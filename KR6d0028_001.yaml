body:
  text: 撲揚沙門智周撰開元八年暮秋朔日余濫竿覺使聖佛道場矣時群德萃焉謂余曰此修多羅辭約理祕藏固沖賾是以龍樹讚歎麟角扣寂逮乎凡罔窺閫奧匪夫注記券疏而詎遊哉故伐蘇命世人寶振富婁慈恩學襲洛聖摛章趙國斯謂蓮剖芬馥膳含珍味者矣故尚道之士莫不手儛頂載且夫陷圍佩毒馳未均利涉大川淺深幾異故有若執炬焉思過半焉猶瞽聵焉方今嗣傳有準曷不贊前途啓後躅示之貝竹利不偉乎余不肖也談何容易但群情流顧莫之以抑乃敬述先誨捃諸所遺長想十翼資光一轍庶幾後進蒞迷無惑者也勒成四卷目攝云爾疏酬願因者夫願有多種不出二種如瑜伽論四十八云願有二種一求菩提二利樂他因中之願具有兩種果中唯一但願度生果已滿故疏如我昔所願今者已滿者問現覩四生沈溺九有願滿無異豈不爽哉答傳有四釋一云一切有情通有無性據有有姓稱言滿足二云就有性中有無緣別依有緣者故言滿足三云就有緣中熟差約根熟者而言滿足四云熟者度得未熟亦作得度因緣是以總言我願滿足議曰義門漸略理亦可通一一甄別旨猶昧且第一釋據有性者有性既有未發心等與佛全差一何言滿餘思得失今正釋云願衆如我行因趣果生既發心欣無上覺證入道因故對有緣言滿無失疏初依菩薩供五恆佛等者問依何地位立此四依答相傳多釋一云見道前劫為第一依未入聖故初之三地為第二依同世間故次四五六為第三依同二乘故餘之四地為第四依純菩薩故又真諦釋如下疏引問準下學無學人供養五十世界塵佛方成正覺二十六恆一何少耶答有三釋一供養自國佛二十六恆若約他方數乃塵界二起通供養佛世界五十若依業力二十六恆三四依一一有入住出言五恆等且約三中之一心也初兩釋好若依後解四依三心總計祇有七十八恆望五十界亦餘少也故不取之疏餘經無此初大相者問初相者何答有三釋一云入定名初此釋不然將説餘經前亦入定何得言無二云説無量義經入定等瑞總名初相若爾涅拌在於遺教前説涅拌應是遺教初相答不例非涅拌後定説遺教法華經前畢説無量無量所以得名初相體用兩法相因説故又彼經者雖被菩薩傍益二乘作聞此漸故三云入定雨華放光動地總名初相餘經不具雨華等事故言無也問何故不取無量義經答雖無量後即説法華彼經自為菩薩而説彌勒等衆復無疑故故非其相問光等非首如何説初答正宗前故得稱初也問餘經何故無此初相答自昔未説二乘作佛今欲開權顯斯實旨恐有疑生故現奇禎拂彼迷意故大般若經第七十七四百九十八五百五十六等云佛言憍尸迦若入聲聞獨覺正性離生者不能復發阿耨多羅三藐三菩提心何以故彼於生死行流已作限隔故維摩經云聲聞之人猶如敗種順權方便經第一云聲聞如敗種無所加設大樹緊那羅經云入正位者燒敗於種前大乘中永非法器更有多文恐繁不具今談此等悉皆成佛與昔説別意旨難信是以餘經無此初相疏説因者傳有三釋一云法華會前説於二乘九部之法為調彼心令堪聞大説九部法是聞大漸故名説因説即是因及説之因二云論七成就第五名為依止説因衆生渴仰為説因體説之因也三云所説法華即名説因由説此經生聞得果故正説經名為説因説即因也議曰若自別釋非無此途論取疏意三皆不可初解非者疏引唯以大事因緣辨於説因大事因緣豈九部法第二説非義亦準此第三非者為酬説因説斯妙法妙法體即自是説因云何酬因方説妙法能酬所酬義乃無別今觀疏意乃為二釋一成佛出世是説法因故疏自云諸佛成道必説一乘二未成佛前願成佛已説於一乘故疏結云皆是因中方便求趣復云故趣宿因説斯妙法若爾説因願因二有何別答願成正覺名為願因願説妙法名為説因對望不同故分為二問所述六因為因果因為因由因答有二釋一云因果之因若爾大相佛位方起何得言因答昔見他佛現相方説遂自發心將説現相二云通二前四在因後二居果居果即以因由名因然觀疏意有二釋意故疏結云皆是因中方便求取即前順釋疏行七步放光明等者大集經第二十一云我不行七步而言行者示現行也又大般若亦同示現又涅拌經第四云南行七步示現欲為無量衆生作上福田西行七步示現生盡永斷老死是最後身北行七步示現已度諸有生死東行七步示現衆生而作導首四維七步示現斷滅種種煩惱四魔種姓成於如來上行七步示現不為不淨之物之所染汙猶如虗空下行七步示現法雨滅地獄火令彼衆生受安穩樂疏我生胎分盡者菩薩有三一者一生所繫二者最後之身三者坐於道樹上生即一生所繫下生局得二身今説偈身即當第二若乃成佛三生並盡今此三生唯約化佛餘未見文以理而言亦通餘有如第七地唯此一身即受變易名一生繫八地以上名最後身往自在宮坐蓮華座名坐道場此取自受有三生也若他受用理亦如是觀音之身名為最後其坐道場一生所繫未見成證理必定有問一生補處約何等生名為一生答且如彌勒昔在人中名一生者一大生也若據小生而有四也天中中有及本有二人中中有及本有二合為四生如七生等依大生説實理論生有二十八若爾何故智度論説彌勒三生答以在人中即得成佛故除人中本有一生但言三也又諸菩薩有五種生一除災生由願自在為魚等身濟諸飢乏為大醫王救諸疾病乃至變為種種物類息除衆患二隨類生願自在力於傍生等惡類中生彼所行惡而自不行彼不行善而自行之如入酒肆能立其操等三大勢生稟性生時壽量形色種姓富貴最為殊勝能斷衆生我慢等過四增上生受十王果自在化導隨所應生五最勝生此生資糧已極圓滿生王家等能現等覺作諸佛事釋迦即當第五生也問得變易生已捨胎藏云何子今方説無耶答捨之與受俱示相言理實久離此之穢業問若論化相盡有情界有情界有化何盡耶答生既無盡化亦無窮且據一期八相之事言盡何失或約此界化緣已畢言盡無爽故處胎經云從此滅度於十方面各三十二姟諸佛國土而復成佛教化衆生準此盡言故知化也議曰雖有二釋前解為正若依後釋違壽量品壽量品云其父聞子悉已得差尋便來皈咸使見之既言還來故知此界非化總畢又處胎經不言永不來生此界故前釋善疏遊出四門至證大菩提等者問如來施為無非佛事示遊觀等何所彰表答非無所示案大集經云示現老人為壞貪身示現病苦為壞貪壽示現死相為壞貪欲及我我所示現沙門為令衆生不求釋梵人天之身勤求出世無上之法踰出宮城者示現出離三界繫縛則除周羅棄捨瓔珞遣馬犍陟放闡陀還者示現遠離一切煩惱現剃髭髮者示現不貪著於一切法受著袈裟者示調衆生從陀伽阿羅邏邊咨問受法者示破壞自高之心六年苦行者為壞外道現受飲食者示現隨世法現受蘭草者示於知足坐草辱上者示壞憍慢降伏魔怨者示勇猛力獲得無上菩提道者示現了知一切法相更有餘經説有別處後當會釋問彼時云何得有沙門答有兩釋一云是化若爾侍者云何識耶答雖無正教外俗教中何妨説有沙門等狀傳聞乃識亦猶犧皇等君所有形儀記之典册達觀知委問犧皇等君是彼外事外典可記沙門非外何得為例答周書記佛生滅等事宣尼説彼西方聖人西方外論記千年後有佛出世此豈非外記內事耶彼亦何失二云外道沙門雖非是正而亦猒世承此生欣踰城出俗纍年學外若不爾者云何見彼內道沙門而求外法準此二解理俱通也思之又案智度論第一云太子以刀剃髮持上妙寶衣貿粗布僧伽黎以衣準人沙門是化而未甄分故於外道修苦樂行疏仙人所住林等者又準佛本行經第十二云太子在彼閻浮樹陰之下思惟坐禪一切樹影悉移唯閻浮陰獨覆太子疏鶖子等請乘權實境等者問鶖子問境佛何為説果之與因開示悟入前三為果後一因故答智所緣故亦得名境示彼令知使修進也疏悔唯小有者問何故經云求三乘人疑悔皆斷答有二釋一云文約義繁合而言也理實菩薩無得有悔大勝小劣不可悔勝方求劣也二云亦有如不定性諸小菩薩於大菩提起懸崖想退求小位斯豈非悔雖有此理然無顯文説悔修大問此經論云二者多事驚怖以大乘衆生生如是心我無量無邊劫行菩薩行生驚怖心起取異乘心此豈非是悔修大云何得言取異乘耶答只言取異無悔大文若實有悔文何不説如第四驚怖悔實不無文即明説此既不説故知無也但揣無力欲退求小議曰以至理言有悔修大故信解品云悔來至此竊作是念此或王等非我傭力得物之處不如往至貧里肆力有地復云何故至此案此等文即悔修大若爾疏主何乃言無答疏意不障菩薩有悔然法華會無有此者信解品中敘昔事故有餘德云菩薩有悔引論為證斷疏主釋為不盡理此亦不可一論無明文二乖疏本意問三根聲聞各至何處而斷疑耶答鶖子初聞法説一乘疑心已盡故方便品末後之偈告鶖子云無復諸疑惑等譬喻品初廣敘疑盡須菩提等中下根之人得記已去疑心方盡故授記品請記偈云心猶懷疑懼未敢即便食又云雖蒙佛音聲言我等作佛心常懷憂懼如來敢便食又五百弟子品云自謂已得究竟滅度今乃知之如無智者又云我今乃知實是菩薩案此等文得授記已疑心方盡問何故上根疑除方記中下不那答根勝劣異劣假聞記迷情乃息中望下勝對上不如故亦得記後始疑盡問悔通小有即彼三品並得有不答上根有悔經有明文中下兩根略有二釋一云亦有序品末云諸求三乘人若有疑悔者譬喻品云願為四衆説其因緣令離疑悔授記品云每惟小乘過不知當云何得佛無上慧五百弟子品云悔過自責準此等證三根俱有悔有新舊五百弟子品中言悔聞記方生即新悔也餘悔是舊二云中下兩根舊無有悔舍利弗請言令離悔舉己方人實彼鈍根昔未曾悔若論新悔理有無失議曰前釋為正經有誠文不可意斷言彼無也引證如前問聲聞之疑而有新舊如文可知未審菩薩疑亦二耶答吉藏法師解云菩薩舊疑者昔稟三乘之教既執道理有三或疑退墮二地或疑進成佛道今疑者疑佛所説今昔相違昔説有三今不應明一今辨有一昔不應説三故方便品菩薩聞此法疑網皆已除問菩薩新疑出何文也答身子請中云求佛諸菩薩大數有八萬欲聞具足道當知菩薩亦有疑也問八萬大士皆是法身菩薩何容有疑答身子權行接引實人法身菩薩應同新學故無過也疏諸經云餘人善根涅拌時盡者準莊嚴論而有此言疏瑜伽及法華論説四聲聞者問何故瑜伽名不定性法華論名退菩提心答法華一會多是退心不言不定瑜伽總談不定退心不定姓寬退心言狹有不定姓非退心故疏增上慢等者此舉無學例執初禪等亦為初果等疏菩薩與記令發心者發心有二一發趣向心二發信向心增上即初趣寂第二合而言之總名發心又菩薩有二一者初業二者久修久修達器隨姓與記如勝鬘經菩薩堪能荷四重任求菩薩者授菩薩乘等若初業者未識根器但總發願令得作佛即般若經我皆令入無餘涅拌不輕同此疏根未熟者議曰畢竟未熟亦得名未何要後熟方名未熟耶故趣寂人亦名未熟疏菩薩與記具理性因者問案瑜伽論理智雙有方名具因今但有理何得名具答此經論云示現衆生皆有佛性若非理者云何皆有疏主依此約理名具猶總也衆生齊有故立具名更有餘釋如下當悉疏菩薩與記令發心等者問菩薩與記尚令生信佛何捨耶答佛記作佛必具國土名號等事增上慢者善根未植而無此事故佛不記疏由生數少等者前三果人有七生等名生數少無學生盡名曰全無或在凡位經六十劫三生修習於此生中從初至極亦名全無問頓漸之義豈由生數若不由者何事須言答有二釋一云舉生數等意顯得聖得聖得有學無學別顯二差別並能回趣非言生數證漸悟義二云無學回心必名漸悟有學回心要取無學方行大行受變易等故舉生數證有學等名為漸悟問何要得無學方行大行等答若至無學煩惱已盡更不受於長時生死若有學位未盡煩惱容得招生為怖斯事故取無學方行大行議曰後釋違教佛地論云回向菩提或於學位即能棄捨求聲聞願或無學位方能棄捨若雖回心要取無學豈不違此有學之位棄捨之言又云學位回心即伏煩惱起定願力資現身因令於長時生死相續名不思議變易生死言即伏惑明非無學無學斷故準此學人得受變易變易既得即離長苦何假要至無學方受問前釋者理雖可通致生數言亦非至要但言二乘即乃苞盡何藉生數答若不言數恐不能悉學無學等並能回趣故非無要疏若從二凡者二乘凡位具二種姓修二乘行未得二果齊此已還並名二凡疏況復示有生數少等者此依凡位望去見道説為多少問既約聞慧而釋於悟何以生等為理證耶答有二釋一云雖二凡位發心向大然要至彼二乘見道後方修大以決擇等有定生時一坐等故若不至見云何得名已定生耶設未定生亦須入見所以然者為怖長時生死苦故若見入已即受變易若不爾者二大劫來受生死苦故約生數而已為證二云但曾發二心曾修二行即名漸悟況復亦有去二見道生數近者不名漸悟言生數者意證久修亦名漸悟非以生數證彼入見方行大乘行議曰前釋是本而有多過如決中斥後解理通然非是彼師之本意疏中兩釋約生數者非疏家意疏主往在藪門敷闡諸德諍此頓漸之義有人約此生數以判故敘之耳疏主但據或得二聖或行二行回趣大者即名漸悟疏三種練磨心者一菩提廣大屈引他況己練二萬行難修屈省己增修練三轉依難證屈引粗況妙練無性攝論第六卷云無量諸世界無量人有情剎那剎那證覺無上正等菩提是為第一練磨其心者解云無量界者顯處無邊無量人等者明趣無限剎那剎那者時無有障證覺等者顯前無障修因成就故證菩提此並引他文無例已準下二練亦合有也此意例云彼無量界他音情等於念念頃皆能發心證菩提果我既與彼同有佛性何不發心亦趣菩提而退屈耶第二論云依此意樂能行施等波羅蜜多我已獲得如是意樂我由此故少用功力修習施等波羅蜜多當得圓滿是為第二等者解云由此意樂者顯他已發菩提心故為六度等因能行施等者明地因因行施等果此並引他我已獲得如是意樂者明己亦得六度等因我由此故等者顯己亦能速圓行果第三論云若有成就諸有障善於命終時即便可愛一切自體圓滿而生我有妙善無障礙善云何爾時不當獲得一切圓滿等者解云若有等者引他障善於命終等者明他因彼障善得果此總引他四菩薩行菩提分等名妙無障十地位中由證真故名之為妙金剛無礙能除障故名無障善此並明自有妙善因云何爾時等者由金剛等既能除障得佛果故是故佛果自然圓滿明己因因復得佛果問作三練磨未登聖位云何得言我有妙善及無障善答從當為論若修不息必得二善二善既有何不得果非時已得名有妙善問此三練磨在何位地答有二釋一云總在十信初位二云第一在十信前及十信中第二在後十解前及十解位第三在彼十回向前及回向位故唯識云此資糧位於二種障雖未伏除修勝行時有三退屈而能三事練磨其心堅固熾然修諸勝行問三種練磨通能所治及以所練各以何法而為自性答能練總以聞思二慧而為自體由聞於他發心修行引他例已䇿發自心比量智故故是聞慧所練體者本有種姓及菩提心四菩薩行菩提分等所治即是三種退屈所知障攝即彼為體由橫思量謂自無能謂菩提心非衆行因謂果難得故是法執所知障攝問練磨者何義答謂䇿舉心令其猛利對治退屈是練磨義亦猶練金復似磨鏡令心純淨立練磨名廣如唯識鈔疏斷除四處障者如無性攝論第六第一論云由離聲聞獨覺作意斷作意故者解云由者因義由離作意障能入所知相餘三準此言斷作意故者釋離作意之所由也此言斷者但是伏也後三亦爾此意説云初修菩薩見生死苦涅拌為樂欲捨生死欣趣涅拌此即名為二乘作意障大菩提故須先斷由觀生死涅拌同無相性及修大悲斷執小乘生死作意作意即障持業釋名或二無學執自乘極不趣大乘或二有學執趣二果不樂大乘或見道前二乘凡夫欣求二果此等並名二乘作意議曰前二釋本準後兩釋理亦無違通四不爽第二論云由於大乘諸疑離疑以能永斷異慧疑故者解云雖離於前二乘作意於大乘教種種法門先起疑惑後執一是便撥餘非即是慧能此慧邪倒與正不同故云異也體即法執邪見所攝故世親云此中異慧謂鄙惡慧於理動搖疑謂猶預作三性觀異慧及疑永不復轉名為永斷異慧及疑亦即是障問標云諸疑離疑離疑之言目於何法答有四釋一云能斷彼疑名為離疑二云云諸疑者即二乘人言離疑者漸頓菩薩合而為文云諸疑離疑三云不定種姓諸小菩薩雖先發心至第六住前然於大行起懸崖想數數退屈遂起疑心為得不得名為諸疑欲就二乘心生決定名為離疑四云諸小菩薩先於佛説顯密三藏種種不同而生疑惑名為諸疑後執一是斥餘為非自為決定名為離疑據實未悟依彼妄解名為離疑議曰第一解正所以然者答本論問云云何能入所應知相彼總答云由斷四處障等能入下別釋中四種皆説能所二治若離疑言不自能治第二將何為能治耶若言第二不説能治何故餘有此獨無耶故離疑言顯能離也若爾故第一第三先説離言第二能離下方言耶答阿毗達摩性相而求逐便即言何責先後第四亦復言無分別豈無分別亦是障耶然第四釋理亦少通然非論意故亦不取有人斷前第三解正難第一云疑既已離云何名障此斷全非説疑異慧名之為障由離此障入所知相於理何失審披本論藏否自現第三論云由離所聞所思法中我我所執斷法執故者解云雖離諸疑然隨所聞若教義等皆執有性便障唯識法空觀智故斷法執方入真觀故釋論云執著皆無於其勝義證現觀故第四論云由於現前現住安立一切相中無所作意無所分別斷分別故者解云於此安立現前相中而無作意及離分別斷分別言而通一切分別之法若隨別説是忍一位能觀之智此即勝障入初地時息滅名斷問何以復須斷此忍位分別智觀答此忍雖離能所分別法執然自有彼微細分別障彼初地無分別智故須滅也釋論云謂於現前至悉能永離者解云此並舉彼離緣之境言謂於現前任運而轉色等現住者業所引境也即大地等言及作功用諸骨鎖等淨定安立者定所引境言一切所緣諸境界相作意分別悉能永斷者於前定散二境之上能分別心一切永伏此上並明離緣染法分別言乃至一切諸佛菩薩波羅蜜等如是等相執著分別悉能永離者言佛菩薩者淨法假境波羅蜜等淨法實境於此等境能執分別悉能永離明離緣淨境分別問何者為處答處所即四所障由此四障障四觀行從彼所障名之為處或此四障是分別心所居之處障即是處前釋依主後釋持業此中總意初二障彼猒小欣大之行後二障彼捨妄證真之行故得障名若能斷智即觀無相及於三性由證法空證無能所斷分別心如次四智斷彼四障問於何地位斷四障耶答在十信位斷於初障由離小心初入大乘十信位故在十解位斷第二障由於大乘離疑惑故而得正解修菩薩行在十回向乃至忍位斷第三障由作遍計觀遣所執故在第一斷第四障由此第一分別觀智加行息滅得成初地最上覺故若據相違正滅言之斷分別位即在初地成此第四離分別障論引頌云現前自然住安立一切相智者不分別得最上菩提解云言現前者通説定散二境當心名現前也自然住者別顯散境言安立者別明定境一切相者雙顯前二定散境相智者不分別者離能取心得上菩提者離障得果即以初地名上菩提形於地前故稱最上疏緣法義為境者法者即文義者所詮無性攝論第六云似文似義釋論云似外相轉實唯在因準此即以有似於無內似外也疏由此攝論至即二種者攝論一三兩種之障亦即同此離執之義疏諸疑離疑即是前者攝論第二諸疑離疑此前第一破疑中攝疏佛自成道未為聲聞授記等者問準提謂等經授價人等成佛之記價人之中亦有聲聞云何得言前未記彼答彼文言總而意授彼提謂等記若不爾者云何此經言未曾説汝等當得成佛道故知彼經文合意別疏有佛子心淨等者問若先未行今説令行可名彰行佛子心淨即先已行如何得言今説法華為彰行耶答舉大前行令復小者亦冀行之舉勝引劣冀令二乘見賢思齊亦不違也此經上下多有此妨倣斯通釋疏要由修慧福等者略有四釋一云初之五句如次配彼眷屬境界文字實相觀照般若並名因行第六一句即一乘果由前五因得此果故二云初句資糧位而依外門修福慧故次句加行能依定門觀空有故即此加行依似文義名依教詮即此依教悟自性等假有實無名究玄理得入見道名真解起證所證理名悟一乘三云初之兩句明修福慧空有二行次之四句明觀教理行果四種雖云修行未知如何可以修之故舉教等令依修習四云初句意彰創所修行次句因行智達空有第三句明要持於教第四句顯而善決釋三藏妙旨第五句意由前四事正智得生第六句者顯因上五種修所悟理問本彰於行何故説彼理教等耶答雖言於行要在現等若不因詮行從何起不知理果而何所欣故説無失議曰第二釋位稍局也豈登地已不修行耶餘三隨應理可通矣疏因即七地等者第七地中亦攝於果從多總相説為因也疏下隨所應並皆具配者下文廣散不可繁談今略序之示方隅耳列名如次此不別説舍利弗等在法華會未解一乘未趣大前名種姓地或初發心亦種姓地經二萬劫到十信故分別功德品云八世界衆生發菩提心觀音品云八萬衆生發無等心此等並名勝解行地分別功德品云衆生得無生法忍天親釋云而是初地即是第三增上意樂地又云菩薩得聞持陀羅尼門亦得旋陀羅尼一相而言即是第四行正行地又云菩薩能轉不退法輪即當第五決定地攝又云菩薩得樂説辨才即屬第六決定行地又云菩薩能轉清淨法輪即是第七究竟地中菩薩位攝壽量亦明三身佛果即第七地果究竟攝彼等經文下疏自具故不縷説四菩薩行亦如次列下疏自明故亦不説疏利今後明記聲聞等者問授記何不在前彰記門攝答前門總談而為記別後門別説利益不同故分二門亦無失矣疏別記等者問法明普明二種不同何名同耶答法普雖異明名同故故名同記若爾善現名為名相學無學等名為寶相相名同故應名同記答經品不同根性亦異不可為例問品同性等即名同記慶喜羅睺性等品同應名同記答性品雖同名不同故或慶喜等名同無失為別於前故名後記隨舉一邊不可齊責不如前釋然有釋云慶喜羅睺非衆所識得後記名而經中言衆望足者羅睺自言非佛説故不可信也議曰此釋違經而亦乖論序品歎德而總結云衆所知識論中但云學無學等非衆識故若爾慶等應非後記論不言故答舉多攝少後記何違根性與品而並同故疏與天女記者法師品中言八部等一切聞經皆與授記據此文寬得有天女或但此經通記之處即攝天女非局一品古有二釋一云耶輸陀羅是天女也父是樂神乾闥婆故二云法華文中不見天女得記之處但有龍女或可即名龍女以為天女近傳釋云法師品及法師功德品亦兼天女議曰古解近傳俱違正教設縱耶輸是樂神女樂神非天何名天女準本行經耶輸非彼樂神之女不可救言依主名天經如下引龍既非天女非天女又復釋迦不與彼記經既明文披之自悉近傳解者案彼法師功德品云男子女人持經皆得六根清淨不言得佛不可違文以意斷也疏如提婆品至合四位益者問前二位為是此界為彼方耶若是彼方何開此經現益之事若此界者經無明文以何為準又復疏主下釋彼文云前二位彼土得益一何𭿺盾答準下上疏疏有二意一者四位總此界益故判四位總名利今二者前二彼界之益經文形勢有此難準故為二釋問四位之中第二第四而云記者何佛記耶益為二釋或即彼佛或即釋迦文不明言任情取捨問彼佛者何名現益答由聞法華賴彼佛記亦名現利問既得授記何不屬彼果記利中益雖云得記文不説為成佛之事但可記彼地位等事故非屬果或由非是釋迦記故故非果記議曰後解非也有何所以餘佛授記非得果名獨釋迦爾故前為善疏若往僧坊至帝坐處等者問聞他隨喜福尚無邊自受持等云何乃少答理實無限若具彰陳恐諸小智心生狂亂狐疑不信故般若云我若具説心即狂亂是故略舉隨喜猶多故知親聽福不應寡疏四乘為實等者勝鬘説彼四實一權為對決定四種機故頓教大乘者即四乘中大乘是也一乘權者即彼經會以前説言唯一乘者是權説也問彼經上下總無此言何以得知一權四實答直據顯文彼似非有以理取教教即非無言四乘者經云攝受正法善男子建立大地荷四重任乃至授以大乘言一乘者經云若如來隨彼所欲而方便説即是大乘無有二乘四乘不言隨欲方便故明四實一乘即言隨欲方便明説一權若不爾者隨欲等言何所彰表問隨何意欲説一無二答如法華等隨不定意説一無二勝鬘會之云方便説問若説一權應唯三實四中大乘即一乘故答唯説一乘不立餘運此佛權説名之曰權非大體無名為權也四中大乘對大根性同餘三乘有所對器故四名實問四對定四應器名實一對不定隨性非權答望自不定是實非權形四定姓故權非實疏一乘是實二乘為權者此法華説一實二權問勝鬘説四同四重擔即言四實一乘為權法華説乘同諸草木亦應一權三乘是實答法華本為不定聲聞故説一實下因轉破説三草木而非本故故非三真理實若對定性而言亦得名實對望不同故不相例疏三乘有行之教者總對三乘而説於有三乘各依自乘所觀觀行差別而為有也有云不定性人有三乘性此人觀於有空之時名為三乘非是有別三乘之人名為三乘議曰後解違般若等彼經自云初轉法輪三乘得益各各不同如疏自引故前解善疏三乘同行空教者對彼三乘總相説空三根悟異二乘達我空菩薩雙悟疏先懺至謗法等罪者問佛初成道法猶未唱云何得有謗法之𠍴而云悔耶答罪通過現佛示令悔斯亦何咎疏四大本淨等者悟四大等本唯真理離於妄執故名本淨又傳三釋一云於四大等起貪等惑令彼四大成所緣縛令斷貪等於彼四大所緣縛斷故本淨若五蘊六塵不善者斷無記離縛故言本淨二云若地獄業所感四大名為不淨由懺悔已惡業自消不受彼果故言本淨三云四大是異熟果感此本因即業感二故名業惑為四大本由懺悔已惑業自淨不招惡果故名本淨五蘊六塵及五我等皆準此知議曰三釋俱非皆不明悟本淨之體若初釋云四大無記非自性染然由緣縛故得染名離縛之時名本淨者若爾六塵五蘊不善若斷之時何名本淨不善本非無記性故若談真理何乃不言故為非也若言色聲有是業者惡引生而表善惡名為善惡非自性故名本淨者云何前言不善者斷又雖無記豈非有漏有漏之法云何淨耶第二非者縱人天等所招四大從因等言何不名染餘過思準第三非者若懺悔已可不招果云何得言惑業名淨未見聖言煩惱惡業名淨之處若據真理直言即悉何事何事故為不可今案覺愛難五時教引提謂經等云四大本無乃至六塵本無又云五我本淨是人無我即此修明二空窮宗之説者準此疏主取意而談本無本淨義同文異或經有異故不相違悟四大等明法空理吾我本淨明悟生空疏本言五而筆誤也有不知錯而因而解之翰墨徒施終乖經本故不録也疏價人得柔順忍者準仁王經四五六地名為順忍相同二乘順無生故依佛地經唯第六地名為順忍論自釋云隨順無生法忍故問何乃不同答仁王總約近遠得名佛地唯依近順名順問柔者何義仁王佛地何無柔言答柔者調柔我見若存是非等起不名調柔四地永亡故得柔稱又此三地能斷害伴羸劣隨眠得名柔也廣略不同故諸教異疏龍王得信忍者按仁王經初二三地得不壞信相同世間修施戒修三品不同總名信忍而言龍者化相而言實大菩薩故華嚴云阿耨池龍出水給濟瞻部洲人皆大菩薩若不爾者豈畜生身有得聖耶若許便違一切聖教疏但為此曰至法輪方轉者此釋外難外難意云為提謂等説法之日有得聖者何不當即名轉法輪至五比丘始名為輪答意如文問經文自云提謂等衆得果大小各各不同何故不名三乘同觀答但言果別不説同觀問五比丘時豈説同觀答即下所引大般若云轉四諦輪三乘果異此即所觀四諦是同名同觀也復有釋云法輪有二一化漸悟二被頓悟三七日後名為轉法輪據化漸悟若依頓悟初七日等亦得名轉若不爾者云何得言佛所施為無非法輪問初七日等有得小果何名為頓答決定性等頓學自乘亦名為頓議曰雖有此理然未見文説諸定姓總名頓也今以理準法轉有二一者通行三乘同觀四諦理故二者別行三乘觀境得果各別三七日後名轉法輪據通行説若凡施為並名法輪依別行言亦不相違疏毗濕縛藥者此云有功能藥有云此言天馬耳形如乾薑議曰雖未見文分明譯處以理而言取前為正一者名寬二者疏主三藏聞傳相傳非謬此意説云於諸丸散湯等之中若置此藥令餘諸藥功能轉勝於一切教置此三性了義之經義乃顯了餘喻準此疏婆羅痆斯者此乃河名義無相當故不翻也問準菩薩念佛三昧經云波羅奈城云何名河答城從於河立名無失疏仙人墮處者按婆娑云昔時有王將諸婇女在園遊觀有五百仙人乘空而度見已墮落因立名焉又按菩薩念佛三昧經第四云於古仙住處三轉法輪又大集經第二云鹿野林中仙人住處轉正法輪又轉法輪經論釋云彼處常饒寂靜仙人是故世尊在彼處轉更有多文皆同於此問何乃相違答大小乘異法輪經論亦同大乘問瑜伽深密文既言墮為同小部為取大乘若同大乘何乃言墮答為二釋一隨轉理門文言墮故二依大乘義墮者即是住之異名疏第三時中普為發趣一切乘者問為要被三為對一二設爾何過二俱有失若要被三此法華經應非第三無緣覺故若不要三何名為普即小乘等應名第三答具明有空被三根法名之為普非要一時有三所利方得普名且三性教説所執無餘二性有有無義足説有即當為趣二乘説空即當為發大者空有具明即當為彼久學菩薩依斯説普理亦無爽法華第三小乘非者理可思矣疏涅拌亦云醫教服乳等者問按涅拌經初醫服乳喻於外道客醫斷乳及後教服皆譬如來如何有教同於外道經言初醫性復頑嚚亦復不知病起根原復不善解風冷熱病一切諸患豈我世尊有斯過耶答慧日論云此對外道執皆有我為破此有令入人空且密説人空義顯為小初説法有次破法有密説法空涅拌會中方為顯説除外道執有故説空除聲聞執空故説有以明佛性非妄計我故非有有常等故非空合第三時議曰今觀疏論釋經意云舉外道有我喻説法有然甚離也觀經喻合望初有教殊不相當取證三時恐成誤矣後當細披疏若以偏圓等者小乘名偏大乘名圓從小向大名依偏圓有云偏約一機名偏誤也疏一果之證者不證小果唯取大乘名一果證疏依善戒經至唯説有二者準下引文先標後列今此無標作者墮時不可齊一疏六處殊勝者此出無漏種姓之體言無始者顯法爾義六處殊勝相傳三釋一云佛果根境不過六故但云六處以實而言佛十二處今因中姓與果殊勝六處為因因從果稱云六殊勝二云此是有情內六根處於六處中有得佛果最勝功能故名殊勝三云是第六意處無始以來殊勝種姓在其第六阿賴耶識意處之中此第六處名殊勝六處評其是非如唯識鈔疏無種姓人無種姓故等者問按善戒經第一云菩薩若無菩薩性者雖復發心勤修精進終不能得阿耨菩提而無不言無性之人一何增減答善戒雖無地持即有故地持云非種姓人無種姓故餘同善戒疏引地持善戒大同而不具説故亦無失疏依有無等者言依有者有行姓也依無者無行姓依異者二乘觀行得果等別故別明之依同者二乘同斷惑障同證生空依此合説言通者即不定姓通者三乘聖種姓故言就別者不定性乘攝入三乘更不別明問二乘之人斷證等同涅槃合明菩薩亦爾何乃別開答煩惱分同所知斷別利鈍全異何乃相例餘準此通問三乘相望皆有不同何唯二乘相對名異答實理應爾但由同義既對二乘所以異義不望菩薩疏遠塵離者論有二釋一云由見所斷諸煩惱轉得離繫故名為遠塵由彼隨眠得離繫故説名離垢二云以現觀時有粗我慢間無間轉名之為塵若遍了知所取能取所緣平等即彼斷滅故説遠塵一切見道所斷煩惱隨眠斷故説名離垢問按莊嚴論即是大乘見道位收彼第七云離垢者見道所斷煩惱滅故菩薩爾時名遠塵離垢得法眼淨大論八十六中所説即是聲聞彼説遠塵得十勝利二者隨獲一沙門果三者了知我證預流準斯二論通於大小何故判是定性聲聞答然法華經是第三時普發之教分別品等有發大心故遠塵言明得小果由此義順發一切乘亦復不違遠塵之説疏依斯義判是聲聞不言遠塵不通大有設爾何知是定性耶答按善勇猛般若説云若於三乘性不定者聞此法已發正覺心今既不言發正覺心故知定性餘妨準思疏病人三種者問四依菩薩供佛極多獨覺之人自然悟道何言菩薩不遇疾療二乘要值方得病療答言遇不遇約始發心不障後時得奉多佛聲聞衆出得遇無違麟角一人望遠亦遇或從多分理亦無爽問準何得知菩薩不遇亦能發意答瑜伽論云菩薩四緣而能發心一者見佛現諸神變二者聞佛説妙法故三者末法見正法滅四者劫減見飢饉等因期四種皆能發心廣如入道次第中辨疏此經至亦同涅拌者問既有小草經何不被答下談乘差説言小草非法華會得有彼器若爾何名普為一切答談法功能具説於法如前已説疏諸論雖説聖亦回心等者有回心已即受變易有未受者論據即受説聖回心經依未受故言未入正性生者此人雖曾行二乘行未得小果聞大乘經即發菩提疏正性離生者正性有二義一者涅槃二者聖道見所斷惑為衆惑本猶如生食為衆病本名之為生聖道能斷名為離生又大般若三百七十八云以何為生以何為離佛言菩薩以一切有所得為生以一切無所得為離又四百八中以生食等而為喻也問何故前釋般若不同答前依喻伽對法等論通三乘釋般若唯依菩薩以明望義異也議曰入見道中未得涅拌云何正性取涅拌耶雖復證得一分真理涅槃之義未建立故又般若云以無所得名之為離無所得者無分別智準此後解正性應善更思撿餘疏勝鬘經至無間非法衆生者四喻相傳總有三釋一云大海最重以喻凡夫諸山次輕喻於聲聞草木轉輕喻於緣覺衆生最輕喻於菩薩準此依障輕重為喻二云海喻菩薩理性深廣山喻獨覺樂處最靜神通稍高草木喻聲聞得涅槃已後報盡故衆生喻闡提但有人天生得善根力微少故喻理如是然文不次三云海喻闡提生死無盡故山喻聲聞諸見不動故草木喻獨覺神通之障執輕小故衆生喻菩薩二障輕小故教理行果義非邪妄名之為正體苞軌持目之為法或唯正理名之為法攝者包含受謂領納證法在心名為攝受言無聞等者有二釋一云無聞熏習法爾無漏言非法者非聖法器二云無聞者不聞法也言非法者不能思惟如説行也議曰而明正法及無聞等並前解勝何所以者若不攝彼教行等法何能濟人豈教行等不名正法豈彼不聞人天等法而思行之若不爾者無不行之云何得言人天善根而成熟者若云無未行行云無聞等斯何過者若爾亦應三乘性者元未行行以人天善而成熟之若云不聞不能思惟三乘聖法名無聞等言既不彰豈無濫也故取前勝疏第五有二時邊等者按莊嚴論第一云一向行惡行普斷諸白法無有解脫分善少亦無因釋云無般涅槃法者是無性位此略有二一者時邊般涅槃法二者畢竟無涅槃法時邊法者有四種人一者一向行惡行二者普斷諸善法三者無解脫分善根四者善根不具足畢竟無涅槃法者無由因故彼無般涅槃性謂此但求生死不樂涅槃疏當成不成者略為三釋一云言不成者無種姓人當成之言文對之耳二云當成謂有姓雖現未成當可成故不成謂無性三云當成不成並目無性當成之法所謂菩提此當成法而不得成是以結名當成不成議曰既非聖言義意言之三皆總得然依理長前二非勝思之可悉問上所引教根器不同各何所以答言依有無通別等者是釋所以更有餘釋恐繁不述雖有斯釋終未離難難云何故依彼無有等性一五等別實理解者教所被器器類不同故一五等種種有異何乃須責問若第三時而被菩薩名菩薩乘應聲聞等亦名彼乘答顯説諸運對彼達觀名菩薩乘雖被聲聞不唯説彼非彼餘乘此義應思問法華等經普發一切即名第三般若亦爾何故第二答正唯被有傍益一切據正非傍故是第二餘例準思疏小乘二十部等者此部分起所説法異廣如論明今略釋名以披所要一大衆部佛涅拌後界內界外兩處結集界外之衆無別主首徒衆數萬但名大衆至大天已乖諍因生界外苗裔而多轉從大天所説故取昔名名大衆部二一説部此師説云世出世間一切諸法但有假名皆無實體名即是説從彼所立用彰部名三説出世部此部意明世間之法顛倒煩惱業及世界四轉次生既顛倒生故但假名都無實體出世之法非因倒起故道及果皆是實有亦從所立以得部名四雞胤部上古有仙貪欲所逼遂染於雞後所生族因名雞胤婆羅門中仙種姓也五多聞部廣學三藏深悟佛言從德為名名多聞部六説假部部主意言世出世法皆有假實蘊實處假亦從所立而部得名七制多山部制多梵言此云靈廟安置聖靈之廟處也山有制多山得此名人依山住部從山號八西山住部山在制多山之西故從處為名九北山住部義同西山從處立稱十説一切有部一切有二一者有為三世法等二者無為非三世攝二皆體有亦從所立而為部名十一雪轉部以上座部微弱不行如似雪風飄流靡措從喻為名亦名雪山從處得稱亦可名上座從遠所襲以彰部號十二犢子部上古有仙居山靜處欲染母牛因而有子自後仙種皆稱犢子部從遠襲故以為名十三法上部律主之號有法可上或復有法出衆人上並名法上部從人稱十四賢胄部賢者部主之名胄者苗裔之義是賢羅漢之苗裔故從襲為名十五正量部權衡刊定名之為量量無邪謬目之為正此部所立甚深法義判定無邪目稱正量從所立法以為部名十六密林山部近山林木蓊繁密從處為號十七化地部部主之身本是國王王所統攝國界地也化地上人故云化地捨國出家弘宣佛法從本為號號化地部十八法藏部部主之名藏之與密意義大同法藏法密二義皆得此師含密正法如藏從人立名十九飲光部梵云迦葉波此云飲光婆羅門姓上古有仙身有金光影蔽餘暉故名飲光部主是彼飲光之胤故言飲光又此部主身有金光能飲餘光從自立名二十經量部此師唯依經為正量不依律論即經部師依彼所立而立部名疏宗有八者問七八兩宗義顯可悉餘之六種望二十部各攝幾耶答初宗攝六謂犢子法上賢胄正量密林經量等部第二攝四謂一切有多聞雪山飲光等部第三攝七謂大衆雞胤制多西山北山化地法藏等部餘三如名各攝自部復言等者自部之中本末有異故等等之前三言等文意可悉問按宗輪犢子等五無根等蘊經量即有又所許我義全不同云何總合為一宗耶答今據分同非説一切又計我別然有我同約斯為宗故亦無失自餘問答皆倣此也恐繁不述問四阿含等六宗之中各是何攝答阿含即是第三宗收釋論第二法有宗攝毗曇梵網入第一宗四分亦當第三宗義思屬可悉故不繁言疏雖説於有不違於空等者意説依圓二性名有不説遍計亦是有收故不違空不違有義翻此應悉疏滿宗所收者問莊嚴遠塵即是小果被彼何非半教所收答經唯被小名為半教今既不爾故非半收若爾若應有作不攝答通明小義何非有作疏以一乘為宗者一乘之中根本方便皆通教理行果四種然古德釋略有四師一云以萬善之因為此經宗所以然者經皈一乘一乘即因故乘以運載為義果更無進故大品云是乘從三界出至薩婆若中住既言於住明非進義問此經初分明因後門辨果云何偏以因乘為宗答後章辨果為成前因以行一乘之因得壽量故舉果成因以因為宗二云以果為宗所以然者夫欲識經宗宜觀經題題云妙法者謂如來靈智體也陶冶塵滓衆塵斯盡故名為妙堪為物軌所以稱法自因已來粗法未盡不得稱妙故以果德為此經宗是以釋迦玄音始唱歎佛智慧甚深多寶讚善稱大慧平等即其證也三云具以一乘因果而為宗義前分明一乘之因後章明一乘之果故借蓮華為喻者此華不有而已有即華實俱含此經不説而已説即因果雙辨四云以無所著而為經宗問何以知然答中觀論云推求諸法有亦無無亦無亦有亦無亦無非有非無亦無是名法性故因果不可得即是妙法又法華論云引導衆生令離諸著著有四種等故有著者不名妙法無所著者乃是經宗又經云是法不可示言辭相寂滅等此證非一又曰此經始終具有四句一因乘非果乘即證子乘車直至道場二果乘非因乘佛自性大乘是三雙用因果為乘即合前二句四非因果為乘謂是法不可示等前三句為乘用第四句為乘體故説上三句皈於非因非果議曰初且非理此經論云方便品下顯因果相開示悟果入一是因方便品等正明一乘果若非乘何須明此開示悟三又唯識論云諸佛究竟樂利樂他樂利樂他豈非運義又佛自運窮未來際此之自運何不名乘不以增進解乘義故然大品云薩婆若中位者約自行滿一相而説二亦不可即此經云乘是寶乘直至道場此證甚多因中煩惱體是塵滓可不名妙因無漏行既非塵滓何不名妙只以因行名之為乘不以因惑而為乘故三理少通然不取彼方便因果義乃不備此經佛語舍利等云汝等所行是菩薩道道者因也方便若非是大乘因云何得言是菩薩道漸漸得成佛四亦難詳若無所著以為宗者何得乃言此經宗耶豈餘聖典許執著耶若云諸法寂滅言因果等豈非著者若爾諸法非言言非著者豈非是言若是言者言非所著亦是其著何得名宗若云言非所著寄之以顯而不依執何非宗者前言因果亦寄而明不於彼執何即為過又云前三為用等者用不離體體既是宗何獨棄用亦應體不離用體亦非宗若云體者而非因果因果既非更以何法而為體耶若云離言而不可説為因果者亦應離言而不可説體與非體若寄談之既得名體何即不得為因果耶彼此異因理不可得粗述大略餘繁不敘疏三經品得名等者本釋具疏略敘古云若依佛經但立一名法華論明一部始終有十七種名議曰論明十七乃是無量義經別名何關於此若云彼經即此法華故故十七名屬法華者彼即法華已説畢或何乃更須説法華耶體用而言理即不障不爾即有如前之失設彼即此云何言得依經但一經中自云名無量義等列三名故又古德云梵音之中含正及妙是以什公法護法師各取一種今合前二更加兩名謂真法好法然佛之道未曾邪正為對內外二邪故立為正言妙真好對粗偽惡義意亦然問既有四名何獨稱妙答凡有三義一經有妙文無正等稱如云我法妙難思是乘微妙即其事也二妙是精微深遠之稱立於妙名即稱歎義即云我法妙難思等三就義推夫正以形邪受稱妙以轉粗得名宜以九十六法為邪五乘稱正五乘雖正正下而由粗一乘之法乃稱為妙不得云外道為粗五乘為妙亦不得云五乘為邪一乘為正外道之法形於佛法其猶石與玉五乘之與一乘皆同是玉但玉有精粗故以五乘為粗一乘為妙也議曰真法好法既非佛言不可人情而以加也窮將不可雖以三義證取妙言以理論之隨取皆得菩薩言既含正妙兩義譯主隨意取以標名不可於中強定優劣既以相形立於正妙五乘形外為妙何乖劣乘對勝為邪何失亦如四真四俗諦故不可以經有妙之言即證經題經中亦云是大乘等應證題名為大乘耶此既不許彼何即取但是譯者隨標以言未皆定也疏應云妙法白蓮華經者問智度論云陸生中須曼華為第一水生中青蓮華為最上今者何故取下白華喻上妙法答青蓮華形相乃妙故喻如來之眼白華衆色為勝故譬於斯經欲顯此經義明白故諸法本故餘如疏辨疏無別白字者奔荼者義當白華梵題之中不別言白疏與辨中邊三種無上亦不相違者此遮伏難難一乘體即是無上乘中邊論中無上乘者境行果三而為其體何故今此唯用行果故會意云三種無上即行境果今雖行果義亦攝境故不違疏能詮之教名權方便者法性離言由佛愍生於後得智方便施設能詮之教為有情説故但能詮皆權方便此釋不取教為一乘之所以也疏總覽經文等者此即第三解法華體第一唯以行果為體第二依論及方便品初以教理二為妙法體尋文可悉疏悲智所誘名衣裓等者問譬喻品云當以衣裓從舍出之後更思惟乃至當設方便等準彼經文不以衣機衣機若是二乘因行何不用耶答此敘古釋非疏主意此亦不然豈有過者便指古人答疏主解彼衣裓等文云果化喻故知此處非疏主意又復本師親承疏主相傳不謬疏上來三乘猶若分段者此斷身手有力等文所以然者在所燒門未出宅故出宅已後名離分段自在不繫方與車名疏云菡萏者荷華也芙蕖者芙蓉別名江東呼荷為蕖花者華也疏然觀經意等者總重聊簡文有二意一云方便品初至唯行果二以名蓮華總是第一取行果二并會不取教理所以所以之中而有兩節初會方便品初説有教理次云無量義經等顯教理二不彼二乘於中復二初明非正後唯菩薩思準可悉二云又復此經至名蓮華等者此即斷取教等四種如文易了蓮華二義至第二疏如彼廣明疏教行並開敷等者由論説云開敷出水名為蓮華不作此言恐違論旨此釋外難難意可詳疏況論釋名非解於此者設外人云我依論者設縱依論猶闕一義況復本論無但解彼無量義經十七名中蓮華之義非釋此經也疏大法之妙是依主者但是大乘悉得名大妙唯在此簡餘大乘故云之妙疏若理為妙等者準疏教法相對四釋然行與果既亦妙法以二對經釋亦無失疏舉梗槩而亦無過別釋綺互思之可悟疏其法師品等者問既通依主持業二義何不入彼不定名耶答雖有二義然觀經意取人法師故不入彼不定數內疏能所為名者分別者能分別屬於人功德者所分別屬於法疏顯經品廢立等者然有傳釋此經所譯數與時節今因略敘僧寶林云此經六譯然尋傳記但有五本一正法華晉大康七年八月十日竺法護譯二妙法按寶唱録云秦弘始七年三月十六日於長安大寺什公所譯三秦録云十年二月六日譯遠法師序云弘始八年譯所記各異難以準言三按晉録云秦弘始元年譯名薩曇分陀利經有六卷今無四晉録云沙門慧根以晉大康元年譯名方等法華五卷亦闕此本五姚興録及魏録云外國沙門支謙至魏甘露元年七月於交州城譯沙門道敷筆受名法華三昧經一卷亦闕此本今加一本隋仁壽二年笈多於長安興善寺譯亦名妙法華議曰按內典録此經重譯但有三本謂初二後一而別説有法華三昧單譯中收準此前言第三四五法華異譯道理難悉然更撿餘録疏古解至安在前者按吉藏法師法華疏云諸經屬纍多在經末此安神力品後者依於梵本及法華論又即秦地新翻法華並安屬纍品在於經末今明羅什善解秦言妙得經旨安在神力品後必有深致餘如疏引議曰此判難詳所以然者梵本次第為依佛説為結集排若佛説者什違佛言云何得言妙得經旨若言非佛阿難集經云何經首言如是耶與佛本經不相似故設縱慶喜而排次者慶喜佛許什公豈即智逾阿難作斯通會理成焉有後人紛糾蓋因此也幸熟詳之問古德所會過已可知實義云何什公經本屬纍非後答今以愚度什所譯本本先不次依本譯之故致差舛誠非故意竊觀梵本葉葉皆別加復輕脆然以縷貫縷斷葉脫因而集雜緣斯不次未必故情疏文殊海會至華現者此引文誤誤引妙音來此之文文殊文云爾時文殊師利至詣靈鷲山意取詣山以為證也設取妙音何非為證答他説妙音來此之時此已成穢土合有山何得為證故不取也疏上見下故等者問下根不知上根之事變土既佛妙音何見豈可佛下妙音為上答穢土為下本為二乘及凡夫等隱劣為淨所以妙音得兼見本若爾何故言為分身變為淨土答為警二乘令其欣慕若不爾者佛恆居淨何須變乎疏經家結集為偈者此兩句經合是長行是結集家見斯文少復前及後皆是於偈故束為偈若不爾者云何而言偈答無盡此即偈故或寫經者勒而為偈名為經家疏設無亦何違理者問梵文元有今無違本云何乃言不違理耶答只是本脫違何道理有本言損有解云如良醫等雖有於損亦不乖於利益之宗設有處言菩薩不害於人亦何違理何不違理據彼畢竟名為不害非全不損損有益故疏隨時至故知差舛者此意説云元本問者是莊嚴幢偈中何故答無盡意又無祇問無盡意長行乃言無盡遍觀觀音願海告幢菩薩乃至説偈即是佛告無盡意也豈不問答人有差舛疏四從三逆者若從第四隨時所添違前二經一論三本疏第六釋經本文者科此經者今古實繁略敘一二異增異智有廬山龍法師開為二段從初竟安樂行十四品是開三顯一從踊出品十四品是開近顯遠於兩中各有序正流通三分合成六也又光宅雲法師為三分同吉藏法師又印法師為四一初品名序説二從方便品竟安樂品十三品開三顯一三從踊出品分別功德品彌勒説偈已前開近顯遠四從分別功德品彌勒偈後已去竟經流通分又河西道朗法師開為五門一從如是我聞竟序品致法華必轉之相二從方便品至法師品明法華體無二之法三從寶塔品竟壽量品明法華常住法身之果四從分別功德品已下至屬纍品明修行法華所生功德五從藥王本事品明流通法華也又道融法師類為九轍第一昏聖相扣轍即序品是第二識教皈真轍方便品是第三興類潛彰轍譬喻品是第四述昔窮迷轍信解品是第五稱因進悟轍化城喻品是第六讚揚理行轍法師品是第七本迹無生轍見寶塔梵是第八舉因徵果轍踊出品是第九宣揚違濟轍從隨喜功德品訖經是議曰考尋古釋皆存一理然依理教但取三分夫將説法必有由序驚駭物情令生信意乃為正説之由漸故故有序分物起淨心澄情渴仰佛隨器説故有正宗有情無盡佛悲莫窮冀傳不息有流通也斯乃理矣按佛地論釋佛地經開有三分雖釋一經可為通軌餘經亦有三分勢故又道安法師判大小乘經皆有三分故取三分也雖取三分取三分之中而有多類至於優劣如疏所斷又有古德泛言序者總有二種一經前序二經後序經前序者即序品是正宗前經後序者如是我聞等是佛説經後方教置故疏遵古法師判二分者問此釋如何答理亦難究若言得益即是正宗序品亦宗舉動施為皆悉佛事佛事遠近皆有益故若言授記得證發心等方名益者應方便品不名正宗無上益故若云鶖子悟解一乘何得非益者彌勒發問文殊為答衆疑亦遣何不名益若言文殊雖答未見佛説疑心猶在不得稱益亦應鶖子在方便品尚未得記不名正宗又佛地論判經三分亦違彼也熟思疏智積還等者議曰引此證彼八品為正宗恐成返唾所以然者多寶本意來聽法華及至出時説經已訖出何所益若言本來祗為勸證不言聽法者若爾請歸亦為不可勸證之事而未畢故又違經文經自説云為聽法故塔踊其前準此經文證十九品為正宗也若爾智積何事請歸聽未訖故斯亦無失智積下根不測上聖隨自心請亦何違理更熟思之問塔品既云為聽法故而踊現前即前八品定不得名以為正宗云何疏斷初解為勝答夫言經者序正流通並總名經雖復不聞序正兩分聽於流通名為聽經亦復何失由斯之理疏斷初解以為正也然但不得引請還事證八為正過如前辨疏證之果因者之者助詞意明令彼證得於果而及得因疏序成就者問皆是序何故第一獨得序名答雖標總稱即是別名如十一色此經七喻眼境名色初彰喻名此亦同彼疏二衆成就者餘經未必具有四種故標勝言疏第四隨順威儀成就者問與衆成中威儀何別答聽説二別疏見能照等者光為能照萬八千量是所照境六趣三寶涅拌等事名為所照疏如大術等經者問按大術經佛報母恩天上所説如是等言佛臨寂滅方乃教置時既懸隔何以會通答始終為論始從天上爰至金棺重起而説總為一經即如華嚴大般若等此類非一疏立之所以者又按智度百論等中外道經初先標兩字所謂阿憂阿之言無憂之言吉無所不吉故名無吉有傳釋云阿字同前憂者有也一切諸法不過有無故以標攝今顯異彼置如是等問經由佛説為簡外道置如是等戒亦佛言何不置簡答古有解云戒等之法為內信説不假須安經通為俗故置如是議曰此釋不然如遺教經等既通於俗何無如是此類非一實義合有略故無也準諸廣律有如是等疏三妙觀者厭離有為求於菩提深念有情三心是也疏清淨增上力等者按無性攝論第七云清淨者即善根力增上者大願力第二句全即堅固力雖遇惡友方便破壞終不棄捨大菩提心所修善法念念增進不生喜足者即心進力齊是名為最初修行三無數劫者釋後二句議曰有人判為總有四力今觀頌意但只有三第四力者準於釋文似結於前非是別明心進之力然設進取者理亦無失然疏主意取三力也何以為證答即次云善根為體等如次三力如文可悉疏證四不壞信者問為一切聖道為唯見耶答通一切道四果皆得問四種何別答如瑜伽論九十八云又四證淨預流果中唯説為淨於餘學果説圓滿淨於最上果説為第一圓滿清淨問云何不有壞答能信之心堅固無動即前論云深固根本於餘生中亦不可引無虗誑故設在餘生於佛善説法毗奈耶畢竟無轉故名證淨廣如彼説疏信為手等者捨能捐惡牙唾諸物頭連身首而命不斷念能憶持善心不絶頭為身導慧能簡擇為善法導有能擔集二利能積一切功德由斯義同故取為喻疏七聖財等者無胎初始義因斯傳釋世財有四一過意財謂珍寶等令心悅故二增長財謂按摩等長養四大故三吉祥財五月五日等續命衣等四住持財宅舍等是所住持故疏衆善因之俶落者亦初始義疏拔衆生出生死泥者異熟果如土煩惱若水業類如泥人疏大車無輗等者劉炫論語疏云案考工記車之職有拍車大車羊車無小車小車非周禮之車名大車亦非周禮大車直二車相對名大小耳禮言拍車者拍者長也古書伯仲之字皆作拍此車大於羊車故以拍為名羊者善也説文説善美之字皆從羊故鄭玄云羊車拍車山車大車平地載任之車羊車所用未詳輗穿轅端著之乃無文也蓋舊相傳為然以輗相類之物皆是施軛之處以拍車大而難制其輗應穿轅之端更著木於上而為之羊車小而易制其䡉直因轅之端而節之也疏左傳苟者明信等按傳云鄭武公莊公為平王卿士注云卿士王卿之執政者言父子秉周之正傳王二於虢注云虢西虢公也亦仕王朝王欲分政於虢不復專任鄭伯傳鄭伯怨王王曰無之故周鄭交質王子狐為質於鄭公子忽為質於周注云王子狐平王王子也傳王崩周人將卑虢公政注云周人遂成平王本意傳四月鄭祭足帥師取溫之麥秋又取成周之禾注云四月今二月也秋今之夏麥禾皆未熟言取者蓋芟踐之也溫今河內溫縣成周洛陽縣也傳周鄭交怨注云兩相疾怨傳君子曰信不由中質無益也明恕而行之要之以禮雖無有質誰能間之苟有明信澗溪沼時之毛注云溪亦澗也沼池也時小渚也傳蘋蘩薀藻之菜注云蘋大萍蘩皤蒿薀藻聚藻傳筐筥鑄釜之器注方曰筐圓曰筥無足曰釜有足曰鑄傳潢汗行潦之水注潢污停水行潦流水傳可薦於鬼神可著於王公注著進也傳而況君子結二國之信行之以禮又焉用質注通言盟約彼此之情故云二國疏衆生三疑者準此合在立所以中疏主隨古安釋名內疏感應之端者端者首也序也有本言瑞誤也亦同二十唯識所説展轉增上力二識成決定義或瑞字也瑞者信也明如是者而是其信故左傳云所臨唯信信者言之瑞也善之主也是故臨之杜預云瑞符也神臨之也疏與我聞作呼轍耳者此中意云若不先指所聞之經即言我聞我聞於何為欲彰其自聞所以先標如是光宅寺名在潤州江寧梁武之世雲法師也不欲斥其名故以寺標人焉疏合十五釋法公五傍總合為一數雖有五並明謗故有云五傍分五三疑三寶各合為一名為十五議曰不及於前二三一一釋如是周五傍一一釋便不備且如第一離增益謗然不能遮損減等故故五合一二三別開疏不同前二者非外道故不同於初非極成故不同第二由無我執有自在德名為大我即阿難也如世説言不自伐功其功更大由悟無我自在逾增故名大我疏有三阿難等者亦如帝釋千名非即自多舊人解云有三阿難文殊師利將大乘阿難於鐵圍山間結集大乘三藏餘二阿難集二三藏疏不取此疏多聞聞持等者按佛地論釋云無量經典初中後分皆能聽受故名多聞隨所聞義皆能憶持令不忘失故名聞持數習文義令其堅住是故説名其聞積集議曰如次聞思修三慧也疏然根五義等者一所依勝二能生勝三相續勝四自在勝五莊嚴勝也又按對法論云又由六相耳於聞聲中最勝非識等何等為六一由生因耳能生彼故二由依處聞依耳故三由無動轉耳常一類故四由自在轉不待緣合念念生故五由端嚴轉由此莊嚴所依身故六由聖教如經中説耳能聞聲故如是所説六種相貌於識等中皆不可得疏以二為門等者耳意二種而為門也問耳不得名理乃無失云何意識不言取聲但説耳耶答耳不得名云但聞聲不遮意也若爾何故瑜伽論説聞謂比量豈意聞聲唯比量耶答瑜伽據意聞名而説實亦得聲故亦無爽疏諸餘佛土至為佛事等者問按上生經彌勒入首楞嚴三昧放於光明光明之中有般若等現亦如招手前人解意豈非依色有名等耶答依多分説色等有名少不足説更思疏隨墮八時等者晝夜八時或八囀聲時直非直等略有三釋一約教相明長行名直頌名非直二依十二分教而説契經名直以初略説未巨細故餘之十一𬾨明周至委曲而談名為非直三從所詮名詮自性稱為直説句詮差別言非直説議曰第二釋中若約委具非委具辨違瑜伽論論云不了義經者謂契經應頌記別世尊略説其義未了應當更釋準此三分皆非委𬾨云何言一名為直説若云不約具與非具名直非直者更據何理作斯判耶故難詳也又契經中有通別二而不分別雷同而言亦成疏略實義應言別相契經應頌記別名為直説未委具故餘名非直義周至故疏已能善入等者無性釋云或依德迹或共了知謂彼已能善入大乘或即於此已極善入故名已能善入大乘此顯已得諸陀羅尼辨財功德於大乘義能持能闡者解云謂彼菩薩內有善入解大乘教義道德行迹迹是安足之處德是施名之所由內有德故名善入德名外彰名共了知謂彼已能等者釋前德迹或即於此等者釋前共了陀羅尼辨財如次顯上德迹共了總由此德名為善入餘文悉又體大者甚深高廣無上故大疏彼增上生等者談實菩薩實不説法聞者為言菩薩為説約此故言增上生也然有餘釋與此稍別如本疏及法苑決釋疏譬如天等者如人於天或鬼神處求乞論呪此人夢中雖無耳識於意識上論呪顯現故知夢人意識不能分別鬼神所説論呪所見論呪明自心現疏我從成道等者按大般若佛告善現等言我曾於此不説一字汝亦不聞當何所解何以故甚深般若言説等皆遠離故由此於中説者聽者皆不可得又新華嚴頌云諸佛無有法佛於何有説但隨其自心謂説如是法疏如母嚙指子生喚解者按汝南先賢傳云周惕者安成人母身有疾其亦有疾若在野母須見嚙指便至又孝經援神契云庶人孝則林澤茂浮野怪草秀水出神魚注云庶人謂有德不任若曾子之孝千里感母能便其城致浮珍固其宜也問若實不説如何説云我所説法如手中葉等答為增上緣令他得益如手葉等名為説也問無性為許諸菩薩等有言説不若許有者不合難言如何菩薩能説有兩俱不成答云增上生者亦自他兩失若不許説亦為不可非唯大悲及離戲論何不説耶答菩薩理説言不説者但為非是説經之人由佛加被令遣作緣而不言説非是一切言語皆無餘有處言五人説經皆依此會議曰今按佛地佛唯三法而不説法論既明言理無致惑準無性論出於教體但取問者所變為體意存唯識復顯菩薩非説經人云增上生令他得解不言菩薩元總無言故釋善入大乘等云得陀羅尼辨財功德於大乘義能持能闡若總無言何名能闡若爾舉喻豈不𭿺盾答喻證菩薩而不説經不證菩薩總無言也意言天鬼為增長緣取能求者自心所變論呪等法而為其體不取天等論等為體不障天等餘時之中得説論也斯亦何過若爾疏主豈不解彼文答非不悟也取彼菩薩非是説經之人故言不説不是總言菩薩無説又彼文隱取義而談云不説法若不爾者既有本質何故唯取能聞所變不取能説約此之理故言不説也更思疏謂餘相續差別識故者即説法者是聽法餘相續即身自心之上所説之法種種不同名為差別令餘差別翻準應悉問云何般若華嚴等經皆言不説答依法性言更有多釋如唯識鈔疏此中二解至綺互解釋者不説法家會説法文説法之家會不説法文如唯識鈔疏説教時分有二義者問説聽究竟共相會遇義旨無殊何故分二答乍觀似同理實有異初約説聽所為事畢雖多剎那總名一時後依説聽感應時同名為一時問設不就彼説聽究竟而言一時復有何過答如初説字次談於名後方言句乃至部等時皆有異云何言一故知依彼事畢稱一故佛地論云説聽究竟總名一時若不爾者字名句等聽説時異云何言一疏如夢所見謂有多等者按無性攝論所引頌云處夢謂經年寤乃須臾頃故時雖無量攝在一剎那又西域傳云有隱士結廬屏迹博習伎術究極神理能使瓦礫為寶人畜易形但未能馭風雲陪仙駕閲圖考古更求仙術其方曰夫神仙者長生之術也將欲求學先定其志築建壇場命一烈士執長刀立壇隅屏絶息言自昏達署求仙者中壇面坐手按長釰口誦神呪收視返聽達明登仙是人既得仙方訪烈士營求曠歲未諧心願後得烈士先與人傭力艱辛五歲迷失一日遂被笞辱又無所得悲號巡路隱士見命數加重賂潛行陰德感激其心烈士屢求效命以報知己隱土曰我求烈士彌歷歲時幸而會遇奇貌應圖非有他故願一夕不聲耳烈士曰死尚不辭豈徒屏息於是設壇場受仙法依方行事坐待日曛曛暮之後司其務隙隱士誦呪烈士按銛刀殆將曉矣忽發聲呌是時空中火下煙焰雲蒸隱士疾引此人入他避難已而問曰誡子無聲何以驚詬烈士曰受命後至夜分惛然若夢變易更起見昔事主躬來慰謝感荷厚恩忍不報語彼人震怒遂見殺害更受中陰身自顧歎惜猶願歷世不言以報厚德遂見託生南印度大婆羅門家乃至受胎出胎備經苦厄荷恩荷德忍而不言洎乎受業冠婚喪親生子每念前恩忍而不語宗親戚屬咸見怪異年過六十而有一男妻謂曰汝可言矣若不語者當殺汝子我時惟念已隔生世自願衰老唯此稚子因止其妻令無殺害遂發此聲耳隱士曰我之過也此魔嬈耳烈士感恩悲事不成憤志而死疏是不相應等者問長等依色立隨依色處收時依五薀施何不從依攝答長等但依色從別色處收時依總法立故不相應攝故佛地論云即是有為法上假立分位或是心上分位影像依色心等總假立故是不相應行薀所攝疏諸經中有説相續相等者引牒文難問頗有唯説剎那時耶答有華嚴等云佛以一音即其事也問疏何不言答亦方隅爾或一音言而含多義謂一剎那或一無漏並名一音故疏不言疏淨穢可定知者所變之土不過二種故可知定衆生根性萬品不同故難準也疏覺有三義等者又按大般若第三百六十五總有八釋今舉後三義即三覺一於三世法及無為法一切種相無障智轉二如實開覺一切有情令離顛倒惡業衆苦三能如實覺一切法相所謂無相故名佛陀如次配疏三覺無失又華嚴經第六偈云於實知真實非實知非實善解真實際故號為正覺此略不舉覺他義也疏如睡覺等者疏意可悉有餘德云佛陀之名含於二義一是覺義無明如睡斷無明盡如睡夢覺二是開義愛染如水蓮華沒水未能得開斷除愛染如華出水方得開敷議曰觀彼論勢疏解為勝夢覺自知夢前更事餘即不委故喻自覺華開氣馥令他聞見故喻覺他以後二喻配前二覺文義順也故本釋善疏如所有性等者一切真俗諸法自性名如所有如所有者指斥言也此諸法性智悉能知舉境顯智名如所有又釋云如謂真如證如之智名如所有即根本智故瑜伽論七十七云如所有性者謂即一切染淨法中所有真如又釋若如其所有一切諸法皆能緣之名如所有即後得智議曰初二釋善理明義備有所憑故智者思之疏盡所有也者一切真俗所有諸法差別之義名盡所有盡所有者指斥言也此差別法智悉能知舉境顯智名盡所有又釋云備攝有無名盡所有智悉能知名盡所有智即唯後得故瑜伽論七十七云盡所有性者謂諸雜染清淨法中所有一切品別邊際又釋若盡者減義減盡煩惱所有之智名盡所有智即根本智議曰今取初之二釋優劣可詳故不待言疏準諸至名薄伽梵者按佛地論云佛具十德何故佛教傳法者一切經首但置薄伽梵名謂即此名世咸尊重故諸外道皆稱本師名薄伽梵又引一名總攝衆德餘名不爾是故經首皆置此名疏應化非真佛等者問按天親論但云應化非佛非説不言法身而能説法引斯為證恐乖論旨答引彼意證應化非真非真説法不以彼文直證法説若爾引之而何取益答憑之申理既説應化非佛非説故知法佛可名真佛故彼論云非非法者真如無我相實有故一切聖人依真如法清淨得名故知法佛名為真佛佛既名真合名真説故疏引彼稱讚大乘而以為證有云疏主引般若論證法佛説乖論意者不悟深旨妄為彈斥應細思之疏住少聖凡夫觀丈六而無盡者二乘之人名為小聖四善根前及餘一切凡夫之類總名凡夫但見丈六又按西域傳云有婆羅門聞釋迦佛身長丈六常懷疑惑未之信也乃以丈六竹杖欲量佛身恆於杖端出過丈六如是增高莫能窮實遂投杖而去因植根為林竹修徑被山滿谷因號斯處為杖林焉疏劬師羅長者按經音義此云妙音疏古因解聖住等者吉藏法師云住有二種一者身住二者心住身住有四一化處住十方諸佛等有國土二異俗住三世諸佛多栖止伽藍三未捨壽分住佛未答魔王啓請壽命無量由答啓請則唯留八十餘皆捨之四者威儀住謂行住坐臥悉名為住二就內德論住亦有四種一者天住謂住布施持戒等二梵住謂住四無量心三聖住謂住空無相無願三昧四佛住住願十力等果地衆德如來具此內外八住疏二謂退凡者凡有二義一未得聖者名之為凡有經説云王宮人等並得初果二謂非王家人親屬凡庶名凡問何未至佛王宮豫下乘答敬法重人顯為後軌亦猶迦葉聞佛涅拌欲起神通赴涅拌所而思之曰我今最後見於世尊豈可以通而往彼耶此顯珍敬王亦如之疏古人有説置千王等皆謬者問古人所説非無典據如智度論律毗婆沙仁王等經説各異故何得總撥為謬説耶答設彼等説皆敘彼俗不正説也故疏不取疏自他二化俱説等者山佛自化城他王化舉自化處顯利於緇説他化處明益於素疏或教妙至有所表等者前解山城俱喻教理此即別配山同出水城類開敷思之可悉疏舍衛豐其四德者謂豐多聞解脫財寶欲境疏古説此經合居四處者疏雖不説準理而言處既有四説即有三初二同疏三者屬纍品後居穢土説故成三矣疏今解至説唯在二等者問觀音之品既在空説無盡菩薩云何右膝著地請佛答經本不同多無右膝著地之語設縱有者理亦無違地者依持之義膝踞於華名為著地疏因緣之經等者因有三種謂因事因請因戒此即因請疏讚證因亦利之者此釋外難外難意云一乘正逗聲聞鶖子可請既不被於菩薩二聖何陳故今答云因利益故所以請也由讚壽量及持經等分別等品證益不同既有斯利菩薩故請疏聲聞凡夫等者定性之人遠塵離垢不定性者發菩提心疏聖者菩薩等者然無生忍初地亦得今所明者非初地也若初地忍即合凡夫菩薩所得既言聖者故知餘地疏有化聲聞等者問意證報土二乘是化今滿慈子見居穢剎何須化為又佛地論但説報土佛菩薩等化為聲聞不言化土今引滿慈恐成虗設答疏意談經有化之事非即以證二土之化但通言耳疏十五人王衆者有本云人天衆者天字誤也有云天對人來實無天也此釋誤也疏此衆二徒者徒者徒轍有此相對之徒轍也二二合之總成三對如次可悉疏後衆次第者問前第三門所烈名字與此第四何故不同答此衆多德互立一名由此多寶為聽證來分身諸佛為證開集前後互明故無失也疏依乞等者比丘乞食須具五義一者不得詐現異相二者不得説己有德三者不得高聲現威四者不得瞻相吉凶五者不得説有所得驚動人心又真諦云食有五種一者盜食二者債食三者許食四家法食五自在食初戒定慧三種俱無二者三學隨有一種而無餘二三具三學四有學聖五無學者疏跋陀十六人者即上生經所説跋陀十六人也非此經中所烈跋陀疏一心等者同心觀佛希聞妙旨同一見解八聖道同餘可知矣問慶喜于時身居有學解脫何同答前首言乃是結集者置集法之時已得解脫所以言同或從多言問二乘之智如盲摸象各各不同何名一見答後得等異根本無差故名一見疏真諦三釋大者彼有三喻猶如大王智德尊高勝一切人喻如山海形量大故猶如大軍兵衆多故稱之為大如次為喻疏合為六者非是全取前之二三取前五解加名稱大而為六釋除智論初議曰可總為七取智論初九十五種外道之中最為大故疏四淨命者離諸邪命事乃名淨命邪命有四一者仰口謂占相星月等二者下口謂自種植貿易等事三者方口謂騁國四方通致使命四者尖口或云經口諸行醫道等以上四緣求諸衣食並名邪命即以貪瞋所發三業名為邪命而有頌云俗邪見難除由恆執異見道邪命難斷由資具屬他問比丘之名含於乞義諸餘乞者應名比丘答比丘之名具於五義餘不具五不名比丘然有釋云乞有二種一乞法二乞食比丘具二餘不乞法不名比丘又退無積畜之纍進有福物之功自利利他異餘乞者議曰後釋難詳亦有俗人於佛求法所得不積二利齊修應名比丘故知比丘而含五義非一乞士得比丘名疏依新經舊論有十六句者唐三藏所譯般若等經名為新經此經之論先譯名舊且言新經實餘古經亦有十六句者問論釋於經何故經論數不同耶答古有兩釋一云梵本廣略不同一云聲聞常衆無會不集處處歎之故羅什略歎其德天親欲示解一經歎德令識衆經歎德之意故廣記也議曰初解乖理論牒經釋經本既略論何因廣故非梵本有廣略也問何故諸經歎德增減不同答有二釋一者譯主具略不同二集法者歎有多少歎德皆是結集置故論上上起門者古有三釋一云學人功德比凡為上無學人德復勝於學故云上上二云羅漢有二一者鈍根小羅漢德但名為上今明利根大羅漢德故云上上三者就大羅漢有二功德一上功德二上上德今十六句歎上上德議曰理有百途非無此旨若依論勢可從本疏所以然者論云上上起門者謂諸漏已盡故名為羅漢標上上已即以諸句上下釋之故知諸句上下互起名上上起若如古説論何不言疏論以第二句釋初句者問無學之人種現俱盡何不雙以第二三句釋第一耶答有二釋一云理實合爾但由現惑招於三有無學既稱不受後有故以第二釋第一也二云八地已去頓悟菩薩亦名羅漢若要種盡方得應名即顯八地非羅漢攝今顯通彼故以漏盡釋羅漢也議曰後釋為正前約一邊雖復正明小乘羅漢義兼菩薩故亦無違疏十六大隨者色無色界各有八隨合成十六疏具十一殊勝事者按緣起經説一所緣勝遍緣染淨故二行相勝隱真顯妄故三因緣勝惑業生本故四等起勝等能發起能引所引能生所生緣起法故五轉異勝隨眠纏縛相應不共四轉異故六邪行勝於諦起增益及損減行故七相狀勝微細自相遍愛非愛共相轉故八作業勝作流轉所依事寂止能障事故九障礙勝障礙勝法及廣法故十隨轉勝乃至有頂猶隨轉故十一對治勝二種妙智所對治故疏多緣欲起從勝為名者略言欲界而有三欲一睡眠欲二淫欲欲三飲食欲為此勝故故得欲名疏九結者此之九結而有三義一自相二功用三位差別言自相者愛結謂三界貪恚結謂欲隨惑恚慢結謂七慢無明結謂三界無知見結謂薩迦耶見邊見取結謂見戒二取疑結謂於四諦三寶猶豫嫉結謂隨惑慳結亦隨惑也言功用者謂有此者不厭三界由此展轉不善現行善不現行言位者謂於後果生位廣如對法疏以離定障名心解脫者問定障是何答理實諸染能障定者皆名定障然依勝説異熟生受名勝定障領下劣法不上進故問定既離障何乃名為心解脫耶答定是心所以所從王名心解脫鄰近釋也或定令必住於一境定得心名問頗有定圓根不具耶答應為四句有定圓根不具謂身證那含得九定故名為定圓上惑未已名根不具有根具定不滿謂慧解脫及超中二有根圓定亦具謂俱解脫者有根定俱不具謂諸凡夫未得定者及除身證餘前三果疏離性障者煩惱體性即是障故故名性障疏由離此二證獲無為者問豈離定障得無為耶答許得何失若爾何故説三乘人解脫床同答彼約惑苦不生解脫不説無為三乘同也問定障既在所知障收云何生觀而能斷耶答非生現觀但以事觀能伏於彼由無惑可斷復更不別得於果故故非理觀若也練根取獨覺果容以理觀別得果故雖不別得擇滅無為由伏定障得非擇滅故言離二證獲無為疏離心相應縛者王體非縛相應煩惱能縛心故名相應縛心相應即縛持業釋也疏如相應事已辦故者略有四釋一云與四諦理相應也一云如謂真如相應謂正智與如相應正智辦也一云能證滅諦諸心心所名曰相應如者指斥之辭由得如是相應之事已成辦故所以名為已辦所辦一云如相應等者是舉喻也思可知矣雖有多釋隨應皆得疏單釋十五至心自在者問既由諸句名心自在何名單釋答疏主總談由具上句至心自在不同餘句取他束釋疏準論三句以下釋上者準有三句而以下句向上釋之所釋唯三能釋即四乍觀為言能釋有三上釋下七亦準此知疏三單二不釋者問既不以他及總不釋何總名為上上起耶答從多為名疏故入十地得羅漢名者釋以現行漏盡之義釋羅漢名之所以也疏或總無煩惱別我執亦亡者此有二義一明當句自釋所以遮於外難前諸漏盡據總煩惱此無復言約別我執雖俱現行總別有異故分二種此順前解無復煩惱第二釋也二者第二三句俱是現行將諸漏盡釋無煩惱雖俱現行由總現無別執亦盡故將釋之與前不同亦有斯理前釋為本疏三應入聚落至所牽等者如頭藍子雖得非想非非想定然未自在後入王宮為欲境惑失諸神通即其事也疏應一向行善等者問既號無學何有進修答二乘究竟道欣大菩提故若爾定性應不進修答亦樂利他練根除障總言進修故理無爽疏於二界禪等者問禪唯色界言二者何答略為三釋一云疏脫第字一云文總應言於色不著於禪於無色界不著於定一云無色亦得名禪禪者此譯名為靜慮能生一切諸功德故亦義名為功德藂林故智度論八十説云禪者四禪四無色定等諸禪定若不爾者禪波羅蜜攝定不盡而經論中多不説者色界具支無色不具故得名別理實通有疏應如實知同生衆等者問云何同生答古有釋云準經而有二五種佛子一者四果并緣覺五二者四果并法身菩薩而除緣覺此二五種並從佛口生故謂同生衆生準疏意云化諸衆生令同羅漢所得己利名曰同生疏攝取得功德者問云何名得答有云一切羅漢必應諸漏已盡無復煩惱準此意云令得漏盡無復煩惱名之為得議曰若爾何但攝於二句無學必合所住辦等準俱解脫望十五句總名為得慧解脫者隨準知之然疏意云由成二句是以能得諸功德故故名為得疏攝取所應作者問猶修供養云何名為已作所作答自位滿故名已作所作為報佛恩更修供養疏過上下界者下謂欲界上色無色定散不同開合為二疏攝取上上功德者問何故初後二門之中正智解脫皆言無為第二門中即言解脫謂神通耶答解脫之名通於二義由伏定障方得神通亦名解脫古隨義釋不同何咎即第十四至心自在前後不同準此可悟疏宗義配之者但以宗徒義意配之非論本意及真實理須此配也疏十二由經等者問結集之首乃是慶喜何言不同答且初結集界內外二自茲已後諸部傳異故不同矣言唯慶喜據初從多思之疏修苦樂行者於頭藍等處學非想等定名為樂行對苦名樂彼定不與樂相應故疏上時者有云西方俗時而有三種一者熱際二者雨際三者寒際今此尊者熱際時生故名上時亦猶雨衆外道而立名焉疏無滅佛黨弟者傳釋云亦號此尊名半頭天眼古釋半頭之言由失肉眼後得天眼半頭已上悉能照矚名半頭眼復有釋云肉天具有名全有眼由闕無一故名半頭議曰按智度論云何泥云盧頭色界四大造色半頭清淨是天眼佛天眼四大造色遍頭清淨準此但據淨有圓缺以名遍半未必約見及眼具闕若如古釋五眼不具總應名半縱有天眼眼亦少故未必皆能全頭見故故不依也尊者即是甘露飯王之子也疏假和合等者問死尸無情云何得與有情為支分也答有二釋一云鬼神之力二云實即不然示現可爾為破有情執有實我顯假和合示無我故議曰前解違唯識理離託餘身無重生故思之疏餘習尚在等者問按大集經歎羅漢云善得解脫斷煩惱習云何今言有餘習耶答習氣有二煩惱即習因習成故二煩惱之習惑氣分故前羅漢無後容得有故大集經云佛漏盡智無邊清淨不雜煩惱習聲聞緣覺習結氣是故漏盡智不淨疏經五不死者一釜煮不死二𨫼爍不燋三水不溺四魚腹不爛五刀破不傷疏因共佛論者本外道也後逢如來求欲論義自為其主矯立宗言言不受一切法此矯意云既立宗云不受一切佛若難我我皆不受佛返徵云汝為自受此知見耶為不受乎彼聞斯責即知墮負請皈出家此難意云若自受者即違自宗宗言不受一切法故豈汝此見非一切耶若言不受兩俱不成俱知此見汝之起故云何不受又夫宗者違他順己汝自不受何得名宗若言我宗不許何成俱過者設爾亦有世間相違及隨一過疏放牛十一事者一知色二知相三知刮刷四知覆瘡五知作煙六知好道七知所宜所八知度處九知隱處十知留乳十一知養牛主如智度論第二具明疏滿慈子者有云尊者父母江邊祠天求乞於子設以華香供養梵天感夢寶器因得是子滿本願故故名滿也疏執日等者此尊者六年處胎傳有二因一云曾塞鼠穴時經六日二昔曾為王召一沙門處於門外經於六日忘不處分故招斯過疏進趣止息名為無學者問如俱解脫理即可然慧解脫人定未圓足云何得云滿足止息得無學名答據自分位所得足故即名無學不約練根轉修勝定若不爾者從俱解脫亦非無學後回趣故故知但據本根性滿雖止得於未至定法亦得名滿或且據彼俱解脫人而作斯釋此經所列並俱脫故不如前釋疏大術生佛七日命終者問但有皈禮諸佛並賴益壽延長親誕神儀翻令促命答如來設化事不一途舉動施為非無所以且傳釋云佛在知足將降人中先觀閻浮所有四事一觀生中國二觀生剎帝利家三觀衆生根器四觀所生母七日命終菩薩不欲屈節女人故有斯志故目連問經云父母生我時七日便壽終所以者何母人之德不堪受其禮故所以者何用與得佛不應還向母作禮於是頌曰佛為天人尊諸道無能及女人德薄淺不堪受其禮此經雖不入因然取其意釋難亦得問何故彌勒生婆羅門家答濁惡劫出生剎利舍劫初減應生淨行家問若待根熟云何迦葉如來七日涅槃而不化利答以所被生而無多故言不化也非是全無又按佛本行經總有三釋一云太子誕生適滿七日摩耶夫人更不能得諸天威力復不得太子在胎所受快樂以力薄故其形羸瘦遂命終矣二云或有師言夫人壽命算數唯在七日是故命終雖然但往昔來常有是法何以故以諸菩薩幼年出家母見是事其心破裂即便命終三云薩婆多師復作是言其菩薩母見所生子身體洪滿端正可喜於世少雙既覩如是希奇之事未曾有法歡喜踊躍逼滿身中以不勝故即便命終又按大乘方便經第一云菩薩先在兜率天時以天眼觀摩耶夫人命根滿十月已餘有七日在爾時菩薩便從兜率天來菩薩以方便知摩耶夫人命根欲盡故來下生非菩薩咎疏父母等將皈等者意説闥婆本非人類如何父母而言取歸

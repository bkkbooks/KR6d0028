body:
  text: 沙門智周撰化城喻品疏此所起慢或欲界等者此得定人要伏欲界俱生煩惱分別不伏故容得起欲分別惑有云此所起執分別煩惱而是色界以得上定欲分別惑雖未伏斷以無影輩故不得起議曰雖有此斷未可為依無明教故問起欲分別為何性耶答有二釋一云此得定人雖不能伏欲分別惑由定慙等力所制伏不起不善二云既不能伏容起不善議曰若准前解所起慢等非是欲界唯識論云若欲界繫分別起者唯不善攝發惡行故若依後釋起欲慢等理即無違疏凡夫有學聞此假解等者問若聞他說所變假相以為涅槃而執求者何要得定豈不得定不聞他說不執求耶答論據曾習勝人說也疏如二乘所起四倒者舉此證彼二乘假解在出定後非解脫道作斯解也所言四倒者謂我生盡等疏又有釋等者問疏主結斷取於初解然觀論旨後釋為優故論云以有三昧實無涅槃生涅槃想若不執於自所得定以為涅槃論言有定生涅槃想豈非虗設答談彼二乘有世間定生涅槃想凡夫求之斯有何過問論文既通斯之二理疏何斷令依於前解答佛陳七喻大意有二一敘昔事二者談今若言敘昔無文說彼下根之類在凡位曰執自得定以為聖果是增上慢若言對今增上慢衆方便品中拂席而去枝葉無遺對何說耶以此推究故初釋善疏說化滅化者說彼二乘涅槃為化滅彼凡夫自執化城疏是喻法者法者涅槃今以化城喻涅槃法或喻即法法名通故疏釋迦修行至猶稱王子者此難意云設大通世初始發心逮於今時已逾三劫況大通時早為王子王子行位非是初心云何許時今方得佛猶為尚也義意可知疏意趣有四者莊嚴攝論皆廣辨之今疏所引與論名字雖少有殊大意不別今依攝論等粗宣其義冀諸後學披疏易悟略開三義一立意二出體三正釋初立意者以斯四種決了如來祕密言教令生開悟故對法云由此意趣故方廣中一切如來所有祕密應隨決了二體性者皆以如來後智為體由緣一切差別義理為利衆生安立教故故無性云遠觀於他欲作攝受名為意趣意云謂能化者遠方便中先視於彼所化人之宜以何法而攝受之名為意趣三正釋者先總後別思量名意趣謂理趣思量理趣故名意趣有財釋也趣謂其境意是相應智用斯二以得名故別名四者一平等意趣此彼佛身身功德等悉皆相似言過去佛即是我身非實彼佛即定是此故楞伽經大慧菩薩白佛言何故世尊言我是過去一切諸佛佛言以四等故一字平等過去及我同名佛故二語平等謂三世佛皆有六十四種美妙梵音言語說法我亦同彼三身平等我及諸佛法身色身相好莊嚴無異無別四法平等我及諸佛皆得三十七菩提分十力無畏諸功德故依此四種唱言我是𤘽留孫等又無性釋云謂一切佛由資糧等互相似故作如是言彼即是我然非昔時毗鉢尸佛即今釋迦問本以意趣決諸祕密如言彼佛即是我身有何祕密復如何決答勝觀釋迦本非一體經言彼佛即是我身道理有乖故云祕密談佛意趣據平等理言彼是我以會相違餘三准此二別時意趣者言雖說此意在他時言說與意時分有異名為別時故無無性釋云謂觀懈怠不能於法精勤學者故說是言若誦多寶如來名者便得決定由唯發願便得往生極樂世界此意長養先時善根如世間說但由一錢而得於千意云最初一錢是彼後時得千之因於一因中說千之果法亦如是問持名願往何祕密耶答持名發願皆是其因後時方得決定菩提往生淨土經依今因說於當果言持名等即是決定往生安樂國故名祕密今以別時意趣通之故無妨矣言雖即指持經決定意在後時方得決定三別義意趣者雖談此義意主別義言說與意義有不同名別義意故攝論云若已逢事爾所殑伽河沙等佛於大乘法方能解義無性釋云謂證相大乘法義與教相大乘法義甚有差別由此故言於河沙佛方能解義意云解義有二一證理之時名為解義即證相大乘在初地已上菩薩所證二聽法聞思之時亦名解義即教相大乘在十信前凡夫所聞聖凡階位而有不同故言差別問言逢多佛方能解義何祕密耶答據教中義解實非難言逢多佛方能悟解豈非祕密故以別義意趣通之佛雖指於教相中義本意在彼所證之義故事多佛方能解之故涅槃經云初依菩薩供五恆佛方解十六分之少分然疏中云謂說諸法皆無自性等者言雖總說法無自性而意別在遍計法也餘類可知四補特伽羅意樂意趣者雖於一法讚毀不同為對所化意樂故爾故名衆生意樂意趣故攝論云謂如為一補特伽羅先讚布施後還毀呰如於布施尸羅亦爾無性釋云先為慳貪讚歎布施後為樂施毀呰布施為欲令修勝品善故讚毀惑等准施可知問此讚毀教何名祕密答於一施中讚而復毀而豈非是自語相違故是祕密觀所化器意樂不同對彼而說故不相違疏善心相續至猶稱王子者言三劫者據求菩提方便善心剎那積數相續而說若起餘無記不善等時不取為數今者三性所有時節總合而言故經爾許問唯壽量品明成佛時已在十六王子前矣縱有多會豈不相違答彼據實成此依示相或復彼依平等意趣此據實成廣如下疏疏下諸長行方頌有文者末品下頌方始頌此長行之文中間頌者諸梵請文非頌長行文言似倒應云頌方有文疏十事坐於道場者按彼經第四十云菩薩摩訶薩有十種事故坐於道場何等為十所謂種種震動一切剎故普照一切諸世界故除滅一切諸惡道故變一切剎為金剛故觀一切佛師子吼故離一切虗妄心淨如虗空故示現隨順淨身威儀故隨順圓滿金剛三昧故受一切佛清淨坐處故自善根力悉能受持一切衆生故坐於道場疏破魔軍有十義者按彼經第四十云菩薩摩訶薩坐道場時有十種義故示現降魔何等為十所謂五濁惡世衆生樂相征伐欲顯菩薩功德力故悉滅天人諸疑惑故為欲化度魔眷屬故諸天世人樂征伐者令集化故集天人已顯現菩薩功德之力不可破壞調伏衆生故發起一切衆生力故哀愍未來一切衆生故乃至道場現有魔事悉能超出衆魔境故顯煩惱力勢羸劣大悲善根勢強威故順五濁世諸衆生故示現降魔疏即二世界鐵圍山間者即兩圍山之中間也而由日月持雙山高圍山障故故兩山中常無日也問中間衆生何界所攝設攝不攝俱何失耶難二俱有失若言攝者如兩界物取不犯盜以無屬故此何不爾若不攝者此中間者應非三界之所收故若復爾者即有三界攝生不盡之妨答未見正文待後撿之未間且為一釋如物處中雖非二界然亦不離三界之中名三界物中間衆生類亦應爾雖非二界何廢亦是三界中收疏或初禪至梵福量者請轉法輪感梵福量梵福量報即初禪故經東方五百萬億國等者問二乘通運不越三千梵王凡夫云何得逾五百萬億答略為二釋一諸梵王等皆是菩薩得受十王位故二或是凡夫佛加被故故唯識云定通等力即不決定仗佛通力遠來何失又序品云毫光照於萬八千界而此世界盡見彼土又如十住斷結經法界品後云吾曾遊處野馬世界去此七十二億江河沙數諸佛剎土時我弟子名目連神通第一至野馬界放大音聲遍三千界演說其法此乃如來加之令往若不爾者二乘神通不越大千云何得至塵沙界外故佛加也故知凡夫佛加亦得二釋任取經其所散華如須彌山等者問十方梵衆皆悉獻華一一華積並若須彌此界云何容多須彌答此中化土及受用境合而說之大即報境小即化土隨應釋之餘皆准此經諸梵天王說偈請轉等者按大集經第二梵王說偈請轉法輪云如來雖有大慈悲憐愍衆生如一子我今勸請法應爾願轉無上正法輪如來初生發誓言我當救彼苦衆生衆生渴仰甘露味願大施主施法雨經天宮殿俱者問云何宮殿天身俱來答有二釋一云梵王既是菩薩宮殿俱來何難二云縱是凡夫自亦有通復依佛加如來亦無失問若言梵王是菩薩者八地菩薩必受變易梵衆等類云何得見答凡梵所見亦即化身疏老死有二因至齊識退還等者德證無說等能為依者亦得名因以彼生支是無記故問證意可詳然文難悟何唯二因復分粗細俱至識退不及餘二答生果所由二種便足去果遠近能所感異分為粗細然舉一隅以示三故至識退還故瑜伽論九十三云由老死支苦諦所攝故於緣起逆歷觀察當知此中由三種相於其老死如理觀察觀察細因緣故二者觀察粗因緣故三者觀察非不定故感生因緣亦名為生即生自體亦名為生者釋有及取愛感生名生即能生名生生支自體而是其生復能生他總名為生言前生是細後生為粗者釋有取愛名之為前生支名後業煩惱故名之為細逆報果故故得粗名言觀前細生有故而有老死亦觀由後粗生緣故得有老死當來老死細生為因現法老死粗生為因者釋明彼粗細二因各別而與其果異世同世名前後矣待前過去故得後名言除二生體餘定無能與老死果者釋第三相非不定義言如觀老死生有取愛各由二種如理觀察當知亦爾者釋例顯生等各有粗細兩種因言依緣起門逆次而入先緣後際如理思惟老死苦諦乃至其愛者釋未來生死與死總名苦諦有取愛三名為集諦言如是觀察後際苦集未為喜足釋雖知未來生老死苦因有取愛集之所起然未知有取愛三法依何而有更欲知之言未喜足言遂復觀察後察集諦由誰而有者釋推有取愛有之所從言知由從先集所生起識為邊際現法若有者釋觀受與觸六處名色至識為極故名邊際此現識等苦諦之法是彼先集之所生起未來有取愛等三集依此識等現苦方有言既知從先集所生起不應復觀此云何有者釋此顯逆觀但至識支不觀過去行無明支之所以也為前已推後際有取愛等三法依先集諦之所生起現識等五准知識等即是過去行無明生不應復觀識等五支云何而有由觀至識更不觀行及無明支名為退還又依前文及無性論意逆觀老死由生而有及至名色由識而有識復由彼名色而有由識名色展轉為依故為此觀而至於識不觀由行得有識支却觀因彼名色得有名為退還故彼論云齊識退還者識者即是阿賴耶識自體為依無間轉故自體即是名色支也問十二支緣識於行云何今言依名色耶答據識現緣但觀名色故不觀行疏不說非支亦名為集者諸無漏法外無情物並名非支不說此等以為集諦疏真如至名為滅諦者標滅諦相言滅依能滅滅性者亦彼論文釋前三種名滅所以滅性即是擇滅無為正名滅諦滅依能滅相從而言亦名滅諦非正滅諦故辨中邊論云能寂靜道并寂靜道所緣真如及彼所證並是寂靜無為疏依詮顯實至滅諦所攝者若息於詮即非滅諦寄詮以辨可滅諦收即對法云真如滅依亦名為滅疏滅性正是滅諦所攝者舉正滅諦以顯真如約詮相從亦名滅也疏有作無作四聖諦者小乘觀諦望度更有大乘諦觀可修習故故名有作大乘觀諦望後更無餘觀可修故名無作亦名有量無量四諦小乘法中雖觀四諦總相粗知名為有量大乘法中隨別細知名為無量如一苦中知塵沙苦集滅道三亦復如是即涅槃經以為明證疏如是八諦非二乘所知者問無作四諦可非二乘知有作云何彼亦不悟答知不盡故亦名不知故勝鬘經云如是八聖諦如來說四聖諦如是四無作義唯如來事究竟非二乘事究竟釋究竟有二一解究竟解知一切四諦法相故二行究竟於己苦集斷盡滅道修滿足故如來名事究竟不究竟者亦有二種翻前應知是故二乘名非究竟然彼經文而不一處言八聖諦非二乘知疏主取意合一處言讀者知之疏即新經云安立等者問非安立者廢詮為義言無作者無後可作名為無作然可施設二義既差云何相即答非安立名通於二義一唯廢詮與無作別即瑜伽論非安立諦唯是一也二言非者即是無義安立是作名字有別義諦無差經云非安立故即無作也疏如所說相不捨離義者如說苦相實是其苦不可令樂乃至滅苦之道實是真道不可令其苦為非苦乃至道為非道名不捨離不捨離者是即實義實義名諦疏由觀此故等者此即能生不顛倒覺名為諦義離顛倒者名清淨故疏滅者彼俱寂靜義者彼苦集二悉皆滅離名俱寂靜疏能成三義義者能成知苦斷集證滅三種義利之義故論重言義義也疏此中苦事至亦爾者一一諦中皆有事理及如三種三種皆隨自諦為名疏趣苦滅行者道諦名為趣苦滅行行者是道此道而能趣向苦滅疏由彼集諦苦諦攝者煩惱業種更無別體即是賴耶故苦諦攝相皈性門也問現行惑業復如何耶非賴耶故答現行望種正是其果體復逼迫苦諦所收義明顯也何待言矣疏言觸證者至觸證滅諦者能緣之智親對了悟簡彼非親故言觸證是現見也又顯不起貪染等心言不生怖等或從喻言身根取境對觸而證親於餘根故取為喻疏乃能成辦所說三義者即是知苦斷集證滅疏由此故苦為初者逼迫故苦為此苦諦而是取薀逼迫體故故取在初疏如此故苦為次者而論正云如此故苦此為第二如此者指斥之詞如此集諦故今有苦故在第二或如者似義集因似此所生苦果有逼迫義故在第二所似能似以為次故疏由此故樂為第三者由此苦集二種滅故故有其樂故此滅諦以為第三疏如此故樂為第四者如此之言指斥詞也如此聖道能證彼樂故為第四或如者似義道因似此所滅之果離逼迫故故在第二所證能證以為次故疏如次無常等者大小乘中皆悉有明今依雜集粗顯之也苦四行相者一無常相者略有十二一非有相謂薀處界於一切時我我所性常非有故故曰無常無彼常相名無常矣二壞滅相謂諸行法生已即滅暫有還無故三變異相謂諸行異由不相似相續轉故四別離相謂於諸行失增上力或他所執或資具等自在失壞或他陵奪為己有故五現前相謂正處無常由因隨逐今受無常故六法爾相謂當來無常由因隨逐定當受故死無常性決定當受七剎那相謂諸行剎那後必不住無間必壞故八相續相謂無始來諸行生滅相續不斷展轉相乘輪回不絶故九病等相謂四大乖違住持勢力盡故十種種心行轉相謂一切時起有貪心或於一時起離貪心餘瞋癡等諸不善善皆如是知十一資産興衰相謂諸興盛終歸衰變由諸世間富貴榮盛不可愛樂非究竟故十二器世成壞相謂火水風三種成壞故二苦相謂三苦八苦廣如前明三空相謂若於是處此非有由此理正觀為空問於何處誰非有答於薀界處常恆不變我我所等非有由此理彼皆是空又有三種空性一自性空性二如性空性三真性空性初依遍計所執自性觀由此自相定非有故第二依依他起自性觀由此如所計度皆非有故第三依圓成實自性觀由此即空真性故四無我相謂如我論者所立我相薀界處非此相由薀界處我相無故我論外道計度諸行為我彼諸行非此相故故名無我集四行相者一因相謂能引發後有習氣因是名因相由業煩惱是能引發後有習氣因故二集相謂彼彼有情所集習氣於彼彼有情類為等起因是名集相由諸有情所集習氣於天人等有情類中能為相似形貌種類平等起因故三生相謂各別內身無量品類差別生因是名生相是諸有情各別內身相續決定趣生地等所有一切品類差別乃至有頂生因故四緣相謂諸有情別別得捨因是名緣相能令有情得未曾有得自體捨已曾得自體故滅四行相者一滅相謂煩惱離繫故即流轉因煩惱離繫故名為滅二靜相謂苦離繫故行苦所攝不寂靜相取薀離繫故名為靜三妙相謂樂淨事諸煩惱苦究竟離繫自然樂淨以為自體故名為妙四離相謂常利益事故不復退還最極安隱如其次第名常利益最勝善性故名為離道四行相者一道相謂因此道尋求真實義故所以者何由此聖道是諸聖者證真義路是故名道二如相謂能對治諸煩惱故所以者何一切煩惱皆不如理道能除此是故名如三行相謂善能成辦心令不顛倒故所以者何心不覺悟真實道理於無常等法起常等顛倒善能修治此顛倒心令離顛倒覺真實義是故名行四出相謂趣真常路故所以者何由此聖道能趣出離究竟常路是故名出疏為除四倒至除我者問何故苦一除二倒空無我二除一我倒答夫言苦者體必有漏有漏之法唯是不淨由知是苦即知不淨故一苦行能除二倒薀界處中無彼所執常恆之我名之為空即薀界處無彼外道所計我相名為無我由斯二行共對治我倒疏集諦至獨愛者四愛行相如前已辨依此四倒四愛生也行相可悉問集諦四行一一別觀四種愛耶答此四數總相相當立集四行非一一行別別對彼四種愛也以彼四愛一一皆有因集生緣四種理故思可知之滅道四行對四愛等亦據總相以一一愛滅皆有滅靜妙離四種理故道亦如之並思可悟疏於一剎那為行所集等者如剎那頃而殺生等即剎那行而能集於當來苦報五果之種善亦准此疏有處亦說至非通種子者彼經既言生引同時引因識等既是種子生支老死明亦通種然實非種義言是種問然觀唯識唯會彼經說識等五通現所以不言彼經說生老支亦是種子故唯識云或依當來現起分位復由此說生引同時但明識等據當起位名為同時通現所以何以得知彼經亦言生等通種答文不明言理准知矣既言生引同時而有即言彼經說識等五通現行收以彼引支同生支故亦應生支與引同時生支同引亦通種子由有此理故疏說云經說生老死通種子也不爾難悟疏此有故彼有顯無作緣生義者由此無明等緣法有故彼行等果法而得有也餘支相望皆准斯矣外道小乘執緣有用今破於彼名為無作雖無妄執真實作用仍能生果故名緣生疏此生故彼生顯無常緣生義者此無明等從因生故彼行等果方得從於無明等生餘支相生例亦同此外道妄執自在梵世冥性神我等體是常法不從因生而能為因生他果法今顯異彼名曰無常從因生故緣生同前疏顯勢用緣生等者外道執時方等法能為多果之因今破於彼顯無明等但望於行能有勢用生起之義不能普生餘一切支餘支展轉相望亦爾問若但鄰次有生能故名勢用者何故瑜伽云無明支乃至亦與老死為緣答緣有二種一近二疏瑜伽前文及對法論據近緣故但言無明與行為緣瑜伽後文通依近遠故云乃至亦與老死而為緣也不相違疏無明有二至異熟果起者異熟謂三塗惡報由愚不信惡行能感三塗異熟異熟之愚依主名也由此愚故起諸惡行正違信解三塗異熟所有正見故對法論第七卷云由異熟愚發非福行必不容受信解異熟行相正見真實義者即四聖諦由愚迷此不知三界皆是其苦妄執人天以之為樂及涅槃等故起不動及以福行願求彼果真實義之愚亦依主也故對法云真實義者即四聖諦於彼愚癡名真實義愚於三界苦不如實知便能發起後有因性福不動行問發行無明為現為種為同為異時答種現俱通通同異時故對法云由非福行是染汙性與無明合時此即現行與非福行俱時起也又云雖起善心由彼隨眠所隨縛故亦名愚癡此明種與不動福二行俱也又云由彼勢力於三界苦不如實知發福不動行此明前念愚癡所有勢力發後念福不動行也真實義愚既以行同時種及後念現能發二行異熟愚中亦應如是影略說故唯現無明福不動行不俱時發明昧異故問若據諦故名真實義五趣果體皆苦諦收總名真實若酬因邊名為異熟三界果法悉是異熟何故無明迷人天報名真實愚迷三塗果名異熟愚答非福行與愚合時不了惡因得惡異熟由迷所感異熟果故發非福行福不動行由無明力迷人天果謂為樂報及以出離起行求生雖人天果亦是異熟三塗異熟亦苦諦收然起非福行時不知得報所以不明報中有苦名為逆苦但由迷彼所感異熟名異熟愚迷人天者定知其業而能感果所以不得言異熟愚但為不知人天果苦及非涅槃妄以名樂及以涅槃起行求生所以名為真實義愚疏一分別自性緣起等者分別者區分差別之義即諸法因令所生果各各分類差別轉故名為分別非是緣慮解釋分別言自性者即是種子因之自體或是種子所生果體後解為勝故瑜伽云因緣者自體種子緣所顯故分別者是因之用自性即是所生果體從用及界以立名矣自性之分別依主釋也自性分別之緣起亦依主釋愛非愛者善趣異熟可欣樂故名之為愛惡趣異熟不可欣樂名為非愛緣起即是二趣因也分別同前亦是從用及果以為其因依主釋也問此二緣起以何為體答有云初自性緣若據通論三熏習種各生自果並自性緣今此所明多取名言無記種子望異熟果為自性緣議曰觀攝論意三熏習種對望自果為自性體不唯無記望異熟果故本論云此中依阿賴耶識諸法生起是名分別自性緣起無性釋云以能分折一切有生雜染法性令差別故准本論中言諸法生起釋論云一切有生豈唯望於異熟之法而名諸法及一切耶故知即以三熏習種以為自性是論言心矣愛非愛緣體尅性唯以有漏善種不善種生望生善惡異熟之果是愛非愛故緣起經云由善不善業令三塗人天差別又梁攝論云福及不動是可愛非福是不可愛若據通論十二有支現種因果皆愛非愛故攝論云後有十二支緣起是名分別愛非愛緣起以於善惡趣能分別愛非愛種種自體為緣性故本釋二論皆依通體疏依阿賴耶識等者出緣體也本識是彼諸依處故舉所依識顯能依種言諸法生起者舉所生果疏一則名緣識等者言緣識者謂即藏識是餘轉識之生緣故藏識為緣所生轉識受用主故名為受者以受用境受數為勝從識俱受立受者名即鄰近釋言此中者六轉識中名為此中或雙指前緣識受者名為此中議曰後解為勝不爾緣識豈無相應受心所等耶能受用者謂即受薀言分別者即是想薀推心所者謂行薀中思作意等令心造作䇿舉於心故名推心舉思作意等行薀中諸心所也此心心所皆能受用所緣境故名受用緣疏若識俱三薀等者除受薀也自是支故即想薀全行色二薀各少分也色除五根及身語表無表業色如次屬彼六處有支行除無明無慚無愧以無慚愧纏中攝故思觸沈掉貪生異滅別立支故故取少分疏住名色根說為六處者名色是總根是其別以別依總名住名色問意根過去現唯有五云何剎那具十二支闕六處故答如名色支非攝非色色法皆盡由居此位得名名色六處亦爾雖數有少亦不名闕或由五根能滿六處六處之分亦名六處如言燒衣燒衣一分名燒衣故故正理云有色諸根說為六處疏諸法生起名生業者問生相未來老死唯現時既分二云何剎那具十二支答有二釋一云此依四相作用究竟名一剎那故十二支而有具義二云四相體用合說生據其體得與老死用同現在二釋任取疏復有說至非同前義者此異師說剎那連縛俱遍有為通情非情有漏無漏然連縛緣諸師皆許遍諸有為剎那有別故對連縛異說也問連縛何義答無間名連相接為縛或鄰次名連相屬名縛故正理論云連縛緣起謂同異類因果無間相屬而起疏即此至名遠續者即此第三分位緣起約起隔遠而相續故故名遠續此據於後及不定說故正理論云遠續緣起謂前後際有順後受及不定受業煩惱故無始輪轉問此緣起差別云何答剎那緣起二說不同如前已辨連縛緣起通情非情有漏無漏分位遠續有情有漏又連縛緣前後剎那無間相鄰連接相續若分位緣據十二支分位無間相續而起及不定說若遠續緣據分位中後及不定說也疏或位安立諦等者問縱依安立何先觀苦答安立四諦苦諦在前故先觀苦疏謂老死至趣滅行者四諦如次如觀老死當老死支名為苦諦生支名為老死集諦老死因故滅道可知餘支皆爾當支為苦前支為集疏無明無因即智種闕故者種猶因也由智無因故不得成四十八也又按婆沙百一十云何故不說知無明智答若法有支所攝以有支為因是有支果者此中說之無明雖亦有支所攝而不以有支為因亦非有支果故此不說復次若依此法具起四智此中說之依無明支但起三智不起緣有支集智故此不說疏緣教法名支不攝者即此教法非十二支名支不攝前之六智緣理之智道理理也第七之智緣事之智問何故名法住答謂世俗智如佛施設聽聞法已智無倒智名法住智智無其謬而住法也法即四諦因果法也故瑜伽論九十四云能以妙慧悟入信解苦真是苦乃至道真是道諸如是等如其因果安立法中所有妙智名法住智或法是果住是因名名為法住同於小宗故按婆沙百一十云法者是果住者是因智知果法所住因故謂知三界上中下果所住之因名法住智此智唯知因之別相非聖行相故唯世俗智所攝也評家取之以為正義疏異生聖者俱有此智者問准瑜伽論九十四云住異生地能以妙慧悟入信解四諦法中名法住智又云當知建立七十七智從此無間入諦現觀准斯聖旨但目異生云何而云皆通凡聖答若法住智凡多聖少若真實智聖多凡少論據多分故不相違疏是聞慧故名法住智者問按瑜伽論九十四云住異生地便能如實以聞思修所成作意如理思惟能以妙慧悟入信解四諦因果名法住智何故違教斷唯聞慧答疏主既言通聖得有豈容不許有修慧耶但據異生多分說也故不相違疏逆順緣起者問逆順之名據何而立答有三對一因果對先因後果名之為順順生之理返此名逆二細粗相對先細後粗名之為順順積聚理返此名逆三近遠相對先近後遠名之為順順觀適理返此名逆故婆沙論二十三云以因推果名順觀察以果推因名逆觀察復次從細入粗名順觀察從粗入細名逆觀察復次因近觀遠名順觀察因遠觀近名逆觀察疏雖無現前至十二行相者此伏釋違違云十二因緣本被緣覺下明得益元無辟支所為既不會莚甘露豈無徒降故疏答云令聲聞人聞緣起教因茲亦得悟於自乘如因外典得悟內宗賴彼小乘趣皈大運議曰亦有緣覺經中但云說法時那由他人不受一切法等通有辟支斯亦何失若爾何故經次說云從是已後聲聞無量答有二種一從多言二從通說聲聞之名通辟支故若不爾者有相例失云何佛說四諦大乘之法即有所被聲聞菩薩說十二支何無所化故通無爽疏彌勒三會等問彌勒大通俱言有會齊是化身何化生數多少不等答彌勒三會而所列者且舉釋迦遺法弟子非准爾數或舉德首或緣感異何要齊同後解勝也疏釋迦不說會者或說有空非空非有三時說法即名三會疏待機熟故過二萬劫者或令於法生稀有難遭心故經佛說是經於八千劫者問佛說法時何少沙彌答對機感故或由如來處定時多是以沙彌說法時廣疏示現四種道理者按集論第十一云由依四種道理能觀彼法故一觀待道理謂諸行生時要待衆緣如牙生時待種子等諸識生時待根境等二作用道理謂異相諸法各別作用如眼根等為眼識等所依作用色等境界為眼識等所緣作用眼等諸識了別色等金銀匠等善修金等三證成道理謂為證成所應成義宣說諸量不相違語所應成義者謂自體差別不相違語者謂現量等不相違立宗等言四法爾道理者謂無始來於自共相所住法中所有成就法相法爾如火能燒等如經說言眼雖圓淨空無有常等所以者何其性法爾疏今此除離欲等者今此經中脫離欲者以彼離欲與其示現俱令修行譯主合之然實不可雖俱修行初令離染第二示現令其信解兩義別故又化之漸法須五故又按智度論五十四云示其善惡教令捨惡而從於善未得法味心生退沒能為說勝果使修善因令見利益故名為利隨其所樂而稱歎之令歡喜故故名為喜有義取今經意釋斯四者初示三乘是方便乘一乘是真實乘故名為示次令捨三入於一乘故出教也次復說彼三乘報劣一乘果勝使修一因令見利益說名為利復觀機緣或以法說喻說說宿世因隨其所樂應器令欣故云喜也議曰雖無其教理可觀也然云令捨於三說三報劣理即不可但應說云令捨於二說二報劣理如乘章或三學錯令為二字更勘餘本疏因言長理者如言因論而生論也疏今解至名為涅槃者問諸有學未回心前元本未得有餘涅槃云何今言未回心前所得有餘答約彼有學若不回心定能證得自乘有餘今經談彼未回心前所令證得涅槃為名名之為住問何故此聖回心劫數懸隔若斯答有惑無惑利鈍差別致此不等問有學煩惱多多劫至菩提凡夫頓發心應稽於漸悟答凡夫二惑全欣背增故稱頓悟有學缺於惑背捨悲增故多劫問惑少背捨劣所以經多劫無學惑全無無背更多劫答無學全無凡全有背增無彰劫無多有學有障背不增有無不全劫經久問有學趣向二乘極果時不經多縱回心已取二無學豈不省彼長劫艱虞答既回心已厭彼二乘由如怨敵誰肯更取有經云菩薩怖向二乘之中如惜命者怖歸屠肆如下廣引疏曾經七生等者古師意云前五種人皆是無學由經生數多少不定經中遂與初果等名雖俱無學根有利鈍故所經劫多少不定疏凡身得果等者創從凡位得於聖果名凡身得聖得聖已後復經於生後所起身名為聖身即依此身而證無學入般涅槃故總說云凡身得果聖身涅槃若從凡夫更不經生即得二乘無學之果入般涅槃即說此類名凡得果凡身涅槃疏卷第八疏十煩惱至皆互相資者略為二釋一云煩惱及業各自類十而互相資非煩惱業更相資也以能感業等相資有百故所感苦亦有百也非是果體能自相資由煩惱等而以資故若爾惑業既各有百所資苦果應成二百答理實應爾然二能資苦資一果故但云百不以能資而有二故惑業苦三分成二苦今亦應爾二云所感十類自各相資以成其百問自各為果更何待藉云互相資答相假有力即名相資非己為果便不待藉如現根境雜是其果由相待起豈彼不得名相資耶其類非一議曰二解俱得然後釋者順於疏文自云惑業苦三皆互相資苦苦不相資何須標列後釋故順任情取捨疏變易生死至二百者問何故不取能招之業亦為三百答無漏業者不名為險有漏業者非正能感變易之果所以除之有義五百喻三界二乘過三百者出三界也故智度論牒大品經云度四百由旬即去城邑不遠龍樹釋云三百譬三界四百喻二乘若爾四五數既不同何得為證答大品經中合於二乘以名一百此經開之開合雖殊體即無別取喻何過議曰此與疏釋名目雖殊義意無別分明易悟疏議可玩經聰慧明達者有義智在耳曰聰慧在眼為明達又聰慧譬種智明達譬三達種智橫照萬法三達竪鑒三世議曰依俗而釋耳目聰明理可通矣若依佛典未必須然後釋無妨經今欲退還者問若時未退擬將退故言今欲者下文更無說退之處若時即退何得言欲答有義為根性不定有退為凡退住二乘進為菩薩為斯不定故標欲言實當已退問既有二退今云退者退處何位答退處凡夫生死之位所以導師為設化城議曰據根性殊意欲不定而言欲者非無其理然觀經文但云其退無有根性求退別相白佛今欲如是之言皆義說矣佛知其意而義談之疏或令求出至後時說故等者舉事釋成如身見戒取及疑三結入見道除然說不還除五下結者據彼盡處後時說也即初果等出三惡道亦令得名過於三百然未永出永出之者即是無學五全離者名永出也故言無學過三百也問理實初果具斷見惑云何聖教言斷三結答按雜集論第十三略為二釋一障解脫二迷三境由斷此過但說斷三即彼論云由此三種障解脫得最為殊勝由薩迦耶見執取五薀為我我所深生愛樂於大苦聚不生厭背於勝解脫無發趣心或雖發趣然戒禁取及疑僻執邪道疑正道故便邪出離及不正出離又薩迦耶見迷所知境因於大苦聚虗妄增益我我所相故由戒禁取迷能見因於顛倒見謂為清淨出離因故由疑迷對治因於三寶所不決定故若依小乘義與此異如俱舍論二十一說疏雖亦出於人天等者然無學人亦出人天斯乃應名過五百矣但變易生人天趣攝二乘未離彼變易生不得言越人天趣也所以但言過三百矣疏對種智車故名為一者約為無為異種智有為既有三種滅理無為故稱一也或可種智而體一故對之名一若爾車三云何言一答據名雖三論體但一羊鹿兩運本無體故問滅理無二自然是一何假對智方名為一答滅理無二是一一義對種智故復是一義二文別也乍看似同疏實得無餘至終滿處說者以類成也欲入滅定至近加行早已證得想受無為然言滅定得無為者依顯處說定中想受而皆不行想受滅言彼時顯故若不爾者已入定竟六識不行說誰證於想受滅耶要有能證心方有所證故況意可悟有云此第九定中無想受故前定雖厭未名受想滅無為者議曰理義甚乖且以前定得此受想無為不耶若言不得為喻不成意證無餘已前得故若言得者大小乘教皆總不言先之八定得想受滅故名說謬疏勝鬘至去涅槃界遠者明二乘四智不具所以言餘生等者顯我生盡而未究竟即知苦智雖斷分段變易猶在故言有餘以未盡故當更有生雖更不受後有之生然變易生既生死法有此生死名為有生分段後受故疏言更言餘梵成故等者明梵行以立未究竟也即證滅智涅槃名梵證梵之行依主為名梵行有二一分段因盡顯有餘依分段果盡顯無餘依二變易果盡顯無餘依無漏依在顯有餘依定性二乘但得前一不定性者前一之中唯得有餘定不定性俱未得後有無餘智雖有所成然為變易因果所雜故名不純望自得者名為成也是後智餘名有餘矣或復後智二乘未得是得者餘此當可成故名為成言事不究竟等者明所作已辦不究竟也即修道智修道有二一分段對治二變易對冶二乘未修後之對治謂此修道事猶未畢名不究竟更可進習名有所作言不度彼等者明不受後有不究竟也即斷集智斷集有二一分段因二變易因二乘雖斷分段之因變易因在名不度彼不度彼故當必須斷上總明彼四智不究竟也言去涅槃界遠等牒前第四以例餘三顯彼涅槃未滿足也佛大涅槃名涅槃界二乘功德而未圓成復要三祇乃方逮彼故云逮也疏所作未辦等者以此經文屬彼四智未究竟義經文略也疏具明之細尋可悟故不釋也然疏云梵行不成不字也彼經之中無不字故疏思空勝義舍者思謂能思空勝義者所思勝義真如之理理為其舍如來家故故論說云住極喜地生如來家舉彼能思顯所思體取以為舍依主釋名或思屬所思即持業也義可知矣住空真如亦得名空勝義也故二乘得疏覺品至八解為浴地者三十七菩提品而以為華並有敷榮顯實義故總持能以攝持諸行類園御外能持內故大乘之法萬德滋茂故等於林華莖幹實備諸蓊二乘功德雖不名大亦有滋茂故亦名林故取彼經相擬宜矣又阿含經四無量為園諸無漏為林望義別也定能洽潤解脫離垢故比流池疏重門等者空無相願俱為人空舍之所由故名重重為不一有義重門同前盡無生智稱高樓閣有云四諦十六行配三空門義如信解品疏所配初觀所取以之為空後觀能取亦復是空故名為重無相願二重而亦准此又十六行攝之為三觀四諦境以為空故即行空智入無餘滅心境俱空以此為門名為重門無想願二亦准此知然入滅者即唯定性不定性人亦得有此重空之義故有宗云如杖轉尸尸既盡已杖亦棄之議曰喻意全差非為善釋有宗但據能所二空名之重空不明門義此況三種俱能入理故名重門思之可悉疏真實諦法為男生空真智是者由聞諦教生空智起所起之智能紹三寶名之為界諦法之界依主立稱五百弟子品疏於下劣心生虗妄解者挾劣心者所求二果生虗妄者能求執心或心字屬下是能執心更思疏此是有學及凡夫者問七種染慢皆是凡夫何故復言是有學耶答雖言有學亦凡夫攝若爾何故置及字耶答凡夫有二一學求趣得有學名二不求趣但得凡稱此二種人俱無定心俱執二極為有所簡故有及言或可修習久近不同故言有學及凡夫也疏又下根至先已領故者滿慈領際五百之徒亦同領訖餘如文疏二領授記等者問授記品末總言弟子皆當授記今即領之方便品末亦言聲聞聞說一偈皆成於佛何不領之答方便品中雖總言成未見別與二乘記別尚懷猶豫授記品前已鶖子等得別記別方生決定所以領之不同舍利是上根人而能領解方便品也疏鶖子已下授記者通取四大聲聞之事故言已下疏四領神通等者問設化城等言中施為導諸倦高即名神通火宅窮子藥草喻等義亦同之何不通攝俱言設故答理實俱是悟通所收但為化城文中自言我所化作餘喻不然故不為例疏離所詮故者於所詮法不生執著名離所詮故名清淨疏修梵行常持菩薩三聚戒者梵謂涅槃行者因義三聚淨戒是涅槃因名為梵行疏七佛等者問佛實恆數何唯言七答傳云佛之施化本利群惑惑俗而立七廟之事今隨於彼故立七佛欲漸化之歸真實故疏賢劫有四等者何故爾耶答所言七者兼自他數所以故爾後至彌勒退毗鉢尸加慈氏也問賢劫之稱何所因立答按悲華經第五云何因緣故劫名善賢是大劫中多有貪欲瞋恚愚癡憍慢衆生有千世尊成就大悲出現於世因立劫名餘經多分而無善字問七佛之中已兼釋迦云何復言今於我所說法人中亦第一耶答七佛據總今我所者依別而說是今化主故更獨明下言賢劫總別准知經護持佛法等者問夫護法者為任既重何人堪可法等復何答義有多門略明三種一能護人行二護法之意三得益就初復二一總明其行二約人別辨總護法者上自諸佛下至末俗佛具功德護法決能未知餘者何行能護夫欲護法當崇重尊德不陵卑下無違教詮隨順正理惠捨育物調心守根過惡揚善殯邪樹正言行相應能成斯行真護法矣故大般若五百七十一及二云行不違言尊重師長隨順正法心行調柔志性純質諸根寂靜遠離一切惡不善法修勝善根又云寧捨身命不捨正法於他謙下不起憍慢卑賤耻辱其心能忍飢渴有情施好飲食在危難者能施無畏於諸疾病如法療治嚴飾塔廟惡事掩過善事無揚又云若順文字不違正理常無諍論名護正法又大集經第十九云有二種人能守護法一如法而住二誦是文字若無文字法不可說二依人別者初僧護法戒德嚴總智慧凝明遠離傷毀為護法矣故涅槃經第三云夫護法者謂具正見能廣宣說大乘經典終不捉持王者寶蓋油瓶穀米種種果瓜不為利養觀近國王大臣長者於是檀越心無諂曲具足威儀摧伏破戒諸惡人等是名持戒護法之師後俗護法者為護法城墻塹三寶示威攝物懷慈不殺即護法矣故涅槃經第三云今聽持戒人依諸白衣持刀杖者以為伴侶若諸國王大臣長者優婆塞等為護法故雖持刀杖我說是等名為持戒雖持刀杖不應斷命若能如是即得名為第一持戒又大集經第六云諸天子若能護我諸弟子者即是護持我之正法如是護者法則久住二護法意者顯法難遇為令不滅度諸有情所以護之故大般若三百二十七云護持正法不惜身命常作是念我寧棄捨財寶親屬終不棄捨諸佛正法所以者何財寶親屬及自身命生生恆有甚為易得諸佛正法百千俱胝邪庾多劫乃得一遇遇已長夜獲大利樂又五百七十二云一切如來常共守護如是文字不起不盡常無隱滅其所顯義亦不起盡常無隱滅所以護法又五百七十三偈云為度諸有情成大悲願力護持佛所說此甚深法要三護法得益者常為四攝眷屬堅固功業難量皆賴護法故大集經第十云若人能護佛正法者即為四攝一為佛攝二為天攝三為福攝四智攝佛攝復四一常得親近諸佛二魔不得便三獲得無盡陀羅尼門四得住不退轉地天攝亦四一說法之處諸王設淨二說法之時衆樂聽受三終不為因緣所害四不信者信福攝亦四一莊嚴於身三十二相八十種好二莊嚴於口凡所演說衆生樂聞三莊嚴土四莊嚴種姓所謂釋梵轉輪王智攝亦四一知衆生根如意說法二知衆生病者隨病施藥三得大神通遊諸佛土四了了通達法界善男子欲得如是功德當護正法又偈云世界微塵可說盡護法功德不可量欲得不可宣說知應當堅心護正法又涅槃第九云若諸菩薩勤加精進欲護正法以是因緣所得眷屬不可沮壞疏廣大法味喜樂所持者廣大法味是能生法喜樂二種是所生法由因大法喜樂生故取彼所生為二食也疏不淨等食者欲界有情名不清淨見修煩惱現種具有不清淨反此二乘無學名為清淨上之二界有學三果名淨不淨上界異生能伏下惑名為清淨隨眠未斷自他之惑猶未能伏名不清淨前三果人見等惑亡名淨修惑未盡名不淨如來及八地已上菩薩實不受食亦不假食自身安住然順世間示現受食示現假食其身安住名示現食問按彼論云食有四種謂依止住食等云何其食云何依止耶答人是能依依止於食方得住故食從人果以立其名名依止住問如欲界者能伏無所有處下惑此所住食四中何攝答是俱句收論據全界及有學明故略不說問此之四食段等四食攝幾種答不淨具四淨不淨中上二界者除段有三下欲界中亦具四種第三清淨隨何界聖具三四也方現示之亦有四也問云何上界無段食耶答已離欲故故無段食段食能長淫等故又身輕微無色無形俱不假段問彼論但說佛示現食云何兼說八地上聖答論據果滿略不明因實爾八地亦不假段決定已受變易身故疏能長氣力至不壞者段觸長力思長希望識攝根種或通四明之皆有此能故今但依初疏觀入念住故但有四者為觀此境入念住故念住既四故所觀食亦但四也疏不頌問衆者前長行中云汝等見是富樓那等是佛問衆亦有疏云不頌四衆四字誤也長行無文列四衆故疏理雖至應化弟子者據理但頌滿慈今現之德乍觀頌文似頌一切應化之德故經云是故諸菩薩作聲聞緣覺問文中既有諸菩薩言何故不許兼頌一切答舉諸菩薩意顯滿慈權化所以非為顯餘言諸菩薩疏僚友等者疏華嚴有十種行者按彼經第三十八云樂聽受法故利益衆生故調伏自心故教化成就欲界衆生故令速轉故速成淨慧故教化衆生故恭敬禮拜供養一切佛故斷一切生死相續故不斷菩薩行故名如疏列此十行相如次配名疏今取此為喻者取如意珠以為譬也疏衣謂意識者發菩提心而在意識故以喻衣或第八識名為意識在意處故立意識名是所熏處以喻衣也若不爾者第六意識體非能持云何得言汝衣裏珠今故現在疏今以第六不共無明等者若第七識在異生位一類染汙云何可言起已遊行第六可有起於善心求勝法時名起無失議曰菩提心珠第六意發發時不得與無明俱云何得言醉時而繫由此理故取第七識癡為醉體亦應無失後言遊行據第六善然亦而是醉中行也真無漏智方名醒故疏或是大乘至謂戒身等者謂是大乘五分法身舉戒等餘慧定等四疏從貝音酉者者酉字也疏主恐有不識故以今時酉字音之然寫疏者皆錯為卯字卯字與古酉字稍相似故人記品疏高名之記等者滿慈一人授佛名號時節等別名為一異陳如五百佛號等同故名為同陳如五百得記前後有差別故名為二異疏非高名等者二千得記得名號同名為一同慶喜羅睺得佛各別名為二異法師品疏此中多以至名法師故者現得記中既名法師故知持讀在佛前者亦名法師約多分者且依滅後現為弟子疏又現習學至亦名法師者此影略言若在佛前人為弟子影八部類持經亦然佛滅度後人為法師八部持讀示為法師疏以藥王久持經等者問已後方便說藥王因事如何今者即告藥王答藥王在會以彼昔時早時此經所以告之稱因何失因者因由所以義故又准法華經此品名藥王如來品初長行及偈廣明過去藥王佛世有寶蓋王及善蓋太子法供養事已然後方言爾時世尊告八萬菩薩因藥王開士故知疏釋理無違也有云正法華經法師品初先明藥王過去持經之事所以經云因藥王菩薩告八萬大士議曰品初雖有藥王之號乃是佛也非菩薩矣王及太子經自會云爾時王者現在寶焰佛是太子善蓋今我身是總無藥王菩薩之事故知謬引經何況盡能受持等者問法本亡言名詮莫逮若取名字非善求法所以淨名經云法非見聞覺知若行見聞覺知是則見聞覺知非求法也今讚受持經者豈不轉增其痼答依言妄執諸教共訶假筏筌真衆聖同許誰之人出不由戶哉故大菩薩藏經第十六頌云如人入暗室覆蔽絶光明雖有衆色像非明眼所見如是隨有人內具諸明解不聞於正法善惡何能曉多聞解了法多聞不造惡多聞捨無義多聞得涅槃善聽增長聞聞能增長慧慧能修淨義得義能招樂聰慧得義已證現法涅槃淨覺法相應證得第一樂聞菩薩藏已正法善安住為世大光明行菩提妙行所以如來鄭重讚詠又般若論福不取菩提一者受持二者演說經能竊為一人說等者問云何而為一人說法即為佛使答說乖正理而無巧便縱為多人誠非佛使不因於此致出世故若也順理善巧雖為一人實為佛使能令所作至究竟故故大般若五百六十七云夫其說法隨順法相是名稱理若諸所說不違法相與法相應能入平等顯現義理名巧便說由此故知非諸說法者皆得名佛使疏若壞亂菩薩至毀壞一切佛法者問害佛破僧殺阿羅漢焚毀障礙云何不名壞一切法答金剛之體何有害者害者縱有豈廢法行僧破殺羅漢但是小乘設有破亡大乘之法詎因而滅又復不依大乘五逆若菩薩者能弘大法即人既亡故法隨失疏自他有多少等者若讚於佛唯能讚得益如來果圓更無益故故名無少若讚持者能所讚者皆得其益以所讚者其果未圓遇讚己已歡喜勇鋭而倍進習既自他利故名為多准前毀佛輕重理也疏無生而有生等者無學之者集苦都盡名曰無生今令回趣三大劫生名為有生亦如燋穀可更生故故為難信疏中外相形名之為舍者大乘名中外道小乘名之為外由形於彼名之為舍舍為中故經我於餘國遣化人等者問遣化衆生意何以耶答略申三意一供養法師二引導實人三擁護法師寶塔品疏智度論至如何有衆者問按論第七誠文如疏疏如何斷傳解難知答論言無請無請多寶說法華故非言多寶全不說經名為無請若不爾者無人請說法華故塔現為證亦不說餘餘經寶塔何不現證證不證殊故知有說不說異也論言無請不證法者言總意別非古難知故無過矣疏同為寶性故者同以七寶而為國土名寶同也即釋經中所變國土以頗梨等莊嚴所以經懸鈴者按說文云鈴下也從金令聲疏容佛佛世尊何須再坐等者問問於再坐何故乃答三變所由答容佛再坐為主三變故舉三變所由為答言三至道似同儒典按論語云齊一變至於魯魯一變至於道鄭康成云言齊魯有太公周公之餘化太公大賢周公聖人今其政教雖衰若有明君興之齊可使如魯魯可使如大道行之時經師子座者佛無所畏能伏一切故名師子師子之座名師子座非實師子亦非金等作師子座故智度論第七云號名師子非實師子佛為人中師子佛所座處若床若地皆名師子座疏座假燈王者燈王佛剎而借於座以待客也疏放光至唯在八方者此釋伏難放光變土方域數異故為難也疏上位佛土中有者為四善根位所現土有此山也對餘凡等名為上位又上位者即他受用土亦有山也所以經云摩訶迷盧若不爾者何假復致摩訶之言又壽量品云在靈鷲山故知受用土有山也若爾何故經云移山答移彼化土諸山也又解他受未必有山言摩訶者亦是多義如言大比丘衆多得大名此亦爾疏字林僮苫者撿諸字書竟未見釋今以愚度應是僮僕所居第室以苫覆之名為僮苫從人從物以立名焉疏示現化佛至為成大事者總說三身皆為成此一大事也經行頭陀事者大小三藏具明斯義今依瑜伽略舉二門一辨名相二別對治然總名者應云杜多正釋如疏又云洗浣洗浣煩惱故浣衣之子名杜多也應云斗藪斗藪塵垢故浣義相類亦云修治其心也十二功德束為三類一者明食而有四種謂常期乞食次第乞食但一坐食先止後食二者明衣而有三種謂持三衣毳衣糞掃等衣三者明處有其五種謂空間處及樹下露處塜間常坐名為五處一常期乞食者而常邀期乞食自濟二次第乞者謂入聖巷巡家而乞隨得隨現而便受食不高舉手越趣餘家願我當獲精妙飲食三一坐食者謂坐一坐乃至應食悉皆受食從座起已必不重食四先止後食者謂為食故坐如應座乃至未食先應具受諸所應食應正了知我今唯受爾所飲食當自支持過此不食如是念已然後方食五但持三衣者謂但三衣而自支持一僧伽胝此當在上義謂入王宮聚落最在上披名為在上二嗢怛羅僧伽亦有在上披義謂在寺內謂即七條於寺內中在五條上披亦名在上或名為中在大衣下五條之上故名為中三安怛婆參此云內衣安怛內也婆參衣義下一婆參該上二處論巧略也除此三衣更無過長六但持毳衣者謂所持三衣或是長衣皆用毳作無餘所作謂細羊毛名之為毳毳織為衣名為毳衣或但細毛即名為毳通諸禽獸一切細毳非獨羊也七持糞掃衣者謂所有衣他捨棄擲或街巷市道非道處或雜便穢膿血洟唾之所塗染取如是等不淨衣物除去粗穢堅執洗浣縫染受持問毳毛雜物亦作三衣與前三衣而有何別答初三衣者用好氎等之所㓨成非毛雜物恐不知足者以無價氎等而為其衣故以毛雜物而為衣也此三三中隨持一三非三三衣悉頓總待八住阿練若者此名空間處謂住空間山林坰野受用邊際所有臥具遠離一切村邑聚落極惡臥具名邊際也郊外林外名為坰野九常居樹下謂常期願住於樹下依止樹根十常居逈露者謂常期願住於逈露無覆障處十一常住冢間塜間者謂常期願住冢墓間諸有命過送尸骸處十二常期坐處如常坐者謂於大林小林草葉等座端身而坐推度時日不以背脅依倚大林小繩床樹草葉等坐名常期坐謂所坐臥諸草諸葉等座如應敷設而常坐臥一敷設後不數翻舉修理第二對治者先總後別問何名為杜多功德答譬如毛等未鞭彈紛擘等之時相著不輕䎡不任作縷線及氈蓐等若紛等己耎輕任用如是行人由於飲食衣服敷具而心染著彼由杜多功德能淨修治令其純直柔妙堪任隨順依止能修梵行別對治者於飲食中有二種貪能障修善斷美食貪故故常期乞食次第乞食斷多食貪故但一座食先止後食於衣服中有三種貪能障修善斷多貪故但持三衣斷耎觸貪故但持毳衣斷上妙貪故持糞掃衣於敷具中有四種貪能障修善斷喧雜貪故住阿練若斷屋宇及淫佚貪故常居樹下逈露冢問斷倚樂臥樂貪故常期端座斷敷具貪故處如常座或開屋宇淫佚二貪為五亦得疏卷第九提婆達多品疏天授與之者古有解云提婆天也達多名熱由造逆罪墮地獄中受燒煮等苦故名天熱又云以初生時諸天心熱故名天熱天心何熱天知此人造三逆罪故見初生心所以熱因為名也議曰西方土俗從天乞得名提婆達多同祠祀得名耶若達多餘提婆達多非造逆罪何故天心而為熱耶非一切提婆皆造逆故故知古釋乃意定之應從疏正疏蓏謂瓜瓞之屬者瓞音姪俗云匏子小瓜之類匏音撲也經本聲聞人至大乘空義者問明海會衆何故說言住虗空中答有二釋一在聲聞時觀三空門以為依止名住虗空說聲聞行二直指海會出者在虗空中問此聲聞人為在空後修行大行為在海中已回趣耶若在海中已回趣者如何在空說聲聞行答設已回心說聲聞行亦復何失豈佛菩薩不得說彼聲聞行耶或談彼昔說聲聞行皆不違也疏不得作魔王等者問具修十善奉敬三寶何得名魔答由因十善敬三寶故故得於魔非得魔已肯行斯敬然人趣者皆因善招女者乃是別報惑感所以不得作魔王等持品經復有學無學八千人等問准前授記無八千人此何而來答有三釋一准涅槃文有八十人千字應誤二即法師品中得授記三八字疑錯應為二字是前授學無學人二千人有義持品有五類人前四人中初三是直往菩薩後比丘尼是回小入大議曰初之一類直往可然五百八千既昔聲聞今適發趣何非亦是回小入大文極分明不知此德何意斯斷疏傾身似有下至身語諂者按玉篇諂諛也傾身似有下也莊子云希望其意道其言曰諂疏云身語諂者釋彼兩家差別非莊子等中云身語也疏𧋠聲之行者按瑜伽論第二十一云或犯尸羅內懷朽敗外現貞實如水所生雜穢蝸牛螺音狗行實非沙門自稱沙門略有二釋一云蝸牛在水而令水濁如彼牛涎惡行比丘亦汙佛法水亦復如是故類蝸牛然西國土俗尚彼螺音而有狗呼似彼螺音而行狗行況彼比丘內懷貪欲不善之行外現善言直正之行二云蝸牛喻出家身行不清螺音喻比丘語不正法此似好語而不能表出離因故狗行喻彼意行顯如其狗相雖可愛常懷貪嫉非真出家亦復如是疏喬答彌於女聲中呼者西域聲明之法總聲有三謂男聲女聲非男女聲輕重等異故有云喬答彌此云明女故十二遊經云明女亦得其少分非盡理也問何故釋迦及喬答彌而同姓耶豈可同姓而為姻媾答國俗不同未可為難又釋姓是總非親族類而以為婚稍似此方五姓之中如一商等而有多類同商為婚亦如農商四人之類有云如此方者適主家名王氏女其喬答彌亦復如是此釋不然違本行經等經觀八萬菩薩等者有義顯諸菩薩智慧利根懸得佛意及經旨趣令物信之如莊周云目擊道存故也經貪著利養故者按出曜經第十利養品佛昔為提婆說於偈云芭蕉以實死竹蘆實亦然螺驢坐任死士以貪自喪如是貪無利當知從癡生愚為此害賢首領分在地愚人貪利養求望名舉稱在家自興嫉常求他供養能諦知是者比丘真佛子不樂著利養間居智亂意又大菩薩藏經第十二偈云苦樂欲住諸財寶不樂出離所行處如是無理諸凡愚安住地獄之前道經惡鬼入其身者外魔來入身中令其毀謗或同火宅諸煩惱等亦為惡鬼前釋善也後釋理通經念佛告勑故皆當忍是事者問本意弘經何乃行忍答由行忍故諸諍不生諍不生故惡事當息既無惡事何法不弘經說佛所囑法等者問馳驟諸道受諸傷毀堅志傳法其利如何答法為佛師人能弘道道既常存佛亦不滅具多德故故假佛宣故持人經第一云若有持誦為他人說以是象典勸諸菩薩令學諷誦轉復宣布所以者何若是景僕久在天下則佛正道永長現矣如來常存以是觀之故須傳布安樂行品疏正行助行令無傷毀者有云安樂行品所明四行名之為正餘六品所明名為助行議曰不然且如法師功德品中五種法師自力勤求云何名助餘類非一應云自正行者名為正行傍聞隨喜等皆名助行非局一品疏說大乘法而取非大乘法者顯顛倒也實有大乘而不肯取實無小乘而妄求之故名顛倒又本學大乘而返取小故名倒矣問為聞說大即趣小果為退大後方趣小果答法華會所大分為彼退大聲聞故聞大後退求小果然實亦有聞於大乘即求小者何以明之故大品經云六十菩薩聞說般若成阿羅漢問豈不根法有差失耶答一雨所潤生長不同從多所為名為大乘故未爽矣疏以此法門令二乘同十地滿等者此法門者所謂一乘一乘而辨十地行滿今令此人依此一乘得行圓滿如十地大士故論言同或復此經是一乘故如十地行滿故名為同以頂明珠最為尊極故比此經為極亦爾疏如來密與解釋等者論云授記授記者解釋之義王賜珠意令彼為王佛與其法令其作佛與珠與法表作佛王故稱為密疏雖文有異至是前義殘者第六無上第六喻皆說明珠雖前後異明珠是同故是義殘疏身行親疏總別等者即親近處名之為親行處各疏疏即總行親是別行或可親附名為親不可親者名疏空有名總餘四名別疏下頌雖依人至於理無違者即下頌云又復不行一頌頌前長行又復於法無所行等頌云亦不分別等頌頌此一唱亦不行不分別等然觀頌文雖寄人法解於二空總明於法無所行攝言解二種者即前云又復不行等及此云亦行不分別等兩唱文也疏六書者按周禮保氏教國子六書一曰指事者視而可識察而見意上下是也二曰象形象形者畫成其物隨體詰詘日月是也三曰形聲形聲者以事為名取譬相成江河是也四曰會意會意者比類合誼以見指撝徑信是也五曰轉注轉注者連義一首同意相受考老是也六曰假借假借者本無其字依聲託事令長是也書者按廣雅書如也記也又說文蒼頡之初作書蓋依類象形故謂之文其後形聲相益即謂之字字者孳乳而浸多也著於竹帛謂之書書者如也又釋名書庶也記庶物也亦言著也著之簡紙永不滅也疏律中入王宮有十種過者按四分律第六十云出家人入王宮有十過失一若王與夫人和合時比丘入宮至綵女間夫人見比丘笑比丘見夫人亦笑王作是意言比丘若已作是事當作是事二若王醉時與夫人和合不憶後夫人有娠王作是意言比丘來入宮是比丘所為三王太子欲反殺王王作是意比丘來入我宮內是其所教四王在內祕密之言以聞於外王作是念比丘來入我宮內是其所傳五王失寶若似寶王作是意比丘來入我宮內是其取去六王以賤人在高位處外不喜者作是言比丘入宮是其所作七王或以高位者處在下職不喜者作是言比丘入宮是其所作八無事因緣非時王集四部兵其不喜者作是言比丘入宮是其所作九王或集兵中路而還其不喜者作是言比丘入宮是其所作十若王在宮綵女間出好馬鳥端正女人見則心生愛著非比丘法是為十過失疏吳主同輦者按高僧傳吳王孫皓以馬車迎沙門康僧會入宮不言同輦按高僧傳道安法師與秦主符堅同輦傳云釋道安常山扶柳人也家世英儒七歲讀書再覽能誦至十二出家遇佛圖澄因澄為師後避難襄陽廣宣佛法備搆福事時符堅素聞安名每云襄陽有釋道安是神器方欲致之以輔朕祈後遣符丕南攻襄陽安與朱序俱獲於堅堅謂僕射權翼曰朕以十萬之師取襄陽唯得一人半翼曰誰耶堅曰安公一人習鑿齒半人也後堅出東苑命安升輦同載僕射權翼諫曰臣聞天子法駕侍中陪乘道安毀形寧可參廁堅勃然作色曰安公道德可尊朕以天下易輿輦之榮未稱其德即敕僕射扶安登輦餘之神德具言於傳今略不敘議曰今從於傳疏言吳者乃草誤耳或餘傳記有吳王事或約車馬迎會之事名為同輦疏秦主讓妻千齡受耻者按高僧傳云鳩摩羅什此云童壽天竺人也家世國相什父鳩摩炎聰明有懿節將嗣相位乃辭出家東度䓗嶺龜茲主聞其棄榮甚敬慕之自出郊迎請為國師主有妹年二十識悟明慜乃適妻焉生什公也什年七歲出家日誦千偈偈有三十二字凡三萬二千言善大小乘博覽四韋陀典五明諸論陰陽星算莫不必盡妙達吉凶言若符契以僞秦弘始三年十二月二十日秦主姚興遣使敦請至長安興待以國師之禮甚見優寵請入西明閣及逍遙園譯出衆經後秦主謂什曰大師聰明超悟天下莫二若一旦沒世何可使法種無嗣遂以伎女十人逼令受之自爾以來不住僧坊別立其舍每至講說先自說譬譬如臭泥中生蓮華但秉蓮華勿取臭泥也疏掉戲之人等者按出曜經第四復第五放逸品云又第十四云放逸之人轉能行惡不顧後緣不念後世猶如子投火欲望苗幹者事不然猶如小凷塞江欲以止流者終不可得放逸之人意行暴虐欲求毫𨤲善者吾亦不見疏對法有十四至皆名不律儀者為欲活命屠養買賣羊猪等類乃捕魚等恆處山林調執野象習呪龍蛇戲樂自活以離間語毀壞他親持用活命名不律儀問云何得成不律儀者答若生如是不律儀家或生餘家如其次第謂身語方便為先決定要期現行彼業未起捨彼不律儀緣名不律儀者疏不悕二乘果至是菩薩破戒者又按大般若經五百八十六云若時菩薩不現發起一切智心爾時無記心相續而住是時菩薩猶名具戒未名毀犯棄捨菩薩淨戒若時菩薩不現記一切智心向聲聞等地是菩薩捨菩薩地失自行處隨爾所時回向聲聞即爾所時於無上乘應知名死雖非實死而得死名如工巧幻師執小兒手引上高梯幻解身支分分墮落時彼眷屬咸謂命終菩薩亦爾捨大菩提退住聲聞等地失一切智應知如死彼小兒而彼親屬起於死想疏五種不男等者故雜集第八云如扇𢮎迦及半擇迦不堪親近奉事苾芻苾芻尼等又云半擇迦有五種生便等故同此經令遠離也問扇𢮎迦等唐義目何答扇𢮎迦此云無根設縱有根形畢竟不有男根勢用並名扇𢮎迦半擇迦者此云樂欲樂他於己為非法故或云染汙由樂他人於己為過能染汙他故名染汙問五種之中生便除去此之二種永無男勢應名扇𢮎云何乃言半擇迦耶答若無男勢復不樂他於己為過即名扇𢮎雖無男勢若樂他人於己為過故名半擇迦據實望彼無男勢用合名扇𢮎此經集論據與他人而為所遏五種總名為半擇迦故瑜伽云是除去等若不被他於己為過唯扇𢮎迦若有被他於己為過名半擇迦五種之中見他行淫自男勢動名為嫉妬被他於己行非梵行得他精血自男勢起名為灌灑半月半月男勢方動得半月名餘二可悉又瑜伽論五十中三說有三種此開彼合亦不相違疏六方之中各有五事者按迦羅越禮六方經云向東禮拜者謂子事父母當有五事一者當念治生二者早起敕令奴婢時作飲食三者不益父母憂四者當念父母思五者父母疾病當恐懼求藥師治之父母視子亦有五事一者當念去惡就善二當教計書疏三當教持經戒四者當早與取婦五者家中所有當給與之南向拜者謂弟子事師當有五事一者當敬歎之二者當念其恩三者所教隨之四者恩念不厭五者當後稱譽之師教弟子亦有五事一者當令疾知二者當令勝他人弟子三者欲令知不妄四者諸疑難悉為解五者欲令弟子知勝師西向拜者謂婦事夫有五事一者夫從外來當起迎之二者夫出不在當炊蒸掃除待之三者不得有淫心於外夫罵詈之不得還言作色四者當用夫教戒所有什物不藏匿五者夫休息善藏乃得臥夫視婦亦有五事一者出入當敬於婦二者飲食以時節與衣被三者當給與金銀珠璅四者家中所有多少悉用付之五者不得於外邪畜侍御北向拜者謂入親屬朋友當有五事一者見之非惡私往於屏處諫曉呵止之二者小有急當奔赴救護之三者私不得為他人說四者當相敬歎五者所有好物當多少與之向地拜者謂大夫視奴婢使亦有五事一者當以時飲食與衣被二者病疲當為呼醫治之三者不得妄撾捶之四者有私財物不得奪之五者分時之財物當使平等奴容婢使事大夫亦有五事一者當早起勿令大夫呼二者所當作自用心為之三者當愛惜大夫物不得棄指乞丐人四者大夫出入當送迎之五者當稱譽大夫善不得說其惡向天拜者謂人事沙門道士當用五事一者以善心向之二者擇好之與語三者以身敬之四者當慕戀之五者沙門道士人中雄當恭敬承事問度世出之事沙門道士當以六意視凡氏一者教之布施不得自慳貪二者教之持戒不得自犯三者教之忍辱不得自恚怒四者教精進不得自懈慢五者教人一心不得自放意六者教人黠慧不得自愚癡沙門道士教人去惡為善開示正道恩大於父母如是行之為如汝父在時六向拜之教何憂不富乎問何故以父母等配之六方有斯次第答擬日出沒下上尊卑圓缺為喻思之可悉疏遠四惡友者問何等人名為惡友答破戒邪見背菩提等為惡友故大般若經五百六十八云菩薩不親近惡友謂破戒人著邪見人不律儀人邪命人無義語人住懶惰人樂生死人背菩提人愛俗務人問何時不親答一切時不親即前經云菩薩夢中不近惡友況於覺時而親近彼若爾云何憐愍衆生如一子耶答即彼經云菩薩雖常憐愍而不共住由如是法遠離惡友但令離長染等緣非心善根令離彼也故郁伽長者經云出家菩薩不應親近多人衆中我應捨彼我之善根終不捨於一切衆生疏或七倒者謂於無常樂我淨之法妄計為常樂我淨等名之為四五者想倒於常等四起妄想分別六見倒於是妄想所分別中忍可欲樂建立執著七心倒於執著貪等煩惱疏亂相及亂體等者五塵等界名為亂相相者因也能生識故諸能緣心名為亂體體是妄倒故名亂體第二句結前亂相識所變故能生識故不離識等故名色識第三句者結前亂體第四句者顯無所變亂相色等能變亂體亦不得有要有其因果方有故經是名菩薩第二親近處者舉前不可親近之處翻彼即名可親近處又按郁伽長者經有四親近行彼云出家菩薩有四親道如來所許一親近法二親近成就一切衆生三供養如來四親近不捨一切智心疏如食曠野子宍等者按報恩經第一孝養品佛告衆言過無量劫爾時有國號波羅奈有佛出世號毗婆尸佛像法中有王出世號曰羅闍王波羅奈國王大臣名曰羅睺心生惡逆斷大王命尋詣邊國次殺二子其第三子有守宮神而語之言羅睺大臣逆謀奪國殺於父王及二兄竟不久將至何不逃命去也而王思念欲投鄰國然路有二一七日二十四日至王時入宮命子須闡提即出進路夫人亦隨心竟迷亂誤入十四日道路險糧盡王欲殺妻以活其子其子諫曰何處有子噉於母宍可乞一願耶日割子肉三斤以充三人之食父母從願得至前路爾時王者今我父悅頭檀王是母者今摩耶是太子者今我身是今引意者食子肉者非甜其味但為命也沙門受食但為修道而支其身不貪味也疏如無垢稱者即維摩經云迦葉住平等法應次行乞食為不食故應行乞食為壞和合相應取摶食為不受故應受彼食以空聚想入於聚落所見色與盲等所聞聲與響等所嗅香與風等所食味不分別受諸觸如智證知諸法如幻相無自性無他性本自不然今則無滅以一食施一切供養諸佛及衆賢聖然後可食經於聲聞至讚歎其義者問夫菩薩者揚善止惡謙下正直若也二乘非正即直言斥之若許善可録即謙辭讚美何因二事俱不許為答夫人讚毀情必欣惡欣惡斯起種智莫生淨戒淪沒故今見止故大般若經五百八十八云諸菩薩若暫起心讚毀二乘應知毀犯菩薩淨戒所以者何若讚彼地便於彼地心生愛著不能趣求一切智若毀彼地心生輕蔑即障所求一切智智於菩薩戒有所毀犯是故菩薩於二乘地不應讚毀此亦應爾故誠無爽經譬如強力轉輪聖王等問輪王有四王領不同具辨如疏七寶德化其義如何答薩遮尼乾子經第三云轉輪聖王七寶具足一夫人寶二摩尼寶三者輪寶四者象寶五者馬寶六大臣寶七主藏寶其化德者彼轉輪七寶具足遍行大地無有敵對無有怨㓨無有諸惱無諸刀杖依於正法平等無偏安慰降伏王四天下得自在故所出教令無違逆故以十善道化四天下悉令受持離十惡業行十善道具足成就名為法王問所感七寶何因而至答依離瞋心不善業道之所得也若爾何故仁王經言上品十善鐵輪王等答彼經具言此據增勝故無過矣問七寶現者本應聖王各有何德以先聖王夫人德者身口等中出於無價栴檀優鉢羅華之香身觸柔暖寒時能暖熱時能涼王見夫人離諸疲勞飢渴憂惱受最第一無極之樂復有五德一者知念不違王心二者能生千子具足三者自然性尊豪貴四者能令住處具足一切資生五者若王與諸夫人受欲樂時不起嫉妬瞋恨惡心摩尼珠寶德有八種一於夜暗放大明光如秋滿月光明能照一百由旬至於夏日衆生患熱放光觸身得清涼故二王行曠野無水之處衆生飢渴珠放八味具功德水充足飢渴三王所須者一切皆從摩尼寶出四有八楞相一一楞中出種種光五在所能令一百由旬所有衆生皆離病苦常得定心所作善業無空過者六所住境界無諸惡龍能放毒氣雹風惡雨傷害衆生七一切山川溪谷溝㵎泉水乾竭悉令還服樹林草木華果枯悴能令滋茂池水華林一切具足八所在之處人民無有疾疫諸毒非時死者至於畜生虎狼之類相食噉者不起害心輪寶之德而有五種一輪寶體純閻浮金具足千輻廣五由旬顯現世間如第二日輪二飛虗空去無能障而一日能行八千由旬三隨王心念欲謂四天王行四天下隨王念處即飛虗空在前而去依彼輪力四兵象馬及車步等一切悉皆飛騰而去四有不伏轉輪王者王若心念而彼輪寶隨所念處即飛而去悉令降伏五輪寶勢無有歒對一切小王見者降伏象寶德者彼大象寶猶如良馬調伏柔濡隨自在用降伏他國七友善住彼象能於三處有用所謂虗空水中陸地彼象能速疾行一日三匝行閻浮提輪王乘象象同王心隨王念處即從而去行步平正猶如鵝王不疾不遲不曲不戾凡人中行不令驚怖至鬪戰時極能現大凶害之相不可侵近馬寶德者色白如彼拘牟頭華天旋輪文遍滿身相不小不大不高不下身體正足心性柔濡善能調伏如帝釋王婆羅河馬隨意去住一日三遍行閻浮提無疲勞相大臣寶德者代王理政一如王心憂國忘身不營私務念護百姓如養草木隨王所念如念即辦不礙不著修行正道離於非法主藏寶德者彼主藏寶有大功德一切諸山深𡼏幽峪曠野川澤丘陵堆阜坑坎高下不平之處能以金剛寶因陀羅寶等一切珍寶以用填滿而寶不盡何況金銀琉璃頗梨不在數者彼主藏寶心常歡喜無諂曲相問七寶之中幾情非情答珠輪二寶是非情法餘五有情問七寶將應其相云何答按中阿含第十一增一經中第四十八云王具七寶而現空中有白象王須臾之間行遍四海王上西樓向視見有紺馬王乘空而來王土東樓東向視見有神珠長一尺六寸有八楞相紺琉璃色乘空而來懸於幢頭照十二由旬王上東樓東向視見有剎帝利女名曰奪情端政無雙乘空而來王上北樓北向視見有主藏臣名曰財幢乘空而來王上南樓南向視見有大將軍名曰無畏乘空而來問馬色珠光與前經別一何不同答大小乘異見聞不同故無過也餘准此釋問七寶出處其本何耶答按觀佛三昧經有金翅鳥名正音伽樓羅王命終已後火起焚之餘悉灰滅唯有心在難陀龍王取此鳥心為明珠輪王得名如意寶珠餘經不言復傳釋云輪珠二寶天帝所有下應輪王象是善住龍王五百子中之一子也馬亦天帝之龍馬象女臣兵三亦皆天帝之臣妾也後之五寶下生閻浮以應輪王輪王化息還無皈天餘二但從天中應下問尼乾子經云如帝釋王與豈不相違答諸教對機說各有異亦應無失問王之千子其德云何答尼乾子經輪王千子身體洪壯勇猛雄傑降伏世間隨順王命能護大法隨順法行心能慈愍一切衆生廣會諸教及餘門義具如章辨疏三種魔類者分段變易各有三種故品三類由經但言三魔故疏言三天魔別說故言并也疏六恆住者謂阿羅漢而住六境無喜憂等故大論第五十云謂阿羅漢諸漏永盡於六恆住常無間多分安住謂眼見色已不喜不憂安住上捨正念正知如是耳聞聲已鼻嗅香已舌嘗味已身覺觸已意了法已不喜不憂安住上捨正念正知疏二乘聖者至全破分破等者有學分除無學全破二乘不能任運畢竟除於天魔故但言三下言四者約其加行及暫時說疏破魔先後者疏亦名蓮華者此釋伏難難言二乘破分段而賜法華菩薩破變易何不賜法華故今云無量經即是法華經若於夢中等者問外境本無夢因何起答假餘緣力雖無實境夢心得起故智度論第六云有五種夢一熱氣多多夢見火見黃見赤二冷氣多多見水見白三風氣多多見飛見黑四所聞見事多思惟念故則夢見五天與夢而欲令知未來事故今經所明即是第五縱佛菩薩加之令夢亦第五收類相似故涌出品經他方國土諸來菩薩等者問此等菩薩何時而至經之上下無文辨故答有義塔品命持經人故諸菩薩應命欲持至此方矣又釋即無量義經會中菩薩經家舉勝是以經首而不列歎或是妙音普賢二士所從之衆問涌出品後妙音等方至云何八恆是彼徒耶答理實妙音等涌出前至而集經者排其次第安在於後若不爾者妙音等本旨欲聽法華及至此方說經宗已訖來作何為以此故知涌出之前早已來矣議曰初釋省非後二不如思之經止善子不須汝等者問縱彼持經何傷不許答有義他方菩薩非釋迦所化不得顯釋迦壽量是故止之此土菩薩是釋迦所化得顯釋迦壽量故即許之疏釋如文議曰與本疏釋言雖有別意相似矣問疏云為顯佛化功能者豈可欲自衒德而止他乎答若不顯自功諸疑不起疑既不有因何顯佛壽量長遠為斯止他非欲自衒經此界虗空中住者問既言虗空即金輪下云何得是此界攝耶答此界勢分亦此界攝如律結界之勢分遠近而分亦屬近界經少病少惱者問病惱何別而俱問耶答身心異也故智度論云隨世俗法有二種問辭一問訊心名為少惱二問訊身名為少病經乃不識一人者問彌勒妙覺當成薰習已遠云何此衆不識一人答據真實理無彼此相彼此相無故不得言我識於彼也或諸法離言未可語之識與不識或依示相故下經云新發意菩薩或不信受明已信知亦兼識矣有義踊出菩薩為開法身之相法身非十地所了故言不識一人議曰意明不識能開之人不明所開法身之體不識法身何關踊出菩薩之事疏於此伽耶處至此城亦爾者或伽耶名往已有矣久已在此成道化生下彌勒疑為言今世居伽耶城成道化也故揲為問疏佛言不虗四無謬者不妄說四事名四無謬故天親般若論云以如來實智不妄說佛菩薩小乘大乘受記之事所以經云如來是真語實語如語不異語如次說四說彼小乘苦諦等法唯是諦故名不妄說小說大乘者說法無我真如故名不妄說大一切過去未來現在受記故名不妄說受記問何故如來有此四語答按功德施菩薩釋云以世間中求名利者於上人法未證言證言證佛異彼人故說真語復有貪欲情多憍妄曾獲神通自知已失有人來問但云先得遠離是心說於實語又有修得世間之定心暫不生相同寂滅而向人說我證涅槃永除此謬故說如語以諸凡夫於乾闥婆城等如其所對如是取著名為異如諸佛不然是故說不異如語凡夫所取城等非城等有名為異如來所證非虗妄有不誑性故名不異如又約如來證四諦理說於四諦而無虗謬如次名真語等也壽量品疏於第一乘至增上慢者不集善者不集大乘善根故論云於第一乘不集善根故言不取為第一者釋於此人成於顛倒增上慢之所以今昔二時皆未集故名為不集疏且除八障者問對治行相云何得知答按莊嚴論略而言之一除輕佛障者謂有有情見於如來始生王宮道樹成佛薀道時近疑無種智生輕蔑想為治此人故大乘經說往昔毗婆尸佛即我身是約平等意故作斯說二餘輕法障者謂有衆生取於釋典粗文淺義非不解生遂於佛教生鄙淺心輕而蔑之為對治此故大乘說於無量恆河沙佛所修大乘行乃能生解言生解者生證解也依別義意故作斯說三除懈怠障者謂有有情雖已發心謂行難修而生懈怠不肯進習為對此人故大乘說郁生安樂及稱無垢月光佛名決定當得據別時意作斯說也四除少善等障者謂有有情已修少行謂有所得便生足想更不進趣為治此人故大乘中於一善根或讚或毀冀令衆生不執一法生喜足心令遍修善依意樂意故作斯說五除貪行障者謂有有情貪此穢土五塵境界而不修習勝妙之因為治斯執故大乘說諸佛國界極妙樂事而令求趣六除慢行障者謂有有情恃己高貴見佛居穢剎身命俱短及諸下事便輕慢之為治斯過故大乘說身命修長國界嚴麗諸德圓明無有可惡七除悔行障者謂有有情輕佛法僧恆生追悔悔為修善敬崇等事障修勝善故大乘說於佛菩薩起不饒益事得生善道況修善乎冀修勝善八除不定障如疏可知問除前四障見四意趣云何得言對治祕密之所治耶答意趣別分四祕密中但第三攝開合異也若爾意趣祕密何殊答有二釋一云意趣約彼能說者意趣祕密據彼所說難解二云謂能化者遠方便中先須觀他所化根器宜以何法而攝受之故名意趣後親對機善巧方便說法開悟名為祕密良由如來意趣善巧有方便故依祕密義對彼根宜有益便說故所設教皆名祕密意趣是能說祕密是所說遠觀根性近設方便依祕密義趣祕密教故二別也議曰廣略不同大意無別問疏列八障第二與莊嚴等行相何故不同答應疏寫誤或疏意云勝觀如來既即我身明所有法亦為祕妙不如初釋疏轉變祕密等者於能詮字所詮義中轉變顯義為此密義又轉詮顯了義字變目密義故無性論云謂於字義轉變差別言覺不堅等者謂即調柔無散亂定名為不堅能於此定起堅固慧故云為堅為彼散亂令心剛逸名之為堅定異於彼故名不堅問不堅之名自目於定何名轉變復稱祕密答不堅之名俱目定散目散義顯目定義隱何所以者謂散亂者於境馳流不專守一世共所知故名為顯若彼定心而專一境不堅義微唯善解法者知定調柔有不堅義非世共知故名為密以彼顯言詮此隱義故名轉變准理而言定散俱名堅不堅矣若也真實專守一境名之為堅即唯定矣若馳流散動令心剛逸名之為堅即散亂也若性調柔名不堅者即在於定不能專境非真實故名為不堅即是散亂故對法云堅有二義一真實二散動由此散動令心剛逸故亦名堅無性論云剛強流散說名為堅非此堅故說名不堅即是調柔無散亂定二論影說故知定散具堅不堅妄執有為常樂我淨名為顛倒若人於此顛倒之中解知無彼常樂我淨名為善住為利有情長時精勤修難行行為彼劬勞疲倦所逼名煩惱所惱由前三句行而不廢得於諸佛三菩提義名為最上有義覺不堅為堅謂如意足善住於顛倒謂四念住極煩惱所惱謂四正勤由正勤故為諸有情受諸難苦是故精進名極煩惱准思作餘同於前疏他報化身俱名生者隨衆所宜數現生故得生身名疏二應身非化生至一應身者問准何得知四善根人見於大千一應佛耶答雖未見文以理言之固應有也如十地別他受用身各各不同資糧加行位既不同所應佛身何故不異准斯形量大小亦別問資糧位有四十心別亦應佛身應不一種答取大位別不依一一少分不同即令身異四十總名資糧位故疏十佛至隨其所應三身所攝者釋曰化身現於樹下成道名現等覺以願乘通化一切生名弘誓願百劫修業招王宮身相好之報名業異熟縷素等像名為住持法身自體名法界佛第八無漏名為心佛大定之身名為定佛自受用身從本種姓三劫修成名本性佛隨彼地上所樂不同現身有異名隨樂佛初五化身住持似化故化所攝第六法身後四受用或初五化身次二法身後三受用或第一第二第四第五四是化身第六七九三是法身第九佛地名本性佛法身為本其義顯故第三八十三是受用受用酬因名異熟佛名義符會化身化應以為業報理不明著且隨相增分為三釋疏楞伽經至薀界入等者按四卷楞伽第一云法佛者離心自性者釋法佛所說之法離妄想心自性相法即離能緣所緣自性相也又云自覺聖所緣境界建立施作者釋自覺謂自悟智所證之理名所緣境建立自覺所證之法以為法佛所說之法言施作者即是說也舉能證者而顯法佛說法所以又云法佛者離攀緣釋離諸妄想攀緣心也又云攀緣離一切所作根量相滅者釋由離攀緣心故一切妄想諸根量相等皆悉滅也問夫言說法假文名等既離攀緣諸相寂然云何名說答說法本意令他生解法佛為境令菩薩等根本智生故名為說所以經云自覺聖所緣境界建立施作又云法依佛說一切法者釋即報佛也依法身起名法依佛即他受用名為報身非自受用自受用身不說法故有云法依佛者即是化身此義不然下文自說化佛相故又云入自共相者釋五薀等法各異名自苦無常等通貫諸法名為共相問貫何法答四雖名共貫有寬狹苦是有漏法之共相漏皆苦故無常一切有為共相諸造作者皆無常故空無我二是一切法之共相也一切諸法皆無有我我所故故大般若經四百一十三云苦是有漏法共相無常是有為法共相空無我是一切法共相問五薀何故名自相耶答相不互通故名自相故大般若經四百一十三云變礙是色自相領納是受自相取像是想自相造作是行自相了別是識自相共成一身故名共相此不然矣無文義局復言入者解也解自共相是自心現或入者攝也前云法依佛說一切法此一切法皆攝入彼自共相中或入解也令所化生解自共相名入自共非約佛身名之為解佛解極成不待說故又云自心現習氣因者釋現者現行變現習氣謂種子此自共相自心變現熏成種子即此現行為種子因名習氣因又云如工幻師依草木瓦石作種種幻起一切衆生若干形色起種種妄想釋以況衆生依緣起法起種種妄想又云彼諸妄想亦無真實者如彼幻師所幻起法既無其實依緣起法所起妄想亦無真實然疏引文而取大意文雖差異意乃同也三佛所說粗細別也問化佛說於六度等法云何名粗答雖言六度不言有為皆如幻化是故名粗疏如一切智光仙人等者按一切智光明仙人慈心經中廣說其事今略言之乃往過去無量阿僧祇劫時有世界名勝華敷佛號彌勒恆以慈心四無量法教化衆生經名慈三昧光大悲海雲聞者必超百億劫重罪成佛無疑時有大婆羅門名一切智光明六十四能聞佛彼經即生詰難不能屈伏便發信心願持彼經必得成佛號曰彌勒捨家入山滿八千歲乞食誦經時遇荒年乞食不得經於七日是時林中而有白兔其數五百一兔母子見仙無食而作是言法山將崩法海將渴我今為法不惜身命供養法師捨身投火以充其膳用濟仙命肉既熱已後諸神等而白仙言兔王母子為供養故自投於火其肉已熟宜可取食仙人聞之悲不能對久而說偈寧當燃身破眼目不忍行殺食衆生諸佛所說慈悲經中彼經說慈悲者寧破骨髓出頭腦不忍噉肉食衆生如佛所說食肉者此人行慈不滿足又發願言世世不起殺想恆不噉肉乃至成佛制斷肉戒語已投火與兔併命由是菩薩乃至成佛猶名彌勒疏如說阿彌陀為法藏比丘等者按無量壽經云錠光如來出世之後更有無量諸佛出世最後佛名世自在王時有國王聞佛說法心懷悅豫尋發無上正真道意棄國捐王行作沙門號曰法藏高才勇哲與世超異詣自在王佛所說偈請法願佛為我廣宣經法我當修行攝取佛國清淨莊嚴無量妙土令我於世速成正覺拔諸生死勤苦之本法藏聞法廣發大願佛告阿難法藏菩薩今已成佛現在西方去此十萬億剎其佛世界名曰安樂成道已來凡經十劫疏合是生至四生根熟等者取初見佛所受之身名為初生第二生者不約見佛三四亦見即此喻中有此四生思配可悉問觀疏之意即舍利等今見釋迦為第三生按五濁經賢劫之中有千佛出第九住劫已四佛出人壽四萬歲迦諾迦村陀佛出世人壽三萬歲迦諾迦牟尼佛出世人壽二萬歲迦葉婆佛出世人壽百歲釋迦佛出世縱舍利等逢迦葉佛已為初生至今釋迦豈唯三生若爾云何獨乃長壽甚為可怪若不爾者云何從初逢佛至今釋迦名三生耶答略為二釋一云初逢迦葉佛還生此界逮逢釋迦合有多生此界命促故若生他界及於天上長壽之處至遇釋迦何廢只三二云但言從初至釋迦佛總有三生何必要逢此界佛也他界逢佛後至此界更逢釋迦合為三生於理何爽其第二生或此他界受皆無失疏是第四生值彌勒佛者問彌勒出世望去釋迦當於人間五十六億七千萬歲是人云何但受一生即逢彌勒若更經生云何得言是第四生逢彌勒耶答約三生後至逢彌勒總名一生不言此後唯更一生名第四生逢彌勒也不障此人有多生故問何故三生即約行人自經生說是第四生即不爾耶答利根極遠限至三生故唯約自鈍根之人極遲六十劫生即不定故且對前三生云後生逢彌勒名第四生議曰經文之中既不定生論復不說縱不約生而明其喻斯亦何過若法歸分別假生贊成經之深旨所有妨難當如前會亦何不通疏為有不定等者不唯二乘兼有菩薩為此不定故經說言乃至百也分別功德品疏菩薩無取捨等者問任持所餘說一乘准此亦為菩薩說乘權實而有取捨如何無有道證等耶答為二乘說令捨昔權而取今實故有記證菩薩之人先取彼大為說權實但令不退不同小乘故不相例疏無生是境等者今依大般若經略為二釋一法即無生名無生法故彼經三百七十六及第五第六十帙並同云謂令一切煩惱不生微妙智慧常無間斷觀一切法畢竟不生是名為無生法忍意云謂能斷彼煩惱之智觀彼一切遍計所執畢竟不生此能觀智名無生忍無生即法無生法之忍依主釋也無體之法亦名法故二智所斷惑畢竟不起名為無生智了諸行同陽炎等名之為忍無生即法無生法之忍依主釋也不同於前唯依遍計所執名無生法故前經云由斯勢力乃至少分惡不善法亦不得生是故名為無生法忍此令一切我及我所慢等煩惱畢竟寂然如實忍受諸行如夢尋香城等此忍名智得此智故名為獲得無生法忍有義真如法身名為無生初地證得此真如故名得無生忍議曰雖有此理准般若等經義即不爾聖教多途亦無有失疏即三無生等者問何以得知緣三之智名無生忍智緣三種耶答按集一切福德三昧經第三云為緣何法無生忍佛言緣陰界入得無生忍釋曰緣陰界入無自然生得無生忍又云亦復緣於常樂我淨彼得法忍釋曰緣常樂等惑苦無生得無生忍又云忍之所緣非與世法而共俱行乃至不與一切法俱行釋曰有體之法可云與俱遍計所執本無其體所以故云不與一切諸法俱行而緣此之遍計無法得無生忍如次即緣依他圓成遍計所執三種無性疏涅槃十六分義者經文不釋古今多解今略敘三一云常樂我淨無常無樂無我無淨若迷此者名倒若悟此者名正涅槃所明大意不逾此之八種見道已前而能信悟此之八種入見去往即證悟入見未見別各有八種合成十六二云有為無為各有八倒合成十六返十六倒即十六義三云涅槃總意明諸衆生皆有佛性如來常住能解此者品類不同有十六分十六分者而是成數故舉言之如一斤十六兩故故涅槃云十六分慈不可難言何唯十六分終有一難不必須通議曰既無明教三德所言無可不可涅槃抄中當廣言也疏末尼珠王最勝等者勝劣有殊分為二種或經說言末尼如意唐梵雙說由此珠有品類不同唐梵雙言為彰勝劣疏此經雖說出生等釋伏難也難云法華勝鬘俱說出生一乘之義何故彼經總對六度此除般若故有斯答如文可解疏多云此經唯說出生唯字誤也合為雖字疏數力無似勝等者按天親釋云數勝者如經百分不及一等以數無限齊是以攝得餘數意云持經之福以數無限是以攝得布施之福布施之福量所不及故云數勝力勝者如經不及一歌羅分故疏云勝時疏意說云胎內五時歌羅是初最少時也舉此少時持經之德餘施多時所不及也據有其能故論名力有云如折一毛以為百分百分中一名歌羅分以少歒多故論義翻名為力勝言無似勝者此福德中數不相似以此福德不可數故如經數不能及疏云勝喻故者疏意云似者喻也不可喻故故名勝喻今助一釋布施之德可以數數名為相似持經之福數不可數故云無似論自別言不可喻故故知似者未必取喻言因果不相似此因果勝彼因故如經乃至憂波尼沙陀分者意云金等布施得三界果持經等福必得佛果所以名勝疏四方衆僧生八道者四方衆僧各各皆成八道也故三十二餘之表意類此可知隨喜功德品疏卷第十經皆衰老將死不久者若未登聖位雖受人天福樂歡喜老病死事而無避者故知三有深可厭患是以勸之修證聖果故出曜經云自古迠今大畏有五不可得避應老之法欲使不老者此不可得應病之法欲使不病此不可得應死之法欲使不死此不可得應磨滅之法欲使不磨滅者此不可得應盡之法欲使不盡者此不可得問何故老等名可畏耶答能壞盛事諸苦所依故名可畏故本行經云老最可畏所以者何老來逼時能奪年少盛壯將去摧折身形腰脊傴僂不能行步猶如枯樹誰喜樂著此最可畏其病來者是名可畏所以者何平健之時不知不覺一期痛切宛轉呻吟華色充鮮忽然悴減煩冤楚毒眠坐不安當於是時誰能代者臥在牀機勢不從心以是因緣病最可畏死最可畏所以者何死來之日滅我壽命忽撮將去雖復力能統四天下金輪摧伏七寶道箭利刃強兵不能遮制爭奪可得以是義故死最怖人問居老等位誠可吁嗟棄之修練若處盛年貴健之際阿患須厭令更造習答夫處世者必不可保隙影石光須臾變滅故教捐捨故出曜經云世有四事不可久保一者常必無常二者貴必貧賤三者合會必別離四者強健必死疏如挍量佛梵音聲相者除梵音相餘三十相不及無見頂相一種無量頂相不及一梵音何以故以梵音中能出無量百千梵音百千法義利樂有情證意可悉故智度論云三千果樹不及一如意樹亦猶十方螢光不及一日大千野干不如一師子也又大般若三百四十一云若善男子等於初發心及至一生所繫菩薩功德起隨喜心得幾所福佛告憍尸迦假使三千大千界合為一海若復有能取一毛髮折為一百分取一分端沾彼海水可知渧數是隨喜福不可數知何以故是隨喜福無邊際故又云於諸菩薩功德善根生隨喜回向菩提善男子等速證無上正等菩提速能圓滿諸菩薩行又四百三十二菩薩所有隨喜功德於彼異生聲聞獨覺諸福業事為最為勝為尊為高為妙為微妙為上為無上無等無等等何以故以異生修福業事但為令己自在安樂二乘修福業事但為自調伏為自寂靜為自涅槃菩薩所有隨喜功德普為一切有情調伏寂靜般涅槃故所以今者第五十人隨喜功德難為比法師功德品疏百福十善因所惑者按涅槃經二十四云菩薩不殺戒有五種心謂下中上上中上上乃至正見亦復如是是五十心名初發心具足決定成五十心是名滿足如是百心名百福德具足百福成於一相琉今解唯在四善根位者問至四善根自能見於三千界等何關經力答由持法華得至四善根故見境等亦名經力又不持經至善根位者雖見三千而不明利若持經者見乃明矣又不持經雖見界等而無八百等功德也今持經得見大千功德疏即如經云三千大千一化佛境等者其教非一又華嚴經言初地得百法明門見百佛世界即是百箇大千世界一界一佛名百佛界此據四善根人所見佛境故名百界若據凡夫二乘資糧菩薩所見說者即合說見百箇百億佛之世界一四天下一化佛故故梵網經一華百億國一國一釋迦又大悲芬陀利經第四云一切四天下示成佛故並是凡夫二乘資糧菩薩所見佛也百億四天為大千故經既但云見百佛界故知據彼善根人見佛境說也疏一云至於理無爽者此解之中文意有二初云諸根互用至非唯三千故者此釋意云言得功德及見境量屬於地前諸根互用乃屬地上聖凡別也二又初地至理無爽者此意釋云見三千界亦通地上會意可知疏若加行地前亦得者以加行力而少分得地前容得疏此本論至互用中故者此意言者論前所說凡夫之言通在得勝根用及根及根互用兩處文疏前凡夫位至有互用者疏主結斷取初釋也地前功德見境地上互用兩位別也實非地前得有互用議曰論意本明持經之人所得功德六根境量諸根互用功德境量既屬凡失諸根互用何即菩薩本不欲明地上菩薩故又論引經證互用云眼見者聞香知故如經釋提桓因乃至鼻根知故經中結云父母所生明非地上准此之理論明凡夫諸根互用然疏斷意若論加行少分得者不障地前自在即非非全不許凡得互用論據少分故不相違更思疏但知百劫劣二乘者據任運起言百劫也若加行者數即廣多豈可二乘同年而語如華嚴經十地論中而具言矣若二乘者知八萬劫即加功矣又百劫言且對所證百法門說經悉見三千界者問何但三千更不多耶答有義智度論云三千界外有風輪天眼相違故不能見意明凡夫肉眼之力風輪能違故不更多見經彌樓山者傳云此名光明山經須彌山者傳云此名安明山今正云妙高山疏又得三千至亦不相違者意明此中所說耳境通於凡聖大小位人所有境分經三千大千界至有頂天者問三千界量如第二疏五趣所依身壽量等如第六疏四洲及天一一別名疏未曾釋其事云何答四洲者一東毗提訶此云勝身身形勝故或形南方以得勝名或翻為前在餘方前故二南瞻部即是樹名此樹極高故標洲稱或云林名或以果標名此無相當故不譯也舊云穢樹者誤矣何以知者樹既高香何得稱穢三西瞿陀尼此云牛貨因高樹下有一寶牛貨即是寶洲從二事以得其名或以牛貨易故名牛貨四北俱盧者此云勝處於四洲中處最勝故或云勝生四洲有情此最勝故次明天趣欲有六天一四天王如第二疏二忉利天此云三十三天四面各八及中帝釋從數為名上之二天皆地居也居須彌故三夜摩天此云時分受樂時分有不同故四都史多此云知足謂即受樂而知足故或名喜足多情喜足行滿足故名喜足五樂變化樂變五塵於中受樂雖復亦有業所生境從勝標名六他化自在有自在力令他變化五塵之境而自受樂雖復亦有業生自變五塵之境而自受用從勝標名次明色界四靜慮天初禪有三一者梵衆大梵從衆大梵所有所領所化故名梵衆二者梵輔於大梵前行列侍衛輔弼大梵名梵輔也三者大梵由彼獲得中間定故最初生故最後沒故威德等勝是天主故得大梵名梵言雖通此為其初獨名為梵二禪三者一名小光光明小故二無量光光明轉勝量難測故三極光淨淨光遍照自地處故三禪三者一名小淨意離喜踴而純受樂名之為淨於自地中此淨最劣名為少也二無量淨淨轉增勝量難測故故名無量三者遍淨淨周普故四禪九者一者無雲以下空居天所止處如雲密合第四禪所居之處是極輕薄不同彼雲此天初故故名無雲二者福生有勝福者方可生故三者廣果居在方所異生果中此最勝故故名廣果四者無想一期生中除生及沒粗想不轉立無想名五者無煩謂彼天身心無煩擾一期領受純寂靜樂非下所有或證苦等諦離下粗重諸煩惱故故名無煩六者無熱證四諦故離下所起煩惱蒸熱或熱者熾盛之義上品雜修靜慮及果此猶未得故名無熱七者善現由彼天形色妙端正過下二天又得上品雜修靜慮善彰顯故故云善現八者善見彼天形色轉復妙好衆所樂見又雜修定障餘品至微見極清微又得上勝圓滿雜修靜慮所得善法轉復粗顯故名善見九者色究竟謂彼天形色最勝妙餘所不及又復於彼有色界中最尊最極又復色者積聚之義至積聚邊名色究竟無色四天如第三疏八解脫釋疏壞根不壞境者壞者雜壞壞亂之義下皆准知互用之義如唯識抄疏此是智境鼻根知故者第六意識相應之智依於鼻根而能知彼亦鼻根知疏得假似香等者問諸教不見說香有假云何言得假似之香答准瑜伽論好惡香等名之為實和合等香而是假也故五十四云空行風中無俱生香准有假合者既言假合故知是假問空行風中假合香者其相云何答風中無有根本之香如風過樹樹華等香逐風而來由因華等風方有香故名假合假合故假疏言得似即瑜伽空行風香不得實者不得根本香之自體疏此據依形等者此約依色界實身而起通力變起香等經地中伏藏聞香知者問按成實論云金銀無香金剛無味豈不相違答小乘根鈍而不知有今經大乘豈同彼耶經云命命鳥者共命鳥也經末利華者鬘華堪作鬘經闍提者金銀華也經雖未得菩薩無漏法生鼻者問許因五識通無漏者正符此文護法所立豈不違教言雖未得顯有得故答但言無漏而為能生不言所生體即無漏體即無漏何須說云無漏生耶問從無漏生體應無漏答如等無間諸心相生通乎三性及漏無漏此何疑乎又言鼻者而是根也故長行云清淨鼻根豈容鼻根同成無漏故知經意明聖菩薩以無漏法起鼻等用名無漏生生猶起也非感親生聖不議故疏經亦說佛有鼻舌通過於眼耳者按菩薩瓔珞經第三明有鼻通又十住斷結經第六云如來眼通不可思議如來耳通無能限量如來鼻通倍不可計如來舌通廣無邊際疏一月四月等且舉月時分齊等者按西國法一年之內分為三際謂熱雨寒四月為一際也所以經言四月等也不輕品疏因彼說非正明者彼謂不輕因不輕故方說威音非為正說威音佛事疏初不可輕後犯戒故者初是菩薩而非比丘禮拜四衆而不可輕後是比丘而非菩薩若禮四衆即犯戒也今者不輕亦比丘亦菩薩雖違遮禁為利既大是以禮也疏此二在凡四十心位者問前早已住四善根位何故今言在四十心四十心者資糧位故答第十回向攝四善根今言滿處亦不相違疏後三並名在大衆中說法無所畏者後三總名在大衆中說法無畏然別行別故開為三足前成四行相易了神力品經千世界至踊出菩薩等問何故踊出復請持經答有義菩薩踊出而有二意一為開敷壽量則善其始也二發誓流通則合其終疏促不延時等者若取舒舌延劫之時佛年無量今除放時但言八十問何故攝舌而不收光答有義表說法竟故攝舌相欲令十方通徹彼此相見故不收光屬纍品疏纍謂重疊等者按說文屬連也廣匹委託纍也謂以事相屬纍左傳相時而動無纍後人謂纍重也有義纍謂憑纍藥王品疏八塵之痼者色香味觸地水火風疏七漏者按成實論及涅槃師子吼品一者見漏見道煩惱二者修漏修道煩惱三者根漏謂眼等根能生漏故四者惡漏謂惡象等生煩惱者悉名惡漏能生漏故而得漏名五親近漏謂衣食等生貪因緣近能生漏名親近漏六者受漏受三惡覺能生漏因不以受數名為受漏三惡覺者謂欲瞋惱七者念漏邪念起漏故名念漏七中前二是其漏體後五即是生漏因緣總名為漏疏得此定已能隨樂現身者所起色身即是定果也或得定已而能發通現諸色身身即通果所攝色之三昧依主為稱餘皆類知或有財釋經兜樓婆畢力迦者傳什公云出龍神國此土所無故不翻又有云畢力迦者此翻為觸經滿千二百歲者表居因位十三住中前十二住皆因位故問依毗尼法若自燒身得偷蘭遮燒臂得突吉羅喜見豈不將犯戒乎答古有兩釋一云可是在家菩薩不預犯列二者設令出家適時而化如身子與須達長者共載一乘而不犯罪或大小異故無違也經以佛法至亦付汝等者問若小乘者言佛畢竟入於涅槃可須付屬大乘如來常住不滅有感而應何待付屬答有三因一者時衆見佛殷勤付屬有在則重法情存各欲宣持二付屬菩薩令其自行及化他故三者佛知衆生於菩薩所有深重緣故付令其弘法濟物文中付屬而有二事一法二人故金剛般若經論云以根未熟菩薩付屬根熟菩薩經八萬四千寶塔者表佛八萬四千功德滿矣八萬四千塵勞之垢以能除矣問如來之體金剛之固云何燒破為多分耶答理實覺體莫有能壞良以悲感應物佛力破之以施三有作諸佛事故大般若經一百二十九及五百三云一切如來應正等覺本以大悲觀有情類應於諸佛設利羅所皈敬供養而得度者以金剛喻三摩地力碎金剛身令如芥子問供養佛體有何福利此之菩薩廣崇寶塔答近而言之越三惡趣受人天樂遠而言者登涅槃樂故大般若經一百二十七云諸善男子等供養恭敬尊重讚歎佛設利羅決定不復墮三惡趣常生天人受諸快樂富貴自在隨心所願乘三法而趣涅槃問自供施他福何優耶答後勝於前為能令彼廣流布故故大般若一百二十九五百三云若善男子等從他請得佛設利羅種種供養若善男子等從他請得分施與他如芥子許令彼敬受此二福德何者為勝天帝釋言如我解佛所說義者當勝所以者何令他得於無量福故問舍利雖是如來之體然不能現通說法以利有情云何堪受人天供養復令供養獲福無限答按大般若一百二十八云佛設利羅是極圓滿甚深般若所薰修故是清淨甚深般若所依器故堪受人阿素洛等供養恭敬尊重讚歎又五百三云皆因般若甚深經典而皆生故堪受供養又一百二十九五百三云復次深廣大悲神力加持如是佛設利羅令於如來般涅槃後有得一粒如芥子量種種供養其福無邊於天人中受諸妙樂乃至最後得盡古際經七萬二千歲者表居因位德未滿也問前生何乃燒身以供養今者但燃兩臂獻耶答前生佛在弘法生在物有導者所以燃身今世佛無若也燒身衆生無導法無弘者故但燃臂疏總別離惡攝善等者初句名總具彼離惡攝善二故疏隨其所應配前三句者配前法中三句法也次下合文亦准此也疏聞書功德等者聞謂聞經書謂書經疏得無邊邊等者彼人功德而無有邊佛能知彼無邊功德無有有邊功德可知名佛不知經聞是藥王品不受女身者問何獨聞此品得離女身豈聞餘品女身不離答實聞餘品女身亦離但約事相類偏寄此明何者以女人者性多樂著己身種種嚴營今明菩薩捨身捨臂破彼著性不生染愛故捨女身疏方便攝引云菩薩慧無與汝等者佛為引接聞經之類令其進趣故云菩薩無與汝等非實菩薩總不及也經病即消不老不死者問夫有漏者皆有病老死云何凡夫聞經離病老死答古有多釋一云由聞經已要至於老方死無中夭者云不老不死又云百八煩惱名之為病得聞經已能斷煩惱故云病消不起六十二見名為不老不失慧命名為不死又云由聞此經知老病死本來寂靜滅故云不老病死又云由持經故得好顏色故不老得延命故云不死不病可知妙音品經甄叔迦寶者赤色寶也按西域傳云印度多有甄叔迦樹其華赤色形大如手此寶色似彼華因以為名又傳云璧圭也又有云此云鸚鵡寶此寶似鸚鵡鳥𭉨而赤色普門品疏隨類往化者問菩薩發願常侍於佛如影隨形云何得言隨類化物答據不化生言不離佛又心不離佛身化六趣又不起滅定尚現威儀化生侍佛二皆不闕疏法琳皈命等者按法琳法師別傳云俗姓陳氏頴川郡人祖因官從寓襄陽住長安濟法道場貞觀十一年春正月帝欲宣暢李風導崇李系爰發明詔令道士女道士齊供行立在僧尼之前時法師與京邑僧等進表論佛道優劣李氏真僞申以直言時天威震怒敕法師曰汝所著辨正論信毀交報篇言念觀音者臨刀不傷既有斯靈朕今赦汝七日之內爾其念哉俟及刑科能無斷不法師既羈縲紲復迫刑期氷炭交壞控告無所至第六日夜從倚沈吟步朗月以烟燃慨浮生之若寄仰天而歎曰昔鄒拘齊獄丹質秦郊尚敢夏景遷霜烏頴為白豈可獨於琳也無微應者哉言已俄有神人身長丈餘素服無冠踰垣戾止而謂法師曰既云刑殉道弄紉類網冥衛實繁幸無勞慮語訖而失法師恭虔五體默念三尊遂思逸胸懷懌然無懼至七日勑遣刑部尚書劉德威等問法師曰今赦期已滿當屆臨刑比丘念觀音有何靈應法師對曰七日已來唯念陛下威等問曰前奉勑旨令師誦念觀音因何不念乃云唯念陛下法師對曰琳聞觀音聖鑒塵形六道上天下地皆為師範然我皇文思聰明光宅海內九夷奉職八表刑消君聖臣賢不為狂濫今陛下字育恆品如經即是觀音既其靈應相符所以唯念陛下威等録狀奏帝帝悅因召法師而問釋道優劣法師援據今古鴻儒博達校量二宗優劣之事而以面奏勑覽法師對異而釋放焉疏齊歡憑依者按齊書元魏天平年中定州募士孫敬德在防造觀音像年滿將還在家禮事後為賊所引不堪拷楚遂妄承罪明日將決其夜禮懺流淚忽如睡夢見一沙門教誦救生觀世音經經有諸佛名令誦千遍得勉苦難敬德忽覺如夢所緣了無參錯遂誦百遍有司執縛向市且行專誦臨刑滿千邊刀下斫之刀為三段皮肉不傷易刀又斫凡經三換刀折如初監司問之具陳本末以狀奏聞承相齊歡歡為表請免死因此廣行於世所謂齊王觀世音也敬還設齊迎像乃見頂上有三刀痕疏意以事因歡奏得免經復從齊立名故云齊歡實非歡身免田之厄亦不相違疏一定異熟等者按瑜伽云順定受業者謂故思已若作若增長釋起思故作兼復增長此業定招異熟果故名順定業言順不定受業者謂故思已而不增長業者釋故思雖同不增長別是故此業招果不决名順不定業疏取論意而以牒云文少不次尋此應悉疏八十九至不增長者按彼論云若有離作不增長者諸有造作如是業已若無追悔不修對治彼於此業若更增長若不增長此業亦轉令成順惡受受釋由不追悔及更作故故令其業受惡趣果然論不言名增長業疏取論意立增長名以論說言若更增長順惡趣受故知此業得名增長下言名不增長業亦准此釋疏或先增長業至復名不增長者此來意者論次前云諸有故思造不善業此業亦作增長者定於當來受惡趣異熟故疏云此人若不起追悔之心誠為定業若逢善友起追悔心亦名不定如未生怨舉事為證由此故知定不定業大網望彼悔不悔別悔即不定不悔定也瑜伽前云定受惡者據不悔說以猛利造惡有情多不悔故亦不相違疏對法第七有五故思業者問他勑等何名故思答初雖他勑後發故心故亦名故思故彼論云他教勑者猶如有一雖不欲樂因他強力之所勑教發起故思行不善業他勸請者雖不欲樂因他勸導執為利益發起故思行不善業無所了者不了得失無所執著隨欲所作發起故思行不善業倒分別者依不平等因見愛樂邪法為求當來可愛異熟發起故思行不善業餘如疏引疏八自性無記者略有二釋一云謂善不善非業道攝中下品性自性不增不同善惡業道攝者故名無記非三性中無記性也二云即三性中性也疏九悔所損者即是追悔令業不增名為損也疏六增長業者一者加行由極猛利三毒加行發起諸業二者串習於長夜中親近修習若多修習不善之業三者自性語業中妄語為重於身業中殺生為重於意業中邪見為重四者事故謂佛法僧及隨一種尊重處事為損為益五者所治一向受行諸不善業乃至壽盡無一時善六者所治損害斷所對治諸不善業令諸善業離欲清淨疏其十不增至多少者十種不增不越對法三種不增六種增長不離對法二種增長但作論者依分位殊開合有異問十種三種相攝云何答若名體而相攝者瑜伽第二攝彼第三瑜伽第七攝彼初二餘之七種隨其所應義通三種七據睡寤狂不狂等位之不同而故開也問對法五種總言故思十中第三云無故思云何相攝答對法據後總言故思瑜伽據初言無故思對法初二初云不欲即是無故思也問第九第十與彼對法全無相似云何相攝答即彼初二由二損故故他勑勸而不增長問一四五六八彼五何所攝答一五第六是彼末三四八二種前二隨攝問六增長業與對法二相攝云何答五中偏指惡業作法六中通論善不善業六總義通彼二中有對文觀之其義可見故不具之問若作增長非不招果頗有增長不作等耶答有故瑜伽論第六十中作四句云殺生所引不善諸業或有是作而非增長即前夢等所作十不增業或有增長而非是作為害生故於長夜中數隨尋伺由此因緣彼遂增長殺生所引惡不善法然不能作殺生之業亦作亦增長者除先二句所餘一切殺生業相非作增長者謂除前相餘九業道倣此應知疏第十三業等者三四五業諸教不同開合差異可具言之疏既有指就披可悉故不繁重疏由此故知初釋為善者即前亦有釋言上疏引瑜伽對法而成立者並名初釋疏撿繫攝録等者又按廣匹云申也括也為括束之釋名云禁也謂禁閇誨物使不得開露也經天大將軍者有云是天力士如鉢健提之類亦如那羅延之流那羅延者即天名也疏處位荏人曰宰者又按聲類云宰治也謂治邑吏廣匹制也謂制事也疏三轉施恐乖彼心者問既云不受將何轉施故釋之云恐乖彼心故見受之而乃轉施亦名不受疏所以不受者通結前三經觀音受珠分作二分奉多寶等者有義受有二意一上順佛旨二下愍群生欲展轉生施主福故分為二分示現生死涅槃平等但奉二尊又釋迦生而為智德多寶滅入即是斷德為顯智斷為福田故又顯二佛俱受明二如來不滅也疏如巧醫師至令發勝意者可有二意一令行惡者以己方人自知其苦故不苦人二令傍人見於不堅而內自省不與於惡故著本人非是菩薩無利困物經無等等菩提者略為兩釋一者佛大菩提而有二義下所不及名為無等上佛有齊故名為等二者上無等言為顯佛果超過一切故云無等下一等字因菩提心與果相似故名為等故涅槃云發心畢竟二不別又智度論四十一云無等名佛所以者何一切衆生一切法無與等故是菩提心與佛相似所以者何因似果故是名無等等心前解不正後理教具陀羅尼品疏以少略密無義文字者能以少略而含多義復是祕密觀其文句而似無義名無義言非實無義問何以明之以少包廣復何所以少含多耶答按大法炬陀羅尼經第二云此一法句出無量句是大總持通說諸義何以故欲令一切衆生易受解故疏總持有四謂法義等者然四總持一法二義三呪四能得菩薩無生忍疏中所言辨才詞者而有兩義一者疏錯辨才及詞非總持故二者不錯詞無礙解法總持攝辨才無礙通於法義總持中收故舉之也疏上來長行名法義持者有二義一當此品初長行在呪上故名為上來二通前諸品諸長行也後正問何除偈耶答亦不除為對後呪總名長行更思疏無得無生忍持者此經不說得無生忍之總持也問分別功德品中由聞如來壽量長遠六百八十萬億那由他恆河沙衆得無生法忍妙音菩薩品四萬二千天子得無生忍此品之中六萬八千人得無生法忍何得言無答經不明得無生法忍法用位次差別之義名無無生不障聞經有得者也有義下聞神呪悟無生忍豈非一乘即此亦有無生忍總持也議曰兼取於前所得之忍並名總持斯亦何過更思問神呪所詮詮於何法答有義不出三義一者說於極果勝德或因中萬行二說三寶名字或大力鬼神之名三者說於諸法深理無相使聞者悟道問此方何乃不譯從此音乎答有義呪語含多此間無物以擬之若譯之者於義不盡又恐失其勢用傳有譯者未可依之經若有侵毀此法師者則侵毀是諸佛已者問何故損人即名損佛答法師即如來使者行如來事是以毀之即是毀佛問夫何等者真法師相答三業清淨薀德遠非可真法主故涅槃經云若欲說佛性如來藏及三乘者先當清淨其身以身淨故則無訶責無訶責令無量人於大涅槃生清淨信信心生故恭敬是經若聞一偈一句一字及說法者則便發菩提心當知是人是衆生真善知識是我弟子非魔眷屬釋曰且舉粗相而易為者言令身淨實淨三業又按大集經第七云凡所演說不為飯食至心演說說時不輕亦不自高為出善巧所聞不失又般若經五百六十七云謂隨所化多為愛語含笑先言遠離頻蹙發詞有義能稱如實諸有所說不欺侮人所言決定種種樂說以柔暖語令衆歡悅容色寬和使他親附隨義而說聞悟解為利益故稱法相說平等為說心無偏儻離虗妄言作決定說隨衆根性由此因緣令衆歡喜妙莊嚴王品疏又淨眼至故不說者問妙嚴王即前華德今更明之何不重濫答妙莊嚴王雖即華德華德於前不題為品今立名題故無重濫淨眼即是前者藥王藥王前者以標品號今者更言豈無重濫故不取也疏又作枛者五篇稻也稻音若冷反經願母放我等出家作沙門者問在家何過厭而捨之答損德敗善長諸惡緣所以見捨故郁伽長者經云所謂在家者名殺善根名不捨過害助善業是故名家云何名在一切結使在中住故故名為在又復家者在是中住無惡不造則於父母沙門婆羅門不好敬順又復家者長愛枝條憂悲苦惱患在中生未作善根掉動不造已作善根悉令散滅又若住是中好廢戒定慧解脫解脫知見等聚又若住是中父母妻息姊妹親友眷屬知識貪愛所攝常思念財貪欲無限如海吞流終不滿足又在家如幻多容集聚無實衆生在家如夢興衰代故在家如露速破故家如蜜渧須臾味故家如㓨網貪著色聲香味觸故家如毒蛇互相侵故在家多怖王賊水火所劫奪故具斯多難故見捨之事同脫屣問夫出家者何利有之而見求趣答真出家者能扗三有門滅諸囂纍發菩提路生植衆德故郁伽長者經云出家妙好捨離多垢遠離愛欲淤泥是涅槃際甘露器億劫難得有百餘翻對在家者以明優劣有斯勝德故求出家問若欲出家以何為心名真出家答為損生死為趣涅槃離諸執著名利等事是真出家故郁伽長者經云以何緣故捨業出家為修慧故勤加精進如救頭然應作是念我應住於四聖種樂行頭陀四聖種者謂隨所有衣服乞食臥具而生知足歎美知足不為此等而行妄語若不得此不想不念不生憂惱設令得之心不生著不貪不住知其過咎知於出離隨是知足不自稱譽不毀他人樂斷樂離樂於修習於樂斷等不自稱譽是名住四聖種疏善或經等親近善友者又按瑜伽三十五云由四種相當知菩薩具足一謂菩薩所遇善友性不愚鈍聰明黠慧不墮惡見二所遇善友終不教人行於放逸亦不授與諸放逸具三所遇善友終不教人行於惡行亦不授與諸惡行具四所遇善友終不勸捨增上信欲受學精進方便功德而復勸修下劣信欲受學精進方便功德所謂終不勸捨大乘勸修二乘勸捨修慧勸修思慧勸捨思慧勸修聞慧勸捨聞慧勸修福業勸捨尸羅勸修惠施終不勸捨如是等類增上功德而復勸修如是等類下劣功德是名善友具足之相疏紺青赤色者按說文帛染青而備赤色釋名云紺含也青而含赤色切韻音赤也經河月者螺屬者出海中潔白如雪者也疏然瑜伽正定聚要入初地等者按瑜伽論第一百云邪正定法聚者謂無間業及斷善根正性定法聚者謂學無學所有諸法不定法聚者謂餘非學非無學法問按大般若三百九十四云若初發心若不退位若最後身菩薩皆住正性定聚如何論中言學無學方名正定答略為二釋一論通三乘經唯大運二乘發心多有退故二經論相似經言發心即是初地證發心也故彼經云住正定菩薩不復墮於三塗八難三塗八難得永不生由入見故更思勸發品疏有云滅後人年五十歲時者又按楞伽經亦云後五十年注云四百五十年後至五百年中間所有五十者名後五十年經普賢菩薩乘六牙白象者有義有三因故而乘象也一明菩薩羽儀二欲以靈獸伏諸魔毒三者欲表三乘之人㝹馬象三如次喻故又菩薩能乘之人象乃所乘之物表能所乘之法並離於染故復白也又按俱舍論云六牙譬六度四腳譬四如意足七支譬七覺皆是一乘中別行有斯表彰故乘其象疏生下四天亦下品等者四王衆天名下四天疏生夜摩天至文略無果者兜率陀天有彌勒佛諸天得見經文明舉其夜摩天及上二天中無佛天無所見由此經中略不說之為中品修所感之果議曰忉利天中亦無其佛經何故言但是舉彼下上品修所感之果影顯中果非要約彼見不見佛方言不言或不見佛言釋上二天為中品所以文略無果釋經不言若准斯理疏言無失文約義含尋披方悟疏只如中品至各有下上者意明十行一一之中皆有三品如受持讀誦中上品中而皆說故取證於餘疏今但於中品說有等者如說修行實有三品今者經中但中品說如說行下上兩品便不說也疏又修一二三行為下等者若復有人十法行中唯能修一或修二行或修三行並名下品行人即下品中有三類也中上之行亦准此悉問下品之中行二三行對彼中品二行之人且高復勝云何名下答下品中三如次對彼中之三品名之為下非以下品第三對中初一名為下也中對於上亦准此知或復疏言一二三者如次下品之三品也復云二四五六者二言題是第二中品非目十行之中二行復云三七八九十者三言乃目第三上品非目第三行文中三法行也此意總說約彼十行而有多少分三品也此釋為正疏切韻至更無了音者切韻了音之中唯四了字無彼繚繚燎燎二字字音刀小反非了音也了音盧鳥反然镽者镽𨲭長貌也𨲭音巨小反疏有二燎字者謂繚繚二也繚者按說文云繚繞潦纏也謂相纏繞也疏視也內𭾤也者按蒼頡篇內視曰睞疏寫多誤也又相傳云內𭾤者俗云眼仰𭾤

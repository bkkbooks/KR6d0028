body:
  text: 沙門智周撰疏第二卷疏或及初解皆持業釋者略有五釋一云大悲即是大智之用亦悲亦智名為持業二云無上佛果不離於心智所起處即是菩提故觀經云心即是佛三云所求之果不離能求可名持業所度之生自他有別不名持業據一邊説四云攝他同己故所度生即能度者亦名菩提薩埵五者大悲大智屬能度人不取所求及所度者議曰初解理通文略不具次三非正今依第五問既與初解全自不同云何得言初亦持業答初依大悲大智而釋今亦取之故云亦也但自他異故成有財持業二別若不爾者持業有財而有何別疏顯示菩提者法身理體及菩提道者四智心品疏顯示人平等相三世諸佛功德平均名人平等或有釋云約真理説有情共有名人平等議曰不及初釋與解脫相而無別故復攝四智而不得故論復説云以菩提法故知是佛若依真理二乘亦有豈即名佛疏説智及智處者智謂四智處謂真如智依處故疏菩提菩提斷者智名菩提真理名斷因斷障得立以斷名疏一切莫過超遍等喻者按涅槃經十九云喻者有八種一者順喻謂從小至大從因至果法喻皆爾展轉而增名為順喻即順次第也二者逆喻至極處已却尋至所依尋至初首法喻皆爾名為逆喻逆次第也三者現喻衆生心性猶如獼猴獼猴之性捨一取一衆生心性亦復如是取著五塵無暫時住衆生及猴現皆不住將現比現名為現喻四者非喻如佛先言四山從四方來四山即是生老病死生老病死實非是山而名為山故名非喻五者先喻譬如有人有貪著妙華採取之時為水所漂衆生亦爾貪愛五欲為生死水之所漂沒喻初貪欲能為後患名為先喻也六者後喻如法句説莫輕小罪以為無殃水渧雖微漸盈大器謂取後時盈大為喻故名後喻七先後喻譬如芭蕉生果則死愚人得養亦復如是如螺懷妊命不久全謂以生死兩時為比名先後喻八遍喻謂遍計法以比彼物名為遍喻如波利樹根葉等一一以比如來弟子從初出家終至菩提廣如彼經恐繁不具疏然諸經論至菩提體者按大般若三百八十七云此本性空即是諸佛所證無上菩提又二百三十云何謂無上正等菩提佛言諸法真如是謂無上正等菩提斯教非一恐繁不具疏不退非即不轉者略有二釋一云退者失也轉謂動焉於彼菩提修而不失相用煩惱復能不動故退轉別二云前三不退但名不退非名不轉猶為相惑之所動故第四不退雖通即別二種之義今取於別所以者何為不退名該前三種故從於寬而取別也疏不退即不轉者欣覺進心即不為彼相用等動故得不退即名不動問約二不退解不退轉已得不退亦同第二即不轉耶答不得猶為相用之所動故若爾何由對四及二分為兩釋答由諸聖教泛明不退有四二別故對以明非對四二證不退轉成即別也設對四種明退轉別理亦無失對二準知疏十地經至分三用者引釋外難難八地去唯定非散云何説言有聞持耶聞是散故答意可悉疏散者施也等者問能持持四可名總持所持各一何名總持答且如法中以一言中現一切言等如一字呪示含多法義等可知故示名總疏因果別故者聞持為因法義等果疏謂轉如前四位二種等者四即信等四種不退二即已得未得二也有云四不退中一一皆有已得未得二種不退且第六信前已得不退未得有退第六已去於未得法亦復不退餘三準知又有云證行不退名為二也議曰若信等位未得不退與八地上而復何別又疏指前前疏不明證行不退但依初解疏説自分功德等者謂諸菩薩説自所得大乘之法名為自分談二乘法名為外分又當地已得上地未得名自名外已得之法更不退失未得進求心固而趣名不退轉或説二乘法令他不為邪染所動自不為彼小乘法拘亦名不動疏説智等者智四智等福謂百劫所修福事或但餘福或令有情所引福事初福未得名為不轉於次福者不生愛染若於後福勸生行之離於邪欲並名不轉或無漏福資成正覺窮未來際不同人天福有遷改故名不動説智可知疏説般若等體用分之行相準悉疏説有為等者真理凝寂非動搖故名為不轉或於無為任運證修志無傾怯名為不轉或可前三約勝劣明言不退者已得劣法言不轉者未得勝法泛明福智智勝福劣今約後時修相好故福名不轉方便乃是智慧妙用為勝無失審詳疏蟷蜋拒轍者按韓詩外傳曰齊莊公出獵有蟷蜋舉首將搏其輪問其御曰此何蟲對曰蟷蜋也為蟲知進而不知退不量其力而輕就歒又莊子曰蟷蜋努臂以當車轍不知不勝任也疏動宣言教至言後者如次屬彼教理行果能行行人因佛等聲能得聖道名運聲前據究竟説非是一切正聞聲時即運聖道言後準知疏以己身心業者菩薩依舉自色身體攝餘二業有云菩薩依佛色身種植名為攝取問何不依彼法身種善答今明供養故明色身疏供養有十者有三義一於三寶起恩德想二明差別三顯得果先於三寶起六種心一起福田心如世良田能生稼穡三寶能生衆生善牙二起恩德心能拔衆生一切諸若能與衆生涅槃常樂三起最勝心一切衆生無有能勝於三寶者三寶乃勝一切衆生何以然者衆生未免生老病死種種等苦三寶不然故為最勝四起難值心於百千劫不聞名字況能可見如塢曇華極難遇矣五起獨現心三千界中但一佛出出即不多故頗逢遇六起德依心世出世間所有功德皆依三寶而有之故如諸卉木岩石泉流皆依大地方得有矣二明差別具如疏辨然第十正行略更分五一於諸有情起四無量心普緣衆生有求樂者發起無倒與樂之心緣有苦者起除苦心緣有樂者發起隨喜不妬嫉心緣諸有情無苦無樂有苦有樂三類衆生逆次發起除貪瞋癡清淨之心如次名為慈悲喜捨二於諸行修被無常苦無我想一切世法皆為生住異滅等相之所遷變輪回三有生死不息故名無常此無常法有生死等種種逼迫故名為苦此苦之法假無其體獨幻化等故名無我三於涅拌修勝利行謂彼涅槃體圓寂靜無生無滅離煩惱縛是衆德本湛若虗空勝一切法能證此者即能永斷一切煩惱得一切智一切功德出過三界為人天師是故當須觀此涅槃所有勝利而求證之四於三寶六處而修隨念念佛具有大悲等德是大導師能引衆生出於宅生死險路是大醫王療衆生苦念此如來種種功德不得顛倒執著分別名佛隨念念於三乘清淨之法是大良藥能除衆生三界等苦念此法時示不顛倒執著分別念於一切菩薩二乘能離煩惱得大功德和合無諍衆生善友能救衆生苦復能與樂念賢聖等一切功德亦不執著念布施等是大般筏能度衆生生死大海至於彼岸念六度時亦不執著等是名六度隨念五於一切法發生智慧信離言法真如之體不起分別住無相心謂情非情莫不皆以真如為體如體離言言詮不逮本無分別亦無有相實如既然諸法亦爾但由衆生虗妄顛倒於無分別無相法中起分別相若能於法知實無相及無分別自心不起分別等相此即名為住無相觀正行供養三顯果差別者且初第一現前供養當獲無量大福德果受大梵福於無量劫不墮惡道由此亦能為菩提因後所得果轉勝於前乃至第十寂為上妙何所以然答正行正是成佛之因餘非正因故勝劣別恐繁且止疏理事疑盡者問疑唯分別入見已除云何今言二疑盡耶答有三釋一云然於事中八地已前容得有疑今皆永盡二云約習氣言八地方盡三云疑要與彼有漏心俱八地已上漏心永絶已前猶有約此俱心永無之處言八地除實初地斷義同得於無餘涅拌及想受滅無為之中疏入一切智等者有云論文而不倒也入一切智是能證智如實境界是所證理復有釋云佛一切智於菩薩所入之境界也議曰準於經文後釋亦得依論文解道理無失據理明白改亦應得然觀經意以釋論者入者能入菩薩之智一切智者即是如來如實境界佛所觀境今談菩薩能入佛境故經説云善入佛慧之性也此釋望於經論莫不相順疏通大智者問何獨稱大答小唯生空今生法二故云大也疏應作所作等者問菩薩二利萬行俱修何故獨言化衆生事名為應作答菩薩之行外己親人是以菩薩利他為本又得忍已物我平等故常利他故大品經云大事者謂救衆生此是菩薩常所應作智度論云菩薩得無生忍已更無餘事唯成就衆生淨佛國土疏攝取事門等者此中文意鉤鎖相連皆以上句生起下句思準可悉故不作也疏不同下上等者所言下上不約地分但取勝劣以為上下七地已前為彼有無相用等動今此八地離斯二種問按十地論云八地菩薩耽寂滅酒十方諸佛摩頂七勸唯識亦云於利他中不欲行障如何今説任運而行答七勸有障皆據利他不能任運非依自利自利實能任運進故又八地中有入住出勸為創入任運依後故十地云汝已經二大阿僧祇已故知創入非勸住出疏八九十地示現諸地者同得攝取九句功德名同示現諸地諸地即是八九十也此總舉結論之大意也疏何智等者問上下支門及攝取事兩復次釋總有三處明此三智為同為異答初門三智如次根本後得真如真如名智智實性故觀照雖通本後二智今取後得攝取事門初復次釋與前釋同第二復次與前有異初中二智俱是後得望義異故問論歎菩薩何不立上上起門答有兩釋一云羅漢上下起定菩薩不爾所以不説二云亦有影略説故前舉羅漢影後菩薩理亦有也且下起上者由得陀羅尼故於菩提而不退轉餘皆準知議曰後釋理全不然且如羅漢定由漏盡菩提不退非定總持九地八地亦名不退轉故餘皆思悉故不具非有古德釋十三句分為二種初總後別別有十二名十二淨一持法淨二知機淨三正事淨四習解淨五修因淨六斷疑淨七深心淨八入密淨凡悟理淨十究竟淨十一長他功德淨十二令他解脫淨又束十二總為六德一不退菩提德二知機説法德三供佛修因德四他讚自修德五凝真照俗德六譽遠功高德配經可悉經勇施者有釋云大士了畢竟空捨身命財不生怯弱經大力菩薩等者有釋云據理釋者煩惱能令三界紛綸二乘迷倒其力最大菩薩能摧此大惡法故名大力經無量力者有釋云依理明者無相之力不以有量為名故名無量疏不樂異熟果者先業所招縱依於樹及起念等所得衣等皆名異熟今即不然變化而作名非異熟問設是變化亦遠託因復欲界中何有變化答應名異熟然似通果變起故得變化名復言言化者但業化非通化也問下二空居等所受樂具為是先有為念方現答待念方現若爾云何名為先住欲塵求耶答樂具等物雖待念現宮殿等事先即非無故亦無失疏若依後釋無四空居等者依後初釋空居但一據後第二四種總無不足全無總名無也問無縱何過答疏但舉言法華會無四空居衆不言即過或亦有過何獨空居不來聽耶疏三光天子等者問三光何攝答有云散天以恆空中散居不定議曰此答與問無不相應應地居攝雖實處空以屬四天故空地二屬地居也疏大般若至堪忍界主者頂髻光頂俱名尸棄若依般若尸棄大梵即第四梵光明同前等言但等初禪諸天及第三禪經娑伽羅龍者即天授品娑竭羅龍此從所依海得名也疏無熱惱等者依池得名離三熱惱何以知然答如阿耨達經云佛往欲池化彼龍衆先遣目連警覺彼類時目連化為妙翅而於池上鼓羽鳴觜諸龍子等驚集王所而作是言比無此鳥今何忽有按此經言鳥既不到何被食憂餘二可悉疏絞妙高令細龍之類者傳云此龍欲食帝釋等絞山令斷冀令墜海將欲食之議曰此非也或可亦通為顯般若之威力故山欲將覆帝釋知已集諸天衆處善法堂而念般若龍威自息不能為害經緊那羅者有云歌神馬頭人身能語問何道所攝按雜心論畜生趣攝經乾闥婆等者又按智度論云犍闥婆名童龍摩此云樹居在地上十寶山中若諸天須樂乃身有異相即飛上天與緊那羅番休上下問何趣所攝傳有二釋一云鬼攝一云屬修羅未見正文疏師子兒等者此亦不然非以畜生生即畜生攝如犢子雞胤部等非畜攝故卵生人等其類非一疏深於須彌者略有三釋一云量度大小不同今見猶有大小兩釋所以增減而無失也二云業力所致縱入金剛亦復何失亦猶石鐵火等中有衆生故又同中有於山等物皆不礙故三云據實海水亦深八萬四千舉其成數但言八萬如俱舍頌云煩惱八十千此亦應爾故知經論所望不同並無有爽疏化生鳥能食四生龍者問夫化生死尸骸頓滅食化生龍何有食取答鳥吞咽已未死之間能為食事或雖死已暫爾之間亦有資益疏聞小乘經等者按普超三昧經第三云阿闍世王所入地獄名賓跎羅普曰集欲適入尋出其身不遭苦惱之患問準古今録皆説此經是大乘經云何既依小乘判耶答疏隨古人且依小判何以明之答按吉藏疏云阿含經云闍王懺悔猶墮拍毱地獄得成辟支實爾大乘亦説入地獄疏聞大乘經不墮地獄者問普超經中明言墮獄云何乃違答亦依古説古疏説云大乘經力勝重罪都滅所以不墮議曰雖云順古而違經文不具指陳來誤後也疏後得柔順忍者普超經云如來為説三世之心則無形貌無所有等以何心害説是語時王阿闍世得柔順忍又云王尋逮得不起法忍問既得忍已云何墮獄答斯權現也示於後人令生恭敬問普超涅拌俱是大乘云何二説得有不同答略為三釋一普超經説隨轉理門涅拌所言據真實理二普超意明不孝過重業障難逃令生猒怖言墮地獄涅槃意顯大乘力大令其令欣慕三普超而據示相而説涅槃依實不入談之各據一義並不相違疏并客衆者古疏云聖有二種謂聲聞菩薩凡有兩衆即客舊二問何謂客衆答有云吠舍黧等並名客衆或妙音等亦名客衆議曰疏意不然古疏云經文自有經文何處有吠舍黧復云凡衆妙音非凡故知非也彼意言者經之所言餘域人天並名客衆疏以面向為前者問此經不説何以明之答維摩經等云皆謂世尊在其前即為證矣論依此義故加前後經為諸菩薩等者問上云四衆之所圍繞何故今唯為菩薩答據正所被若爾前明四衆取比丘等何有菩薩答且舉四衆實有菩薩又比丘等亦攝菩薩何以為證按智度論云菩薩必墮四衆之中四衆未必墮菩薩中疏對法十一明七種大姓等者問般若論中但列七名餘指瑜伽依撿瑜伽四十六釋與對法論義有不同云何得言名別義同答略為二釋一乍觀二論似若肝膽審而察之誠同水乳今具牒會冀令易悟疏中已具對法論文今者但引瑜伽對會瑜伽論云一法大性謂十二分教中菩薩藏攝方廣之教會云對法望彼能緣之心瑜伽據體二論名別體實不殊二發心大姓謂有一類於其無上正等菩提發正願心會云對法具牒瑜伽影顯願求菩提即自利故或亦具之欲趣菩提要起正願願中含於二義一求菩提二利樂他不興二願無得菩提故四十八云願有二種一求菩提二利樂他也三勝解大姓謂有一類於法大姓生勝信解會云法大姓者即二無我之真理也實了二理而在於智智之同時非無淨信瑜伽據彼鄰近而言言生信解四增上意樂大姓謂有一類已過勝解行地證入淨勝意樂地會云對法據總凡聖合言瑜伽約別但説聖者五資糧大性謂福德智慧修習圓滿能證無上正等菩提會云由福智故不住於二方得菩提對法據用明所不住而云方便不住生死及於涅槃瑜伽依體及所求果故云福智及得菩提互舉一邊影略明也六時大性謂經於三無數大劫方證無上正等菩提會云瑜伽明言其時所得之果影顯業用對法明言果業密亦顯時互舉一義七圓證大性謂即所證無上菩提會云開合次第雖復不同體竟不別二釋兩論七義義有不同隨作者意何要會之而使一種且如對法前五為因後二是果瑜伽前六是因後一是果故論云前六皆是圓證大性之因圓證大性是前六種大性之果故知別也餘別可悉又按大集經第七云其乘廣大故於諸衆生無障礙故是一切智善根本故無有煩惱諸結黑暗故所有光明無處不遍故周遍有眼目故本性常淨故初無垢行故斷諸煩惱一切習氣故故名大乘準此經文通攝有為無為二種功德廣如彼説疏無相不相等者略有三釋一云初相是有不相是無不者無也上一無字該下兩處應言無有相無有相意顯真如離空有二二云初言相者即有為法次言相者法實體相意言無一有為法中不以真如而為體相三云初無相者無遍計相次云不相有依圓二議曰後釋稍疏經意唯明一真法界前二義通疏最勝經典者問制伏放逸尋求理覆律論為勝何故今云修多勝耶答意云此經明於一乘會二皈一形二藏勝不言餘經亦總名勝形對不同互有勝故疏諸佛德藏者略有二釋一云定能含諸功德故而名為藏定依此經經亦名藏二云此經能含功德及諸定等經即名藏議曰後釋為勝順經論故故神力品云如來所有一切之法自在神力等皆入此經疏一出水不可盡等者有議曰法身雖在二乘濁水而不滅盡即如經言有垢真如若出水已名無垢如皆不可盡又云三世諸佛化他成佛令出二乘而佛乘不可盡即如經言以我此物周給一國猶尚不匱等又云蓮華出泥水而不捨泥水雖令衆生出二乘而不捨二乘常作二乘方便即如經云一雨所潤三草得益等疏前解頓悟菩薩等者有義談於如來法身之體出離二乘濁泥水也問先在中後超名出如來菩薩元不在中何以名出答有二釋一云菩薩等有二乘種姓今成菩薩永不取彼二乘之果亦名為出若爾元無二乘姓者何名為出既有斯妨故第二釋云夫言出者不要先入後出名出但離於彼即得出名如言岸上先在於岸及後出者但名岸上此亦應爾議曰疏中上下皆云彼經對菩薩故名無量義對二乘故名為蓮華今不可盡既比頓悟云何得言蓮華之號唯對二乘今即一釋即不可盡亦喻漸悟漸悟身中大乘體法性能出彼小乘水故後出泥水喻彼二乘後回心已用能出彼小乘水故是以蓮華對於二乘無量義名對彼菩薩即無妨矣若爾師資豈不自為魚肉答依法不依人豈以所宗曲相阿僮又疏主本意言不可盡喻大乘體性言喻頓悟且順古釋故嘉祥云前義與後義異者而有二釋第二釋云前約直往菩薩後就回心入大也又疏主問答之中言彼蓮華據未出水性能出故此據水上用能出故若以頓悟名不可盡云何未出又云彼經正對菩薩名無量義傍被二乘名為蓮華若頓悟者名不可盡云何得言蓮華之名不對菩薩豈可前後自相矛盾故知疏主前敘他解後申自義以為問答熟思應悉問若爾何故初出水義不言二乘第二方言喻聲聞耶答既取真理而以為體豈獨不定二乘有耶既通菩薩所以不得同於後義而指聲聞疏此乃所詮等者且此能詮為餘能所二詮門者待此能詮彼所詮義方得顯故此能詮法以為本故餘能詮法方因起故所詮為門翻前可悉疏二云至與此名體無二者問俱號蓮華名可無二真如行果既各不同云何言體亦無二耶答兩經蓮華俱以真如行果為體但緣彼對菩薩正舉真如此應二乘偏言行果互舉一邊實體不別有云彼理之中而有行果此經以彼行果為體故云無別有云取能依行果之體為華體即如故有云雖彼真如此是行果能所依別然以彼此各用一法名為無二議曰言即有餘理即不可若以理中行果為體彼理之中即包行果此行果中不兼彼理云何無二疏中但云能依行果名此蓮華不言其體云何言俱真如故故名無二疏言體無其二即云各以一法為體名為無二疏亦説云名無其二應亦不同得名蓮華名為無二此既不爾彼云何然又彼理為體可云一法此有行果云何名一故皆不可疏後二義釋此寬彼狹者問第五此寬理無有爽第四彼狹有多疑矣彼此皆以二法為體云何即有寬狹不同答因果之中但有理智所以名寬具如疏中明理智也疏住對面念等者面謂涅槃真如之理念即與定相應者也今意明定而言念者鄰近釋亦有聖教言背面念面謂生死定能永棄生死面故疏示聽聰明之相等者不思而説説多疏誤思已方陳陳乃審諦審諦無過故成聰睿疏發三問答者三字恐誤應為二也彌勒為問文殊為答問答合言名之為二亦有釋云彌勒鶖子文殊等問名三問答議曰理未必然鶖子等問不因定故疏如將説般若等者此答意云説般若時雖先入定定亦不名般若定故定經名別此亦同彼疏適意華等者其華之色而即不定或通四色今時所雨應唯白華有所表故同白毫等疏行四法迹者能與三學而為因迹按雜集論第十云謂無貪無瞋正念正定無貪無瞋能令增上戒學清淨不因貪恚門毀犯學處故正念能令增上心學清淨由於所緣無有忘失持心定故正定能令增上慧學清淨由定心者能如實遍知故疏截四流者按雜集論第七云謂欲暴流有暴流見暴流無明暴流隨流漂鼓是暴流義隨順雜染故疏斷四繫者按雜集第七云謂貪欲身繫瞋恚身繫戒繫取身繫此實執取身繫以能障礙定意性身故名為繫由此能障定心自性之身故名為繫非障色身何以故能為四種心亂因故謂由貪愛財物等因令心散亂於鬪諍事不正行為因令心散亂於難行戒禁苦惱為因令心散亂不如正理推求境界為因令心散亂由彼依止各別見故忘生執著謂唯此真餘並愚忘由此為因令心散動於何散動謂於定心如實知也疏四軛者按雜集論第七云謂欲有見無明四也障礙離繫是軛義又按瑜伽論第十九云一謂染汙尋思軛二不染尋汙思軛三喜樂繫縛軛四一切色想軛由此異生雖到有頂而為四軛所繫縛故於彼下地還復往生二論不同如餘處會疏五合觀説處者處有二釋一云處謂法也今既地動必不虗爾欲説何法二云處謂處所疏仁王經頌等者按彼經文總明五忍今此二頌明初伏忍初之頌明忍方便餘正明忍忍有三品銅銀金輪如次三品即是地前三十心也十善謂戒欲趣彼岸度生死流事資於戒為舟為足十善為本故先明之發心將棄名為長別非已別訖近生聖道名道種姓疏此與餘經三種姓別等者按善戒地持瑜伽唯識經論中初性後習故與般若而有異也何以故答善戒等據法爾無漏種子元有名性種姓復因修增并新所熏名習種姓仁王經中不約本種但據新熏逢緣修行初學名習習已漸增位復不退名性種姓如世説言習以成姓道種姓等亦望漸增所對不同故無有失問按十地等論十王之位不説地前初地菩薩為鐵輪王亦復不説四天王位及第三禪何乃不同答地前三十或報不定多隨業力初地已上隨願力生隨心自在仁王通依業願二力十地等論但據願力自在者説又四天王臣而非主第三靜慮極樂不苦所以十地不立王也問按仁王經云雖十千劫行十正道入習忍位習忍位者即十位初僧祇之始按本業經云一二三劫得入初住二文不同一何乖反答有二解一云十千劫者據入習忍不退位説若不爾者與迂回人辟支何別彼十千劫到初菩提如涅槃説二云且舉十千非必定爾逢緣即減不遇或增故本業經云若值善知識學佛法若一二劫方入住位準會仁王本業可悉疏涅槃面門等者面門謂口一頭之上眼鼻等孔口最為大欲表常住大涅槃理故放口光然按經文云種種光不言四色者言四色者疏主之意為顯涅拌有四德故有云光有六色云種種也而有二意一表真應二身萬德具足故云種種二表化身而必滅也所以然者夫盛必衰光既是盛顯必有滅故有斯表疏上生言舉身放光者舉猶遍也顯佛慈悲弘濟普及又明修行悉得度故或彰彌勒果滿事故言金色者顯可重也濟末代生可為寶故疏有緣皆函等者問有緣至言為屬此界為亦屬他答唯屬此界撿上下文不見他方尋光至者或兼他界故下頌云又諸萬億國轉輪聖王至故得通他疏不照無色彼無處故者問無色既許有定果色光何不照答非是一切皆能有故所以不照若爾有者何不偏照答光既被彼不可於中有照不照若爾欲色光雖遠臨中間無緣了不知見彼何不爾既有此難應云無緣故不照也疏上下括於五趣者問萬八千界一一皆耶答爾既云悉見明知齊等疏多思名人者諸本不同或作思或有作恩字既不同隨應兩釋一云是思善能思量種種善惡異餘趣故二云是恩有恩慈德勝餘趣故更撿經本疏意寂靜故者略有二釋一云寂靜體是涅槃人能求彼從所求法而以立名即有財釋二云人多無諸劇苦擾惱不同鬼等惡求多求恐怯多畏極大苦等故名寂靜議曰後釋善也理可思知問經云於此盡見彼土為凡為聖答居法華會凡聖皆見問廣慧聲聞所見不逾一三千界云何凡夫見萬八千答佛威所加故有論云定通等力即不決定故有何過疏分段變易生死者此廣有章今被時要略辨名體而言體者總二生死正取異熟第八識為體兼通餘識異熟五薀且別分段名言熏習識等五種而為親因福及非福不動三業為勝增上能招感緣一切煩惱能為發業潤生之緣由依他緣而得生故問勝鬘等經云如取為緣有漏業因而生三有名為分段不言識等名言親種一何乖反答彼等經論隱彼親種但顯增上分因與緣故亦無失變易體者即前識等五果種子皆為親因欲界福業并色不動但除無想及淨居業為近勝緣依四靜慮緣事無漏後得悲智相應定願為遠勝緣復由所知障執彼菩提有情為有而起悲願亦為斷此留身久住故所知障能為其緣問勝鬘經云無漏業因所知障緣有意生身云何得言以名言種不動等業而為其體答經隱所資但舉能資及彼能發勝劣二緣故亦無過問既有親因及所知障等何要復用無漏業為因答若無無漏無勝堪能感變易生故假此資所以須矣言釋名者分謂齊限即是命根段謂差別是五薀體捨此受餘有差別故此差別身命有齊限即段之分名為分段命屬身根依士釋或此分段俱通身命皆隨因緣有定齊限故名分段亦分亦段持業釋也由此無漏所資感故所受變易妙用難測非下劣境變易即不思議持業釋也或無漏定願妙用難測名不思議不思議之變易依士釋也疏四種生死者按無上依經以分段生死有四種難變易喻彼亦立四種四種難者一煩惱難謂無明愛取二者業難謂行全及有少分三者執報難即識等五果并生老死四過失難謂生異滅憂悲苦惱以變易四如次喻彼即所知障而為方便無漏有分別業乃為因緣所得變易名為有有以五薀上有生等故重言有有即變易上生異滅等行苦攝故更無餘果故云無有問若爾但有三種生死無有即是第三攝故若乍看似然理實不爾第三但取五薀之體由上有彼生等相故從其所有得有有名不取生等而為體也第四即取生等為體故全別也準此而言念念有四古今釋異諸教不同廣如章辨後便更敘疏七有等者五趣是所趣業及中有是能趣能所合言故但有七若爾煩惱亦為能趣無不因惑有趣果故據親者言隱疏不説疏九有情居者有情樂居有九不同名九有情居一身異想異謂取初禪成劫已來不計梵王為能生時欲界人天諸受不同歡戚有異身形彚別故成二異二身異想一即成劫初初禪天也謂劫初成梵王獨住念諸輔翼因有天生梵王念言我能生彼後來天子起宿住通知梵王念而生梵處便云我從梵王所生計能生同名為想一王勝餘劣身貌不同故名身異三身一想異謂第二禪身並相似根本有喜等未至而有捨有厭動勇而樂捨者樂厭不同故想成異或初生天子見下火災言本至此舊住天子而言不來我屢見此未曾來也來不來別名為想異四身一想一第三禪同一樂想身復不別五第四禪并四無色名之為九故俱舍頌云身異及想異異身同一想翻此身想一并無色下三故識住有七餘非有損壞應知兼有頂及無想有情是九有情居餘非不樂住此亦兼明七識住也問三塗之中及第四禪非非想處如何損壞非識住耶答夫言住者識所愛樂來處樂住住樂不離三惡道中多不愛樂設令愛生不樂住故第四禪中五淨居者唯聖所居深厭生死情欣入滅無想天中而復無識無雲等三未生樂生生已有樂求無想者非非想處有滅盡定滅心心所由斯識住但有於七三塗有情不樂住故非九情居如餘廣明恐繁不具疏僧中有二等者問二類之中有優婆塞等此何名僧答據理和説或僧者衆義故近事等亦在僧收疏由行菩薩道故入二位者地前地上名為二位即是信解相貌二也疏四攝法者按諸經論處處廣明今疏所述即瑜伽論論有九門九門多義疏撮而言不舉名因今依疏引而略展釋疏不言者今亦不具言九門者一自性愛語二一切愛語三難行愛語四一切門愛語五善士愛語六一切種愛語七遂求愛語八二世愛語九清淨愛語利行同事亦名九門一自性語於諸有情常樂宣説悅可意語諦語法語引攝義語釋曰不粗惡語名為悅意不妄語故名之為諦不離間語名為法語不綺語故名引攝語二一切愛語者略有三種一設慰喻語疏云遠離頻戚等二設慶悅語見諸有情妻子財穀其所昌盛而不自知如應覺悟以申慶悅或知信戒聞捨慧增亦復慶悅釋曰言不自知者雖有盛事自不為盛或復不知盛之所因由憑三寶福德所致三設勝益語宣説一切圓滿法教相應之語利益安樂一切有情恆常現前以勝益言而為餘益釋曰前之二種隨世軌語後勝益語順正法教三難行愛語略有三種一能於怨家以善淨心無穢濁心思擇為説如前三語二能於上品愚癡鈍根諸有情所心無疑慮思擇為説種種法教誓受疲勞如理如法如善攝取三能於諂詐欺誑親教軌範尊長真實福田行耶惡行諸有情所無嫌恨心無恚惱心思擇為説如前三語四一切門愛語略有四種一欲斷諸蓋趣向善者為説先時所應作法釋曰為説人天善業等事名先所作以無如來數數得故或為先説五停心觀名先作法初入法人初時須作此五觀故五觀初作名為先時時即初也二遠離諸蓋心調善者為説增進四聖諦等相應正法三在家出家多放逸者無倒諫誨方便令其出離放逸行不放逸行四於諸法中多疑惑者為令當來離諸疑惑為説正法議論決擇五善士愛語六一切種愛語疏略不引七遂求愛語謂依四淨語起八聖語釋曰即不粗惡等四善語名四淨語見言見不見言不見八種實語名八聖語八二世愛語九清淨愛語疏略不引利行亦九自性利行由彼愛語為諸有情示現正理隨其所應於諸學處隨義利行法隨法行如是行中安住悲心無愛染心勸導調伏安處建立略名自性釋曰隨彼彼趣以義利行饒益有情名為利行令如説行示其正理隨其所應於諸所學隨義利行法隨法行者謂教修三學問利行愛語而有何別答愛語泛説教理果法今利行中隨機正授三乘之行令其修習名為利行故二別也二一切利行者略有二種一未成熟有情能成熟利行二已成熟有情令解脫利行復有三門一於現法利勸導利行謂導以法業德招集守護增長財位由此能令獲大名稱及現法樂釋曰作諸金銀及種植等皆名為法作工巧等名之為業德謂道德由有德故得他財利或言法者謂不邪命如法求財名為法也業等同前菩薩教人以此法等三事得財故現得樂二於後法利勸導利行謂勸棄捨財位清淨出家受乞求行以自活命由此能令決定獲得後法安樂現樂不定三於現後利勸導利行謂導在家或出家者漸次修行趣向離欲由此能令現得輕安後生淨天或般涅槃三難行利行略有三種於先未行勝善根因諸有情所能行利行名第一難難勸導故於有善因現前耽著廣大財位衆具圓滿有情能行利行名第二難廣大放逸耽著縛故於諸外道著本異道邪見邪行有情能行利行名第三難彼於自宗愚癡執著於正法律增背執故四一切門五善士六一切種此之三門疏略不引七遂求利行謂見有情有八纏者方便開解令離被經纏謂見有情於應慚處為無慚纏方便令離餘七亦爾八二世利行有九種謂於有情依淨身業勸離殺生不與取欲邪行離一切窣羅若迷麗耶及以末陀放逸處酒依淨語業勸離語四過依淨意業勸離貪瞋癡釋曰身語各四意為根本三合為一故云九也窣羅若米酒也迷麗耶藥酒也末陀者蒲桃酒也九清淨利行略有十種依外有五一無罪行諸惡行者於諸善中能正安處名無罪行二不縛行於非解脫非定清淨處求為真解脫求為定清淨即於其中能正勸導名不縛行三漸次行知劣中妙慧隨次為説下中上法教誡教授令漸次修名漸次行四遍行利行一切有情隨力隨能行義利行隨類勸導名遍行利行五如應利行於請有情若於自義善法三品功能差別可勸導者及由方便功能差別可勸導者及於彼如彼方便勸導名如應行依內清淨有五利行一於諸有情起廣大悲意樂現前而行利行二於諸有情所作義利雖受一切大苦劬勞而心無倦深生歡喜而行利行三雖現安處最勝第一圓滿財位而自謙下如奴如僕亦如孝子旋荼羅子其心卑屈離憍慢我執而行利行四於諸有情心無愛深無有虗偽真實哀憐而行利行五於諸有情生起畢竟無復退轉慈愍之心而行利行問何名外內答諸依有情外緣而起立以外名依自內悲所起之者故名為內四者同事如疏略引今更不廣疏非如二乘執三別體等者如薩婆多不立真如然計智慧擇滅解脫皆別實有化地部等立善法等三種真如亦計智等三事別體身智滅後得無餘依即前後也大乘不爾問大無三事假實不同為無為別云何不異答起智斷惑證滅之時不得異時調然而別亦猶因果不即離也思可知矣問二乘解脫與佛解脫為同為異耶答亦同亦異約煩惱障惑苦而言此即同也故經依此説三乘人同解脫床若諸障盡方名解脫此即有別二乘未斷煩惱障習及所知障故經下云其實未得一切解脫疏又樂有五種等者今者略明五種體性自性樂者按瑜伽論云受樂也有漏無漏遍通學無學三界所繫所有攝益身心之受皆名受樂通有無漏喜樂捨受而為自性二者因樂論云謂二樂品謂有無漏二樂或身心二樂順樂果業及根塵二并彼能生順樂受觸並名因樂體通五薀順樂果業相應共有皆因樂體三苦對治樂論云寒熱飢渴等苦滅時生起樂覺問此樂自性為取火等能除之法為取所生受之自體答設爾何難二俱有過若取火等因樂何殊若取所生受樂何異答俱不取但取寒苦息所生樂受俱慧覺苦無有慧為其體又苦無之處義説為樂非實有之苦息之時但生捨受捨受俱慧覺無飢等故取捨受俱慧為體四受斷樂論云然依勝義諸所有受皆悉是苦滅盡定時此勝義苦暫時寂靜故名為樂即以盡定而為自體問滅盡定具止滿無漏心豈無漏心名勝義苦答無漏之心雖是所止而非是苦而言所猒而是苦者從遠所猒有漏為言問若爾有漏所猒之心乃由無漏加行心遣何關滅定而云滅定除勝義苦名受斷樂答如滅受想無為之體無間道時實已得之後時方乃得滅盡定却説無間所得無為名想受滅此亦然也勝者勝心方覺為苦名勝義苦五無惱害樂論云有四一出離樂謂出家者信戒等為體二遠離樂得初靜慮離生喜樂受數為體或取五支並名為體三寂靜樂二定已上尋伺息故名為寂靜以二禪上定為其體或四五支隨應為體四三菩提樂謂無分別智而為其體或通後智為此樂體或智所證涅槃亦為此體問遠離等三猶居有漏云何總名無惱害耶答前三能順三菩提樂名無惱害故論結云能隨順故疏以根地人下者按佛地婆娑正理俱舍謂有三度即地根人度謂越度超過之義上地利根及以上位如次超於下地鈍根及於下位以名為地根人度如彼廣明恐繁不具問彌勒望佛三俱是下云何乃言示相懷疑答不知實心名地等下能知化心名示相疑如猿等類猶知佛故若爾凡夫豈不如猿名實心惑答彌勒因滿歷事既多放光等緣昔皆曾見故能知也餘衆不爾不可為例疏離諸搆盡等者有難云按下文殊答成就云我於過去曾見此瑞今佛現光亦復如是舉古顯今即是比度復云如我惟忖即是搆盡云何得言離搆盡等今釋無違定心緣境無非現量舉古顯今豈即比知下疏科云示相籌量名為惟忖此并會訖無繁致難疏因成就等者疏主釋意文殊自成放光等事名因成就此因即是成就一切智之緣也故復言緣故總説言一切智成就緣緣字屬上論復言因者相也者出前因體有餘德釋言因成就而有二種一者正因二者緣因論言一切智成就者是正因論言緣因者相也者是緣因緣字屬下謂文殊成就一切智故見過去事故一切智即是見彼過去正因疏凡重説頌有十所由者如文可悉又按龍樹十住毗婆沙云復有六體一隨諸國法有不同且如震旦序銘之文天竺故有散華貫華二種之説二樂不同故隨彼志説彼長行偈頌以應三悟非一有解長行不了於偈有了於偈不悟長行或別聞俱迷令聽方悉故雙明之四根有利鈍利根一聞而則知了鈍根而説方乃解之五引聽者易奪言辭轉勢説法其猶將息病者回互食味六衆有前後疏頌依於文及文士者文者文字言文士者是作頌人依文及士而有於頌頌實有體復有釋云士字誤也應為上字頌雖依文取勝上文方為頌依並依小乘解疏失盧迦頌等者傳西方釋句有五類一處中句以八字成者二者前句或以六字七字所成三者後句九字已上乃至二十六字所成四者短句或以三字五字所成五者長句從二十七乃至百字或更多字之所成者隨前五類當類四句方名為偈縱是長行亦數四句名之為偈問觀今經文但十六字云何判言當失盧頌答若準西方有三十二今譯從漢但有十六如言菩提此但云覺故無失也又按婆沙句有三種一集義句二集字句三讚歎句今此頌中隨應皆有如文可悉復有釋云偈猶竭也乃此方言明義竭盡故名為偈議曰不然設此方言未必偈中皆明義盡經旃檀香風者有云雨華表生一乘之解香風表滅二乘之惑經照明佛法開悟衆者疏釋如文議曰或此二句總結於前説四辨意疏從革不違者革猶改也疏西方之行者五行之中金屬西方疏今亦聲也者金字形聲攝也疏牟婆洛揭婆遏濕摩揭婆者釋如疏文按泰法師佛地論疏云舊言車渠馬瑙然於此方無正名相當故存梵言疏杵藏者形似立名疏胎藏者業力所加餘緣不損為名之堅據實亦有墮胎等者據一邊説疏帝青大青等者梵云因陀羅尼羅目多是帝釋寶以其最勝復稱為大準此勝劣而有不同云帝大青或云帝釋居處波質多羅樹下地是此寶故故名帝青言目多者此云珠也以此帝青而為珠矣問如佛地論攝大乘論引七寶名與此不同何所以耶答良為隨方所重不同經論隨俗列名有異故無過矣疏挽者音萬同疏具七攝受等者按唯識論云要七最勝之所攝受方可建立波羅蜜多一安住最勝謂要安住菩薩種姓二依止最勝謂要依止大菩提心三意樂最勝謂要悲愍一切有情四事業最勝謂為要具行一切事業五巧便最勝謂要無相智所攝受六回向最勝謂要回向無上菩提七清淨最勝謂要不為二障間雜疏古人四馬一乘逐等者馳逐經營等也疏西域暑熱等問光中所囑乃是東方華蓋之飾自是西域何取西法以辨東儀答所照維東能照西發故舉西法以此東儀餘皆類此疏曲輈轓車耳者車轅曰輈車箱曰轓曲據形言耳助辭也或云耳者車耳即障泥也疏不應施等者倚宮形勢盜劫活酒屠殺得財皆名不淨酒毒藥等名亂衆生置羅機網名惱生物刀弓箭等為害生物音樂女色名壞淨心皆不應施問何故經云及妻子施令他離背即惱所施損壞淨心復敗受者何成檀度答菩薩與彼妻子等類必先立契若有求者施請不違有此誠言許施無過如須達太子施妻子事若以女色之意而貽於人固成譴纍若隨求即與不為失也疏復作後時因為今好施熏修之力令於來生施不息絶名後時因疏施中應起四智者念此資財五家之分而不堅窂虗失無功不如惠捨能致大益名覺悟智念餘貧者衣不蔽醜食不充飢我方於彼猶以為勝縱少飢寒當須忍之可咸以施名忍苦智念斯玉帛由我妄情見之為好理實非然若不爾者諸聖者等易不愛此縱畜生類亦不貪樂故知妄愛實何所貪而不惠施名知倒智念彼三界悉是泡幻何乃願求以我所施願求菩提堅固之體名不堅智問雖願求於堅固之體有實因此得彼體耶答有按新華嚴經頌云昔於衆生起大悲修行施等波羅蜜以是其身最殊妙能令見者生歡喜夫行施等皆須回向回向何德而須作耶答按大般若經云譬如真金若時若時鍊燒打爾時爾時光色轉盛若時若時光色轉盛爾時爾時展轉調柔堪為器具如是菩薩若時若時以所作善與有情共回向菩提願同證得一切智智爾時爾時善根轉盛若時若時善根轉盛爾時爾時展轉鄰近一切智智又按舊華嚴經云回向者何義永度世間生死彼岸故説回向又大般若云若以無所得心而為方便與諸有情回向菩提所得功德於彼異生二乘諸福業事為最勝等何以故以二乘等但為令己自在安樂為自涅槃菩薩回向普為一切有情調伏寂靜涅槃經我見諸王剃除鬚髻等者問人之所重莫過寶位今捨黃屋入彼緇林棄諸俗儀受僧禁戒有何勝利見斯救擯答因茲戒本壞捨幻身得金剛體能拯物危自離諸難按新華嚴經頌云昔在無邊大劫海修治淨戒波羅蜜故獲淨身遍十方普滅世間諸重苦舊經云若時淨戒順正教諸佛賢聖所讚歎戒是無上菩提本應當具足持淨戒又涅拌經云一切衆生雖有佛性要因持戒乃見佛性得成菩提又云如金翅鳥能噉諸龍唯不能噉受三皈者又大般若經云以無所得而為方便修行淨戒如是淨戒能滿淨戒乃至般若六波羅蜜有斯勝益故捨王位猶若脫履疏思惟法義諦密法忍舉偏説者問何以明之答按金剛般若經若人以百千萬劫捨於身命不如受持一四句偈捨身命者即安受等忍故知勝劣由來異也問當以何念能發於忍答當念忍力能致菩提不忍為因諸根不具不能辨諸成有情事故大般若經云我若不修忍波羅蜜當生諸根殘缺容貌醜陋不具菩薩圓滿色身若得菩薩圓滿色身有情見者必獲菩提若不得此圓滿色身則不能成就一切有情嚴淨佛土況當能得一切智智問作念可然頗有因忍實成佛耶答按新華嚴經頌云往昔修行忍清淨信解真實無分別是故色相皆圓滿普放光明照十方斯之為證疏精進有五者如文具辨又按大集經云勤行精進凡有四法一者發心二者作心三者觀心四者如法住如是四法即是具足佛法因緣何以故發心者即是生善法因作者名為增善法因觀者名為利衆生因如法住者名入一切佛法因緣問人多懈怠以何為心即能精進答當作念言不精鋭者失諸功德若勤勤者能證菩提利有情類奚不勗勵而修習耶故大般若經云我若懈怠不起精進尚不能獲菩薩勝道何由成就一切有情嚴淨佛土況當能得一切智智以此為念即可精練能致作佛故新華嚴經云往昔勤修多劫海能轉衆生深重障故能分身遍十方悉現菩提樹王下經安禪合掌等者問入定安寂云何復言以千萬偈讚諸法王答有二釋一云此之菩薩皆已登地不起滅定尚現威儀餘定讚歎故亦無爽二云安禪者乃是梵言語尚略也具言安禪那此云合掌譯經之主遂於宜便梵漢雙言言安禪合掌之安禪之言乃非定也下言讚歎亦無失矣問廣運三業二利長修寂靜間居曷有多益答心猶野馬意若嚴後制之一處無事不辦故大般若經云是諸菩薩入色無色定寂靜安樂但欲引發自在神通與諸有情作大饒益亦欲調伏粗重身心令有堪能修諸功德又新華嚴經頌云佛久修行無量劫禪定大海普清淨故令見者深歡喜煩惱障垢悉除滅廣有多能故須入定疏經復見菩薩至擊法鼓者慧度也問所有六度孰為優劣答據無相理法性而言亦何優劣若依聖教功能而説智為群首今略言之一能為善母大般若經云能與一切善法為母一切二乘菩薩諸佛所有善法從此生故二能御五度即彼經云如善御者駕駟馬車令避險路行於正道隨本意欲能往所至甚深般若亦復如是善御一切波羅蜜多令避生死涅拌險路行於自利利他正道至本所求一切智智三能滅諸惡舊華嚴經頌云譬如伽陀藥消滅一切苦智慧亦如是除滅諸癡冥又大般若云若有菩薩安住般若關閉一切險惡趣門不受人天貧窮下賤四能成正覺舊華嚴經頌云勇猛勤方便能盡海源底智慧力如是究竟諸佛海大般若云安住般若速能圓滿一切智智又華嚴云如來住修諸行海具足般若波羅蜜是故舒光普照明克殄一切愚癡暗經為衆講法者問夫説法者如何安措得為為善説答善調三業能離毀息偏儻情棄貪求志斯即可為善説法者故按大般若經云是菩薩謂隨所化多為愛語含笑先言遠離頻蹙發詞有義能稱如實諸有所説不欺侮人所言決定種種樂説以柔耎語令衆歡悅容色寬和使他親附隨義而説聞者悟解為利益故稱法相説平等為説心無偏儻離虗妄言作決定説種種樂説隨衆根性由此因緣令衆歡喜又大集經云凡所演説不為飲食至心演説説時不輕亦不自高為出善巧所聞不失問名字執著至人明誡法本離言正典咸載今啓講途豈不𭿺盾答據真諦言復除其病非無執言皆制不説不爾吾徒將何以悟故按舊華嚴經云如寶在暗處無明故不見真諦無説者雖慧莫能覩由斯宣説益無窮矣疏謂四正斷等者一能制惡法名為律儀初修有漏精進制彼已生惡法令之不起後修無漏斷彼已生惡所熏種二種並名律儀斷也故瑜伽論二十九云一律儀斷謂於已生惡不善法為令斷故生欲䇿勵二未生惡法有當生義為令彼現當不復生故斷彼種種現兩亡故言斷斷即瑜伽云於其未生惡不善法為欲令彼不現行斷為斷故斷故名斷斷又令永斷令不起現重言斷斷又由初斷斷於已生今并未生故言斷斷三未來之善生必能有斷所斷德故數精進令彼得生因修習故通斷得生故名修斷故瑜伽云由於善法數修數習先所未得能令現前能有所斷故名修斷四已生善法若無放逸能斷所斷為護彼善而勤精進令有所斷名防護斷故瑜伽云由於已得現前諸善法中遠離放逸修不放逸能令善法住不忘失防護已生所有善法能有所斷名法護斷問四斷之體其法者何答尅體斷精進故對法論第十云正斷自體者謂精進問夫言能斷尅性唯智云何精進而得斷名答由緣所斷之法而起精進是故精進而得斷名故對法云初二正斷緣彼已生未生所治惡不善法以為其境後二緣彼未生已生能治之法而以為境故從所緣以立斷稱經惡罵埵打等者按大般若經云若有人來埵打訶罵菩薩應作是念殑河沙可知數量我身過患難可得知謂無始來發起種種煩惱惡業違害理事諸佛賢聖共所訶毀今此人來埵打訶罵百分千分乃至塢波尼煞曇分未得其一如何緣此應生忿恚觀如是義而能忍受都無瞋忿怨恨之心又按出曜經云忍心如地猶如此地受淨不淨不作是念捨是受是智者執行亦復如是若有歡譽不以為歡有數辱者不懷憂戚見善不喜聞惡不怒是故説忍心如地也以此為心故能安受打罵之苦疏如彼三類説不二義按維摩經三十三聖明不二義分為三類第一類者前三十一菩薩同説以分別執名之為二無分別理名為不二智會此理名入不二第二類者文殊師利以彼言説名之為二離言法性名為不二智達此性名入不二第三類者謂維摩詰假智言説俱名為二法性真如名為不二正智證智名入不二問準前三十一菩薩説各不同云何總合為一類耶答觀文似異據理乃同故為一類廣如彼説疏俱舍頌云極微金水等者又按佛本行經第十二云凡七極微成一客塵合七客塵成一兔塵乃至成虱皆同俱舍七虱成一芥子七芥子成一大麥七麥成一指節纍七指節成於半尺兩半成一尺二尺一肘四肘一弓五弓一杖二十杖名一息八十息名拘盧奢八拘盧奢名一由旬注云依隨類數討得二百八十四里一三十步問何故不同答略為二釋一國法前後改張有異如今斗尺望古周時大小全異二五天竺境土俗不同亦如今此河南河北關東關西尺步等量亦全有異彼亦應爾譯經之主隨當國言故參差也亦非有過復有説云或四里或一驛地名一由旬皆準斯會縱譯經人是此間者亦隨彼方一國境法疏不爾此洲詎安多塔者問今所明塔乃是光照東土之事何得難云此不安多答雖東西別報化佛境佛佛相似舉此化境不堪安多返顯彼方明是報域疏如天樹王其華開敷等者有云釋難而外難云若由造塔國界嚴好本徒嚴國何關供養故為釋言如樹開華本為結子不欲榮樹及其華發樹自嚴好造塔亦爾疏是今時因菩提因故者問文殊今現處王子位云何説因是今佛因答為二釋一據妙吉祥今實成佛名今佛因二者約彼大三世説往行名去成佛名今佛身已後所有未來總名未來雖未成佛形待約世故亦名今復有釋論云妙光之前未能為衆敷闡斯典然所修行是後説因名為因相為妙光身聞法華已能為衆説稱之為果議準曰此後釋所見果者即是過去因之果也然望論意後釋亦得疏三轉嗣對者謂嗣繼嗣攝佛法輪令不斷故疏住外凡位者此有二釋一云十信已前名外凡位已後名內二云十住已前名為外凡已後名內菩薩本業瓔珞經云佛子住此地者所得福德過外凡位百千萬億由此故知已前總名外凡議曰前雖無證理亦可通約未入彼四十心位立以外稱問何故本業説十住外名為外凡答以十住外未入三祗根本位故故與外名前解約彼方便根本皆異已前未發心故總名為內言破疑者破彼三乘新舊二疑故下經云諸求三乘人若有疑悔者佛當為除斷令盡無有餘疏令入聖等者故鶖子言疑悔永已盡安住實智中當必證入聖實智故疏二密境界者説二乘權菩薩為實唯佛能知非餘所測甚深難解名密境界或與二乘授佛記故故智度論云法華經云二乘作佛名祕密法或是世尊密意而説名密境界定性二乘實不作佛今奄含説名之密也議曰據二乘記引智論證釋密無違何名為二此論自言菩薩聲聞二種密故準第三釋亦只一密不得稱二思之可知故初釋善然八大義總分為二初之六種為令衆生自得作佛即自利也後之二種令他聞教而證圓果即利他也初中復二初五辨因後一明果第二利他亦分兩種初之一句為物演教後之一句令物證入疏古攝論至三十五劫等者按今攝論及餘經論未曾見有三十三者恐此方古德以意定之疏多依五種者論中雖説有五種劫不言此經上下之劫皆依五説疏云多依五種劫者取論意釋亦不決判但依五種如下授諸聲聞等記不必取此月年等劫至文更會疏涅拌經云如來等者又按出曜經説而有四義一依過去佛來經云如過去等正覺來吾從彼來於三阿僧祇劫執行勤苦故名如來二從二利來經云或施國財妻子頭目髓腦能自拔濟從中來故故名如來三從法性中來經云復從法性就世間義故謂如來四如諸世尊依德而來經云如過去諸佛具足十力四無所畏十八不共殊勝之法大慈大悲廣度一切不離如性我今亦爾故謂如來疏羅漢是共德等者問按瑜伽云應正等覺名為共德非獨羅漢今疏所判乃乖本論答略為二釋一疏撿文誤二言共德者有二種共一三乘共二諸佛共言羅漢者三乘共德斷煩惱障同證生空正等覺者諸佛共德斷所知障同證法空故瑜伽云應正等覺謂永解脫一切煩惱及所知障論文雖總理有斯別疏主約彼三乘共德是以偏指非是疏主撿文誤也有餘釋云二空之理諸佛同證名為共也明行等德並是有為諸佛各別名不共德有為體異屬各別故疏遮行行者如彼根戒防護根門名為遮行三業造修亦為行行疏四種增上心等者謂即四禪增上心法現樂滿也四體疑湛故名名住也疏此二是行行攝者即前行行住行總名行行疏由此如來至遮自苦者牒彼論也疏言此中不造過等疏主釋也由不造過釋三不護言密護根門故無忘失者由護根門所以無忘失世間靜慮遮苦行等釋前住行佛所得定雖唯無漏以有為法亦名世間由得此定現法樂住顯異未得忘勤苦者名遮苦行復有釋云遮行行行總名行行四增上心名為住行故瑜伽云前是行行後是住行論云由此二種顯示如來三種不護無忘失法者釋由行行故顯三不護由遮行故顯無忘失論云由不造過世世間靜慮等者釋世間靜慮而是樂道外道造作所修苦行名過靜慮今明如來由不造彼過世靜慮所有苦行名遮自苦議曰二釋異者餘德據論初標次第故攝遮行行行總名行行疏主依義據釋次第攝住行行行總名行行論云不造過者餘德平聲而釋過義疏主去聲以解過義各望義殊俱有所以今詳論云由此二種顯示如來三種不護無忘失法由不造過世靜慮等者如次顯彼行行遮行住行三也疏三不護等者問三業無非即云不護諸根無過何須密護答無罪覆藏名為不護諸根無非如防護者不起於過名為密護非是如來加意守防名為密護疏於四諦至如次配者問苦集世法能解之智名世間解滅道非是世間之法能解之智非世間解答滅道能治解此世間能治之法名世間解若爾二空能證所證亦能治世何故不説答約通三乘但言四諦復有釋云自性因緣義同疏釋云愛味者即過失也由愛味故起諸過失過患者離欲行也由見過患故能離欲能趣行者由見於前生死之中諸法自性因緣愛味過患等已心便猒背起趣三乘菩提等行名為趣行過患所離出離能離故為一也疏由此復釋者瑜伽論中有此二釋古又釋者與後釋同暗相會也未必古人見瑜伽論疏一初善至後善等者有釋如次配聞思修三種慧由教之力能生慧故疏謂極究竟至離欲為後邊者此論文也法性離垢等者疏主釋也言法性離垢故者釋極究竟離諸垢言能學之者至得果離垢者釋及一切至為後邊言能學究竟明有學人修行究竟等者明無學也有二釋一云離現行垢故名謂極究竟離諸垢斷隨眠故名及一切至為後邊此由教力能令聞者生四智等斷現種也二云初簡外道暫能伏惑非究竟斷名究竟離諸垢也後簡外道不能離彼非想地惑名一切究竟離欲為後邊疏及八語具皆圓滿故者按瑜伽二十五云一先首語趣涅槃宮為先故二微妙語謂清淨聲如迦陵頻伽鳥聲故三顯了語謂文詞善巧故四易解語巧辨説故五樂聞語豐諸義味令樂聞故六無依語不為規求名利等事發語説法故七無違逆語隨彼意樂多少説故八無邊語廣大善巧故當知此八略具三德一趣向德謂初一種二自體德謂次二種三方便德謂後五種疏七圓滿等者所度無邊名無限量能度之者超過一切名為最勝疏八清淨謂自性解脫故者自性解脫是本論文疏有二釋一云一剎那解脫等者約時以釋法一剎那自是解脫或復如來一剎那聲而説之時法亦解脫二言法自性解脫據體自釋復有釋云謂在學位無漏之法名自性解脫疏謂相續解脫者此本論文疏亦兩釋初約相續亦有二義一據法體自相續説二依如來相續而説二約學人復有釋云在無學位名相續也疏十梵行者復有二釋一云煩惱等法名為非梵八聖道支能離彼故故名梵行二云此八道支從彼如來梵音而生故名梵行疏如觀碁等者有人執斧行山中見二人碁碁可一局斧柯摧然爛盡又按異苑昔有人乘馬山行遙望岫裏有二老翁相對樗蒲高巖懸竦遂下騎造焉以䇿柱地跪而觀之自謂俄頃視其馬鞭摧然以爛顧瞻其鞍下骸骨枯朽既還家無復親舊舊居荒廢明比久盡仿偟靡寄一慟而絶又按東陽記晉中朝人有王質嘗入山伐木至石室見童子數人彈琴而歌質留跂斧柯聽之童子以一物與之狀如棗核質取含之便不復飢小停止似俄頃間耳童子語曰汝來久何不速去承聲而起所坐斧柯摧然爛盡既歸去家數十年稚子幼孫皆成耆宿親故雕落無復時比復之二事雖非疏引延促義同故因言也疏沙門至此云功勞者按佛本行經釋有斯義也彼頌釋云福德積聚捨諸非此世彼世知無惱一切生死除滅故得此證者名沙門疏化身報身至可言諸佛者一報土中有多化土據化土説言諸佛土一切動也疏梵云吠琉璃者復有釋云言琉璃者從山為名謂遠山寶即須彌山也此寶青色一切真寶皆不能壞亦非煙焰所能鎔鑄唯是神鬼有通力者能破為物或云是金翅鳥卵㲉此寶鬼神破之以賣與人疏水精至土地辨者議曰非必五天皆無氷也按西域傳雪山多雪嚴凝寒苦特甚餘處何得無冰若據大綱多分而説彼實炎暑無氷可爾然疏主以玄應法師一切經音作斯判故故隨彼言非實許爾疏百劫修相好歎弗沙佛者問百劫之中處在幾劫見弗沙佛答第六劫也何以明之答按佛本行經云我念往昔有如來出現於世名曰弗沙時彼佛在雜寶窟內我見彼佛心生歡喜合十指掌翹於一腳七日七夜而將此偈讚歎彼佛偈言天上天下無如佛等彼佛便記汝於來世過於九十四劫當得作佛號釋迦牟尼既云過九十四劫故知處在六劫逢弗沙佛也若爾何故有經説言讚弗沙佛超於九劫復言九十一劫而得佛耶答乃應諸教見聞不同故有斯異問本行經言過九十四那知即是在第六劫答據不超合當第六又釋準言過於九十四劫餘之六劫即是所超此即百劫之中初劫逢也疏二淨果者成佛為一度生第二方便品疏第三疏行竦者竦謂敬也可謂息惡務進善也故國語云竦善抑惡廣雅云竦上也謂高上也行能崇善上升故云行竦有本作疏傳釋云疏謂疏條扶疏行能疏條而長果法雖有斯理無文可憑故取前義竦字為正疏蓮華但説二義因果故即智詮者此意説云論既但説教理二種名為蓮華故今此間亦以教理而為蓮華為因為果言智者理言詮者教疏蓮華二義至無爽道理者論中蓮華雖喻教理解無量義經然彼論云出水開敷因果之上理亦得有故取蓮華況於因果亦不失於開敷通理議曰初之一釋依論以明而非是正第二雖正然據勝言亦非盡理第三釋者盡理正也疏佛智有二者泛明佛智有斯二種疏實法亦二者夫言智者必有其境欲明真智故舉境也疏實智亦爾者智依境起實境既二故智亦二上標二智此文之下釋上真智本意欲辨方便之體若不對真而以形何法得名方便故先舉真後明方便疏對知妄知等者瓶軍林等名之為妄即是第一世間世俗執情計有據體是無名之為妄智能知妄名知妄智智非是妄疏對知事智等者謂三科等名之為事即是第二道理世俗隨義立彼三科等法事相顯現差別可知名之為事疏對知相等者謂四諦等名之為相即是第二證得世俗染淨因果而相可知名之為相疏對知詮智等者謂二空門名之為詮即是第四勝義世俗聖者之智依此空門能顯真理名之為詮疏此之四種實智者實智體一所對有四能對實智故得四名非體四也疏餘四所對至俗智者此之所説能對所對真俗二智餘聖亦有今者疏意唯明如來真俗之智佛後得智能知四俗名為俗智疏對智權智者佛後得智知二乘權或可二乘自所得智名為知權解權乘故名為知權權言乃是大乘談也非彼自悟二乘為權或可回心亦知是權然疏本意但取如來知權智也疏若依趣入至俗智者第三真者親能趣入第三俗智理即不然故真俗別若爾餘俗亦非趣入何故不對但對第三答前二俗智全非證真之方便故第三俗智緣四諦理可是趣入之加行也親疏不同故二相對疏謂見道前七方便者一五停心觀二別相念處三總相念處四暖五頂六忍七世第一法五停心觀者一修不淨觀治四種貪一顯色貪緣青瘀等作不淨觀而以治之二形色貪謂見舉容形貌美好生貪心故緣於爛壞被食等相而除彼志三妙觸貪觸身細滑而生貪著觀蛆蟲等用遣貪心四供奉貪謂祇奉合儀歌儛悅意因生染心當觀死尸不能舉動將對治之二修數息觀為除散亂然有六因而得圓滿一者數謂繫心入出之息唯念憶持入出息數從一至十不增不減恐心於境極聚散故若十中間心數亂者後應從一次第數之終而後始乃至得定二者隨謂繫於心緣出入息不作加行隨息而行念入息名至何所謂念息入為行遍身為行一分隨彼息入行至喉心乃至足指念恆隨逐若念息出離身為至一磔一尋隨所至方念恆隨逐三者止謂後繫念唯在鼻端或在眉間乃至足指隨所樂處安止其心觀息住身如珠中縷為冷為暖為損為益四者觀謂雖觀察此息風已兼觀息俱五蘊等法以為境界五者轉謂移轉也緣息風覺安置後後勝善根中乃至世間第一法位六者淨謂後外進入見道故或至盡智名之為淨三因緣觀為遣愚癡謂有衆生迷內因果為引譬類近指世間穀種等因牙莖等果生生不絶開曉彼意況彼內身決有因緣無明等因老死等果彼由觀此復得入道四慈悲觀破瞋恚者令觀衆生如己子想五界方便觀治著我者觀此一身因十八界和合而有本無有我停者齊也五經之中隨觀何者皆得入道二別相念者別別作彼四念處等三總相念者通觀念處四諦等上作彼苦空無常無我四種觀也四者暖法謂總相念後順決擇分初善根生名為暖法是彼聖道火之前相立以暖名即此善法觀彼四諦十六行相五者頂法謂暖法後有善根生名為頂法動善根中此法最勝如人頂故名為頂法觀行同前六者忍法謂頂法後有善根生於四諦理能忍可中此最勝故又無退墮故名為忍下中二忍觀行同頂上品忍者唯觀欲苦與世第一相鄰接故七者世第一法謂從上忍無間而生此有漏故名為世間是最勝故名為第一修一行相唯一剎那亦同上忍緣欲苦諦略辨所要廣如俱舍恐繁不具疏蒞真入俗者蒞謂臨也謂後得智反影緣如不能親證名之為蒞親緣於事名為入俗疏十地云總至壞者按十地論云所説十句中皆有六種差別相門謂總至壞總相者是根本入別者餘九入別依止本滿彼本故同相者入故異相者增相故成相者略説故壞相廣説故如世界成壞餘一切十句中隨義類知者釋曰佛地經中歎菩薩德有二十句論釋前十名十種入復依本經總同等六辨上十句由依初入有餘九故故第一入名為根本根本攝末名為總相別相可知即前十句同名為入故言同相者入故一一入中更有異義故異名增若成劫已四大等聚成山等物如一山中略攝多物故以成劫喻於成義劫壞器散四大散廣故借劫壞以況壞義然有即以成壞劫事名成壞者理全不然論自説云成者略也壞也廣也如成壞劫既置如言明取喻也又按彼論第三卷云菩薩善知諸地成壞如是次第集故成散故壞疏主引此六種法者意取六中少含多者證此所立集成方便問總同成三而有何別別異壞三又復何殊答總約體義苞含於十同偏據名成隨一一所成之法略談盡指別依別九對一總明異據九別一一增壞隨所應一一區散廣分別説故六有分比講讀者至於此文種種摧存皆非本旨故今具出意袪前惑疏又趣婆羅奈等者證語方便議曰執持糞器説九部法身語別陳趣波羅奈等身語雙説而言趣者即是身業轉四諦法語業所攝疏外已為便者略有三釋一而疏自身稱為外己此顯菩薩親於外物疏自己身二外謂他身己謂自體利益於他而同自己三外他己自合斯二益名之為便疏濟人法益者濟人者即利有情益法者令法久住亦方亦便者謂彼善巧波羅蜜多有彼方便二種之義名亦方便持業釋也亦如無性釋大乘言亦乘亦大持業受稱疏乃通三釋者按下顯上及以通彰為三釋也疏合是十二方便善巧者按下顯上通彰三合便攝瑜伽十二方便疏為成後四後修六種等者後六隨義通成前四不以後六別成前也有言別成非論本意疏隨順會通者隨順謂先順所化人現暖笑等會通謂釋前人所疑疏一切諸法至如幻夢等者此出外人所迷之經總有五句一無自性二無有事三無生滅四等虗空五如幻夢疏但牒四脫如虗空疏彼經不説至自性者會第一句經意不説依他圓成一切諸法總無其體名無自性但説遍計所言自性而體無有名無自性若爾但無遍計一種云何經言一切諸法皆無自性答能遍計心執彼彼物所以遍計亦名一切疏據第一義非無其自性者會第二句雖有依他圓成二法所言説事然依此事起遍計言如此遍計言下所説法之自性如兔角等據第一義如遍計言所執之性理即無也故言無事非言依他圓成二法亦名無事疏既彼性事至有何生滅者會第三句前説性事皆計所執本無有體體既是無何有生滅皮之不存毛將安附第四如虗空義疏略不引按彼論云譬如空中有衆多色色業可得容受一切諸色色業等者依他圓成喻如於空遍計所執似色色業由迷依他圓成二性執有定性若人若法如依於空有色色業若除於色及色業已虗空顯現如除遍計我法二執真如二理清淨顯現故説諸法如虗空等即三性法並如虗空廣如彼文有喻合結三種差別疏又如幻夢至故説如幻者會第五句明彼遍計所執之法非如倒情妄計之法如實顯現亦非遍計所依依他都無自性此依他性但如幻有疏究竟清淨等者明八相成道如下廣敘疏其能所詮至智為性者此會違也外有難云前釋名中便通教理何故出體但唯取智故釋云由因後得能起教理故但取本又能所詮體性各別所以但取智為體也疏觀無量義處定名實智觀者問觀者是慧今明於定何故舉慧答有二釋一云觀體乃是定相應慧慧強定劣舉相應慧以彰定名鄰近釋也二云觀者定行觀境五別境中定慧之境皆名所觀舉所觀境標能觀定議曰前釋為勝縱舉其境但應言觀何故乃稱如實智耶故前釋正復有餘德而釋論云以如實智觀者鑒明鑒明謂知病識藥從三昧起者以知藥審病既竟應投藥時至故從定起議曰觀於論文後釋親也所以然者論既説云以如實智觀從三昧起明如實觀乃是起定之所由也若如疏解如實智觀即是其定何須更言以如實智從定起耶智者應思疏二乘不知亦通此二者通教理二疏餘別屬理教者難見覺等別屬於教五種甚深別屬於理疏以阿含深即昔三教者問若依諸教五種甚深唯依真如疏中何故唯會於教不會餘三答以阿含深經自標歎所以偏云疏由此有故餘三自成者問云何由智性智相餘三得成答既有智慧同時心所即是其果智慧要因教萬行生即有同也智不孤起必依於境所以有二三必有也疏其後二番至一處明者謂第二番解彼方便知見念觀三句説已次復更釋方便等三為第三番故疏結云後二番中初之三義一處明也兩番釋彼前三句已後方釋彼第四言詞還為兩番屬彼三解之中第二解也第二屬彼第三解也結意可知疏往成就謂八相成道等者按大般若云由方便善巧威力為有情類示現入胎乃至涅拌種種化相一入胎相如疏具引二嬰兒童子相有下劣有情善根少故不堪見佛成無上覺轉妙法輪菩薩為彼示現嬰兒及作童子後宮遊戲菩薩若作餘像説法後宮女人則不信樂是故示現嬰童子三出家相者有高行人尚能離俗菩薩為彼示現出家四苦行相復有天人作如是念端坐受樂不得聖道菩薩為彼示現苦行亦為降伏苦行外道示現種種難行苦行五成道相復有天人長夜發願菩薩行詣菩提座時我等天人常獻供養菩薩為彼詣菩提座無量天人既供養已一切獲得菩提因緣六降魔相復有天人作如是念惡魔外道障礙正法願得菩薩坐菩提座降伏惡魔及諸外道有正信者皆令見法為此有情坐菩提座七轉法輪相有天人等作如是言願見大師成一切智一切相智無師智自然智是諸有情雖不求出離而根性純熟是深法器為是有情示現三轉十二行相無上法輪八入涅拌相復有天人樂聞圓寂菩薩為彼示現涅拌議曰疏開嬰兒童子為二不説出家然按彼經如前所引恐經本不同疏引差互更勘諸本攝論等明恐繁不引疏下解此與第四別者論第三番復解此第三種種知見第四言詞二種別也至下疏文亦自釋也疏本末因緣者隨彼所説一切諸法本之與末非局一法疏此六釋中回邪入等者有餘疏本而言四釋亦有言五皆悉誤也疏初牒論解云示現外道邪法諸佛正法即是第一第二回邪入正疏復説云方便更有四番并前為六總為三對一回邪入正對二進善破惡對三自悟悟他對疏著地者問其滅定者身證不還方乃得之如何得言見戒取等執此三昧答略有四釋一煩惱見戒不還等無所知障者非亦不有二未得聖前聞此滅定起見戒取執之為勝而學修證實凡夫也三文總義別雖復總言執此三昧竟説外道及俗類等以見取等執自所有非想等定非是聖者有得滅定而起此執四隨轉理門如薩婆多亦於解脫戒等起執取也議曰前之二釋教理無違第三雖通然但意準第四難悉無有明據疏緣無量境等者按大菩薩藏經云大慈無量者謂諸菩薩行菩薩道為菩提故盡衆生界慈心遍滿所謂盡虗空界是衆生量如虗空界無所不遍菩薩大慈亦復如是無有衆生含識種類而不充遍此即境界及行無量文按雜集總有五義一所依止二所緣境三者行相四者自體五者助伴靜慮為依有情為境願與彼樂相應為行相定慧為自體諸心心法為助伴疏平等欲令離諸惡故者言平等者顯捨行相雖令衆生捨離諸染亦名為捨然以平等而辨捨義或通二義故無性論云捨謂棄捨令捨隨眠又處中住説名為捨疏出體性等者問雜集乃以定慧為體今何不同答對法論依引生通體疏依顯揚涅拌經等約別對治別出體也答望義別亦不相違疏無緣慈等者問作真如相何名無緣答無緣謂境體即真如法性離言體無起盡一切諸相名之為無前第一二有情及法亦是境也疏初三安樂後一利益者但令離彼貪癡等惑故名利益未必即得調適安處不名安樂安樂利益義不同故前三安樂義準可知若爾何故無性攝論云捨無量者欲令有情獲得利益及安樂耶答有是利益不名安樂有是利益亦名安樂疏依偏句論依俱説亦不相違疏與一切種利樂等者略為二釋一云屬能利人由所利生而非一故故能利功而亦非一名一切種二云屬所化生所利非一名一切種議曰後釋雖通前釋為本以佛名為一切智一切種智故疏因果相當名之為處等者又按無性攝論云處名所以有所容受若無所以無所容受説名非處謂無處無容諸衆生類無同惡因而當得有疏淨不淨果至名為處者釋曰淨業是生樂果之處不淨業是生苦果處自在天等名不平等謂外道類計自在等能生諸法為諸法因所生諸法優劣不等正法責云既因是一果何差異為斯毀彼名不平等疏如實轉因者釋云如實者稱實之義轉者起義要由如實自起善惡以之為因生樂苦果非同外道不平等計故可名處疏本名云如轉變因是草誤也疏此定通漏無漏故名雜染等者此乃依總漏無漏判然委説者染中有二一者為障礙雜染故論云得所未得中彰礙雜染謂無方便善巧加行及蓋隨一現行釋曰為求靜慮起加行時無方便故及以諸蓋間雜生故二者自地雜染已得所應得中自地雜染謂煩惱纏及以隨眠者釋曰雖離下欲得靜慮等仍為自地纏隨眠染不得清淨言清淨者論云復有四種與上相違應知其相者釋曰一善巧純淨謂善巧行及以諸善純淨現前二離纏隨眠謂離現纏及種隨眠所起定等一向清淨三解假立謂依靜慮等引發種種功德隨彼功能假立名字四解清淨又即如是諸靜慮等具證得已後更勝進修習圓滿得隨所欲及無雜艱得無硬澀是名清淨疏根者信等五根者問為唯此信等五根為更取餘答此中唯明入道根故但取信等若也通説生死根等即二十二根悉皆是也疏八十千行者即八萬也且舉成數具而言之八萬四千界者即因是種子也疏諸趣門中等者此所知行總有四種一者謂遍趣行如貪行者修不淨觀等二者罪福不動趣行謂順五趣之行三者朋黨各各趣行謂相違見行四者或餘一切品類差別此世他世無罪趣行即彼三乘及不定性於三世中起趣涅拌無罪之行疏文如次有四行也問遍趣行力能知是非與處非處智力何別答彼知境寬此遍趣行但知諸行能有所趣處非處力非但知此亦知餘法所謂海渧地塵有情心所真偽等事如是無量皆處非處力所通達疏二生類者剎帝利等是疏三種姓者謂此是我父此是我母等疏長壽至邊際者壽命至老名為長壽壽命更多名為久住盡業所感長短之命名為邊際疏略六行者八言説中後三合一同是壽量故但有六八言説句是過去世曾所起者能詮名等六略行者是前八六所詮行也問菩薩亦得此十力不答亦分得非圓滿也若爾云何名為漏盡答全盡分盡俱名盡故或可知他漏得盡故或八地上漏永不行亦名漏盡疏我於此難正見無由者按對法論云我於是事正見無緣義意相似於諸謗難見無實因能難於我名見無緣緣即因也又按瑜伽云如來於此能為對治諸謗難中都不見有如實因相釋曰都不見有真實道理能為難相疏邪行鄣諸聖道等者復有釋云煩惱障道有其二種謂見道煩惱障於見道修道煩惱障於修道初果已得見道煩惱畢竟不行未具修道所以仍起妻子等愛疏説出離道等者疏中具釋復有釋云羅漢道滿盡來生若畢竟不受現身病苦等酬於前業仍須受之議曰疏中初釋於理最勝經中復有示現事故經中明言是羅漢故疏內未伏除至名觀外色者此蓋疏主釋彼論意非論正文內謂自身見者乃是能見假者即於自身有色想貪名為色想由於內身未除此想故作初觀而以除之問於內起貪何故觀外不淨治之答外易內難復因外塵內貪不止由斯觀外息於內染疏今則不然者問雜集亦云於內未伏見者色想疏主取之以釋俱舍何得復云今不然耶答未伏少同光明不淨故有多異疏初習業者等者問按本論云於內未伏見者色想或現安立見者色想釋論解云謂於內身未依無色定伏除見者色想或見者色想安立現前二論俱無初習等言憑何以説答文雖不明理通二釋若唯一解何假或言又瑜伽云謂生欲界已離欲界欲未離色界欲名初解脫由斯疏文含綜二論理無違矣論言於內身者略有三釋一內身謂意意身未依無色定法伏見者色二取五根及扶根塵總名內身即依此身起色之解此解未以無色定伏三總以欲色顯形等色及情非情名之為身皆聚集故行者於此未離色欲即身在此欲相之內名為內身論見者色想略為二釋一見者謂假者即是能見色等假者色想乃是見色想解依境立名名為色想二見者謂我能見名為見者色想同前有云不觀自身所有根境但觀身外他身根境名內未伏見者色想此𬣑之甚過思可悉疏若久習業至安立現前者問對法所明如上已引文中不説離色欲言據何為證答理應爾矣若不爾者二釋俱未依無色定未離色欲竟有何差論分為兩解而置或言又既未離色界染色自當情何待安立既言安立而現在前離色染者其義明矣問既離色染何假安立而重觀耶答令觀精純障轉遠故疏而觀欲界作光明等者按瑜伽云於欲界色有光明相作意思惟而生勝解復云觀諸色者觀何等色答欲界色諸色之言通內外也問按瑜伽云依已解脫而作勝解初中久修已離色染何故但觀欲內外色不觀色色答瑜伽唯依初業者説明言觀欲對法既通初修久業故觀諸色言通二界境疏主從寬且言觀欲又欲色粗弊為障力增故偏言矣疏由前三解脫等者問初解脫境論言諸色何故今云攝少多耶答勝處別作少多等觀今總攝彼以為光明故不違論言觀諸色問何等解脫引勝處耶答初一解脫引第一二第二解脫引第三四第三解脫引後四種所以者何謂初勝處內有色想觀外色少若好若惡若劣若勝於彼諸色勝知勝見得如實想由奢摩他道名為勝知由毗鉢舍那道名為勝見於勝未勝二種之中無上慢增名如實想第二勝處內有色想觀外色多乃至得如實想由此二處俱內有色故從第一解脫所出第三勝處內無色想觀外色少乃至得如實想第四勝處內無色想觀外色多乃至得如實想由次二處俱內無色故從第二解脫所流餘四勝處內無色想觀外諸色青黃赤白乃至得如實想四色如次為後四處由後四處內無色想觀四淨色故從第三解脫所出廣如雜集問雖因解脫引勝處等設二境別復何失耶答如世第一法為引見道還作無相真如等觀雖親疏異所緣名同又由解脫勝處等生復由勝處等解脫成滿互為因故觀境同也故雜集云依解脫故造修釋曰由初解脫但起勝解方起後行故云造修由勝處故起方便釋曰次勝處能勝前境即是發起加行功力名起方便由遍處故成滿釋曰後由遍處境行周普故名成滿此乃解脫先起為因復云若於彼得成滿即於解脫究竟釋曰復由勝遍二以為方便能脫諸障故此勝遍是解脫因故由遍處而成滿已即前解脫方得究竟疏由除變化障等者略有二釋一轉變諸色令隱顯等名為變化於轉變時不得自在名變化之障所知障攝二未作觀時若怨嫌心見一切色俱為不淨若起貪染見一切色俱以為淨勝劣等亦然此怨貪心轉變前塵故名變化變化即障體通二障疏瑜伽至依初業者問準列名云有色觀諸色不言其外何故今云觀外諸色答按瑜伽第十二論但云諸色而無外字第十五云未伏內色想外無染汙色既此參差略為三釋一未依無色制伏色想云內未伏已用色定離欲界染云外無染已離欲色而得外名非唯外境二依定散地名為內外於散色離過名外無染定無染在名內未伏故諸聖教呼定散二名內外也故外等言亦通根境三外境名外始業之人未能雙觀且觀外境論依初習言外無染此唯外境名之為外議曰前二理通後釋非善何以明之唯離境染根染未袪初未得定定既未得何名解脫故瑜伽十二云已離欲界欲故若未離根染何名已離又十五云能引不還或阿羅漢諸神通等謂外無染汙色是名第一既對那含等明八解脫豈那含等於欲根染而未離耶若爾何故疏主會云依初業有答疏主雙會十二十五未得無色未除色染者依初業説不言外者觀外境色名為初業雜集亦但言觀諸色而無外字故前三釋臧否明矣據前二義故疏説云觀外諸色疏唯觀外境而為不淨者問內染已遣外染亦無何更觀耶答雖染已除為堅窂故觀不淨令貪不起疏準對法久習等者按對法本云於內已伏見者色或現安立見者無色想疏主釋之分為久始然疏亦有先初後文又瑜伽鈔亦初業先久業居後問以何為正答略以二釋一初先久後如初解脫釋之次第雖初已除見者色想為令障遠觀得增明故更現前安立無色而重觀也故現安立見久習也二先為久習後為初習以久習者不假安摸因修而能起無色想故言於內已伏色想初習業者未能任運要待安施作無色想故言安立阿毗達摩何要次第取捨任好應從多本唯此疏主判對法文為初久別餘德不分然解內身及見者言同初解脫唯翻有色無色為別思之可悟故不繁記疏而觀外色作少多等者但觀外色而作少多好惡等也不為光明問瑜伽對法俱不説作少多等觀憑何而立答二論結云餘如前説前中既觀少多等境故知此爾若爾瑜伽初解脫中亦觀光明第二應爾答不為例瑜伽自簡云又不思惟彼想明相但簡光明餘如於前即少多同也疏已離染色名為外者若根若境但離染者總立外名不唯外境然準對法言內外者約根塵異乃同俱舍與瑜伽別疏今此第二內有色者有根等色者問大小乘教皆言第二名內無色今者何故言內有色答談彼第二解脫觀人內有根色非牒第二解脫之名名內有色言內説色正談有色言有根等出內色體問辨意如何答根塵離染總名為外論言緣外但據外塵以略觀故恐惑者執亦觀於根故以斯簡若爾外塵自以名外何言離染立以外名答境外名局離染外寬從寬為名故無爽矣然大論抄通觀塵根名觀外也俱離染故與此異也疏此説觀外色等者觀外色時不須此定名不現前非第二人不得彼定名不現也疏或已離色界欲等者雖得無色定不依作觀但以色定立無色想而現在前以為觀也故云無色而不現前非不得也疏不同俱舍等者地繫除障悉不同也故俱舍云一一通依初二靜慮能治欲界初靜慮中顯色貪故問為二根本兼近分耶答有二釋一通近分靜慮之名攝於根本及近分故根本近分皆除欲界初靜慮中顯色貪故二云根本俱舍不明言近分故議曰前解為勝小宗但為除顯色貪豈近分法不除障耶問第二靜慮亦緣顯色第三靜慮寧非解脫答初靜慮中由眼識故故於顯色能引貪生上無眼識第三不立問上亦借下眼識等起應引貪生答要伏下染方得上定故借下識貪不得生不同自地起識生貪故不為例故俱舍云第二定中無色貪故問按俱舍云八中前三唯以欲界色處為境云何緣欲境除初定色貪又色色淨欲色不淨復何觀不淨能除淨色貪答非正能斷能為方便令遠離故疏清淨相轉等者顯異前二故言清淨光鮮等也問所為意何答有二因緣一令心欣二審成滿故俱舍云前不淨觀令心沈戚今修淨觀䇿發令欣為審自知修不淨觀為成不成若觀淨相煩惱不起彼方成故疏餘地亦有相似解脫等者如欲界等中雖亦有清淨為餘貪等所陵雜故初二定中不淨伏故第三定中樂所迷故又並八災所擾亂故疏已得捨念圓滿清白者此顯所依唯第四定此定唯與捨相應故亦賴於念故兼言之於一剎那離過名清相續離過復名為白疏以此為依等者以此捨念定為所依所修解脫故名為淨三義名淨疏下引云超苦樂故動亂靜故善磨營故是三義也疏二覺無故者若不相待但別觀一或淨不淨即淨不淨二覺無也以境一故疏由於被障至不淨物者引釋淨中不淨入義不淨之中淨性所隨對法不釋此亦不明略為二釋一不淨物中有白骨故名淨性隨二即前薄皮不離三十六不淨物故名淨隨議曰後解雖得初釋分明疏超苦樂等者離八災患也苦攝於憂樂即兼喜動謂二息亂謂尋伺疏近分解脫道等者若依俱舍近分地中九解脫道總為解脫九無間非所緣下故若順正理而有兩釋一釋同前一云近分地中九無間道八解脫道並非解脫不背下地故緣下道離故又未全脫下地染故契經説彼超過下故唯第九解脫道得名解脫所緣下者緣下之法以為境故故俱舍論二十八云空處近分緣下地色起色想故餘近分地準此可知疏要背下地等者即棄背義是解脫也問各背棄何答按婆沙論十四云棄背義是解脫義初二解脫棄背色貪第三棄背不淨觀心四無色處各自棄背地下地心滅盡解脫棄背一切所緣心也疏多説根本等者近分地中唯解脫道名為解脫不取無間名非全也疏即於空處思惟勝解者重觀遍滿太虗空解脫即於識處等者觀觀空識所觀之識亦遍滿也疏於識無邊處等者思惟識外無有若色非色可得故言於識思惟勝解疏以識無有為自地名者識外無法名識無有非識體無名以識無疏遍於想可生處者解此論文諸德各異今略敘四一如疏明二當地四薀四諦等法皆能為境而生於心名想生處由此論云更不於餘而作勝解三有頂心細故更不於餘下地比挾而起自地勝解四下之三地名想生處遍於此處思惟勝解議曰乍觀四釋義互不足略為徵問用曉未悟且問初釋論自明言更不於餘而作勝解緣無所有豈非於餘若言想生應作勝解取無所有餘二有頂亦想可生何捨不取難第四釋義亦大同思可知異故不別徵答非想等名形無所有粗心而立故須觀彼以為解脫如空處等依空立名即觀空等以為解脫此亦應爾簡空處等言不於餘觀無所有總心心所故言遍於想可生處雖有頂地想亦可生然非明利故不取也問第二釋若觀自地論何稱遍若不形下此地何因得非想名若既待下而得其名何不觀下若也唯觀自地之法即應唯名非非想也唯細心故不名非想而無所待粗心心故問第三釋大略同之故不別責答當地四薀四諦不同觀斯衆境稱遍何咎立名雖形下粗心法解脫不必須對彼為更不於餘而作勝解論明證故既有斯理四釋優劣難為定判智者當思今助一釋無所有處及有頂地此二合名想可生處何所以然因二地心得名非想非非想故若唯有頂形對於何名為非想若觀無所有不觀本地復何得名非非想耶故知取二唯依此二思惟勝解簡空等處名不於餘而作勝解問緣於識外更無餘法名無所有即不兼自唯於識處思惟勝解對無所有名為非想何不唯於無所有處思惟勝解即兼於自答無所有處唯從識外無法立名故唯於他思惟勝解有頂形於自他得稱故於二處思惟勝解疏上説離染依無學説等者如前所明解脫之處言離染者並依無學所得者説非據有學有學之人染未離故引證可知疏身證者得至定未能伏者對明有學那含解脫不同無學要離於染有頂一地必不伏斷以是學故而不能斷無上可欣故名不伏餘地如文問所引唯識但明滅定云何證餘染不離耶答要得前七方證第八舉後明前故無失也問有頂染在何名解脫答煩惱雖在定障少伏故得解脫疏空識二處至影略説者此證有學而未離染亦得解脫前之二地言離染者顯無學得顯無學人得後二種亦須離染後之二種不言離染顯有學得影有學人得前二種亦未離染若不爾者何須置此離不離言問論前自云前七解脫於已解脫而生勝解如何今言兼有學耶答為二釋一前局後通二實唯無學後文略故故二解脫不言離染議曰前釋為勝既許那含得於解脫兼之何過疏無分別智等為體者問對法等論説八解脫而是事觀云何根本智為體耶答對法等論通三乘言此論兼依菩薩等得是故説言緣如為境有餘德釋通後得智不許根本名事觀故變影緣如非親得也諸處説言世出世智目後得故議曰前解為正何所以然影變緣如與本智異論何不簡但言緣如又若但言世出世智可目後得今論既有世間之名與常全異又八解中有通凡得唯將後得以為體者凡體用何故知後謬疏以二十二法等者謂善十一遍行別境各有五種第六心王名二十二疏謂如來藏不變故者雖在煩惱不為煩惱所染故名不變也佛性論云虗妄之法有三變異一果報盡故變異二對治所破故變異三念念滅故變異法身離此三過失故名不變也一前後寂靜無果變異二無流故無對治異三非有為故無念念壞異疏初四住權等者後有配云前四地前後三地上及於佛地第一攝取即十信位攝取令入十信中故第二令不散亂者即是十住住令離散故第三令取者即是十行修行稱取第四令得解脫者即十回向以行純熟必得解脫第五對治者已登初地證二空理得二種智斷二隨眠名得對治第六令進趣者二地以上一行之中修一切行而增勝故名為進趣第七今不失者失者退也八地已去名不退地佛地無學總名不失疏何故配經等者論中説與教化等言結彼前説第三番意論文隱祕恐學難知故疏徵起問言詞等作第三番意亦同此復有義自上已來明佛説法令彼衆生自行成就與教化下第二釋明佛説法令彼衆生化他成就何以知之論上結云此七種法為諸衆生身所作成就故故知已前定為自行即次復云又與教化成就故知教化作利他行化衆生時應以證法而受化者授以證法應以説法而受化者即為説法如向前説者化他二法如前自行成就法是再説應知者重説向前自行二法所有次第即是化他二行次第但自他異行相皆同故論指之而更不作疏不生等三相法者謂無生住滅故大集經第二十云無為之法有三種相謂無出無滅無住無出即無生也問此無為相百法何攝答雖未見文以理言之不相應攝如有為相言不相應二十四者從增勝説示方隅爾疏初地已上得四證淨者依瑜伽論所説差別如前略明然堅固者不壞之義按華嚴經第三十九菩薩有十不壞之信謂於一切佛法不壞信一切聖僧不壞信於一切菩薩不壞信於一切善知識不壞信於一切衆生不壞信於一切菩薩大願不壞信於一切菩薩行不壞信恭敬供養一切諸佛不壞信教化一切衆生成就菩薩行巧妙方便不壞信疏若未入聲聞決擇分善等者復有義暖頂忍位亦得轉成麟角喻果經百劫已起彼麟角暖等善根不移於坐而成麟角故俱舍論二十三云從暖善根乃至菩提不起于座問頗有獨覺不從聲聞資糧加行從自二位修成果耶答有故大婆沙第七云轉獨覺種姓順解脫分起聲聞及佛種姓順解脫分轉聲聞姓起餘亦爾若起佛種姓解脫分已則不可轉極猛利故又俱舍論二十三云顯麟角喻及無上覺暖等善根並無移轉向餘乘義皆以第四靜慮為依一坐便成自乘覺故有餘獨覺異麟角喻起彼種姓初二善根轉向餘乘理無遮礙據斯二論獨覺自有資糧加行二位明矣雙問二日解脫分定生尚非麟角加行之位云何能轉生全少故若定不轉婆沙俱舍二論那通兩俱答曰若望自乘可言生定回趣化運而可增生生數既多為麟何失諸部不同取捨各異云何獨以俱舍婆沙用為指南況俱舍等但言暖等三位轉成獨覺不言麟角然準俱舍疏釋應善以論不言暖等可轉成麟角故若必也得何不同彼獨覺而説議曰二理俱通撿之疏初地已上至發十種心者然十發心而有多種今按華嚴三十九初有十發心一發無量無邊廣心於一切佛二度脫一切衆生三合一切衆生一切世一切剎悉入法界四觀一切法悉如虗空五觀一切菩薩諸行六正念三世一切諸佛七了達不可思議諸業果報八嚴淨一切諸如來剎九深心入一切如來大衆十觀察一切如來妙音一一之上皆有發無量無邊廣心之意恐繁不具疏其中末後一頌半者即初六頌中末後一半疏生因中疑者於此因由所以之中而起於疑名因中疑有義教是理因於教生疑名因中疑議曰智為甚深教稱難解今雙牒起明二俱疑言疑教生故為不足故前釋善疏前説甚深後説甚深等者即證阿含二深也有義如舍利弗等昔居外道佛為引彼讚歎小乘名為真極今指於彼名前甚深今從定起讚智及門名後甚深議曰前正後謬疏自説云前後甚深不同聲聞若準後釋但後不同云何前深亦不同耶豈可疏主自為𭿺楯疏稟佛言至簡異胎藏等者依佛言教生自法身名佛口生即聖一道等名法身也疏此土佛出無轉輪王等者有義即釋迦佛百億國中諸菩薩等化作而來稱諸國來疏返道疑生故名為損者略為二釋一定性所得無學果法名之為道彼若於自所得生信乃名為順今聞一乘於自所得疑為不極故名為返二如來昔説羅漢名極今復説非昔今説異名為返道因此返道而有疑起故名返道疑生即此疑心名之為損有義執小謗大故言損也議曰乍觀論文後説為勝細尋其旨前釋為優所以者何論云是故羅漢不入涅拌意云見佛説無二極是故定性執阿羅漢不入涅拌故知執無定性趣極即為損也若不爾者論言是故羅漢不入涅拌此言何目疏觀此文至不説無驚者此有妨難具釋如決今對凡夫二乘菩薩六類不同説不説驚可為四句一説則有驚不説無驚謂五驚怖中第一三五二説則無驚不説有驚謂五中第二三説與不説而皆有驚謂五中第四今昔二時皆有悔故問準經及論其舍利弗未聞法華常悔修小及聞法華悔心隨遣云何得説説與不説皆驚怖耶答準經論文即無今悔以理言之亦容有也如疑既有新舊兩徒悔何不二以斯理準可得有也悔行云何為今聞説二乘作佛悔不早修大乘行也疏決兩處皆有斯意四説與不説皆無驚謂不退菩薩今昔皆無五驚怖故且望此佛對法華經説未説時名為今昔非遠望也若遠望之何妨菩薩昔曾有驚疏於三類中兩足為貴者舊釋戒定以為二足如來二足超諸餘聖名兩足尊議曰後釋雖得然不及疏疏釋乃是涅拌文故疏今取初及第三者第二四句但名煩惱不得名障非殊勝故疏尼乾子經有五種逆者問按彼經第五明五逆罪即同小乘五逆之罪復言有五根本罪五如疏列而不名逆今云逆者豈不違經答經據通者而立逆名唯大乘者而不言逆非體非逆若非逆者何罪攝耶豈輕成逆重不爾耶問準此經五中一一之中而有多種為要總犯為隨犯一即成逆耶答隨犯於一即成逆罪問若爾逆罪何但五種答據類言五亦不相違經如是增上慢人退亦佳矣者問此起去何當更還答按大方便寶雨經第三善住天子問經第三云增上慢人退席而去不久還來故知此徒亦可還也經略不言故亦無失或可此經唯明一乘二乘作佛其義甚深非增上慢智所忖慮是以不還彼經不爾容不久還經自明文言還不還不可以理會令同也兩釋不同任情取捨經如是妙法者古德云妙有二種一者體妙謂非三一言忘慮絶二者用妙亦非三一不知何以美之為對昔三強歎為一故注經云非三非一盡相為妙非大非小通物為法疏鶖子往劫曾所未聞者問於十六子聞經發心云何説言曾未聞耶答彼時長遠望以後來更不聞故名曾未聞顯經難過隱前不説疏生死海減者問何以爾耶答一切七寶多在海中衆生福勝海減寶出令衆生用海增翻此疏論云至此有三釋解大事一開示悟入以為三釋一釋如文下疏云第二解云總依佛性下即第二釋下云第三解云依大涅槃三事解下是第三釋乍觀疏文為言標釋知見之性以為三也恐有未悟故以示之論如來能證如實知彼義故者釋之如疏今復有義如來能證舉能證人如實知者出能證智彼義者出所證法即是法身一知之言通能所知疏稱化作城非寶所故者翻顯寶所非稱化作故明體實而是無為疏有二種如來藏空智者二如來藏即所緣境謂空不空二種之藏言空智者即是如來緣二藏智問二智不無何故名空答所緣空故以得空名問所緣何空答煩惱虗無真如離彼忘心分別一切諸相故並名空即此空智亦名藏智緣二藏故問二何名藏答忘能覆藏真是所藏故並名藏復有義即二空理名為空智智實性故亦名為智因空所顯而得空名疏謂若離至煩惱藏者此辨煩惱空藏之相妄法別起其體不一是故名離可以對治因緣易脫故名為脫始終變改目之為異經本無有若斷之言或本不同更勘餘本疏不離至如來藏者此辨真實如來藏相所謂諸佛同體義分非全別體故曰不離體真常住不可因緣易脫令失故曰不脫始終不變名為不異妙出情分名不思議經本亦無不斷之語有義真如體遍不離有情故曰不離縛法可脫體既非縛故名不脫如為法體與諸餘法非條然別名為不異議曰不及前釋得失可悉疏能覆真如名如來藏者復有二釋一知此妄空能成如來故所知空名如來藏二妄法空中無有真實如來藏性名空如來藏空即無義從彼所無而以立名疏刀提耶等者傳釋云昔有長者名刀提耶其家巨富情多鄙吝平生之日藏金於搗砧之下死已為犬還生其家慳心宿因常臥砧側以守所藏非家人者輒莫能近砧佛知長者根熟輒造將化至門呼言刀提耶刀提耶犬聞喜躍走至佛前如來慰喻家人見之莫不驚駭佛為説所因猶未之信佛言汝父昔日有金何之答云知父安藏然莫委其所佛命於搗砧所掘果得金方知家犬乃尊君矣今取喻者意有二焉一金喻煩惱刀提耶者喻如來藏因金顯犬知是所親因煩惱顯如來藏二犬喻煩惱金喻如來因犬能顯地下之金因於煩惱能顯身中如來藏性疏善不善法皆名佛性者善有兩種謂有無漏無漏之中通有無為即前所引楞伽勝鬘二如來藏有漏善者為隨順性如加行善等為增上緣隨順增長無漏種故亦名佛性不善法者為違背性礙無漏法因斷於此而得菩提覆佛性故亦名佛性無垢稱意準此明也疏四能顯德藏等者問因斷煩惱方證法身法身即是所顯之法云何今判為能顯耶答處纏之位其德未彰若出纏已具恆沙德故名能顯亦如金性在礦之中未堪其器不名顯器及于陶冶真金則能成種種器是故真金亦名能顯顯成器故法身亦爾疏開者出生顯證之義等者開屬衆生衆生證二圓果故有義為衆生説佛性名之為開此釋開者即屬如來開闡解釋佛性義故議曰若依經本本疏為優故經云欲令衆生開佛知見故知開者屬於衆生若據論云餘釋為善故論云欲開佛知見令衆生知得清淨故然觀經本與論所牒經文少別意將論中所牒經正何以明之唯論牒經開示悟三與本經文並無差別唯牒開佛一處經文即與經本顛倒不同故知經木譯之倒也或可經正而論顛倒論顛倒者亦譯主焉理既各通難以定判知者更詳疏示者同義等者問前開知見已説真如今示復明一何鄭重答疏釋如文復有義前清淨義即無垢如今明同義即有垢如故佛性論以無垢如為勝相以有垢如為同相故故今分二亦無失矣疏雖二乘至故住是説者此伏難難云若入變易名為不退二乘回心即得變易如何至八地方名不退故疏答意云二乘雖爾菩薩八地以前不定若至八地三乘決定悉皆總受無不受者據此決定故言八地疏唯下三世等者有餘德以教理行果配開等今引下文證非不取疏此方便至偏説一乘者問何所以然答初時三根因果理智四皆迷故故具説之根性既差迷悟不等有於此悟於彼便迷有在此迷彼法便悟故隨迷者即為説之故下二周隨説有異更有異釋終不離難故擯不記疏若依此解至便非此義者三周所説廣略雖差其體無別若初四種總是無為牛車造作即有為攝體既不同故成𭿺盾便非此言而有兩種一者牛車非是開示悟入之義二者涅槃貧女喻等非今法華開示等義若依前釋便非此義但顯牛車義與此釋別非斷此釋以為非也若依後釋便非之非義即明此解以為不正疏如貧女等者問何以女為喻答女有懷孕之義似況衆生身含佛性又經以女喻菩薩者為以女人多慈悲故故喻之也疏般若在上為能證道等者問按彼經文以自在目喻彼伊三點不縱不橫不喻涅拌何故今譬涅拌三事答觀彼經文誠如所責義既萬差縱類三德復有何過蓋光彼教義乃含多若非智洞幽祕就能為斯釋乎疏今此三釋至意趣難解者理行果三總名所詮寬狹差別尋前三釋易知不辨疏又以蓮華至亦無乖爽者此釋外難外難意云華喻妙法論解教理而有出水開敷之義可同於華今以因果以為妙法華之二義何以類之故有斯答答意可悉疏餘依永滅等者更無餘生苦依之體名為永滅非無即身名餘依滅有迷此文乃言二乘身灰智亡方名出宅若爾身在不名出宅下經説言出宅索車豈可在於無餘之位有斯事耶誤之甚矣疏又七地分段盡此一生等者頓悟悲增七地以前猶居分段生數既多不名出宅至第七地欲末之時盡一生已即入變易更有餘義辨如義決

body:
  text: 沙門智周撰疏第四卷疏正行無上等六者按彼論第三云一最勝正行具十二最勝正行一者廣大終不欣樂世樂自在志高遠故二者長時三無數劫熏習成故三者依處普利有情為依處故四者無盡回向菩提無窮盡故五者無間由得自他平等勝解於諸有情起施等度速圓滿故六者無難於他善所但深隨喜令自施等速圓滿故七者自在由虗空藏等三摩地力令修施等速圓滿故釋曰以定殊勝變金等物施與衆生無邊盡故如虗空藏從喻為名依於此定而行施等名為自在得此定者勝全八地分劣初地餘地可知八者攝受無分別攝令施等淨故釋曰不見施受及物即本後智或通加行九者發起上品忍中釋曰此上品忍能起見道世第一法以時促故略而不論非無體也十者至得在極喜地釋曰由至此地初得無為故名至得十一者等流在次八地十二者究竟在第十地及佛地中菩薩如來因果滿故由施等十有斯十二得到彼岸二作意正行若諸菩薩以聞思修所成妙慧數數作意思惟大乘依布施等契經等法名作意行又此三慧思惟大乘如次能令善根增長能正悟入所聞實義能令所求事業成滿三隨法正行略有二種一無散亂謂無六種散亂轉變二無顛倒謂無十種顛轉倒變菩薩於此六十等中應遍了知名隨法行四遠離二邊正行若於色等執我有異或執是一名為一邊為離此執説中道行謂觀無我名離邊行五差別正行於十地中十到彼岸隨一增上而修集者名差別正行六無差別正行於一切地皆等修集布施等十名無別行此六正行於十度中隨修差別一一具之疏所緣無上十二種等者按彼論第三云一安立法施設所緣立到彼岸等差別法門釋曰安立施等所有教法施設即所緣二法界所緣謂真如釋曰亦持業釋三所立所緣四能立所緣如次前二釋曰到彼岸等差別法門要證法界方展轉流出十二分故教為所立如為能立五任持所緣謂聞慧境任持文故釋曰任持者謂即聞慧能任持文教令不忘故名為任持六印持所緣謂思慧境印持義故釋曰印持者謂即思慧印持於義令決定故雖聞思慧皆緣教義以互少故隨舉多者聞思能緣文與聞何別聞能緣義與思何異答聞以文先義後思以文後義先故成差別七內持所緣謂修慧境內別持故釋曰謂即修慧緣於四諦三性等理名之為內於諦等境各別證知令不謬解故名別持別持之所緣依主釋也以持屬慧依境得名前聞思等亦同於此八通達所緣謂初地中見道境也釋曰持業依主二釋無違通達屬於能所二故九增廣所緣謂修道中至七地境釋道境二種漸俱勝故持業依主通二釋也十分證所緣謂七地中世出世道品類差別分分證境釋曰分分謂道道之所緣名分分證依主釋也十一等運所緣謂第八地境釋曰從此以後無有功用任運緣如今説初得故唯此地等即平等運謂任運轉前心後心一類無別名為等運等運之境名彼所緣依主釋也十二最勝所緣謂第九十如來地境釋曰此之三地得四辨才逮真灌頂果明圓滿故名最勝持業依主二釋無違能緣所緣俱最勝故疏三修證無上至十種修證等修者謂修修習證謂證得因修而證故名修證按彼論第三云一種姓修證緣無闕故釋曰親善友等四親近行名之為緣此緣不闕故本種姓修而有證此修能證故名修證皆以一緣而釋一證然此種姓體非修證修證之因故名修證從果立號餘九準之二信解修證不謗大乘故釋曰由不謗故乃能信解而修有證三發心修證非下劣心所擾動故釋曰由下心不擾方能發心而修有證四正行修證波羅蜜多得圓滿故釋曰由度滿故其行乃行修而有證五入離生修證起聖道故釋曰由起聖道修證此入離生離生之義如前已釋六成就有情修證堅固善根長時集故釋曰由堅固善長時修證故成就有情七淨土修證心調柔故釋曰由心調柔證於淨土八得不退地受記修證以不住著生死涅槃非此二種所退轉故釋曰不同凡夫二乘為二所退九佛地修證無二障故十示現菩提修證無休息故釋曰由利樂事無休息故修證得彼示現菩提疏通攝至境行果者三無上中初是因行次二境果皆通因位佛果之者尋上自悉疏羅漢有恐怖等者按彼經云阿羅漢有恐怖釋曰對治未滿所以有怖問何時怖耶答若不愚法者見前變易生死對治未立所以有怖愚法之人未來有餘涅槃之後心想生時而方有怖經云何以故羅漢於一切無行怖畏想住釋曰明前怖畏之所以也其徵意云佛於昔時經中常説羅漢離怖今此何故言有怖耶解經答辭略有二釋一云謂於一切變易生死無對治行怖畏想住正明怖畏緣已無行而生畏心名無行怖心在畏中名之為住惑未進斷亦名為住二云無者空也而於一切法空行中住怖畏想不行修證於法空行深生怖畏若如前言由無治行畏依作者理乃不然阿羅漢等未回心前未有變易何得於此治行之所怖想住耶若得變易即趣大竟更何怖畏若云不愚法者聞有變易雖未回趣豫於彼怖斯有何失若準此理前釋亦通然義不遍不攝愚法人故後釋寬知者思之經如人執劒欲來害己亦有二釋一云喻顯於畏變易之因喻之如人能趣未來變易之果名為執劒當果臨至故云欲來來必切身名為害己二云怖畏法空如劒欲害不敢前修疏有歸依者惡法未盡故有歸依故彼經云如衆生無依彼彼恐怖故則有求歸依如是羅漢以怖畏故依於如來釋曰如世衆生無所依仗多有怖畏非一名為彼彼餘文可知疏正法住等者經論二藏生善名住即此二藏除障名滅木叉毗尼此二律藏略廣分二解脫調伏二本異故故初受得名別解脫後名調伏出家受具學三藏人沙彌大僧如次配也復有義前四教法後二行法前中住滅而是經法修善之法故名為住斷障之法名為法滅木叉毗尼並為律藏木叉梵言此云解脫戒是正順解脫之本故云解脫又復戒行既絶業縛名為解脫律教詮彼從其所詮故云解脫又此律法能生解脫亦名解脫毗尼梵音此翻名滅戒能得於究竟滅果故名為滅又復戒行隨分滅過亦名為滅律從所詮故説為滅又此律法能生律行亦名為滅二行法者沙彌大僧如次二別更有多釋不出於此故不言也疏三種意生身皆入初地等者謂二乘菩薩既言二乘受變易生得入初地明地二乘所有功德皆是大乘不爾云何受變易生得入初地疏如取為緣等者如者指斥取即是愛愛增名取諸論説故取是著義助業感生目之為緣理實諸惑皆能潤生而愛力增故偏説也有漏業因者謂善惡業與漏俱故得有漏名親生自果立為因稱三界名有體是有為有漏法故即第八識而為自體此上喻也無明住地即所知障緣執有情菩提實有助業以牽變易生死名之為緣無漏業者謂後得智有分別業正感生死故名為因阿羅漢等受變易人此即法也疏為大乘故説此六處者正法住等是起行處所故名為處處之不同而有六也故名六處問六是小法非實大乘云何得言為大乘説答且正法住謂依經論二藏習生空善隨應近遠皆作大因是名之為大乘説餘準可悉疏失開敷之二能者即第二能也疏所行二利滅道所攝者滅理所證令他智起亦名悟他苦集有漏非究竟利故不取也故唯識論説彼法佛通二利故疏能詮之教二即稱權者教中説彼二乘之者非有彼體以權説故故稱為權疏非別簡三唯無二極者非言一故即乃總簡無有三乘但只簡去二乘之極大非無也疏又以果一簡因三等者教為理因行為因故理果俱果教行並因簡彼行教理果名一疏不破執彼二身極者對能執人説身為二非所執身有兩種也聲聞緣覺為二能執疏既爾即應捨頓學漸者問難意如何答先所習者而是頓法出宅捨之而更授法所與非漸是何法耶若還是頓捨與無差何須與捨若是別法非漸更何由此為難疏為求牛車至皆與牛者二子雖求羊鹿出宅然佛本意令出取牛設羊鹿者牛乘之漸疏談佛意云為牛車出於宅也疏此以所詮至非要真如者意明牛車亦名理也疏密亦通會行果二同者三乘行果會令同也又會同彼教理二種得有開敷秀出之義初解為本疏勝鬘正説一乘因果者問勝鬘一乘以理為性即合顯會正説理教何不然耶答對二乘執權行及果是故説彼因果一乘非即以彼為一乘體明言彼得非為究竟可為大漸是故名為顯會行果密會教理準之可悟或即因果即名為理理性所詮俱名理故法華顯密倣此應悉故不繁云疏此正取至故不相違者教雖非是正一乘體一乘方便亦名一乘取之無失問何不言理答言因果者已攝理矣因果之中定有理故故不待言疏初二解通定不定姓者問簡別通二理誠不爽無別理故破別云何得通定姓定姓之果自堅極故答略為二釋一破別之一唯對不定姓不定姓人定得大果令於小果妄執為極不肯進發可須破之而令升趣定姓所得即以為極今亦破之令何所往是以破別唯對不定二亦對定姓夫最尊至勝無所能逾可名一極定姓所得理即不然何名一極非自不得他之勝説即將己得名為一極故後解勝疏得二意樂者問既佛二乘菩薩三別何非三意答自他為二二乘菩薩他義等故疏為不定姓等者問第六既具三乘種姓正是不定何故不被答據與記故故不取之若爾亦應不取第二此會不説菩薩記故答不定有二一者已行大乘之行而欲退之二者雖有大乘等性未曾行大初即第二後即第六法華本意為第二故故除第六是以經云聲聞菩薩聞我説法成佛無疑菩薩即是第二不定議曰設取第六亦應無過若據分明別別記者十中第二何不除之若依總相受記之義第六應得據此理言十中一一隨應皆取不定姓也應化隨宜亦準斯義疏中唯取初二八者以所餘者約於別義以明一乘非並不定故不取之今以理準縱通不定亦應無過豈不定中無解脫等是以不定未必局唯初二第八問法苑乘章但取第一與此不同而何乖異答彼據論言為二聲聞不説菩薩所以不取此依菩薩性是不定是以取之疏此唯攝入者破二歸一汝等所行是菩薩道言九部法入大乘本皆攝入也上下非一疏彼通出生者按勝鬘云摩訶衍者出生一切聲聞緣覺世出世間善法如阿耨大池出八大河又如一切種子皆依於地而得生長如是一切聲聞等善法依於大乘而得增長又云如世尊説六處謂正法住乃至受具為大乘故説出生攝入如文次第問彼理為乘如何出生答如十二分教依於法界平等所流為依名生此亦相似中有稍異智者思之疏第五問答等者問引攝一類説於一乘設不引之此為畢竟實趣自乘無餘滅度為不爾耶答傳有兩釋一云必無趣滅會得回心以有大乘種姓排故二云若不遇緣亦入無餘由此如來丁寧示勉令回心也不爾何假大師殷勤議曰初釋為善何以驗之答雖有勸文無文説言不誨入滅又如八地已至不動如來亦勸令遣進趣豈可畏此入寂故誨此既不爾彼云何然故十地經云菩薩住此不動地一切心意識等不行諸佛作是言汝得此究竟忍順一切法故我等十力四無畏等汝今未得當勤精進煩惱衆生汝當愍念等又按楞伽經云諸佛世尊為示如來不可思議無量功德注云諸佛勸加八地菩薩言如來有不可思議無量功德汝未得之不應住此無以為證此不動地畏不升進而尚勸之小聖猶未發菩提心云何不動問十地經云若諸佛不與此菩薩起智門者菩薩爾時即入涅槃棄捨利益一切衆生準此但恐入於涅槃諸佛方勸菩薩既爾故知二乘如來不勸定入涅槃以斯明矣答彼經不言入無餘依不可為證彼據寂滅無分別法名涅槃也故彼經云汝今適得此法明所謂一切法寂滅無分別法明又云法界常住諸佛不以得此法故説名為佛二乘亦得此無分別法故又云汝雖得是寂滅解脫等當念如是煩惱準此等文非無餘依若不爾者二乘無餘此不可起大乘中者時未至故更取何法名為涅槃故前説善但説趣寂入無餘依尚自難悉況不定姓而入無餘智者思之經一切十方諸佛亦如是者疏判如文復有義云此文合屬第四合住斥疏科誤何以知之據論釋第五依中而引三世不引十方十方故知屬第四也又十方中言亦如是夫言亦者而亦於前若屬第五前未有言而亦何者議曰疏釋無妨若以論不引故證非第五第四令住論亦不引十方之文云何即判屬於第四俱不引故十方非一法戒皆同顯多佛同置亦何過或亦第三依何義也舉他亦自異他為證又取為則何簡十方獨取三世或屬第四非無斯理疏橫竪有殊者橫為十方竪為三世疏説法為方便皆為後得一乘故者此意釋云小大方便皆是佛乘之階漸故總對佛乘名為方便有義小乘方便但為自身令得解脫對自小果名為方便大乘方便為濟自他對於大乘名為方便議曰本釋為勝故經結云是法皆為一佛乘故若小乘方便不對大者云何結云皆為佛乘疏觀陰界入至得解脫者由作三觀能厭離苦得解脫也問厭苦等者是何位也答有二釋一云厭苦者謂見道前七方便也離苦得解脫者由起方便故得解脫即果位也二云厭苦同前見修二道名為離苦得真無漏實能斷苦少離全離俱名離故得解脫者即無學位離繫縛故疏一佛乘者依四種義者此論文也開示悟入名為四義疏遮無二種法身之體等者問經中但言無二三乘論言遮體體義亦得通於有為何以得知經論據理言無二耶答此經上下非不有文然不明著按薩遮尼乾子經第二云説三乘者示地著別法相差別非乘著別而佛法中無乘差別何以故以法界性無差別故地差別者示諸衆生三乘作業漸次令入法相差別者示現衆生如來種智漸次令入又云佛説三乘者依世諦説説一乘者依第一義説第一義者唯是一乘更無第二故以斯明證故法華言無二三乘處法身説理極成矣疏由殺生業之所感故者總報命根雖因善業短命別報故殺業招疏若於今世法壞法沒等者問法若壞沒佛已出竟若不壞沒不名為濁云何經言佛出濁世答有兩釋一云世間仁義禮智之法亦名正法此法不行名法壞沒二云即佛法壞名正法壞雖佛出時非法已滅亦名見濁據增勝言且云法壞名為見濁理實佛在外道邪見非不名濁餘皆準此疏像法漸起者像猶似也濁諸邪教倚託正法以惑生靈信者信有名為漸起如末磨尼法子三階即其事也疏若飢饉劫等者唯言飢疾體即觸收故色薀中觸塵為體若兼所造即通四塵除聲與法若言飢病劫劫即時分依四五薀無色色欲三界別故疏四悉擅者世界者世間之異名為有情及器俱名世間並可壞故能達此二從緣和合無別實性猶如於車轅軸輞等和合而成無別車體世界亦爾言各各為人者所化衆生根生不同別別治之名為各各如多貪者不淨觀治即為其藥餘觀非藥餘病餘藥綺互相望為藥不藥第一義者謂一切法性一切言論一切法非法一一不可分別離此等故名第一義疏由此二因至離不同等者能感之因二共招果名之為合所感之果分內外別名之為離疏薩遮尼乾子經十二濁者他受等土有十二淨化土異彼即名為濁不同五濁望於減劫煩惱尤重方得濁名欲知十二濁之行相對彼淨義義即易知故彼經中第二説云十二最上清淨佛土如來於中成佛菩提一彼國衆生畢竟能成勝清淨劫離諸劫濁二彼國衆生畢竟能成最勝妙時諸佛法行不失時節三彼國衆生畢竟能成最勝法器受佛正法四彼國衆生畢竟能成淨妙智海清淨一切諸煩惱垢五彼國衆生畢竟能成柔濡之心其中常有調伏衆生六彼國衆生畢竟能成最勝妙乘能以一乘究竟取於無上涅槃七彼國衆生畢竟能成勝器世間無有餘相八彼國衆生畢竟能成如來正教無諸一切外道邪法九彼國衆生畢竟能成直心正心無諸諂曲十彼國衆生畢竟能成無垢功德一切清淨白法十一彼國衆生畢竟能成諸聖人法其中常有勝福田衆十二彼國衆生畢竟能成勝妙道場過去諸佛於中成道與十二濁次第相翻所以名濁然第七淨無餘相者無砂礫等第四第九望無煩惱總別分二第三第八望善法器及離惡緣以為兩種濁中準此辨相差別疏其劫至即五濁者問示現與實既復不同云何相攝答望佛實無滓穢之法現居於此故得示名對凡下聖即非是示故得相攝若爾劫增惑微命不至短皆非凡濁云何對凡得相攝耶答若據增相劫初等時實不名濁論體異淨而得濁名故惑等微亦得為濁據此相攝理亦無違或約名同而相攝也疏十二濁中通能化能障等者三乘差別名為能化魔及魔業名為能障疏障據類同等者同礙於聖名類同也疏此唯據行濁等者此之六濁唯處衆生惡行以立不同五濁通依餘法疏嚴故者嚴政嚴肅之義故以此嚴治威儀濁疏垢謂六垢者起必粗猛損煩尤深汙染增強故偏名也不取本惑及中太隨方此不及疏緣他正法名體等者二體無別名既不同故各別釋緣他身中所有正法道德體起名之為嫉有義忌他外財為嫉忌他正報為妬慳貪為貧窮因嫉妬為下賤業疏初猶未信名損驚怖等者問唯前疏解但疑自果無畢竟滅名損驚怖非不信大名之為損今何異彼答準理觀疏疏有二意前後兩處各別申也餘德多同疏後意也即此文是或可前言疑於自果不言於大而即生信故知疑小亦未信大由此前後亦不相違疏我在必得除我滅後者問若爾何處説增上慢重回受化答此雖不説按大方廣寶篋經善住天子問增上慢比丘初退後來以此而言今增上慢何即不返疏般若論佛説四事無虗妄者按天親論云不妄説小乘者説小乘苦等唯是諦故不妄説大乘者説法無我真如故不妄説授記者一切過去未來現在授記故如彼義如是説不顛倒故不妄記菩提論不釋也以可悟故疏初疑與記上生者諸本不同與記生正疏依初解第三疑等者解第三疑而分兩釋若依初解此第三疑於因記上而生起也問若依初解而言答言除佛滅後現前無佛若依後釋增上慢人佛前起退如何得言除佛滅後答畢竟能令信佛所説故亦無過經有懷增上慢者謂心有所懷即是有所得也言增上慢古有兩釋一云慢中增慢名增上慢二云增謂增勝之名未得增勝之法謂之已得恃此自高名增上慢議曰後解善矣思可知之經優婆塞我慢者注經云雖知無我而以無我為我亦為慢也有釋注云謂我能解無我故名我慢議曰注義無違釋注有過然注意云法實無我愚者於此無我法中妄以為我自恃高倨故名我慢不説愚者能知無我云雖知無我疏戒中既言除上慢等者此會違也故外難云尸羅不淨三昧不現今於或漏云何得定云增上慢故今會云尸羅不淨據犯重説律中犯重既除增上故知增上得定何失是以律中為四句云一心實境不實心將為是境實不是乃至第四心境俱實自所得法實無學法自心作無學法自心亦作無學之解餘悉準知唯第三句成大妄語可犯於重今增上慢既初句收故不犯重可復得定又五千中有是破惑有增上慢言戒缺漏談彼犯者言增上慢據不犯者或增上慢依犯小罪亦名缺漏故並無失疏米籺名粳者按撿字書不見此字然切韻中有麧字者麧糏頭也音下沒反有義三乘之名如米外粳一乘之理如粳內米但得三乘之名不知三乘之義故云糟粳人從所執得粳等名展轉喻也經佛威德故去者注經云風起則塵沙自飛日出即白黑自別此謂非遣而為遣也疏正法久住者即證行也如正像法有證行教名正法住疏如我出世至各分別空者然所説法有總別名如華嚴等即是別名言界經者乃是總稱總為一代所説經稱如世之樂雲門等者樂之總名陽春白雪可為別目餘佛所説亦準斯釋義如名解故不釋之疏宣説諸佛弟子等者按瑜伽論二十五云是中宣説諸佛諸佛弟子比丘比丘尼式叉摩那勞䇿男勞䇿女近事男近事女若共不共最勝功德等者釋曰式叉摩那此云正學正學大比丘尼此之七衆為求涅槃斷惡修善所生功德近感人天同外道等故名為共因此遠尅出世涅槃故名不共如此勝義一切智者同意所許甚奇希有最勝功德是名希法議曰疏云八衆通大小乘言諸佛弟子大乘弟子比丘等下小乘弟子合之為八故雜集論第十一云若於是處宣説聲聞諸大菩薩及如來等甚奇等法名為希法故知通取大小弟子餘德唯依小乘弟子言佛弟子此乃標舉比丘等下明別七也理各通也任情取捨疏應頌至唯依主釋者應者應當應合之義義理應當更誦明之誦不是應從於應理以得其名名應之誦故依主釋應為主故諷詠以二句等頌諷詠諸法諷與頌別即可諷之誦故亦依主自謂能説謂所説所説從於能説立名即自陳之説所説之教待緣而起依能起緣而以立名即緣之起希有即是所説法為能詮即希有之法二利無缺名之為方大教為此二依利處名之為廣或理體甚深方愸無缺名之為方教能宣此名之為廣並依主也疏或即諷誦至此誦是言者即依此分諷詠諸法復為其頌二三等句名可諷誦如攝大乘亦乘亦大持業之義詮於理邊名之為教言辭諷詠不對其理此之教者但名為言若爾何故不復諷誦有應頌耶答只緣詮理不詮別故故此二中而不互有疏契理即經者契屬於教經亦是教故持業釋契理之經者契屬所契經從所契以得其名故依主釋若記謂開示即是能記別謂因果差別等法即是所別能記從彼所別得名名為記別差別之記依主釋也又若記者謂能區分明白指陳記即是別是持業釋若譬者是況喻者曉義即曉喻之譬是依主釋喻依於譬名譬喻故若譬是類義喻是況義譬體即喻是持業釋體無異故若本者是世事者即是過去人法事依於本而得本名即本世之事依主釋也若過去世事即是本者本即是事持業釋也本生二釋類此可悟經如其所得法等者正釋如疏今助一釋如我所得法報二身定慧嚴法用濟衆生疏未曾修善至唯生得者若為求出世所修之善名為方便若不爾者雖加功行但名生得有義未曾修行無所得善為菩提本問鶖子等類曾六十劫行菩薩道此所修善何非方便及菩提因若非因者衣珠之喻應不得成若是方便即以曾修云何言未答略為三釋一云言未修者據今生説縱已前修非無相故衣珠之喻據有相因二云據未曾起無漏善法無漏善法菩提本故三云未曾於餘佛修前二義勝疏箭內稀故者俱舍論云此胎中箭漸次轉增釋曰若子處胎胎損害母如中於箭箭能損身從喻為名名胎中箭以上初凝故名內稀此談形相疏云何六十二見等者此義經論章紀而有廣明疏撮綱要以成其頌若博學者據而易知不待剖釋如初業人睹而難悟要資縷説故對始修略開展也頌二四八十劫見生死遍常者釋此四遍常也謂諸外道得於靜慮起宿住通能憶二十成壞劫事遂執世間及我俱常見有死此而生彼者但是隱顯非是斷滅故執為常四十八十憶有短長常義一種此為三也四由得天眼見諸有情死生之時諸薀相續遂執世間及我俱常頌梵至一分者釋此二句明一分常一有從梵天沒來生此間得宿住通作如是執我等皆是梵天所作梵王是常我等無常二或在梵世或復傳聞梵王有如是見言大種常心是無常或翻此説聞如是理我以梵王為量信其所説故執世間一分常住三有先從戲忘天沒來生此間得通起執在彼諸天不遊戲等在彼常住我等無常四有從意憤恚天沒來生此間餘同第三頌有色至有想者釋此四句明有想十六論有四四句第一四者一我有色死後有想我體是色名為有色能取法相名為有想即欲界全色界一分除無想天若許無色亦有色者即前三天唯除非想總名有想死已皆生此有想處名死後有想二我無色死後有想以除色蘊餘四為我餘同於前三我亦有色亦無色死後有想總以五蘊為我之體餘同前説四我非有色非無色死後有想即遮第三更無別見餘亦同前此四依於尋伺等至皆容得起第二四句者一執我有邊死後有想若執色為我體有分限或在身中如指節量等若非色為我亦有分限所依所緣有分限故餘同於前二執我無邊死後有想若以色為我遍一切處此所不知皆謂其有非其所見能知無邊三千界等有分限故下準此知以智不能知其邊際故名無邊非是遠知無邊邊故名無無邊餘如前説三我亦有邊亦無邊死後有想執我隨身舒卷不定身無量等我亦無量等餘準上知四執我非有邊非無邊即遮第三此四依於尋伺等至第三四句者一我有一想死後有想前三無色二我有種種相死後有想在欲色界除無想天三我有小相死後有想執少色為我想為我所我與彼合名為小想在欲色界除無想天若無色界許有色者并取前三四我有無量想死後有想無量色為我想為我所餘如前説此四亦依尋伺等至第四四句者一我純有樂死後有想在前三靜慮二我純有苦死後有想在地獄中三我有苦有樂死後有想在畜生鬼界人及欲天四無苦無樂在四定以上餘如前説亦依尋伺等至容起頌即有色邊等生無想俱非者釋曰此之兩句明生無想論及非想非非想論各有八句合成十六且無想八論謂有色等四有邊等四有色四者一我有色死後無想執色為我得無想定見他得定生彼遂作是計二我無色死後無想執命根為我餘如前説三我亦有色亦無色死後無想執色命根總以為我於此二中起一我想餘同前明四執我非有色非無色死後無想即遮第三無別有物依於等至尋伺皆起有邊等四者一我有邊死後無想執色為我其量狹小餘如前説二我無邊死後無想執色為我遍一切處等餘如前説三我亦有邊亦無邊死後無想執色為我或有卷舒餘如前説四我非有邊非無邊死後無想遮第三説依起同前俱非八論者亦二四句一我有色死後非有想非無想執色為我見諸有情入非想非非想定想不明了住如是執唯依尋伺起乃至廣説二執我無色死後如前執無色蘊以為我等入非想非非想定不明了故作如是計唯尋伺起三我亦有色亦無色死後如前執色無色為我見諸有情想不明了作如是執唯依尋伺四執我非有色非無色死後如前遮第三句有邊等四句者一我有邊死後非有想非無想乃至第四我非有邊非無邊死後非有想非無想如是一切皆執無色為我已得非想非非想定容有此執一由彼定時分促故以一一蘊為所緣執我有邊二由彼定時分長總以四蘊為所緣執我無邊三由彼定時分或短或長一一蘊或總為我故成第三句第四即遮第三説故頌人欲天色界四無色斷滅者釋曰即此兩句明七斷滅論一我有色粗四大種所造為性死後斷滅畢竟無有見身死後有而無故若自他我皆是粗色死後斷滅現在此身或復他身皆得斷滅此即欲界人中之我二我欲天死後斷滅三我色界天死後斷滅四我空無邊處五我識無邊處六我無所有處七我非想非非想處皆死後斷滅頌從無想天沒尋伺計無因者釋曰此明二無因論一從無想天沒來生此間得宿住通不能憶彼出必已前所有諸位便執諸法本無而起諸法如我應無因起便執我及世間無因而生二由尋伺不憶前身作如是執無因而起乃至廣説頌憶上下傍俱壞劫有邊等者釋曰明四分邊論一由能憶下至無間地獄上至第四靜慮執我於中悉皆遍滿便作是念過此有我我應能見故知有邊二由能傍憶無邊執我遍滿故執無邊三由能憶下上如初近遠傍如第二不得邊際於上下起有邊想於傍起無邊想四由能憶壞劫分位便生非有邊非無邊想諸器世間無所得故頌怖無知至矯亂者釋曰二句明四不死矯亂論也不死謂天以天長壽外道執為常住不死由答不死天無亂問故得生彼天今毀之言名為矯亂一怖無知念我不知善不善等有餘問我不得定答若定答者勿他鑒我無知因即輕笑我應語言於天祕密義不應皆説等二行諂者作是思惟非我淨天一切隱密皆許記別謂自所證及修淨道作如前語三懷恐怖而無記別勿我昧劣為他所知由是因緣不得解説以此怖心而為其室以自安處故名懷怖作如前語四有愚戇專修正行不能矯言但作是思諸有問我我當返詰隨彼所問我當一切隨言無減而印順之頌人天至靜慮涅槃者釋曰明五現涅槃論一見現在受於人天五欲之樂便謂涅槃二厭五欲現住初定以為涅槃引在身中名為得樂見他現在住定亦爾下皆準知三厭尋伺住第二定以為涅槃四厭諸欲尋伺喜故現住第三定以為涅槃五猒諸欲乃至入出息現住第四定以為涅槃以上諸頌明六十二見行差別頌遍一至前際者釋曰遍謂四遍常一分謂四一分常無因者二無因邊謂四有邊矯亂謂四矯亂過現二世皆名為前現在待於未來世故故亦名前即四矯亂雖對現起形未來故故名為前或聞先教因起斯執據教名前頌所餘四十四皆後際攝者釋曰數計可知皆計未來名為後際頌遍至皆遍見者釋曰邊見之中有斷常別謂四遍常四一分常有想十六無想八論俱非八論合四十論名常邊見七斷滅論名斷邊見常斷二遍合四十七頌即彼二無至因皆邪見攝者釋曰總十五類非我後起皆名邪見略展疏頌餘多文義備如章辨經或以膠漆布等者問優婆塞經不許用膠此何即許略有兩釋一云不許用皮骨等膠得用木膠二云開遮有異意也經若使人作樂等者問有經云音樂不施壞淨心故今者何故持以供養答邪淫之樂蓋損淨心真正之樂讚德長善故施不施斯有別也亦如此方鄭衛新聲等樂謂之為邪大夏大韶等古樂謂之為正邪則滅國亡家正則光德誡貞故按春秋感精符曰公卿大夫使八能之士擊黃鐘鼓以德賀於人主又云舞八樂皆以肅敬為誡又按韓詩外傳云湯作護護者樂名救護為義聞其宮聲使人溫良而寬大聞商聲使人方廉而好義聞角聲使人惻隱而仁愛聞徵聲使人樂養而好施聞羽聲使人恭儉而好禮又按魏文侯問子夏新樂之意子夏答新樂之發也淫於色害於德又史記云紂為朝歌北鄙之音身死國亡又禮記云鄭衛之音亂世之音也桑聞健上之音亡國之音也以此況彼理可明矣疏五聲按漢書云聲蕩滌人之邪意至主其正性商章也物成就可章度也角觸也物觸地而出戴芒角也宮中也居中央暢四方唱始施生為四聲網也徵祕也物爽大番祕也羽宇也物覆藏字覆之也疏八音者按禮記樂記云凡音之起由人心生人心之動物使之然也感於物而動故形於聲爰成方謂之音注云方猶文章問何用戒八八節於何答按國語云金石以動絲竹以行匏以宣之土以贊之革木以節之物得其常曰樂極極所集曰聲聲相偶曰和細大不踰曰樂如是金摩之石擊之絲木越之匏竹節之鼓而行之以節八風即八卦之風疏干威羽毛者按鄭玄注云干楯也威斧也武儛所執羽翟也旄旄牛尾也文僲所執經簫者按通俗曰舜作簫其形參差像鳳翼十管長二尺易記曰易夏至之樂補簫簫長尺四寸鄭玄注云火數七又夏時火用事二七十四簫長由此也釋名曰簫肅也其聲肅肅而清流又簫經笛者釋名曰笛聲滌又風俗通曰武帝時丘仲所作笛滌也所以滌邪穢納之雅正長尺四寸七孔也疏琴者又按白虎通曰琴禁也以禁止淫邪正人心也又爾雅伏羲氏琴長七尺二寸上有五絃經箜篌者釋名曰師延所造靡靡之樂後出桑間濮上之地蓋空國之候所存也又續漢書靈帝時好胡服作胡箜篌又風俗通曰箜篌一曰坎侯按武帝祠太山太一后土令樂人侯調依琴作坎侯言其坎坎應節也侯以姓冠章也經曰琵琶者按釋名曰本出於胡中馬上所鼓也推手前曰琵引却曰琶取其鼓時因以為名也經鐃者釋名曰聲錿錿也疏兩司馬執鐸者三禮圖曰鐸今之鈴其匡銅為之木舌為木鐸金舌為金鐸又説文鐸大鈴也釋名曰鐸度也號令限度經歌者按釋名曰人聲曰歌歌柯也以聲吟詠有上下如草木有柯葉尅莫言歌聲如柯也問何事宜歌答按禮記子貢見師乙而問曰賜聞聲歌名有宜如賜者宜何故也師乙曰夫歌者宜已而陳德也動而天地應焉四時和焉星辰理焉萬物育焉寬而靜柔而正者宜歌頌廣大而靜疏遠而信者其歌大雅恭儉而好禮者宜歌小雅正直而靜廉者歌風肆直而慈愛者宜歌商溫良而能斷者宜歌宮疏間俱胝耳等者按西域傳云室縷多頻設底拘胝唐云聞二百億古譯云億耳謬也伊爛拏鉢代多國昔有長者豪貴巨富晚有繼嗣時有報者輒賜金錢二百億因名其子名二百億洎乎成立未曾履地故其足毛長尺餘光潤細軟色若黃金後頻婆娑羅王聞之欲見長者自家至城鑿渠通漕以滿芥子御舟安止以送於子冀免象舟沈蹶之患先禮世尊佛以加夫呈足事王善其禮因而放歸便從如來出家得果餘廣如傳恐繁不録疏一切法中略有兩種等者已上按文而以釋之已下指法明於三性用聊簡也非是別釋經爾時諸梵王至請我轉法輪者問既為衆生而出於世即可自説何待請乎答佛雖不須為令請者而生福故故請方説故七卷金光明經云請佛轉法輪能滅謗十二部經罪問何故天請答有二釋一外道多事梵王梵天既請即外道心伏二天以勝人故明天請問大通智勝子請在前梵請居後今何異彼答注經云前佛出於好世子繼父業濃釋迦出惡世子繼父業薄故有差別疏挍獵者挍有二釋一李奇云以五挍兵步獵顏師古云以木相貫穿總為闌挍遮止禽獸而獵取之疏縱獠者獠音力豫反按爾足霄田為獠郭璞云江東呼獵為獠即今夜獵載爐也照也疏頭藍子者訛也正云嗢達洛此云猛盛疏阿藍迦藍者訛也正云阿波羅荼此云逢遇疏相傳解五人等者今按佛本行經三十四云一陳如二跋提梨迦此云小賢三婆娑波此云起氣四摩訶那摩此云大名五阿奢諭時此云調馬疏所説沙門性等者彼論明彼沙門性已復明沙門性之異名諸無漏道為沙門性懷此道者方曰沙門婆羅門等即異名也若依世俗婆羅門等與沙門異依勝義理真沙門性經亦説之為婆羅門何以故遣煩惱名婆羅門若能勤勞息諸煩惱是沙門義故據勝義彼即此疏亦為梵輪等者即沙門性異名梵輪從能轉説故彼論云亦名梵輪是真梵王力所轉故佛與無上梵德相應是故世尊獨應名梵由契經説佛亦名梵亦名寂靜亦名清涼疏於中唯見道等者於此真梵所轉輪中唯依見道説名法輪所餘皆非名法輪也疏謂正見至故名法輪者正見等四要依於戒而緣境生故似於輻依轂而有正語等三以戒為體戒是衆行所依處故如世輪轂為餘所依正定能攝正見等四令不散故如世輪輞故唯此八得法輪名餘法不類疏寧知等者彼論問詞憍陳那等彼論答也憍陳如等見道生時地居天神即傳唱言世尊已轉正法輪故故知見道名為法輪不爾如何名為已轉修無學道元未轉故此據為他不約如來自轉法也先已得故推於如來為能轉者令所化者生尊重故故不説自疏天親論至立法輪名者此難意云由有宗説眼智明覺顯示三道故名轉十二行相是故難云十二行相不唯見道亦通修道及無學道云何可説唯於見道立法輪名疏是故唯應至可應正理者天親菩薩依經部宗或述自意以申正解按彼論云三周修歷四聖諦故謂此是苦等是見道四謂此應遍知等是修道四謂此已遍知等無學道四故成十二釋曰即此三轉十二行相所有言教四諦法門各法輪體可應正理疏或諸聖道皆名法輪者天親菩薩第二釋也通取見修無學等道皆是法輪不同有宗疏於所化身中轉者釋其轉義疏於他相續至名已轉者此會於前已轉之妨疏成實論至作一空行者按撿成實上下無如疏引之文唯二十三見一諦品云問曰若不以四諦得道當以何法得道答曰以一諦得道所謂為滅如經中説行者觀此五陰空無我故如瓶中無水名曰空瓶如是五陰中無神我故名為空如是觀者亦名為空亦名知見次三慧品復云三慧次相依生議曰疏主但取論之大意而以為言非具録論疏主造判其所授證多分如此然更細撿疏前為後因等者如聞為思因聞思復總能為修因見為修因名等為後因見修總能為無學因名合為果因餘準此知疏見修無學隨次第等者智見現觀如次配彼見修無學故彼論云三周正轉隨其次第智見現觀名得方便應知於入諦現觀時如實了知是苦諦等説名智位從此已後於諸諦中復有所作應當遍知等由此觀故説名見位於無學地如實解了我已遍知等名現觀位疏是梵增語者略為三釋一如來非梵非不梵也強目為名故名為增以一切法言詮不逮皆是識變假施名目名之為增二法本離言而以名句增益於聲有所詮表故名為增三增語是名謂如來有是梵名故説名為梵疏此四種若伏若斷等者教理行果為四法也疏得方便至菩提因者問見修二道可名方便得菩提因無學滿位自是菩提更對於何名因方便答略為二釋一菩提涅槃俱名菩提能證為因所證為果約於此理無學道位稱因方便二雖至無學猶須初起已滿知等四稱行相四種行相與後之位為因等也由斯二義故疏説云前為後因疏依詮門至通三世有者略有二解一云謂苦等諦屬於三世苦等諦下擇滅之理不屬三世由斷依世苦等諦故顯得彼理故苦等諦為能詮也故依能詮説所顯理通三世也二云此辨第三滅諦理也即能證智斷所斷惑而能顯之故名能詮從此能詮説有三世所以諦諦有彼眼等四種行相議曰前説雖得非疏本意後解為正如文可語疏然見道前至不同修道者由修道前有彼見道無漏法故又亦自起無漏法故故有漏道伏亦名轉見道以前全無無漏故伏不取疏彼以法忍至如次為四者然俱舍論不釋眼等亦不配於法忍等也按婆沙論七十九中而有兩釋初解即以法忍等四配眼等四如疏所引第二解云眼是觀見義智是決斷義明是照了義覺是驚察義釋曰前解約見道後解通三道今疏彼言即彼婆沙第一解也由唯見道作八諦觀有忍等四修無學道但觀四諦非作八諦故無類忍及類智也是故諦諦四行便不足也疏此是佛為他三轉等者問但諸聲聞皆賴如來三轉法耶答不定如遇世尊得四果者佛為三轉若不見佛而得果者即非佛為隨其所應蒙於如來一二轉等或總不蒙由不逢佛及逢於佛得果別故思可知也若爾云何名為他轉答有二釋一據逢佛二雖不逢然遇如來三轉之教而得果故攝教歸佛亦得稱為佛為三轉疏令他至深生信解者問陳如得理於佛所證可生信解彼地神等既未得聖如何於彼陳如所證而生信解答由佛唱言陳如解法神信佛言故於陳如所證生信故婆沙四十一云佛告他言我轉法輪苾芻見法故彼得聞問何故告他答世尊自顯於九十六道法之中最勝無及復次顯陳如等真實功德亦令世間良福田故故告他知問會中亦有餘天神等何緣地神先唱告耶答由彼地神先發聲故問何故先發答彼恆隨佛作衛護故今見如來轉法輪已歡喜自慶我先施功令得果滿故先告唱復次地神性經𮜒故復次次第近遠法故地神近佛所以先告疏其輪能寂本性寂者本性寂者即是真如本體寂理法輪境性可名法輪昔未轉時煩惱所覆今轉法輪生聖道故煩惱都盡本性真如其理便顯故言能寂其本性寂疏希有法智天人證者三乘所獲無漏正智名為法智此時天人方能得故名之為證疏獨覺至得燸等法者問有經亦説緣覺化生而亦得聖一何乖反答若現神通令他得果理即可然説法不爾故大法炬陀羅尼經第二云彼辟支佛具足智慧然復不能説法度人問為總無説為亦少説答亦少説故佛本行經云爾時梵德王到辟支佛邊時辟支佛少説諸法令王歡喜踊躍無量顯示善事若有處言不説法者而有二意一不多説故故名不説二説法不能令他得聖亦名不説問觀佛三昧經第四云諸辟支佛擲鉢虗空作十八變諸辟支佛一一足下皆有文字具説十二因緣答彼經不言一切辟支皆不説也容有即得疏鶻盧支佛等者傳有二釋一此云父所愛以最小子父意偏鐘名所愛也二此云啼哭由聞諸兄悉先成佛恆常啼泣憂無生度因立名焉疏獨王一劫者今賢劫數總當兩箇八十增減九百九十九箇世尊住八十劫最後如來獨居一箇八十名為一劫疏十二劫後有莊嚴劫者問按藥王藥上經云昔有三千人稱三十五佛名乘此福祐故一千人莊嚴劫成佛一千人賢劫成佛一千人星宿劫成佛準彼經文莊嚴劫者乃過去劫答應是諸經説不同也或此疏誤法師上生疏中亦説莊嚴是過去故故知疏錯疏迦葉佛住壽七日者問按萬佛名經云迦葉佛壽命二小劫我釋迦佛壽命最少得一百歲如何相反答見聞有異諸教不同此例非一疏説法希等者亦如日月燈明佛從於初佛經二萬佛已後燈明佛方説經故為希聞經懸遠值遇難者如經中説佛在之日有婆羅門其妻端美愛染尤重不肯出家每自念言世世有佛後出非晚時遇世尊便白佛言未來之世更有佛耶佛答之曰未來佛者數如恆沙聞之便去去未遠而自念言過去有乎若有者吾何不遇旋回問佛佛言過去佛亦無邊聞已便悟過去有佛我既不逢未來佛者焉知即過便請出家因得初果譬喻品疏卷第五論七種具足煩惱衆生者略有二釋一云凡夫文言具足煩惱性故若有學聖不得説言煩惱具足二云亦通有學有學之人何名具足答具足有二一約界言二約惑數體言若據界言前二果人欲界有斷不可言具約體言之下界煩惱未全除故故亦名具議曰前正後謬何以驗之論云第一人者而求人天妙境果報故名顛倒豈有學聖而求此耶又前二果分別全無第二果人俱生定初果不定惑既有闕云何説言約體名具故知謬矣疏總顯下二十六品明此三義等者然此三義於下品中有具不具或全無者具如疏示既寬狹異亦可相望以為四句義雖匪難助為光飾故具之也及文殘等為四四句第一七喻三平等為四句者一有喻非平等有五品謂信解藥草化城安樂壽量二有平等非喻有七品謂授記授學法師寶塔天授勸持不輕三俱有有二品謂譬喻五百四俱無有十二品謂踊出分別隨喜法師功德神力藥王妙音觀音陀羅尼妙莊嚴普賢囑纍第二七喻對十無上以為四句一有喻非無上有二品謂譬喻信解二有無上非喻有十五品謂寶塔踊出第十無上有十四品除安樂一三俱有有五品謂藥草化城五百安樂壽量四俱無有四品謂授記授學法師天授第三平等對十無上以四句一有平等非無上有五品謂譬喻授記授學天授不輕二有無上非平等有十六品謂藥草化城安樂涌出壽量分別隨喜法師功德神力藥王妙音觀音陀羅尼妙莊普賢囑纍三俱有有四品謂五百法師寶塔勸持四俱無有一品謂信解第四上下二殘相對以為四句一有上非下有六品謂藥草化城五百寶塔涌出壽量二有下非上有十三品謂法師勸持分別隨喜法師功德神力藥王妙音觀音陀羅尼莊嚴普賢囑纍三俱有有一品謂安樂四俱無有六品謂譬喻信解授記授學天授不輕疏十無上有二十一品等者問説大通事明修大行名行無上譬喻牛車亦大乘因何非無上答譬喻正明在三界中為説三乘漸令出宅非唯辨牛故非無上疏十無上是七喻三平等殘者問殘言為目十無上義為目説彼無上處經答乍觀疏文似目無上之義準論據疏目彼經也明無上經是明七喻三平等經之餘經也故論云無上義者餘殘修多羅明無上義準此論文殘俱詮經不目無上疏文稍略讀者多迷故重言也疏上殘下殘等者論文兩處而説殘言前後不同故疏名之為上下也問詮平等經亦在喻後何不名殘答喻與平等俱言治病為意相似故不名殘無上意別得名殘稱問無上居後可名為殘亦有在於喻等前説何得言殘答論以七喻平等無上挑為其次縱有一二無上在前而明從多類言總名殘也下殘準此疏謂凡夫有學等者簡聖有學故置凡言有所欣求而修作故名為有學不同常説或此凡夫實非有學未得聖故對三平等無學之人故名有學疏如執化城至無所求者舉此意明七種譬喻皆對有學不對無學城如下辨疏無煩惱人至義意如此者總釋論意如疏可知別解論文依疏難解故今牒疏不釋之處而乃釋也論云三種染無煩惱人者明所為人言三昧解脫見等染慢者明所治病釋上染也三昧解脫見等是起染處染慢正是所起之染故勝鬘云阿羅漢辟支佛等為無明住地之所覆障故所應斷法不斷所應得法不得是故無明住地積集生一切煩惱謂正受上煩惱果上煩惱智上煩惱如次即是此中三昧解脫見等等言等餘謂勝鬘經總別因果有十四句明起染處等餘十一未得究竟自謂滿足以斯高舉稱之為慢問本意明執生死等異名三染慢何假舉彼三昧見等答舉於見等而有染慢證此三處亦有染也若不引明恐疑無學無斯染慢疏乃見惑等後苦下生等者後得心粗緣根本智及於真如皆悉不得遂見如行位所作假解惑不生等故心變作得涅槃想解指此能變以之為車疏今説至與之遊戲者如文可悉復有義見道以前發菩提心十信等位未得無漏並名世間此位善等名世間功德無貪瞋癡名為善根有漏禪等名為三昧由彼正貪三界等故説無貪等著五欲等外世樂故為説三昧説之令依名令遊戲因斯後得入大涅槃議曰疏及餘義悉為難悟疏難知者經言火宅宅有三子告與其車車亦言三論釋經意總言與善不定其數何故唯取二乘能變想解為車名世善根而擯菩薩若言如來本為二乘説火宅者何故子車皆言有三答佛為中根猶未體悟乃敘昔授二乘果意故陳火宅誘進之事論取經意但説二車為世間善不爾牛車既唯無漏何名世間正是所行何名方便餘義難者準經陳車車在門外見道前善豈門外耶又説火宅普示諸子與善令戲但及大子餘何不沐故難依準本疏為善疏能入牛車即是菩提者問準經牛車乃是因行何故今説以為菩提答牛車運載理通因果今據果談不違下説疏二乘至皆息等者論據假解所變之法經依解脫道中所證之理名為涅槃望義有別至品當知疏前後諸智皆悉不能了一切法者略為二釋一加行後得如次前後二根本後得以為前後疏如二乘所起四倒者略有兩釋一謂我生已盡等二謂無常等四理皆可通疏今為對治至説此車喻者問經中叵為中根説之豈此中根名求勢力答此之七喻皆有二意一為中根佛敘昔為説二乘意二為現在凡夫之類耽世樂者説彼三界名為火宅令厭出離今昔兩人皆是顛倒求勢力也非望中聖名求勢力故無過矣餘準此知問第一人者先求世間人天勢力今還與彼世間善根此增其痼何成治疾答世間名同體位全別前世間者天人等善後世間者二乘無學後智中善二既不同故知無過譬喻品者解如疏文注經云譬以標事言心及事疏餘品不單名譬喻者餘下六品雖即是喻亦名信解藥草等故此品唯祗名譬喻也亦猶色法有十一種眼所取者上祗名色餘即亦名眼耳等也眼所取者雖摽總稱即目別名此亦爾也疏聞今一實解昔三權者問昔三中一與今一同云何昔三總名為權答實唯有一昔説有三故稱權説非三中一而亦是假名三為權疏如阿羅漢疑黑鹽等者傳釋云鹽豉名黑鹽甲蟲似彼時有無學乍見甲蟲謂之豉也或西域有鹽為顆黑色而似彼蟲問法執事疑初地初斷八地永捨鶖子云何言永盡耶答昔疑己身不作佛等此疑永盡非言一切事疑皆盡又但伏盡名之為斷非斷斷也未得無漏法空智故疏勝鬚云得佛餘財者餘歎二乘能信佛語於佛法身起常樂我淨等四想是名正見是佛真子得法餘財亦有本言得法餘財餘財之義略有二釋一云二乘回心得佛七聖財是自二乘分外之法名之為餘非是佛用不盡之物名之為餘二云地上得理名為正財今但得教説為餘財教是理餘議曰言佛餘財前解無爽言法餘財後解為勝受本言法疏佛口所生等者説法之音從佛口出依聲生解解從根本名口所生疏法隨法行之所生故者法謂教法隨法行者能行行人隨教行故名隨法行由隨教行能生修慧問依教行生何非聞慧答從初因説故瑜伽云隨法行者於因轉時法隨法行由聞他音內正如理而思惟故釋曰初起因時名因時轉疏即思修至隨應生故者思慧從彼如理而生即緣理生修慧從彼法隨法生即緣教起疏法身有二小乘大乘二乘異故者真如出纏名大乘法身或有處説自受法身總名法身真實功德所依處故戒定慧等五分法身小乘執此為佛法身有云大小皆有五分法身雖有此言而未見文明大五處恐為謬釋疏此中有四至為一句者瑜伽有六此闕第二合有五句由此經中從法化生一句含彼第三第四生攝第三化攝第四法字通下生化二處疏又有義至理未必然者失大法以下四大段文也疏厭賤捨受等者捨受有二相一隨順相二不順相今談第二名厭賤捨謂住小已將永失大是故厭捨所得小果此不順捨與憂相似從憂名説問何得故離欲憂乃無耶答憂相粗動杖境而生上界無境憂故不起何為明證按出曜經第三云憂者欲界非色無色何以故以其彼界性無憂故所以生憂者有父母國財妻子僕從奴僮田宅財穀此諸居業皆亦為憂永無此者終無有憂故離欲捨疏猶如奩成者三蒼盛鏡器名也韻集云奩𣫍也收𣫍物也蒼頡篇盛鏡器曰奩謂方底者也疏都羅綿者都羅樹名此無相當故不譯也綿從樹出名都羅綿如言柳絮絮依抑出得柳絮名疏翳泥耶仙鹿王腨者翳泥耶者即閻浮提樹下金色也此色似於彼故得名焉疏如諾瞿陀者相傳解云是樹名也而稍似柳非即是柳或云此云無節樹由此古人謂尼俱陀樹此名柳也非為善釋此時圓滿故以比之疏如頻迦音者此云哀怨音又本行經音云迦蘭陀鳥或羯蘭鐸迦此釋云好聲鳥也案外國外傳云其形似鵲但此鳥群集多栖竹林昔有國王於林睡息蛇來欲螫鳥鳴覺之王荷其恩散食養鳥林主居士遂從此為名疏烏瑟膩沙者此云頂髻亦云重頂骨故無上依經云頂骨涌起自然成髻是也又婆沙論抄云量如覆捲善圓妙疏猶如天蓋者梵天可等行在上有蓋佛頂如彼如彼疏如末達那者此無相類諸經論中不見譯也疏亦不逶迤者説文云行去也疏云逶迤逶迤德之華貌也傳曰迤迤者行可逶曲迹也亦自得之貌也窊邪也今經意者取委曲迹及窊邪也餘非經意疏足去地四指者為離疑慢故也故智度論三十八云佛若常飛衆生疑怪謂佛非人則不歸附若足到地則以為與常人不異不生敬心是故行地四指不到而輪迹現問若爾何唯四指答設有減增終有其難何必為通或顯如來具四神足異乎群聖疏好巡舊處者雖富有年而華容常固名巡舊也疏三十二相由行五修等者三十二相八十種好有總別因其總因者登地已去福智二資一一皆能感於彼故故瑜伽論三十九云如從清淨勝意樂地一切所有菩提資糧無有差別能感一切相及隨好其別因者論有三類感相好因第一類者有六十三因如文録第二類者唯有一業當知皆用淨戒為因而能感得何以故若諸菩薩毀犯淨戒尚不能得下賤人身何況能感大丈夫相釋曰此以戒是諸行之本故作是説第三類者四種善修一善修事業二善巧方便三饒益有情四無倒回向一一修中更有差類感相等也恐繁不具又按大集經第六云如來成就無量功德是故得成三十二相我今於是無量事中當略説之如來至心護持淨戒得足下平相修行種種惠施業故得千輻輪相不欺一切諸衆生故得足跟傭相護正法故得指纖長相不壞他衆生故得網縵相妙服奉施故得手足濡相淨飲食施故得七處滿相喜聞佛法故得鹿王腨相覆藏他過故得陰藏相修善法故得上身如師子吼相常以善法化衆生故得缺骨平滿相救護怖畏故得臂肘傭相見他事業樂助故得手摩膝相常修十善故得淨身相常施病藥故所食之物至喉悉現相常發莊嚴修善法故得師子頰相於諸衆生其心平等故得四十齒相和合諍訟故得齒察相珍寶施故得齒齊相身口意淨故得二牙白相護口四過故得廣長舌相成就無量功德故得味中上味相於衆生中常柔濡語故得梵音相修集慈心故得紺色目相至心求於無上菩提故得牛王睫相讚歎他人所有功德故得白毫相恭敬父母師僧和上故得肉髻相樂説深法故得身柔濡相施敷具故得金光相遠離聚説世間事故得一一孔一毛生相樂受善友師教敕故得身毛上靡相不以惡事加衆生故得髮色金精相常勸衆生修三昧故得身圓滿如尼拘陀相生生之處作佛像故得那羅延力相又大般若四百二十五云三十二相是一一相百福莊嚴八十隨好一一好有無數量希有勝事問菩薩先修何相之業答按婆沙論一百七十七云問菩薩所起三十二思於諸相中先行何相有説先引足下平滿善法之相後引餘相先安其足後及餘故有説先引目紺青相先以慈目觀世間故如是説者此則不定隨此相緣合則引此問何名相好復何別答色之相狀易可了知名之為相令身端嚴名之為好相粗好細是差別故瑜伽云如是諸相是有色故劣中勝品諸有情類易可了知由極殊妙令端嚴故説名隨好問隨好為在相之處所為不爾耶設爾何過二俱有失若在相處何不相奪若異處者異處者何答且依婆沙在諸相間隨諸相法莊嚴佛身令極好妙相與隨好更相顯發如林中華故不相奪問何位初得及圓滿耶答瑜伽論云諸相隨好若諸菩薩始入淨勝意樂地時已得異熟從此已上展轉獲得殊勝清淨問輪王亦得與菩薩得而有別耶答菩薩得者望彼四勝一熾盛二分明三圓滿四得處廣如大智度論疏不見諸佛大人相等者佛備衆德道逾群聖鶖子不見佛如是德不生企慕恭敬之心名為不見非眼不見名不見也疏不往佛所等者問彌勒下生經云大智舍利弗恆隨佛轉法輪今論云何言不往耶答不為欲求大乘之法往於佛所非全不往疏由見佛至功德果故者若能知見佛殊勝之德必定求大故我自身於當來身得無量德自身異身皆舍利也二世別故立自異名餘文可悉復有先德釋論此文與今疏別亦有一家之理今略言之不見佛等者初值馬勝時未見佛故於佛所不生恭敬等心不往佛所者逢馬勝時不往佛所也若往佛所知佛有示現教化衆生力便不取小果由不往佛所故取小果失化物之力見佛自身異身等者自身即本身異身謂化身見此二身別獲無量功德當知不見不往佛所失無量福聞法等者值馬勝時聞説三諦時得道竟不聞佛説若聞佛説知佛能作利益之事便不取小由不聞法不知此事故取小果不供養等者值馬勝時未供養佛若供養佛知佛示現化衆生力由不供養故不知此事又佛所以可供養者為佛能有化物之力我若供佛亦得此力不證小果由不供故故失斯力恭敬等者值馬勝時未恭敬佛以恭敬故得解脫等由不恭敬便失此利議曰義既萬端此彼皆得取論玄意本疏可觀智應悟矣不待指陳問論何不釋八十種好答有釋此猶屬金色三十二也又屬見佛等中故不別釋若今釋者論牒經云放金色光明者此一句中雙含相好二中俱有色光明故示應無失疏既令悔除故名無漏者能令二乘悔等除故為此説佛名為無漏難思議也經世尊知我心拔耶説涅槃等者問鶖子初因馬勝入道捨邪歸正云何今言佛知拔邪答按智度論云頞將入王城乞食佛語之曰汝今日若見非常之人勿廣説法果逢鶖子即是世尊知其心也時頞為説偈云諸法因緣生是法緣及盡我師大聖主是義如是説此偈之中而明三諦初句苦諦第二集滅雖有三諦正明涅槃雖頞説無是佛教推功歸本亦無過失問何不説道答説所治證顯必有彼能治證道理準可知故不具説故智度論十八云此偈俱説三諦當知道諦已在其中不相離故譬如一人犯事舉家受罪疏曾六十劫行菩薩道等者有問云論判此經所有劫者晝夜月年云何少時所值佛多答論據大分非言一切今六十劫取增減劫又縱時少佛多無失如常不輕臨終之時又值多佛彼既得之此何不許議曰為難謬矣論判此經非斷一切六十劫者乃出優婆塞戒經論不釋彼何得為難問鶖子經時自亦遇佛何假能寂言我化耶答如釋迦出世博徒匪一以近明遠何不許哉衆生繫屬緣不同故如長者婢使佛化不從而歸慶喜其類實繫具如經論疏大性近生而遠就等者略有四釋一云大乘種姓先未就故名為近生得無學後堪聞一乘名為遠就二乘種姓而先熟故堪聞説三名為近熟得果還捨名為遠生二云得羅漢已今始回心名為近生餘同前説三云大心先發名為近生小心後發故名遠生大果後得名為遠熟小果先得名近熟也四云只如鶖子昔自發心先修大行其大乘心望本異生鄰近而起名為近生三祇果圓名為遠熟時長久故其聲聞性果經三生六十劫得名為近熟時短促故因隔大心後時方發名為遠故準此生者生起之義熟者即是成就之就議曰若觀疏意及理分明第四釋善今以理準望餘不定及舍利弗等可為四句兩句如疏第三句者小姓近生而近熟創從凡位即發小心望凡為近三生六十即得果故時促名近大性遠生而遠熟隔二乘位方發大心去凡位遠名曰遠生三祇得果時長久故名為遠熟疏汝今悉忘至有四解者第一釋中先小後大有憶不憶復不約時第二約時先大後小故二別也細思方悟疏未入十信至得入大劫等者此意説云羅漢發心經二萬劫方至十信況從起彼大乘心後不徑多劫即遇佛耶由此故過無量劫後始遇諸佛方入大劫今助一釋言無量劫總談從初盡得佛時於中而行供養等事故下偈云供養無數佛乃至過無量劫已劫名大寶嚴等故知通説至佛果時若不爾時凡夫未發大心之時尚數逢佛況無學聖復發大心經歷長時不覩諸佛更恐疏二記體等者記體尅性行蘊中收記用實體色行兩蘊名句文聲假實別故若依相應體即四蘊體用合言具五蘊攝思可知也疏後入法界至非應化者問彼已發心云何此會復言回趣答彼發信有菩提之心非發未趣菩提心也此發趣求故與彼別或華嚴經非一坐説舍利發心未必即是法華會前議曰前釋理通後解不可雖非一座無文有説在法華後縱言有會在法華後此已發心後何更發今助一釋華嚴會所文殊加之令發信心而蓋傍被為後法華趣求之漸今正為説而重令彼生決趣心授佛位等亦如善現於般若會而言發心皆今漸也疏九淨華者具如義決疏法義之門至二解皆得者因教義顯教為義門由所詮義方有其教義為教門疏有云安行至猖獗行者今觀古釋理亦可通諸佛得名隨緣不一如言不動能寂慈氏佛皆處定遣障慈悲豈有散亂囂煩瞋害諸佛此三世尊方得名耶此既尚然安行何過又言華足足對安行文義相協以此言之古釋應通疏今華光至不咸正法等者問按法華論斷此經中所説劫者晝夜月年以為其量華光世勝人之與法俱合修長三十等年一何短促答論據多分或雖言年非要一年即為一劫百千億年而為一劫亦不去年義或但談今法華時事如踊出等所經之劫據月年等非有違也經各各脫身所著衣等者問比丘奉衣雖成檀慧離衣犯禁豈不招辜故大品經中三百比丘脫衣上佛而論釋云十二年中未制戒故不犯衣戒今法華會年已四十固應成犯答略有二釋一云既聞一乘悟解正法得正法戒離衣乃是息世譏嫌故捨衣無罪二云經文之中而有總別心喜踊躍四衆皆然脫衣以奉別屬於倍疏住空至情悲蠢物者按爾雅云修息也郭璞又行遍巡歷也復有義表心離者故住虗空亦不滯空故自回轉又昔協異解於理為背今信理同轉背成向內心既轉外物亦回疏具十一種積聚義故者按對法論第二卷云問薀義云何答諸所有色若過去未來現在內外粗細劣勝遠近彼一切略説一色蘊積聚義故如財貨薀如是乃至識薀釋曰自身名內所餘名外有對名粗無對名細又欲色界或相對立非可意者名之為劣所餘名勝又不善有覆名劣善淨無記名勝去來名遠現在名近又可見處名近不可見處名遠彼過等體雖復不聚而由總合置乎一色名一多體多體稱聚故體是薀又十一名聚故得薀名其所詮體不離能詮故亦薀釋論釋云當知依止十一種愛所緣依處故於色等法建立過去等差別十一愛者諸顧戀愛希望愛執著愛內我愛境界愛發愛定愛惡行苦愛妙行樂愛遠愛近愛由如是愛所緣境故如其次第立過去等種種差別釋曰染內身耽外境樂欲界欣定地惡行苦愛略有兩釋一云不善五薀能感苦果於此苦果起無有愛二云不善五薀能感苦果於能感因生起愛心妙行返苦餘易不釋疏返正為乏等者按三蒼云叵不可也返正為乏𠚪為𣥖反可為叵皆字意也疏中舉彼反正為乏相從來也有疏作之寫人誤也經是學無學人等者問千二百人皆是無學何故今説為有學耶答略有二釋一云於彼所是可學法中並已學畢故云是學無學非有學人名為是學二云此是有學與千二百無學學別故別舉也謂得涅槃執有餘也議曰有餘涅槃有學未得云何執有有餘涅槃名為得耶若言當得何簡無餘俱可得故復無文故疏田喻智斷等者問恩德亦是生他德處何不見取答本末真化而有異故故不取也議曰據生他德恩德為優縱設取之亦乖何理問斷德理一何得稱多答約能詮説疏依佛為主故言有一者問若爾何故宅頓弊耶答佛是主故故得一名體即異熟何廢頓弊豈世之宅屬於宅主遂令宅主同宅無情疏初三唯説中大正門等有復有義諸外道教並不能離生死苦故乃多異也唯依佛教方能出苦稱一門也對外道異故名一門此通大小教總稱一佛教也議曰義出多途非無此理然觀經意疏尺應長所以知耶答初云其家唯有一門下文又云復更思惟是舍唯有一門唯此下上一門之體理不應別下門自判唯是大乘上何不爾不別之理思可悟也問初門若非三乘教者何故下云以佛教門出三界苦豈二乘法非佛教耶答初門與彼佛教門異故後通三若不爾者何不即今依初門出而須設彼羊鹿等耶疏四識住也者四薀是識所住處也問佛何意立答為破外道以諸外道皆計四薀我住其中故云識住非我住中問此體是何答即四薀問何不取識為識住體答無獨緣識而起貪著如色受等故不説識以為識住不如餘四皆增上故緣之而得別起貪等又佛説心本性清淨不如貪等性非淨故故識非識住問此之識住為唯有情為通無情答略有二釋一云有情如俱舍論世間品中有情世中明識住故二云通二既約所緣立於識住由斯識住通情非情問無漏薀等為識住不答曰不立以能益識起貪瞋等是為識住無漏之法破裂生死非識所安不為識住疏泰山其隤者按禮記擅弓上曰孔子負手曳杖逍遙於門歌曰太山其隤乎梁木其壞乎哲人其萎乎今疏舉此顯字所從夫子歌者傷自將逝疏從秀貴聲者略有三釋一云經中頺字取秀旁貴以之為正從者順取義也二云依秀貴二以為一字名之為從秀貴同聲名為聲也非斷經文合取此字名之為從或可應言從秀貴也頺究二字聲相近故故言聲也疏住秀者筆誤也後解勝也疏瑜伽十六至日親之所説者釋迦如來而姓日也取姓彰人是佛親言名日親説故大悲經第四云如來姓日性日者為離諸暗而作光明疏六欲天無皮肉等者皮肉既無云何得有目於骨肉有舒緩等故瑜伽論第四云復次諸天其身內外皆悉清潔無有臭穢又人身肉多有不淨所謂塵垢筋骨脾腎心肝彼即皆無故知欲天無皮肉等若爾云何被於非天斷支節耶答雖無皮肉餘鄙惡色何廢依於淨妙之色有形相別立於支節豈可支節要依皮肉由此無妨疏依華嚴十喻菩薩等者求大中小少多異故故以三數而為喻焉亦如此經三根聲聞上根唯一中根有四下根轉多疏所燒門者一乘教行復有義此名三界限為門故後文云今此三車皆在門外復言燒門故知三界以之為門問門宅何別答如世間人總舉一宅名之為門或稱一宅而言一戶今亦然也議曰甚有理也若經文勢接疏釋優也何者前若有門此所燒門可此之矣前既無門而此於誰雖言三界即是其門然前元無説為門處故無可此更審思之若依疏解前有一門故後此彼疏思以大乘果化者以大乘果而化於彼名為果化欲令二子頓得大果經唯有一門而狹少者廣釋如疏問云何得知以大乘法名狹小耶答按大乘方便經第一云譬如智人從空澤出望見一道唯廣一尺迫迮狹小其道左右有大深坑合云唯廣一尺者一支道也又云一尺迮道者是法性門也其道左右有大深坑者是聲聞緣覺乘也彼經既以大乘為迮小何故法華不名大乘為狹小耶彼經復云是法性門故知即是大乘教行復云左右深坑即是二乘即由礙彼名之為迮此約不容二乘名為狹小其理善順疏超過有漏名奇異者問前言二車二乘後得如何復説超過有漏答談彼所得無漏功德莊嚴具也疏根性稟教等者如次配前形貌力用等四問聲聞待教獨覺自思所證理同云何稱別答談所悟者淺深故異十二因緣四諦之教有優劣故又辟支佛暫爾聽聞即逾聲聞時長閲習若斷惑證滅二寶無差伏諸定障非擇理異故無爽也疏具有二恩者即二利也疏若以二乘所得生空等者問且不定性必能回趣得於種智自生空智可不名車定姓之人竟不不歸向必無種智豈全無車若爾無者何名自運名聲聞乘答今此偏依不定姓説若對定姓自生空智亦得為車不爾即有前之過矣疏理出教外等者問言門外者意談於車理之與果並不是車今言理果出於教因何預車事答所言理者非唯真如教之所詮皆名理故故智亦理又二乘果體亦智收出教出因故並無失疏涅槃經中説有二車至以半滿相形者問按涅槃深純陀文殊自比同驢乘言半教者即是二乘豈彼二士是中小耶答誰言半教即二乘耶不爾如何答半滿之字括乎多義一真俗相對真滿俗半要因俗諦方有滿故二世出世對生死煩惱業果等法以之為半涅槃菩提出世等法名之為滿要待生死煩惱等法方顯涅槃菩提果故三大小對明以分半滿四教理行果亦皆有之疏據前二言驢乘者是半教也不同古人唯約大小半分為滿故無失矣疏三獸被圍等者按智度論三十五云聲聞之人畏惡生死聞衆生空如圍中鹿既被毒箭一向求脫更無他念辟支佛雖厭老病死猶能少觀甚深因緣亦能少度衆生譬如犀在圍中雖被毒箭猶能顧戀其子菩薩雖厭老病死能觀諸法實相通達法空入無量法性譬如白香象王在獵圍中雖被毒箭射顧視獵者心無所畏及將營從安步而去疏無漏離繫縛等者問牛車離繫理在不疑羊鹿二乘云何離繫體有漏故答略有三釋一云二乘無學所有諸法皆是無漏若爾何故言二車體是有漏耶答由為其境能生他漏名為有漏體非有漏二云二乘身中有實有漏故二車體體唯有漏得漏盡人之所得故故名無漏三云至無學已更不為彼漏故名為無漏非體無漏名無漏也議曰後二理通前釋全非違多教故疏如説如來等者兩釋不同一云如來即住果也善逝者謂住因也二云返前如過去佛乘諸功德來成正覺故知談因趣來果也善事終圓名為逝矣故知説果議曰後釋應善順疏文意言證涅槃令生覺智如次喻也經心各勇鋭等者古德約位而以釋之心各勇鋭明外凡位七方便中前三方便謂聞思慧互相推排謂內凡位即四善根修慧位也競共馳走三果學人位爭出火宅無學位也故凡有內外聖有學無學議曰教雖無文縱配可爽經四衢者按爾云路四達謂之衢郭璞云交道四出者也又釋名云道四達曰衢齊魯呼四垂抱為衢衢抱地則有四處此道似之因以為名疏隨三乘至各索其車者問此中二乘為回趣者為未回心若已回心但合趣牛何求羊鹿若未回心自果已滿云何疏云皆於佛所專意希求答為二釋一云未回心者練根修定及餘功德亦名希求故疏次云求證諸法名索羊鹿諸法即彼禪定等也二云佛指種智名之為車出宅不得故專意求先所許智名為希求希求種智冀證諸法議曰順疏上下此後釋善疏亦應許上羊鹿者問許誰上耶答略有三釋一云古解既許菩薩而入化城亦應菩薩許上羊鹿問二乘入城亦登羊鹿可難菩薩而得入城應上羊鹿二乘入城元不登車何得難言菩薩入城應上羊鹿答實羊鹿車而是種智故難令上總難意云菩薩得無住即言許入城菩薩得種智何不升羊鹿二云若得解脫入有餘依名為入城菩薩雖未得有餘依及於解脫然得無住亦名入城亦應種智名之為車二乘雖未得於種智然亦得自生空後智亦應許彼登於羊鹿三云經不言於太子入城今許令入經亦不言二子上車亦應許彼登於羊鹿議曰後二為勝疏厭苦求息至故不稱入者此中但答城入不入不釋前難車上不上不上車易不明言之答城影顯若具答者略有二意一云大子求智所以上車中小不求故車不上二云大子得種智所以車言上中小種智無車無車不上議曰後解為優諸子索車皆求智故理可思之疏經文但説父勸令去者經文但言導師勸商令至寶所疏文言父取意説也導師父等皆喻説故疏喻佛種智等者舉果顯因今助一釋菩薩種智已出分段逾三界等名為高廣本明其子所乘車故疏不比小乘驢車之鈍者問何教明小以類驢車答按無畏德女經云聲聞如驢乘即其證矣疏詩云靜女其姝者按詩靜女篇序云靜女刾時也衛君無道夫人無德注云故陳靜女遺我以彤管之法古者后妃必有女快彤管之法后妃群妾以禮御君所女史書其日月事無大小記以成法彤管以赤管也以赤心正人者也德如是可以助之為人君之妃也詩云靜女其姝俟我乎城隅注云靜貞靜也女貞靜而有法度乃可説也姝華色俟待也城隅以言高而不可踰也箋云女德貞靜然後可畜姝華然後可安又能服從待禮而動自防如城隅故可愛也疏涅槃經至不可覺知者今依遠法師義以釋此文餘德同異優者附言死者是其害身之所名險難處有有云死技起時無通生路無物自資可以趣度名無資糧一死長往名去處懸遠有云死謝過去與現隔絶無人將送名無伴侶一受身已運運趣死無時暫停或可凡夫受身恆死名為常行有云死法來無時節名晝夜行未測遠近或多少難測名不知邊際有云死法覺廣際畔難識一入死分昏沈難出名為深邃諸根壞滅六識無用故曰幽暗無有燈明有云無有五根燈明名之為暗命盡便死無所由從名入無戶有云死法是惡不從理生死不離身名有處所最後一念命盡之時無所覺省名無痛處世醫拱手名不可治向之難裁名無遮止有云死支起時無法能抑時至必遷名到不得脫此人身死不滅他陰名無破壞或云色險現今世人見者莫不憂怖名見愁毒死滅無處更無異相惡色可生名非惡色見者驚恐名令人怖有云未有三塗惡報異形見死之者莫不畏懼身絶即死名喚在身邊有云一形最後時分難測名不覺知有云死理難測疏入變壞心者即從無煩惱心入煩惱心也憂結即是煩惱心故疏現住欲塵生等者欲謂貪欲因妙境起今取所貪故名欲塵生謂衆生謂處欲塵之衆生故簡異上天隨欲化起故名現住餘名準此問何故不取三塗為求答惡趣境乖故不建立疏三他變欲塵生者自亦能變欲塵受用然以他變為希奇故故用標名疏離生喜樂者謂有漏定伏彼欲界能障定法所顯無為名之為離離因得故生謂所生即定喜樂從彼所顯無為起故輕安相應意識俱受體雖是一適悅身心分喜樂二言定應生者定即當地所得之定生謂依定所生喜樂不同於初初得離故故云定生言離喜者離謂猒離由見二定喜相過故故猒離之所得之樂下上地無初離喜故從勝標名所以不言定生樂也滋潤身心名為灌灑又按瑜伽論六十四云欲求有五一攝受求二受用求三戲樂求四解了求五名聲求釋曰第四求解第五求名並名欲求有求亦五一法爾求釋即是任運求上有身亦可劫末法爾離欲求上有身二祈願求釋作意願求或除劫末餘時祈願三愚癡求釋不了上地是無常法求上有身四猒患求釋猒下求上五思擇求釋思擇求上離下穢染故求上地求梵行求亦五一唯求求釋即唯起彼求涅槃心不修梵行二趣得求釋趣求涅槃兼修梵行三現得求釋求現涅槃而修梵行四後得求釋當涅槃修梵行五思擇當得求釋曰種種思擇而修梵行此通邪正復有差別謂假名求釋謂外道第一義求釋佛法弟子無方便求釋釋前第一有方便求釋釋前第二如佛地論第四文殊問經亦明既具有章故不備四言疏下信解品至或有財釋者議曰有財釋勝聲者佛教聞即所化二並非己以二為財全取他法以標自名故有財勝疏求自然慧等者即是具三義成辟支佛按十地經亦有三義與此經同故彼經云不從他聞自正覺故論云一者自覺不假佛菩薩説唯自覺悟即此經中自然慧也不能具足大悲方便故論云二不能説法不起心説法不堪説法故即此經云樂獨善寂而能通達深因緣法成辟支佛乘論云三觀少境界觀微細境界行故即此經云深知諸法因緣是名辟支佛乘疏一切智至三乘同有者問三乘同有理即無違言觀空者有𮓪聖教故大般若三百六十三云佛言善現一切智者是共聲聞及獨覺智何以故一切者謂五薀十二處十八界二乘亦能了知準此三科名為一切能知之智名一切智豈緣三科名觀空耶答此一切智諸教不同疏舉一邊亦不違也疏卷第六疏柱根至行薀無常等者取行薀中命根為柱由柱摧故梁棟傾斜由命壞故受等亦謝故大品經云如人命根在故餘根得立命根若滅餘根盡壞疏者音奪也疏白茅謂之苫者李巡云編菅以覆屋曰苫又音舒焰反苫亦覆也疏桷端木者端猶首也桷者椽也乃椽首之木如疏所明或即連簷故方言云屋梠謂簷郭璞即屋簷也呼為連綿準言連綿即連簷矣疏骨為墉者按爾雅云牆謂之墉城亦謂之墉頌初言城標有城也骨為墉者辨城之體疏城謂八識等者頌中骨城喻八識也城者所依攝御之義內安諸物外捍凶非骨城身如城心如骨城展轉喻也由心內攝貪等四法外御信解善法等也故喻於城又釋頌中城者體身即八識言骨墉者骨是城資故得墉名此釋善也疏二種心城尚不信入者略有三釋一云在家貪瞋出家慢覆名二心城體非心城住心城故名二心城二云一善説法二毗奈耶心之城故名為心城故瑜伽云於彼善説法毗奈耶相應善法二種心城不能信入故知即以善説法等為心城也三云謂善説法及毗奈耶二相應心名二心城心即是城名為心城故瑜伽云相應善法二種心城若不取心何假而言相應法耶議曰初解不可中後理通論不明言相應善法屬於心故隨應皆得問論言善説法毗奈耶而目何義答修多羅藏名為善説正説法故阿毗達磨名之為法是對法故調伏藏名毗奈耶也若爾應言三種心城何但説二答初二合之故為二也何以然者由對於前惡説法中在家出家二類別故以毗奈耶唯出家習修多對法亦令俗學故開合別心城言二疏貪愛有四者按瑜伽論五十五云現有愛云何謂於自體親昵藏護後有愛云何謂求當來自體差別六十七云復有二種一緣後有境二是後有因善貪俱行愛云何謂於現前或於已得可愛色聲香味觸法起貪著愛彼彼希樂愛云何謂於前餘可愛色等起希望愛疏經錯應為蛇字者與𭺟字同但左右異疏博三寸首大如擘者按爾雅注云身廣三寸頭大如人擘指也指謂大母指意云其蛇首大形狀似擘指不言大小擘指也或擘者如人拖三指故廣雅云擘謂分也疏如綬綬者五色之通號也疏平名鬲山等者按切韻云鬲縣名也在乎建平準此建平乃郡名也縣從其山而得其名有蒚山疏本誤也按爾匹云蒚山有蒜蒚音歷也鬲音隔也有草無草字成別也疏食郊牛者祠祀牛也若被鼠食不堪饗祭疏於三際起十九至瑜伽論第九者依撿彼論迷於三際有十九無知無唯九者疏七字者應是十字誤為七也十九名義具廣如論恐繁不録彼論復有七種無知一世愚二事愚三移轉愚四最勝愚五真實愚六染淨愚七增上慢愚疏噍者譙笑反蒼頡篇噍咀嚼也説文噍嚼也疏蟯者經音云五狡反又疏云五交交字恐錯疏緣撥五門者四諦修道合為五也疏五法者謂心心所色不相應無為疏有五行相至諸餘邪見者按對法論第一云謗因者謂無施與無愛樂無祠祀無妙行無惡行釋曰舉無施等五種等所餘也施等五者是所謗因而言無者即能謗行施樂祠祀三種不同略有三釋一云施者泛明布施受樂祠祀如次對彼悲敬二田二云施與愛樂對敬悲田祠祀謂對不現前境三云施與愛樂對非親親祠祀謂彼不現前境謗善惡行不能感果名無二行問因何起此答為得靜慮由見一生恆行妙行死墮惡趣或行惡行得生善趣因作是謗又撥無十善十惡等行名無二行論謗果者謂無妙行及惡行業所招異熟等釋謗無兩行所招異熟并等等流士用增上所有果也論謗作用者謂無此世間無彼世間無母無父無化生有情等誹謗異世往來作用故任持種子作用故相續作用故釋曰世間者是有情世間無此現在有情世間從彼前世有情世來亦無現在有情世間往至後世有情世間此世間者唯是現在彼世間者通於過未問見起因何答由依靜慮見剎帝利命終之後生婆羅門等三種姓中餘姓亦然故作是思無此剎利等從於彼世剎利等中來亦無彼世剎利等從此剎利等中去此中不謗來往有情體性但謗體上來往用無問既見終沒有來往處何故云謗無來往用答只由前後所有種姓互不相應遂計過去剎利雖有不至今世現婆羅門雖後是有不從前來不謗有情故謗作用言無父母者亦復不謗有情體無而但謗言非我父母問謗因何起答由依定故見母命終還為已婆沙返為母又見父終還為其子子後作父由見不定作如是思世間必定無父母也母在任持胎藏之功父有下種之用今謗父母則損此二用言無化生有情者即指無想及無色界名化生有情執現在身後命終已無彼化生有情來續謗無相續之化用也即是謗無無想天等化生有情又無今生往彼化生有情用也問執因何生答由因靜慮見人命終生於無想或無色界及入涅槃求彼生處竟不能得便作是思念決定無有化生有情以彼處所不可知故論壞實事者謂無世間阿羅漢等釋謗無羅漢智斷實事而不謗彼有情之體問謗起由何答謂執自身以為羅漢臨命終時遂見生相彼作是念世間必無真阿羅漢以真羅漢智斷功德有實體性名為實事今言無此名謗實事論邪分別者謂餘一切分別倒見釋曰如執世界有邊等四矯亂等四現涅槃五除我見等四見之外所有之見皆所攝如瑜伽論廣説其相恐繁不具疏嬈者母也疏順戒之禁者性戒名戒遮戒名禁疏不須別配等者古德云此執修禪脫欲以之為道名為戒取計四禪為道如離地一尺計四空為道如離地二尺疏非意云除瞋餘惑亦通上界前鬼蟲等不言配上何故戒取獨配上耶取欲界者據相增説然下亦有配上地者亦依增説疏義同怖弄於狗等弄狗令怖以暢自情名怖狗自樂亦猶鬪雞畋獵怖他自悅疏我語取因此而生者由諸外道執我是實而可論説以為我故故名我語薩迦耶見是我語取此見是彼欲貪所取名我語取故對法論云薩迦耶見是我語取能取所取總名為取能取即欲貪所取是我語疏我語取取能取也明因我見而生起故因此能取更增我見故瑜伽云為欲隨説分別所計作業受果士夫之相起我語取對法亦云然由此取諸外道等與正法者互有諍論由彼不信有無我故疏四薀俱是能依等者四薀同彼煩惱火等亦是能依依識薀也能依四薀被能依火之所燒蕩名火摧落疏不説蟲鬼亦依火逝者證蟲鬼火俱是能依依識薀也若言火者不喻煩惱是所依者經乃應言蟲鬼遊火既不説爾故知火等亦為能依喻煩惱也疏下有惶怖至應為慞者心邊章字與下惶怖俱驚懼意簡異惶怖應單作章然為下言周章悶走章已單作故此章字須著心也疏依初揚聲犬叫解者初解揚聲俗人苦逼外道生厭並生怖懼依此初釋故周章者是怖怕也疏復依在俗等者後解揚聲俗人外道起貪起見而生鬪諍而常不息依此後解言周慞者是忩遽也經毗舍闍鬼者有言此云誑鬼又按婆沙一百七十二云畢舍遮此云配鬼或可是此毗舍闍也音訛故爾更思撿餘經鳩槃荼鬼者正釋如疏有云此云陰囊亦曰形卯謂狀冬苽行擎置肩坐即便據由斯弊狀特異諸類故從為名舊云苽者以其事猥略而不顯疏蜈蚣等喻凡夫等者問前言蜈蚣諸毒蟲等皆喻於瞋今與前異其意者何又云何瞋彼界得有答有四釋一云彼第八識含藏欲界瞋種子故據所藏種名毒蟲也二云非要生彼但得彼定名藏孔穴出定還起欲界瞋等名毒蟲類三云謂上界中癡慢疑等是鈍等類非蜈蚣等即是瞋也四云隨義為喻何得定判前對欲界蛇等喻瞋今明無色蛇等比人亦有何失故次下疏云上來説喻意令厭怖種種變名智者應別若定屬瞋何名為變議曰前三俱非第二全謬第四最優順疏文意尋之可悉疏呪大火因所感之果者火所感果得大火名果實非火果從因稱全取他名可有財釋疏莫我遑處者按詩殷其雷篇序云殷其雷勸以義也召南之大夫遠行從政不遑寧處其室家能閔其勤勸以義也詩云殷其雷在南山之下注云殷雷聲也有其下也義云下謂山足注雷出地奮震驚百里山出雲雨以潤天下箋云雷以喻號令又喻其在外也召南之大夫以王命施號令於四方猶殷然發聲於山之下詩何斯違斯莫敢遑處注云何乎此君子也斯此也違去也箋云遑暇也何乎此君子適居此復去此轉行遠從事於王所命之方無敢或間暇之時閔其勤勞詩振振君子歸哉歸哉注云振振信厚也箋云大夫信厚之君子為君使功未成歸哉歸哉勸以為臣之義未得歸也疏或復如是至災難大火者此蟲鬼等即是其火作用別故言況復也疏不作此解至何所差別者若其不作如前二釋蟲鬼與火俱是煩惱更有何別言況復耶疏若離三界無施化處者古有釋此門外之言謂三界外今疏意非若三界外何有施化無所籍故問八地菩薩已離三界佛應不為無施化故答誰言八地全離三界五八有漏第七間生皆是繫故有施化處故無過矣疏一切種智至若説真如等者問此經雖言造車嚴飾而不配德及簡真如疏準何判答今言車者體即大乘今按大集經中明大乘體以比於此義可明矣故彼經第十六云大乘者謂無量也無邊崖故普遍一切喻如虗空廣大容受一切衆生故不與二乘共是故名大乘以正住四攝法為輪以真淨十善為輻以淨功德資糧為轂以堅固淳至畢竟為輨轄釘鑷釋方言輨音古緩反亦輨謂軸頭鐵以善成就諸禪解脫三昧為轅以四無量心為善調以善知識為御以知時非時為發動以無常苦空無我之意為驅策以七覺寶繩為鞦靷以淨五根為素帶以弘普端直大悲為旒幢釋字書旒音呂周反旌旗之乘車者也以四正勤為輞以四念處為安詳以四神足為建業以勝五力為筌障以八聖道直進於一切衆生無障礙慧明以為軒以無住六波羅蜜回向薩婆若以無等四諦度到彼岸是為大乘彼乘既然此車應爾有為德為無真如也疏裀衣身者且如其衫襟闌領袖所依之主名為身也裀是異名疏因以下輿相連著者由與下輿相連著故故得鞇名因者所以因由之義鞇即左形而右聲也亦會意矣思之可悉經乘是寶車等者問真法亡詮離乎能所無住無出以何方便言乘出乎答以無所得而為前導亦可得言有乘有出故大般若四百九十二云雖觀諸法皆無所有都不可得畢竟淨故無乘大乘而出住者然無所得而為方便乘於大乘從三界生死中出至一切智智中住窮未來際利樂有情無斷無盡故言乘車故無過矣疏自在有十者如第十卷疏釋疏若二乘至有漏一乘者逈心已去為求大乘所修有漏諸功德法皆名大乘議曰二乘既有無漏後智若回心已而亦取之為乘體者竟有何失若非種智不名乘者彼有漏乘豈即種智又二乘人回趣大已昔生空智在初地前而得名為大乘未知當知根攝乘亦應爾然又回心已能以此智起於定願受變易生至於極果此豈非是運載之功疏意者以彼後智無廣用故故不取之今據有能順取所求通取之也各望義別然更審思疏尚庶幾者郭璞曰庶冀也幾幸也冀幸於善道也幾亦微也又幸冀望得遇幸得也疏初二十二頌別歷三趣受異熟果相者問按對法論第七云十不善業異熟果者於三惡趣中隨下中上受異熟果又十地經亦同對法下之十頌得惡人身惡人果準於論經屬不善業等流果收疏云何判是異熟果答夫等流果與因相似是親因緣其體唯取各自親種所生之種種所生現現所熏種餘者皆非經論據假等流果説疏據實體故言異熟果之所攝以盲聾等酬於先世謗經不善故異熟收問夫人趣者必善業招云何酬彼謗經惡業答人趣總報雖善業招盲等別報是惡業致酬斯別報名為異熟亦何爽歟總別報中別報異熟攝疏不説餓鬼等者按智度論六十二云云是破法者多以瞋癡二煩惱發貪發故墮餓鬼此中無慳故不説生餓鬼也疏三孤獨地獄者隨諸有情業力所感處所各別或根本獄有十六增以為眷屬八寒地獄雖無眷屬處所是本今異於彼得孤獨名疏有義地獄重疊等者釋彼瑜伽有兩師別置有義言非瑜伽論有兩師也疏略計至十二萬八千由旬者初地平下三萬二千方至等活等活以下四千由旬方至黑繩餘獄相去並各二千有六各二千八地獄量一一各高十千由旬復有八萬總而計之地平盡下有十二萬八千由旬疏衫寒至處黃十千者問前言八寒皆小八熱今言十千寒熱何別答八熱縱廣皆言十千八寒唯廣言有十千而不言縱故知有異問此熱寒獄其量廣大云何此洲下得容耶答此洲上尖下闊猶如穀聚故得容受問餘三洲下有大獄耶答無故瑜伽云從此下也又婆沙論一百七十二云大德作是説瞻部洲下有大地獄亦有近邊及獨地獄於餘三洲唯有邊獨無大地獄所以然者唯瞻部人造善猛利作惡亦利非餘洲故有説北洲亦無邊等獄是受淳淨善業果處故問若餘洲下無大地獄彼諸有情造無間業斷善根等當於何處受異熟耶答即於瞻部洲大地獄受疏正法念至琰羅王國者有義鬼有二種一有威德勝身牛貨亦有二一無威德類北洲唯有大威德者有説全無鬼慳貪招北洲乃是無所攝受有情處故四大王天三十三天有大威德鬼與諸天衆等守護防邏問鬼狀云何答多分如人亦似傍生問語言云何答劫初成時皆作聖語後時隨處作種種言疏三衆合至此苦有三者問準文合有四種之苦若斫判等豈非一苦答乍看有四細披但三以彼斫等總在第三和合中故一度和合以為一苦尋之可悟疏其如胎藏者即胎衣也此器若彼周旋其身而無戶牖猶子處胎疏銛刃者音纖廣雅利刀鋭為銛問上諸地獄皆有獄卒答準瑜伽論皆有無失若依小乘顯宗所云無間大熱及炎熱三無卒防守大叫及衆合等三小有獄卒琰魔王使時時巡撿其餘皆有問如是獄卒情有情耶答二十唯識大乘宗義唯是非情若依有宗自有兩釋按婆沙論一百七十二云有説有情問彼造惡業復於何處受異熟耶答即於地獄受以彼尚受無間業等極重異熟況復此耶問若有情者何彼火等不害彼耶答顯宗論云有情獄卒防守治鬪罪有情故火不焚燒有情卒若彼身別稟異大種故有説非情然以鐵鎖繫縛初生地獄有情往琰魔王所者是有情數若以苦具於地獄中害有情者是非情數疏四種蘇陀味者天中有樹出四食味名曰蘇陀所謂青黃赤白四也疏八十中劫二劫者問初禪三天二十倍增何故此天頓過許劫答有二釋一云業力使然故難以責二云然梵王天但離於尋猶未逾伺故不倍超少光雙越故超多劫一八十劫即一成壞二十八劫即二成壞疏以上諸天至壽感三劫者少光如前其無量光壽命四劫極光八劫少淨淨天壽一十六劫無量淨天三十二劫遍淨天壽六十四劫無雲天壽一百二十五劫準倍前數合壽一百二十八劫由減三劫故有一百二十五劫福生天壽二百五十劫廣果壽五百劫也問諸處皆言無想天壽五百大劫何故今言廣果天耶答廣果無想身命量等皆五百也若爾餘天悉倍倍之無想何故不壽千劫答約受果別開為二天地無有差故壽等等由斯聖教開合天數或二十七二十八也問無雲天何意身命各減三耶答有二釋一云為成無想五百數故二云初超變異受修艱難故故減三也議曰後釋為善有情唯識而各自成何得為他自減三劫疏除北洲餘悉中夭者問前標壽量唯除瞻部餘之三洲皆悉言定如何復言唯除北洲答前言定據極增定只五百年或二百等不妨中間一百得有中夭故不相違問劫之增減東西亦有餘之三洲豈可極壽只五百等答如是問何所以然答瞻部有情造修善惡其業猛利由乘鋭業隨劫增減命有修短餘洲不然極長俱爾二明分身量半等者以天帝釋三十三主業力勝故今等時分疏時分身量等者以天帝釋三十三主業力勝故故等時分疏共立毛端空量地界者共立在彼毛端計大空地處也疏初受為名生報者從獄出已後生餘獄及鬼畜趣合名後報然業是一故從初受故後受者亦名生報疏明歷四赴受增上等流果者問前處三塗言受異熟此亦同彼何故即言等流增上答能感之業而有三種加行根本後起別故前言異熟據根本業今增上等約初後業若不爾者三時何別問如何加行後起之業亦能感耶答如出佛血是殺加行亦成逆罪能招果故又偷蘭遮是方便罪目連問經廣説受彼地獄劫數後起可悉問雖言等流增上二果行相何別答於法不信起惡行故今招憎嫉瞋恚等報名等流果果似因故餘可增上思可知矣問若也不成根本業道容加行等別感於報既成業道豈加行等復別招果答其加行等若非不善可果不招既不善收別感何失問以為明答按俱舍論第十七云為一殺業感那落迦異熟果已復令人趣壽量短促為更有餘有餘師言即一殺業先感彼異熟後感此等流有餘復言二果因別先謂加行後謂根本雖復總説一殺生言而實通收根本眷屬準此後師復別招果問謗經加行既是不善招地獄苦地苦云何非異熟耶答實是異熟為別於前別感三趣致等流言假名等流理如前釋問夫言假者而似於真地獄之果望謗法因云何相似名似等流答但言總歷四惡趣報是彼增上等流二果不言地獄即是等流隨應有之不別屬也即地獄等可增上果餘之三趣容有等流理思可悉或由謗經斷於佛種令他沉溺今招地獄似因之能名為等流理亦通矣如斷他命復招人中短壽之報名等流故疏喑喑者按聲類大呼也説文大聲疏至誠感神者按尚書云至誠感神矧茲有苗釋曰此言來者三苗之人不循帝道舜命禹討之以師臨之一月不下禹欲循其德而以致遠故書云三旬苗人逆命益贊禹曰惟德動天已遠不屆滿招損謙受益時乃天道至誠感神矧茲有苗注云誠和也矧況也至和感神況有苗乎後帝舜大布文德經七十日苗人自至皈命於舜故書云帝乃誕俘文德七旬有苗格注注格至也討而不服不討自來明御之有道也三苗之國左洞庭右彭蠡在荒服之例去京二千五百里也疏尅念作聖者按尚書云惟聖罔念作狂惟狂克念作聖注云惟聖人無念於善則為狂人惟狂人惟能念於善則為狂人信解品疏我乘與如來乘無別者我所求乘名為我乘非已證得名為我乘以此人者是有學故問求二乘者豈不知佛與二乘異答據斷煩惱解脫生空而為同也便執總同其實不同不同謂同故名顛倒疏前以無為乘等者前言十方唯一乘法依於真理及彼佛果佛果同終故名為後不定性等必當得故故言無為疏彼便迷執者彼不悟意而便執云既言三乘而無有異何假求大故專希小將小與大而無異故疏有為乘及初乘是者異有為事運對無為理初乘即是三乘因行對後佛果而得初名疏亦信亦解持業為名者略有兩釋一云約彼信解所緣教理而是同故名為持業若約能緣信即解者不成持業以解是智即別境慧信即是善十一中一體既不同云何得言信即解耶二云須菩提等有能信解二種之德名為持業亦如攝論釋大乘名亦乘亦大名為大乘亦同解彼菩薩之號亦菩提亦薩埵並持業也議曰後釋善矣前釋難悟諸處皆無此之勢故又體能持用名為持業體持二用故置二名今既信解同緣教理將何為體以何為用故以理推前解便謬疏歎願雙成者華具二命彰其願滿故具壽言含斯二義若但言慧命即闕於壽命不全其義故從具壽文義周矣壽慧二命悉皆具故名為雙成歎斯願遂故名歎願疏此通至不言三昧故者此釋通三慧之所以若言三昧即唯修慧既不言之明通三慧疏四神足定為體者據尅性體神謂神通足是定也神之足名神足故對法云由已成滿三摩地力發起種種神變事又云神足自體者謂三摩地俱舍亦云何緣於定立神足名諸靈妙德所依止故有義若依小乘神者是定欲等四法名之足議曰此但小乘不正之義非諸小乘正義者説故俱舍云有餘師説神即是定足謂欲等論主破云又違經説如契經言吾今為汝説神足等神謂受用種種神境界分一為多足謂欲等此中佛説定果名神欲等所生等持名足故知正義定為足矣疏為此四種而修定故者為由此四方能修定故對法云欲三摩地者謂由殷重猛利樂欲敬恭方便得三摩地勤三摩地者謂由無間方便觸心一境性即常精進無時暫間心三摩地者謂先修定力觸心一境性由於前生數修定力令彼種子功能增長由種子力令心任運於三摩地隨順轉變由此速證心一境性觀三摩地者謂由聞他教法內自簡擇觸心一境性問神足唯定何故言四答足因有四故名四也斯乃從果名神從因名四當體名足足問心何耶答為二釋一心謂心王故對法云神足伴者欲勤心觀及彼相應心心所法又云定種增長令心任運證心一境既言相應明無二定又不可取種子為心非相應故二劣定名心故瑜伽論九十八云三由已入根本勝三摩地為欲轉得所餘上位勝三摩地對法亦云心三摩地者謂由持心觸心一境既言根本明非心王復言持心心豈自持議曰後解為勝若爾相應種等何通答足之助伴有俱不俱言欲勤等顯不俱伴言及相應目俱時伴俱時伴中雖有欲三彰前必復須有定等四故別舉之若唯俱者置相應言文義滿矣何須復説欲等及言豈有相應不俱時耶又種功能令心任運乃明劣定得心名因故無違也初釋同小有違大宗故不取也疏正思惟以慧為性者若依俱舍以尋為體今大乘意佛無尋伺猶有語故慧為體問思亦發語何故不以思為體耶答由正思惟能發語言誨示於他若非慧者餘無此能故對法云正思惟者是誨示他支如其所證方便安立發語言故問此與正見而復何別俱是慧故答分別誨示二支別故誨示前引言分別者對法論云正見者定分別支如先所證真實簡釋故故二別也疏無垢稱至十八因者感淨土因者十八也疏謂發起至各如自名者若諸菩薩發起無上大菩提心即是嚴持當淨土因二梵云阿世耶此云意樂不離惡法名純意樂意樂而能內純淨故三將植福慧加功而修名加行善體唯是慧或通諸善四凡修善際發起增上猛利威勢名上意樂此並能為淨土因矣疏六度為六名止息者由此六法能遣六障名為止息施除於慳戒袪犯垢忍遣瞋恚勤對懈怠定破散亂慧斷愚癡疏四無量名發起者惡法不生善法當起由此前六既止息已此之後四故名發起巧方便者即智慧用斯有二種一者回向二者拔濟合有十二廣如前説疏凡所修回向者趣向菩提不求生死疏説息無暇至名寂靜者除息諸惡名為寂靜寂靜而能寂二一者寂惡果即八無暇二者寂惡因即十惡業恆受衆苦無暫間暇可修善事求菩提故立無暇名然由四輪或得五法除八無暇四輪如下言五法者一受持戒治三惡趣二樂行法施除盲聾等三正信解世辨聰四近善友除佛前後五生中國除生北洲及長壽天菩薩常説四輪五行故能息除八無暇果名説息無暇此名寂果守戒不缺自惡業數悔他惡不譏他善能讚名自守戒息十惡業修十善行名十善道此二能寂十惡因也三類皆有息惡之功總名寂靜疏又依凡諸説者就彼凡夫説於三界名為佛宅理實三界非佛宅也疏中止一城生死中者在生死中止大乘城疏宣尼云求善估者按論語云子貢曰有美玉於斯韞匱而藏諸求善賈而沽諸注云韞囊也匱也沽衒賣也子貢見孔子有聖德而未有貴仕故設此言以觀其意言有華玉於此囊而藏之可求善賈而衒賣之子曰沽之哉沽之哉我待賈者注云寧有自衒賣此道者我座而待賈疏楮中以出者相傳多釋一云楮者姓也中者人名即鄭賈人之名姓也二云楮與豬同即豬車中而載出也三云褚音貯裝衣也亦即核籠籠中而出初釋謬也餘二通矣疏識衆以否臧者否惡臧善疏依後解至名到父城者疏云或聽説法之淺深等是為後解前但總説今此別以説法神通配國邑也故有斯別疏三念住為珠瓔者即是大悲三念住也左塗右斫不塗不斫三處等心是三念住疏此見化身淨土之相者問云何名見答但比見也以非大乘四善根故不名眼見若爾何唯化淨土耶他自二土豈不比見答以初發心未廣聞説他自二土多聞化土故偏比知亦無失矣疏將成道時方向鹿園相見者釋迦成道向鹿園中遇聲聞等是為正覺見今猶未至成道之辰以未親會故名遙見有義釋迦已前生中化身道成鹿園相見或談餘佛或迦葉佛將成佛時去鹿園近義言向園而相見也或云五人將成道時鹿園見佛議曰初釋為正餘雖云云違經違疏不可依之過思可悟疏鹽醋謂生空本後二智者謂見道前學生空觀亦分初後二智別也非實二智實二智者即是無漏得聖方證疏老弊使人四神足者不同利根以彼五通為老弊也由次第者未得根本定不能發通故唯四神足為老弊也雖未得定修欲等四而無違也疏外道家修行作人者外道作人煩惱未伏有惡可見汝今能伏無惡可見初心凡夫亦準此釋疏一一皆具無漏十法行者謂聽聞修習十種法行也如下具明疏五下分結等者二乘各斷五下五上故成二十問五下前三初果已除今者修道何成二十答全除五下謂不還人據盡處言亦名二十下化城品疏有此例問其數者何何名上下答薩迦耶見戒取及疑貪欲瞋恚是五下分五上分者一者色貪二無色貪三者掉舉四慢五癡下有二義初之三種見道所斷是修道下後之二種是欲界法即上界下二義合之名五下也五上總對見道及欲而得上名故瑜伽論第十四云有二種下分謂見道是修道下分欲界是色無色下分欲界是色無下分約此二種説五下分結有二種上分謂色及無色界依此二種上分説五上分結問上二界貪如輪自説掉慢等法是何界耶復何所斷答亦是上界修所斷攝瑜伽雖不明言準顯宗論二十七云唯修所斷名順上分順益上分故要斷見所斷彼方現行故見惑未斷時亦能資彼令順下分故瑜伽自云依色無色説上五分明知掉等非下界繫小乘不同具如俱舍恐繁不述又集論第十三釋唯約界趣名為上下不對見修此乃作者意旨不同寬狹成異亦不相違疏五薀一分者除後二苦相應之薀及無漏者名為一分餘準此知疏樂受自相至能生憂惱等者此對法論文言樂受至壞位者此等皆是愛心所所緣所緣體壞名之為壞言能生憂惱等者由樂等壞變能緣愛而為其戚憂苦相應苦因壞生故名壞苦又能所緣俱壞俱苦所緣樂等變壞名壞由有結縛復名為苦能緣心等由前所緣樂等壞故愛變為戚名之為壞而生憂惱即名為苦故能所緣俱壞俱苦問按雜集云於變壞位能生憂苦名為壞苦即壞之苦云何俱壞復俱苦耶答有樂等壞而生憂惱名為壞苦有樂等壞即是其苦不要生於憂惱等故方名為苦但由有結即名苦故若不爾者如不還者已離憂惱樂等壞時既不生惱應非壞苦又下三禪樂壞之時亦不生憂惱亦應非壞苦此既得有故知樂壞即亦為苦然對法論據欲界中及初二果故不相違問何教為明答瑜伽論五十五云由結行相及變增上所起憂惱當知是壞苦性非唯變壞已離憂者雖復遇彼不為害故釋雖遇樂壞不生憂惱名不為害斯為明證疏又由愛心令變壞亦名壞苦者即彼能緣樂愛心體亦名壞苦所以然者答由壞於前無愛心已愛心法生故愛名壞即此愛心而有結行體是行苦故名壞苦疏由前二苦粗重所隨者前二者苦苦壞苦二粗重者謂前二苦所有種子種子隨逐捨受等故又粗重者二苦現行所有硬澀無堪任性名為粗重由此隨逐捨受等法故捨受等成其粗重言不離前二無常等者不離前二苦也故論釋彼不離二云或於一時隨在苦位或於一時隨在樂位釋在地獄等是隨苦位在第三禪等是墮樂位此據賴耶相應捨受為苦樂二之所映奪所隨逐故名不離二又六識中相應捨受間苦樂故非恆住捨亦名不離前二苦也疏卷第七疏或淨法界等正法者謂四智法身有義無為而不為故云造立五道皆化淺深隨機謂之五欲至人以度物為樂稱為自娛議曰造立可然舍宅體何疏起惡見損壞深故者問前長行中解城邑者唯是佛法今者既是城邑之中云何而容起惡見耶答見不正者皆名惡見非是邪見謗因果等有義善少妄多名生瘖等外則受於機毀內為衆惑所瘵疏理居教內等者問佛比長者即佛在內今何言理在教內耶答人無別人法成人故故理佛也疏昔望生死者即前火宅言門外也對此言昔疏油謂八斷行等者對法論第十廣明疏雖具引然稍叢雜讀者難悟今逐難處而略展之易者不言彼云略攝為四謂加行攝受繼屬對治加行者謂欲精進信欲為精進依依信為欲因所以者何由欲求故為得此義發勤精進如是欲求不離信受有體等故者釋曰先由欲數求證彼定欲得此義方起精進是欲精進正名加行信欲二種是加行依亦名加行有體等者等有能等如是所信攝受者謂安由此輕安攝益身心故繼屬者謂正念正知由不妄所緣安心一境故若有放逸生如實了知故隨其次第者釋曰正念繼心屬於一境正名繼屬因引正知正知相從亦名繼屬言若有放逸下明正知也對治者謂思捨䇿心持心二加行力已生沈掉能遠離故者釋曰由於思故思止舉等由捨故離諸沈掉也䇿心捨沈持心捨掉問既言斷行而斷於何答按中邊論為除五過修八斷行言五過者一懈怠二妄聖言三沈掉四不作加行五除沈掉已復作加行初之四行滅於懈怠後之四行隨次滅餘後四之過疏油謂六支至生大怖等者按顯揚論第七廣明疏引大意不具不次初學難悉今依論次兼略釋之言六支者一若諸苾芻尸羅成就住者謂於所受戒體三業無犯根本名為不破不毀輕戒名為不空並皆具足名成就住二守別解脫律儀者謂七衆戒一一衆中戒體非一故名為別涅槃名之為解脫也律謂法律儀謂儀則別戒防止是祈涅槃名別解脫三軌則所行悉具足者謂於威儀或於所作或於方便修善事中軌則具足四所行具足者謂屠肆淫室諸不應行處皆不得往有識損故餘無謗傷即可行也五於微細罪深見怖畏者謂犯小隨小學處犯已可出皆名微細謂遮戒體名小隨學除波羅夷容可懺者名為可出謂諸菩薩持輕等重於上少罪深生怖畏謂勿令我因此小罪不得菩提不悟二空不證涅槃墮於惡趣由斯小罪見生大怖或時犯已疾疾懺悔六受學學處者謂白四羯磨等受具足戒等名為受學二百五十戒等為所學處然有三時聞其學處一受戒時聞其學處二從和上闍梨及朋友所聞其學處三於半月説戒之時聞其學處問第一二者而有何別答緣具受得名成就住若受已後運運相續為求解脫名守解脫問第四不往屠肆等家與第三中威儀何別答第三但明能行威儀第四唯辨所行之處又前但明是處應行猶自未明所應不應行處之相故二別也問六支即或何得云油答賴六具足戒學圓滿故得名油疏始于今日方得果體者問雖復回心猶未逮信位豈果此時而已得耶答既能回心依大教行必得名得或即大教亦名果體如前乘車遊四方義藥草喻品疏論第三人至種子牙故者五乘等別名種種異衆生各有本有新熏善根種子佛隨彼性為説於法令各自善而生現行名生牙等有義衆生過去稟過去佛五乘教門有五種子感佛出世説五乘法令五種子生五乘牙乃至果實議曰若無本有過去稟教亦何能生三乘無漏故前義勝疏三乘二聖發修亦別者大小菩薩名為二聖疏如説四諦三根俱聞者即鹿野菀轉四諦輪三乘雲華悉皆聞之語意可悉疏然於其中至義殘者若無上等與七喻文而有別者即無上等名為文殘若一文中明喻無上無上即名為義殘也無別文故不名文殘疏仍名為殘者仍字誤也應為乃字疏破乘同病者問二乘昔執乘有差別為除斯病説於此經故方便云唯一乘法無二無三今説藥木生長不同顯乘有異二乘在席豈不疑耶答略有四釋一破求大者疾非為二乘唯應度聞故無疑也二品有二意為聲聞類説能資之雨為小菩薩明所潤草木二乘領雨亦不疑生三二乘聞此還執乘異為斯下説授記除之顯乘平等四上根等類雖聞此喻不疑良以回心領解真旨少袪法障於理不愚故無疑執議曰第四解善若據初解二乘不聞云何得言為中根者而述成耶第二解中分同此過若第三解有無窮失説乘平等還執乘同乘同既痼亦應更破便破無窮故前三非若爾論云破執乘異為而授記顯乘平等豈不相違答論中但言因執乘異説乘平等不言此執自聞藥草後而復生也或二乘利鈍不等鈍聞藥草其病因生為説授記準此理者後二解善疏今取行藥至不能生長者今此法喻互影説也法舉其行影喻取草喻除石藥顯法不取教理及果疏有草非藥者問傳云婆沙論云何故色界無草木耶答由色界中以雲為地故無草木欲界衆生多有病故是以於地多生草木又四分律三十八云得叉尸羅國有賢姓阿提梨字賓迦羅極善賢道耆婆童子往彼受學徑七年已師與一籠及堀草具令於其國面一由旬求覓諸草有非藥者童子依師求非藥者周竟不得空還白師師答耆婆汝醫道成準斯草者無非藥矣今斷有草非藥豈非爽歟答有二釋一雖草皆藥而非一草治一切病望不治處即但名草不名為藥疏據此理云草非藥故智度論四十四云譬如藥師和合諸藥冷病者與熱藥於熱病中為非藥也又三十九云如如好藥不能破病不名為藥二婆沙論及醫王等並不言彼諸草皆藥亦不為證二釋任取疏三根亦爾至五乘種異者問菩薩豈亦不知他耶答少分而知理即容有合明悟者斯即無矣故涅槃經云十地菩薩不能明知衆生佛性斯證非一疏倒者至為破者此一段中有四句也第一三句二字為句第二四句六字為句有錯讀者因漫穿鑿理隨句矣今故明之疏不唯成就者大唯得聖小有二釋設取地前亦多劫修亦名成就經益於彼但名成就非是創心不名生也疏文雖不然理亦何爽者文雖不説雨為其藥理即無違爽猶失也文不然者即經云卉木叢林及諸藥草密雲彌布一時等澍其澤普洽卉木叢林及諸藥草皆不言雨而為藥也上下非一疏又前譬喻至藥草為喻者彼亦合明欣猒總為譬喻之品此品唯彰所潤水草故但藥草以為其號疏訝言合理者訝者嗟也疏聖德微亦許同者微猶少也少分亦得同於窮子或聲聞人聖德微少故同窮子疏法中有四等者觀於經文與疏科目全無行相著下喻合肩目方顯長尋可悉疏或由佛達法等者問與前何別答前解由佛達法識機令所化生而各受道故云令彼各得生長後釋受道亦屬於佛佛受道已然後能令三乘各益故疏説云令三乘別疏雖作此解至及成別意者順前開示悟等文也與今此文意有差易名為別意者疏類依性有故説為橫者此釋伏難難云既一一乘四類不同何不名堅乃判在此橫滋之中故今答云為依橫故故亦名橫疏此名堅長者二木之中三品上中增益差易故名堅長疏三摩跋提樂意生身等者此乃四卷楞伽第三卷也如彼廣辨今者略釋疏之所引正云三摩鉢底此云等至通於有心無心定也此位菩薩由依於定得受變易變易之身而隨意生名意生身今云意成隨意而成但轉易故以非新起不名為生問彼經但云三四五地云何今説五地耶答實初二地亦得此身但初二地定未自在略而不説由定自在於變易生有勝堪能故有義前之七地皆此身攝經舉中三明攝前後餘四地也經家好略故不全文疏覺法樂自性意生身者而能察知有為幻法悉無實體生身同前故經云觀察覺了如幻等法悉無所有問經云謂第八地今據何義兼取六七答得無相觀即能覺法如幻無體六七二地既有此能何故非此第二身攝然六非長時七有加行以非勝故故經不言故無違矣疏種類俱生無作行等者隨諸衆生所有多類菩薩而能現同類身應彼多族名為種類種類之身一時能現名為俱生能任運現不假功用名無作行身等如前疏但説舍利至更無別位者問引此云何證無十信答若也十信別位者應言舍利已過十信至第六住而方退之既不作此説故知無別位疏今乃竪通三位者即三品也疏衆生聞之至不自覺知者除佛已還餘聖不能知於自他委曲皆盡故有頌云如一孔旋有多種色類此何業能感離佛無能知疏一三慧所緣等者此義如章具辨同異今略啓發疏所言者一所緣者若依小乘俱舍所引婆沙師説聞所成慧唯緣名境未能捨文而觀義故思所成慧緣名義境有時由文引義有時由義引文未全捨文而觀義故修所成慧唯緣義境已能捨文唯觀義故天親説云今詳三相無過別者諸修行者依聞至教所生勝慧名聞所成依思正理所生勝惠名思所成依修等持所生勝慧名修所成説所成言顯三勝慧是聞慧等三因所成觀天親意聞唯緣教思唯緣義修慧亦爾大乘説者三慧皆通緣於名義初依聽聞以文為先而觀義者名為聞慧次依思慮以義為先而觀文者名為思慧次依於修俱於文義證解明了名為修慧此在因位八地已上一體義分七地已前各有別體在佛位中無未曾得都無聞慧唯有修慧二三慧行想者若小乘者大毗婆沙四十云若於二藏十二分教受持轉讀究竟流布名為聞慧依此發生思所成慧依此發生修所成慧評曰於三藏等乃至流布是生得慧依此生聞依此生思依此生修此斷煩惱證得涅槃若大乘者聽聞領受讀誦憶念又於彼義無倒解了方名聞慧聽聞已後差別作意明了善心名為聞慧不同小乘聽聞領受皆生得慧具如瑜伽又中邊論云聞所成慧思惟大乘能令善根界得增長思所成慧思惟大乘能生悟入所求實義修所成慧思惟大乘能令所求事業成滿謂能趣入修治地故三三慧體者此三自性別境慧攝名三慧故通現及種然識俱者聞慧唯取意相應慧若論所引伴類之者亦通五識五識由意引聞於聲五相應慧亦聞慧攝因中第七而不外緣佛果七八理無聞慧思慧唯取意識俱思五非助伴行相淺故非七八俱思可知矣修慧始終而合言之通八識也疏二障雙圓者斷之總盡以立圓名疏新翻論名前時有者即本有也據能起業生死次第本有為依方能造業本有最初名為前時今世生有雖最初在前唯一剎那未能造業故不名前望義別故亦無過也中有準知如瑜伽論十中所説有云中有名前時者違大論也疏穀續者相續不絶穀之義也疏詩云播厥百穀者按詩七月篇序云七月陳王業也周公遭變故陳后搜先公風化之所由致王業之艱難注云周公遭變者管蔡流言避之居東都也詩云亟其乘居屋其始播百穀注乘升也箋云亟急也乘治也十月定星將中急當治野盧之屋其始播百穀謂祈來年百穀于公社也播種也厥其也周易百穀麗於地者按彼明離卦云離利貞亨彖曰離麗也日月麗乎天百穀草木麗于土王輔注麗猶著也各得所著之宜也解云麗謂附著也以險柔之質附著中正之位得所著宜故云麗也言日月麗天等廣明附著得宜之事疏此是小草者此有二釋一黑蒲桃者喻無姓人指前蒲桃名此是也二三乘有姓名之為草稟潤能生無漏牙故此前蒲桃總喻小草小草即是聲聞之人議曰後解為優若爾何故疏言百穀甘蒲桃以喻中大二草答前對無姓而且總陳今據無姓委曲而説無姓之人配乾地故疏此依別儀以配喻者前後小草皆喻人天中比二聖今百穀等唯對於聖以明三草乾地乃喻人天之類又若生身果天人不名乾地望無漏牙故名乾地問經論不言何要斯釋答理應爾也若以蒲桃喻無姓人名為小草乾地之言復喻何類由此多途故疏説云依於別義以配喻也議曰百穀等三別喻三草乾地喻彼三草二木所依心王昔乏法水名為乾地今得名洽由心受教五乘種增名為並茂故長行云衆生住於種種之地地即心也以此釋者頗順經旨問如菩薩等恆聽佛説云何得言二木五草所依之心名為乾地答此通言爾又菩薩等不聞之頃即名為乾地如雲收已地名乾也非元無雨方名乾也疏謂三乘十地者十地不同總有五種諸共行十地聲聞十地緣覺十地菩薩十地如來十地今疏所引即初十地今略辨名兼指三乘差別位次餘同等義如廣章明生成佛智名之為地又聖人階級住處又分有生成又能為依持生長之義並名為地未得定水以洽於心名之為乾以能觀達故為慧在資糧位姓謂種姓族類之義漸升勝處在貴族之中名種姓也故智論云譬如小兒在貴姓家生在加行位見道之中前十五心名八人也智隨於忍故得八名復別於修故在見立故智度論四十五云是十五心何以為八答思惟道中而用智多見諦道中多用見忍智隨於忍忍用大故後忍智二能斷能證八忍中住故名八人或有本云第八地者即初果向四果向中而倒數之當第八矣多本無第字但言八人今從初義位可知之見道十六名為見地亦名須陀洹地欲界九品俱生煩惱斷六品盡唯三品在或小輕微名之為薄亦名斯陀含地欲界九品煩惱並巳稱為離欲亦名阿那含地聲聞果滿所作究竟名已辦地亦名羅漢地不待於師自觀緣起而能悟道故云辟支辟支梵言此云獨覺始從歡喜終盡法雲名菩薩地一切種智十力無畏衆德畢滿名為佛地疏或七方便至亦名小草等者望疏上下此釋不正何以然者疏斷小草以為無姓豈七方便是無姓耶又疏主意言涅槃中第三病人勝鬘經中非法衆生亦唯無姓云河小乘七方便者亦彼攝耶故知此中且據未得聖位一邊判屬小草非盡理也故疏下言故前解善亦不取此以為正義疏準二乘至亦名中草者準於菩薩雖在地前得名小木大草中收二乘有學何非中草疏三意生身至故此不論者此會經中不説有學為中草所以經中但云起六神通及得三明不明有學會意可知議曰經中所言知無漏法亦兼有學有學亦能分知無漏準此斯理無諸妨矣疏前解為善者釋前長行諸樹大小竪長之處二乘方便名中草下品地前菩薩名大草下品以為正義今指彼也尋之可悉授記品疏十四不可記者按大般若經有十四不可記事世間常耶無常耶亦常無常耶非常無常耶等為四句世間有邊無邊等為四句如來死後有耶無耶亦有亦無耶非有非無耶為四句命與身一為一句命與身異為一句通前十四有外道等於十四中有所問論佛皆不記問有微皆答可稱種智而難不酬何名正覺答稱理而問答引義利故為釋之乖正從答便無益故佛不記非不記故便非種智故瑜伽論六十四云有四因緣不可記別謂有無問等一或有無故不可記別謂有問言我於諸薀若異不異常無常等二能引無義利故不可記別如來自言我所證法乃有爾所而不宣説何以故彼法不能引義利故三甚深故不可記別諸問言我是有耶此不應記勿彼即於諸薀執我或離諸薀而執有我又有問言我是無耶此不應記勿於世俗言説士夫起損減執如是如來死後有耶等皆甚深故不可記或有法爾不可建立故不可記謂有問言諸法真如於彼諸法異不異耶此不可記何以故彼法爾不可建立異不異故問四記之中是置記攝云何復説不可記耶答非總無言名不可記但不為記所問世間常無常等故云不記有斯問者應語彼言如來世尊於斯不記以言息置彼之所問得置記名由彼所問不如理故所以不記問彼問云何不如理耶答遠離因果染淨所應思處故也疏有一比丘至種種訶者問十二因緣豈無體耶若有體者佛何見訶不為記別答言他作者謂所妄執神我等類能造我等而體既無所作緣生故亦不有皆遍計故故名無體佛不為記疏非前二全後一少分者經今授記望三記中前之二種全不相攝攝第三中大因果之一分也問當成於佛豈非殊勝有果體耶何故不攝前之二種成佛既是勝人勝理復何不攝第三全耶答所問之法有體義故名為有體望因能有當來勝果説彼弟子名為勝人不約佛事故望義別攝不攝異經雖有魔人皆護佛法者問壞善事故可名為魔既護佛法魔義何立答處居魔位以得其名佛因所感能護佛法有義穢土之中一向有魔能為留難純淨土內一向無魔中容之土亦有亦無不同餘方示現為魔故護佛法疏既怯威嚴所以戰懼者問習種俱亡影鴿無怖一何聖者猶懼威嚴答如來大悲誠不威物聲聞小智妄起懼心今舉妄情云怯威德有義三人自謂已解大乘經佛猶未見為授記三人復恐自所解非墮增上慢故悚栗也又喜次至懼懼於未堪喜懼交集所以悚栗疏名即名假至相假者按大品等經假有三種一者名假二謂受假三者法假名即是彼三假名收相即攝彼受法二假由悟三假故名名相經劫名有寶國名寶生者空理為依起塵沙德
